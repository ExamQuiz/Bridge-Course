<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exam Quiz</title>
  <style>
    :root {
      --ink: #18252b;
      --muted: #607078;
      --paper: #fffdf8;
      --line: #dce3df;
      --teal: #087f82;
      --teal-dark: #075e61;
      --correct: #16734b;
      --wrong: #b33d35;
      --shadow: 0 18px 45px rgba(30, 55, 58, .12);
      font-family: Georgia, "Times New Roman", serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: #eaf1ed; }
    header { padding: 42px 20px 76px; background: #123e43; color: #f4f6ed; }
    .header-inner, main { max-width: 900px; margin: auto; }
    .eyebrow { margin: 0 0 12px; color: #a8d9c9; font: 700 12px/1.2 system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2.4rem, 7vw, 4.5rem); line-height: .95; font-weight: 500; }
    .subtitle { max-width: 550px; margin: 18px 0 0; color: #d1e1da; font: 16px/1.6 system-ui, sans-serif; }
    main { margin-top: -40px; padding: 0 20px 60px; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 18px; color: var(--muted); font: 14px system-ui, sans-serif; }
    button { border: 0; border-radius: 5px; padding: 12px 18px; color: white; background: var(--teal); cursor: pointer; font: 700 14px system-ui, sans-serif; }
    button:hover { background: var(--teal-dark); }
    .quiz-card { margin-bottom: 22px; padding: clamp(22px, 5vw, 38px); background: var(--paper); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
    .question-number { color: var(--teal); font: 700 12px system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; }
    h2 { margin: 12px 0 24px; font-size: clamp(1.3rem, 3vw, 1.8rem); line-height: 1.25; font-weight: 500; }
    .options { display: grid; gap: 10px; }
    .option { display: flex; align-items: flex-start; gap: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 5px; cursor: pointer; font: 16px/1.45 system-ui, sans-serif; }
    .option:hover { border-color: var(--teal); background: #f1f8f4; }
    .option input { margin-top: 4px; accent-color: var(--teal); }
    .option.is-correct { border-color: var(--correct); background: #e5f5eb; }
    .option.is-wrong { border-color: var(--wrong); background: #fff0ed; }
    .feedback { margin-top: 20px; padding: 16px; border-left: 4px solid var(--teal); background: #f0f5f1; font: 15px/1.55 system-ui, sans-serif; }
    .feedback strong { display: block; margin-bottom: 4px; }
    .feedback[hidden], #quiz[hidden], #loading[hidden], #error[hidden], #empty[hidden] { display: none; }
    .notice { padding: 25px; background: var(--paper); border-radius: 8px; font: 16px/1.6 system-ui, sans-serif; box-shadow: var(--shadow); }
    .error { color: var(--wrong); }
    @media (max-width: 600px) { header { padding-bottom: 62px; } .toolbar { align-items: flex-start; flex-direction: column; } }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <p class="eyebrow">Study material</p>
      <h1>Exam Quiz</h1>
      <p class="subtitle">Answer each question, then reveal the correction and explanation from the study material.</p>
    </div>
  </header>
  <main>
    <div id="loading" class="notice">Loading questions...</div>
    <div id="error" class="notice error" hidden></div>
    <div id="empty" class="notice" hidden>No MCQs were found in this study material.</div>
    <section id="quiz" hidden aria-live="polite">
      <div class="toolbar"><span id="progress"></span><button id="submit" type="button">Check answers</button></div>
      <div id="questions"></div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

    // Replace these values with the Web App config from Firebase Console.
    const firebaseConfig = {
      apiKey: "AIzaSyB8uOMIZvbtGin3kNsEx3BD_UKepP4ChdQ",
      authDomain: "examquiz-75514.firebaseapp.com",
      projectId: "examquiz-75514",
      storageBucket: "examquiz-75514.firebasestorage.app",
      messagingSenderId: "654411434962",
      appId: "1:654411434962:web:31b663306d2e260a44960b"
    };
    const collectionName = "quizzes";
    const documentId = "bridge-course_hindi_pedagogy_of_mathematics_chapter1";

    const loading = document.querySelector("#loading");
    const error = document.querySelector("#error");
    const empty = document.querySelector("#empty");
    const quiz = document.querySelector("#quiz");
    const questionsElement = document.querySelector("#questions");
    const progress = document.querySelector("#progress");

    function firstValue(source, names, fallback = "") {
      for (const name of names) {
        if (source[name] !== undefined && source[name] !== null) return source[name];
      }
      return fallback;
    }

    function normalizeOptions(value) {
      if (Array.isArray(value)) return value.map(item => typeof item === "object" ? (item.text || item.label || item.value || "") : String(item));
      if (value && typeof value === "object") return Object.values(value).map(item => typeof item === "object" ? (item.text || item.label || item.value || "") : String(item));
      return [];
    }

    function questionRecords(data) {
      const collection = firstValue(data, ["questions", "mcqs", "items", "quiz", "data"], null);
      if (Array.isArray(collection)) return collection;
      if (collection && typeof collection === "object") {
        const values = Object.values(collection);
        if (values.some(item => item && typeof item === "object")) return values;
      }
      if (data.question || data.questionText || data.text || data.prompt) return [data];
      return Object.values(data).filter(item => item && typeof item === "object");
    }

    function normalizeQuestions(data) {
      return questionRecords(data).map(item => {
        const namedOptions = firstValue(item, ["options", "choices", "answers"], null);
        const separateOptions = Object.entries(item)
          .filter(([key]) => /^(option|choice|answer)[ _-]?[a-z0-9]+$/i.test(key))
          .sort(([first], [second]) => first.localeCompare(second, undefined, { numeric: true }))
          .map(([, value]) => value);
        return {
        text: firstValue(item, ["question", "questionText", "text", "prompt"], "Untitled question"),
        options: normalizeOptions(namedOptions || separateOptions),
        correct: firstValue(item, ["correctAnswer", "correct_answer", "answer", "correct", "correction"], ""),
        explanation: firstValue(item, ["explanation", "solution", "reason"], "No explanation provided.")
        };
      }).filter(item => item.options.length > 0);
    }

    function answerMatches(answer, selected, options) {
      if (String(answer).trim() === String(selected).trim()) return true;
      const index = Number(answer);
      return Number.isInteger(index) && options[index] !== undefined && options[index] === selected;
    }

    function render(questions) {
      progress.textContent = `${questions.length} question${questions.length === 1 ? "" : "s"}`;
      questionsElement.innerHTML = questions.map((question, questionIndex) => `
        <article class="quiz-card" data-index="${questionIndex}">
          <div class="question-number">Question ${questionIndex + 1}</div>
          <h2>${escapeHtml(question.text)}</h2>
          <div class="options">${question.options.map((option, optionIndex) => `
            <label class="option"><input type="radio" name="question-${questionIndex}" value="${optionIndex}"> <span>${escapeHtml(option)}</span></label>`).join("")}
          </div>
          <div class="feedback" hidden></div>
        </article>`).join("");

      document.querySelector("#submit").addEventListener("click", () => {
        questions.forEach((question, index) => {
          const card = document.querySelector(`[data-index="${index}"]`);
          const selectedInput = card.querySelector(`input[name="question-${index}"]:checked`);
          const feedback = card.querySelector(".feedback");
          const selected = selectedInput ? question.options[Number(selectedInput.value)] : "";
          const correct = answerMatches(question.correct, selected, question.options);
          card.querySelectorAll(".option").forEach(option => option.classList.remove("is-correct", "is-wrong"));
          if (selectedInput) selectedInput.closest(".option").classList.add(correct ? "is-correct" : "is-wrong");
          const correctOption = question.options.findIndex(option => answerMatches(question.correct, option, question.options));
          if (correctOption >= 0) card.querySelectorAll(".option")[correctOption].classList.add("is-correct");
          feedback.innerHTML = `<strong>${correct ? "Correct" : "Review this answer"}</strong>Correct answer: ${escapeHtml(String(question.correct))}<br>${escapeHtml(String(question.explanation))}`;
          feedback.hidden = false;
        });
      });
    }

    function escapeHtml(value) {
      return value.replace(/[&<>'"]/g, character => ({"&":"&amp;", "<":"&lt;", ">":"&gt;", "'":"&#39;", '"':"&quot;"}[character]));
    }

    async function loadQuiz() {
      try {
        if (firebaseConfig.apiKey.startsWith("REPLACE_")) throw new Error("Add your Firebase Web App configuration to index.html first.");
        const app = initializeApp(firebaseConfig);
        const snapshot = await getDoc(doc(getFirestore(app), collectionName, documentId));
        if (!snapshot.exists()) throw new Error("The study material document was not found.");
        const questions = normalizeQuestions(snapshot.data());
        loading.hidden = true;
        if (!questions.length) {
          const data = snapshot.data();
          const fields = Object.keys(data).join(", ") || "none";
          empty.innerHTML = `This Firestore document contains metadata, not MCQs.<br><small>Fields found: ${escapeHtml(fields)}.</small>`;
          if (data.googleDocId) {
            empty.innerHTML += `<br><small>Linked Google Doc ID: ${escapeHtml(String(data.googleDocId))}</small>`;
          }
          empty.hidden = false;
          return;
        }
        render(questions);
        quiz.hidden = false;
      } catch (loadError) {
        loading.hidden = true;
        error.textContent = loadError.message;
        error.hidden = false;
      }
    }

    loadQuiz();
  </script>
</body>
</html>
