<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learning by Children with Special Needs – Audio Chapter</title>
<style>
:root{--bg:#f4f2f7;--ink:#241a30;--mute:#6d5f7d;--card:#fff;--line:#dcd3e6;--accent:#6a3fa0;--hi:#ece3f6}
@media (prefers-color-scheme:dark){:root{--bg:#160f1d;--ink:#ede7f2;--mute:#a696b8;--card:#20172a;--line:#372a45;--accent:#a983dd;--hi:#251a30}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 Georgia,"Times New Roman",serif}
header{max-width:760px;margin:0 auto;padding:36px 20px 8px}
h1{font-size:2rem;margin:0 0 4px;line-height:1.2}
.sub{color:var(--mute);margin:0}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 20px}
.bar div{max-width:760px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-family:system-ui,sans-serif;font-size:14px}
button{font:600 15px system-ui,sans-serif;border:2px solid var(--accent);background:var(--accent);color:#fff;padding:9px 18px;border-radius:8px;cursor:pointer}
button.alt{background:transparent;color:var(--accent)}
button:focus-visible,select:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
select{font:14px system-ui,sans-serif;padding:7px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
#status{color:var(--mute);margin-left:auto}
main{max-width:760px;margin:0 auto;padding:16px 20px 60px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 20px;margin:14px 0}
section.on{border-color:var(--accent);background:var(--hi)}
section h2{font-size:1.15rem;margin:0 0 6px;display:flex;justify-content:space-between;gap:10px;align-items:center}
section h2 button{padding:5px 12px;font-size:13px}
section p{margin:0}
.note{font:13px system-ui,sans-serif;color:var(--mute);margin-top:20px}
</style>
</head>
<body>
<header>
<h1>Chapter 8: Learning by Children with Special Needs</h1>
<p class="sub">Child Development and Educational Psychology · Unit 4, Inclusive Classrooms</p>
</header>
<div class="bar"><div>
<button id="play">▶ Play all</button>
<button id="pause" class="alt">⏸ Pause</button>
<button id="stop" class="alt">■ Stop</button>
<label>Speed <select id="rate"><option value="0.8">0.8×</option><option value="1" selected>1×</option><option value="1.2">1.2×</option><option value="1.5">1.5×</option></select></label>
<label>Voice <select id="voice"></select></label>
<span id="status" aria-live="polite">Ready</span>
</div></div>
<main id="list"></main>
<p class="note" style="max-width:760px;margin:0 auto;padding:0 20px 40px">Audio is generated by your browser's built-in text-to-speech, so it works offline. Use Chrome, Edge, or Safari for best voices.</p>

<script>
const S=[
["Introduction","This unit talks about facilitating the learning of children with special needs, and about teaching in an inclusive classroom so these children can develop in all aspects along with others. We will learn about the twenty one types of disabilities mentioned in the RPwD Act, how teachers assess these children over time, and how to deal with challenges during assessment. We will also explore how to improve teaching and learning through the Individualised Education Plan and differentiated learning, so teachers can prepare according to each child's needs and build confidence among children with special needs."],
["Learning Outcomes","After this chapter, the learner can: define the term inclusive settings; understand different learning styles; design differentiated learning practices; identify types and strategies for early intervention in learning disabilities; screen for early identification of children with learning disabilities; and understand the concept of an Individualised Education Plan and use it in the teaching-learning process."],
["Inclusive Classrooms: The Learner","Education has always been central to human life, and India is a country of great diversity, including diversity in children's learning abilities. As teachers, we encounter children who are unable to follow guidelines and information in typical ways; these are called Children with Special Needs, or CWSN. Often, a decline in one sense is compensated by more effective working of other senses. If these children are identified in time and given appropriate intervention, they can develop in an all-round way like other children."],
["Disabilities and Their Abilities","Locomotor disabled children have limitations in movement but normal IQ, and can be strong performers in indoor school activities. Children with hearing impairment may have slower speech and language development, but are often less distracted by external noise, giving them stronger attention. Children with visual impairment often have enhanced hearing and touch, and can learn using Braille, digital tools, and auditory signals. Teachers should explain topics thoroughly, speak clearly, and give these children full opportunities to participate. Children with speech and language disabilities may struggle with pronunciation, vocabulary, or complex language, but teachers should focus on their other strengths, such as visual-spatial skills, math, or music. Intellectual disability, autism spectrum disorder, mental illness, and multiple disabilities affect a child's ability to process information, though intelligence itself is not necessarily affected; timely input and practice can reduce these challenges."],
["Concept of Inclusive Settings","Inclusive settings are welcoming environments for people from all backgrounds, whether linguistic, regional, socioeconomic, or related to disability. Key aspects include acceptance of all children as they are, respect for diversity, equal opportunity to participate and learn, and the use of varied teaching methods such as differentiated instruction, universal design for learning, multi-sensory approaches, peer tutoring, and assistive technology."],
["Segregation, Integration and Inclusion","These three concepts differ in emphasis. Segregation focuses on services, a medical model of disability, categorization, and separate curricula. Integration focuses on needs, individual adaptation, and equal treatment, but still centres on a medical model. Inclusion focuses on rights, a social model of disability, institutional adaptation, support for all, celebrating diversity, and partnership between professionals and parents, with an emphasis on school effectiveness and outcomes for everyone."],
["Children with Special Needs and Children with Disabilities","Children with special needs face obstacles in physical, sensory, developmental, behavioural, or cognitive areas, and need more effort and help than other children — for example, children with autism, ADHD, Down syndrome, or learning difficulties. They are categorized as physical disability, intellectual disability, or cognitive disability. Children with disabilities, or CwDs, have a long-term condition from birth or afterward that affects their daily activities. Related terms include impairment, meaning a loss of function at the organ level; disability, meaning a restriction in performing an activity in the way considered normal; and handicap, meaning the disadvantage that results from an impairment or disability in fulfilling a role, depending on age, sex, and socio-cultural factors."],
["Twenty-One Disabilities under the RPWD Act","The National Education Policy 2020 states that social justice and equality can be guaranteed only through education, and that inclusive and equitable education is an essential goal. As per the RPWD Act 2016, there are twenty-one recognised disabilities, including blindness, low vision, hearing impairment, locomotor disability, dwarfism, cerebral palsy, intellectual disability, autism spectrum disorder, mental illness, chronic neurological conditions, muscular dystrophy, multiple sclerosis, specific learning disabilities, thalassemia, speech and language disability, sickle cell disease, hemophilia, leprosy cured persons, Parkinson's disease, acid attack victims, and multiple disabilities."],
["Meaning of Learning Disability","Learning disabilities are neuro-developmental disorders that significantly inhibit a person's ability to learn new things, causing difficulty with speaking, reading, writing, attention, understanding, memory, math, or eye-hand coordination. The RPWD Act defines specific learning disabilities as a group of conditions involving a deficit in processing spoken or written language, including perceptual disabilities, dyslexia, dysgraphia, dyscalculia, dyspraxia, and developmental aphasia. The DSM-5 combined reading, math, and written expression difficulties into one diagnosis called Specific Learning Disorder."],
["Dyslexia","Dyslexia is a language processing disorder affecting the ability to read and comprehend. Children with dyslexia may misread or reverse letters, such as reading 'was' as 'saw', or 'b' as 'd', and may struggle with longer words. These errors come from difficulties processing written language, not poor teaching alone. Helpful measures include multisensory teaching, oral answering, reading and writing practice, work on pronunciation, audio-visuals, and use of ICT."],
["Dysgraphia","Dysgraphia is a disorder affecting writing and expressing thoughts on paper. Beyond poor handwriting, children may struggle with letter spacing, motor planning, spatial awareness, and thinking and writing at the same time — for example, reversing letters or numbers, inconsistent spacing, mixing upper and lower case, or inconsistent spelling. Helpful measures include writing in sand, air writing, dot tracing, correct pencil grip, and regular writing practice."],
["Dyscalculia","Dyscalculia, sometimes called math dyslexia, involves difficulty with mathematical concepts, numbers, and logic, such as confusing 6 and 9, or making errors in addition and subtraction. Helpful measures include hands-on experience, visual tools, step-by-step instruction, real-life practice such as shopping, number blocks and flashcards, counting objects, handling money, and field trips."],
["Dyspraxia and Developmental Aphasia","Dyspraxia, or developmental coordination disorder, makes it difficult to perform motor skills and coordination; occupational therapy can help, along with activities like needle-thread work, catching and throwing a ball, bead threading, cutting and folding shapes, clay play, and building blocks. Developmental aphasia results from damage to the brain's language areas and impairs expression, understanding, reading, and writing. Helpful measures include using simple clear language, repeating and rephrasing, speaking slowly, using pictures and gestures, and storytelling."],
["Causes of Learning Disability","Learning disabilities can arise from pre-natal causes such as early marriage, poor maternal nutrition, or alcohol, drug, or unsupervised medicine use during pregnancy; natal causes such as untrained delivery, low birth weight, forced delivery, or lack of oxygen at birth; and post-natal causes such as serious illness, accidents, lack of vaccination, or malnutrition."],
["Screening and Early Identification","According to NEP 2020, over eighty-five percent of a child's brain develops by age six, making quality early childhood care and education essential. Early identification follows five steps: informal observation by the teacher; case history taken by the special education teacher in consultation with parents; formal screening if needed; referral to specialists or hospitals; and submission of the final diagnostic report to the school for planning. The NCERT's PRASHAST app can support this process. A checklist for specific learning disability looks for signs such as difficulty maintaining attention, difficulty completing tasks within time limits, skipping words while reading, difficulty organizing objects, trouble with mathematical symbols, confusing similar letters or numbers, and difficulty with punctuation or comprehension — especially when the child's IQ is above eighty-five."],
["Early Intervention Strategies","Early intervention services bring together special educators, therapists, and counsellors to help children with developmental delays. Parents and teachers are usually the first interventionists. Occupational therapy helps with fine motor and self-help skills; physiotherapy helps with walking, balancing, and sitting; and speech therapy helps children with stuttering or stammering master language. At the foundational stage, the focus is on mother tongue, oral expression, storytelling, songs, and play, using materials like picture books, models, and puppets, evaluated mainly through observation. At the preparatory stage, the focus shifts to reading, writing, spelling, and comprehension, using story books, word games, and tactile materials, evaluated through reading tests, dictation, and storytelling."],
["Individualised Education Plan","The concept of the Individualised Education Plan, or IEP, in India traces back to early schools for children with disabilities. Under Section 16 of the RPWD Act 2016, government establishments must monitor participation, progress, and completion of education for every child with special needs. An IEP helps a student meet individual goals beyond their current skills, and is revised at least twice a year based on progress. When a child with special needs joins a school, the teacher should welcome them, introduce them to peers and staff, meet the parents, and take a case history. The IEP has three parts. Part A covers basic information, type and degree of disability, and annual and short-term goals, set in consultation with parents and teachers. Part B covers co-curricular activities, therapeutic needs, and life skills, planned with subject teachers and specialists for each short-term goal. Part C covers academics, planned, implemented, and evaluated monthly with subject teachers."],
["Challenges in Preparing IEPs","Teachers preparing IEPs often face insufficient training, lack of resources, communication issues, and the challenge of balancing diverse learning styles including visual, auditory, and kinesthetic preferences, along with an already heavy workload, curriculum adaptation demands, and limited parental support. Suggested solutions include using universal design for learning and differentiated instruction, professional development programs, adequate use of technology, better classroom management strategies, proper use of school resources, motivating parents, and fostering collaboration among all staff."],
["Differentiated Learning","Due to India's immense diversity, teachers must adapt instruction so that diversity does not become a barrier to learning. NEP 2020 supports differentiated instruction, which uses varied tools, materials, and procedures to help all learners succeed. It can occur at the administrative level, considering factors like socioeconomic status, or at the classroom level, considering content, process, product, and effect according to each student's readiness, interest, and learning profile. Differentiated learning increases classroom engagement, improves academic outcomes, promotes a positive learning environment, addresses diverse learning styles, closes achievement gaps, and increases teacher effectiveness. It can be implemented through recitation, role play, smartboards, small group and peer learning, teaching-learning materials, games, multisensory approaches, peer tutoring, arts and crafts, and individual attention."],
["Summary","This chapter covered how to make classrooms more inclusive and effective for diverse learners, corrective measures for common learning disabilities, and how the Individualised Education Plan and differentiated learning help teachers prepare according to each child's needs and build their confidence toward the mainstream."]
];
const synth=window.speechSynthesis,list=document.getElementById('list'),st=document.getElementById('status');
let idx=-1,token=0,voices=[],mode='all';
S.forEach((s,i)=>{const e=document.createElement('section');e.id='s'+i;
e.innerHTML=`<h2>${s[0]}<button class="alt" data-i="${i}">▶ Play</button></h2><p>${s[1]}</p>`;list.appendChild(e)});
list.addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(b){mode='one';start(+b.dataset.i)}});
function loadVoices(){voices=synth.getVoices().filter(v=>/^en/i.test(v.lang));const sel=document.getElementById('voice');
sel.innerHTML=voices.map((v,i)=>`<option value="${i}">${v.name} (${v.lang})</option>`).join('');
const pref=voices.findIndex(v=>/en-IN|en-GB/i.test(v.lang));if(pref>=0)sel.value=pref}
loadVoices();synth.onvoiceschanged=loadVoices;
function chunks(t){return t.match(/[^.?!;:]+[.?!;:]?/g).map(x=>x.trim()).filter(Boolean)}
function mark(i){document.querySelectorAll('section').forEach((s,j)=>s.classList.toggle('on',j===i))}
function start(i){synth.cancel();const my=++token;idx=i;mark(i);
const ps=chunks(S[i][0]+'. '+S[i][1]);let k=0;st.textContent='Playing: '+S[i][0];
document.getElementById('s'+i).scrollIntoView({behavior:'smooth',block:'center'});
(function next(){if(my!==token)return;
if(k>=ps.length){if(mode==='all'&&i+1<S.length)start(i+1);else finish();return}
const u=new SpeechSynthesisUtterance(ps[k++]);u.rate=+document.getElementById('rate').value;
const v=voices[document.getElementById('voice').value];if(v){u.voice=v;u.lang=v.lang}
u.onend=next;u.onerror=ev=>{if(ev.error!=='interrupted'&&ev.error!=='canceled')next()};synth.speak(u)})()}
function finish(){mark(-1);idx=-1;st.textContent='Finished'}
document.getElementById('play').onclick=()=>{if(synth.paused){synth.resume();st.textContent='Playing: '+S[idx][0];return}mode='all';start(0)};
document.getElementById('pause').onclick=()=>{if(synth.speaking){synth.pause();st.textContent='Paused'}};
document.getElementById('stop').onclick=()=>{token++;synth.cancel();finish();st.textContent='Stopped'};
if(!synth){st.textContent='Text-to-speech not supported in this browser'}
</script>
</body>
</html>
