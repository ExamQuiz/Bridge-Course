<script>
const C=[{"heading": "1.1 Introduction", "parts": []}, {"heading": "1.2 Learning Outcomes", "parts": []}, {"heading": "1.3 The World Around Us (TWAU) and Policy Statements", "parts": []}, {"heading": "1.4 Nature and Scope of The World Around Us (TWAU)", "parts": []}, {"heading": "1.5 Integrated and Interdisciplinary Approaches to Learning of The World Around Us (TWAU)", "parts": []}, {"heading": "1.6 Linkages of The World Around Us (TWAU) with Other Subjects of The Preparatory Stage", "parts": []}, {"heading": "1.7 Curricular Goals, Key Competencies, and Learning Outcomes of Teaching-Learning of TWAU", "parts": []}, {"heading": "1.8 Linkages Between Curricular Goals, Competencies and Learning Outcomes in TWAU", "parts": []}, {"heading": "1.9 Let Us Sum Up", "parts": []}, {"heading": "1.10 End Exercises", "parts": []}, {"heading": "1.11 References", "parts": []}, {"heading": "1.1 INTRODUCTION Have you ever wondered, how children make sense of the world around them, e.g. how birds fly, how trees grow, how water reaches us or how roads are created which they walk on? In this lesson, you will understand how this curricular area “The World Around Us” opens up a world of learning for young children. As you begin studying this course, you will come to know that “ The Nature and Scope of The World Around Us (TWAU) Nature and Scope of The World Around Us (TWAU) Six-Month Certificate Course (Bridge) in Primary Teacher Education World Around Us”(TWAU) goes beyond the conventional boundaries of the disciplinary nature of this area. This unit will help you understand that TWAU is not just a discipline-based subject, but an integrated area of learning that weaves together concepts from science, social studies, the environment, health, and wellbeing through real life experiences and local contexts of the children. This unit will broaden your perspective on its significance, scope, nature and status as a core area at the preparatory stage. You will come to appreciate how TWAU fosters conceptual understanding, critical thinking, empathy, and a sense of connection with the natural and social world by understanding its interdisciplinary perspective. You will also gain insights into the key curricular goals, competencies, and learning outcomes that make the learning evidencebased.", "parts": []}, {"heading": "1.2 LEARNING OUTCOMES After completion of this chapter, the learner", "parts": ["• explains the significance and scope of The World Around Us (TWAU) in the curriculum at the preparatory stage and discusses the nature and status of TWAU in the light of NEP 2020 and NCF-SE 2023;\n• describes the interdisciplinary and integrated nature of TWAU as a curricular area as well as an approach to learning;\n• identifies and articulates the linkages of TWAU with other subjects such as Science, Social Sciences, Environmental Education, Language, Health and Physical Education, Maths, and Arts Education;\n• demonstrates an understanding of curricular goals, key competencies and learning outcomes related to this area; and\n• plans developmentally appropriate learning outcomes that reflect the holistic and inquiry-based nature of this subject."]}, {"heading": "1.3 THE WORLD AROUND US (TWAU) AND POLICY STATEMENTS Under the NEP – 2020, the Preparatory Stage covers Classes 3, 4, and 5. Before this stage, all children go through five years of school education, which includes three years of Balvatika and two years of Classes 1 and 2—also referred to as the Foundational Stage. At the Foundational Stage, the policy does not recommend “The World Around Us” as a curricular area. During these years, the focus is primarily on developing various domains of development such as physical, social, emotional, and motor. Nature and Scope of The World Around Us (TWAU) Nature and Scope of The World Around Us (TWAU) The emphasis is not on subject-based learning and teaching but rather on the development of foundational literacy and numeracy skills. However, learning at the Preparatory Stage must continue to be based on play, discovery, and activity as recommended for the Foundational Stage. At the same time, it is also necessary to incorporate subject-based learning to ensure education becomes more formal and structured—moving beyond the informal nature of the Foundational Stage. This necessitates the inclusion of subjects such as Language (mother tongue and second language), Mathematics, and The World Around Us at this stage. The National Education Policy- 2020 also recommends that curricular content at the preparatory stage in each subject be reduced to its core essentials. This approach is intended to create space for critical thinking, inquiry-based learning, discovery, discussion, and analysis. The focus of curriculum content needs to be on key concepts, creative ideas, application of knowledge, and opportunities for the development of various skills of learning.", "parts": []}, {"heading": "1.3.1 Importance of TWAU as A Core Curricular Area at The Preparatory Stage (Classes 3-5) Before discussing the significance of TWAU, it is important to understand how it has evolved. As a subject earlier, Environmental Studies (EVS) was recommended as a core curricular area for Classes III to V . However, in Classes I and II, many environmental concerns—whether related to the physical or social environment—were suggested to be addressed through the teaching and learning of languages and mathematics. Now, with the introduction of TWAU, this discipline has transformed its nomenclature and approach. The World Around Us has been introduced in place of EVS as a core curricular area. Both EVS and TWAU share certain features: they are integrated, theme-based, interdisciplinary, and emphasize the development of process skills through", "parts": ["activity-based learning.", "However, the shift to TWAU reflects a broader and more nuanced understanding of the child’s developmental needs and the nature of meaningful learning.", "The National Curriculum Framework for School Education (NCF-SE) envisions key transformations in this area, which are expected to have a significant impact on children’s development.", "The significance of TWAU in the curriculum lies in its ability to:\n• foster curiosity about the immediate environment and gradually moving towards the wider environment,\n• develop critical thinking and inquiry skills, through experiential learning,\n• encourage exploration, project-based and hands-on learning,\n• focus on pre-vocational skills to respect the dignity of work,\n• promote sensitivity towards social and environmental issues.", "Nature and Scope of The World Around Us (TWAU) Nature and Scope of The World Around Us (TWAU) Six-Month Certificate Course (Bridge) in Primary Teacher Education TWAU thus serves as a bridge between the child’s experiences and structured knowledge, creating a foundation for lifelong learning through meaningful engagement with the world.", "The World Around Us emphasises work-related and pre-vocational skills such as gardening, Do It Yourself (DIY) activities and creating useful items using pre-used materials.", "This curricular area provides children with greater opportunities to connect with real-life situations, as its approach to learning is threefold (E3):\n• Experiential learning\n• Exploring the environment\n• Experimental thinking and problem-solving TWAU learning is designed to focus on real-life problems (RLP) rather than learning of inert facts and disconnected textbook concepts.", "This also emphasises the importance of learning to live in harmony with nature, thereby fostering sensitivity towards all living beings and the environment.", "CHECK YOUR PROGRESS 1.1 1.", "The emphasis of TWAU at the Preparatory stage is to a.", "Develop subject concepts b.", "Develop other subject information c.", "Relate learning with a real-life situation d.", "Develop more Mathematical skills 2.", "What is the significance of the TWAU as a subject at the preparatory stage?", "Justify your answer briefly.", "Answers: 1.", "(c)"]}, {"heading": "1.3.2 Scope of The World Around Us (TWAU) The scope of this curricular area firstly needs to be understood keeping in view the age level of the children as well as addressing sustainability issues of the environment to make the children a productive citizen of the society. The scope of TWAU is very broad and dynamic as it caters to the needs of the immediate, distant and wider environment in a concentric manner. When we talk about sustainable development of the environment, it has two related components:", "parts": ["• Right to develop the environment such as construction works, dam Nature and Scope of The World Around Us (TWAU) Nature and Scope of The World Around Us (TWAU) construction projects, construction of buildings, industries, and roads to enable progress for better living.", "• The need to ensure balance in the environment so that it should not have a harmful impact on the environment in which both humans and other living beings depend for their survival.", "Keeping in view this twin aspect of the environment, the scope of TWAU can be understood through 4 components in the context of the Preparatory stage as shown in the Figure 1.1.", "Fig.", "1.1: Components of The World Around Us Nature’s Classroom: Exploring Our Natural World This component includes concepts and issues related to living and nonliving elements of the environment that are not man-made—for example, plants, animals, landforms, rivers, ecosystems, forests, etc.", "These are addressed from this area in relation to the child’s context (How they are related to them?).", "Various natural processes, such as the formation of day and night and climate change, etc.", "are also part of this component.", "Understanding Our Social Surroundings This component covers concepts and issues related to culture, economic growth, tradition, man-made activities, living style of different communities, and diversity in population.", "It also includes demographic features such as age, gender, income, occupations, ethnicity.", "It addresses issues related to demand and supply of using other resources.", "Nature and Scope of The World Around Us (TWAU) Nature and Scope of The World Around Us (TWAU) Six-Month Certificate Course (Bridge) in Primary Teacher Education Environmental Education-Learning to Live Sustainably The central pillar of The World Around Us are issues related to the child’s immediate environment.", "It includes concepts, concerns, and activities focused on the protection and conservation of the environment-essentially, learning for the environment.", "Some of the key concepts and issues to be addressed under this component include:\n- Air, water, noise, and soil pollution\n- Causes of waste generation and management\n- Climate change and global warming\n- Deforestation\n- Extinction of species\n- Habitat destruction of animals All these issues related to the environment need to be addressed ageappropriately in the form of themes, so that children can relate to these concerns with their day to day life.", "Ethical and Moral Issues-Values That Shape a Better World This component has a broad and comprehensive scope within the TWAU area of learning.", "It focuses primarily on habit formation, development of positive attitudes and values, and the acquisition of skills that contribute to environmental improvement.", "It also includes learning through various processes and experiences, cultivating 21 st century global competencies, and developing respect for the culture of team work and the dignity of labour.", "Five global skills which are addressed through this area are: o Communication o Collaboration o Creativity o Critical Thinking o Computational Digital Literacy It is very important to understand that all these components of the environment i.e.", "natural, social, environmental, ethical are addressed though this area in an integrated (linked) manner, rather than one- to- one in treatment as shown in Figure 1.1.", "CHECK YOUR PROGRESS 1.2 1.", "Write any two environmental issues which should be addressed through this area of learning.", "Nature and Scope of The World Around Us (TWAU) Nature and Scope of The World Around Us (TWAU) 2.", "Learning for the environment primarily focuses on a.", "Care and Protection of the Environment b.", "Learning Science and Social concepts c.", "Learning Environmental concepts d.", "Awareness of the Environment Answers: 2.", "(a)"]}, {"heading": "1.4 NATURE AND SCOPE OF THE WORLD AROUND US (TWAU) The new structure and transformative nature of all stages of school education is primarily expected to lead to qualitative improvement of children’s learning, using age-appropriate pedagogical practices and clearly identified class-specific learning outcomes. This curricular area has undergone a radical transformation in its structure, nature, status, and approach to teaching and learning, as per the recommendations of NEP - 2020 and NCF-SE 2023. It is essential to understand the conceptual meaning of the following related terms, which are used interchangeably in usages, which is not true. These are:", "parts": ["- Environmental Studies (EVS)\n- Environmental Education (EE)\n- Environmental Science (E.", "Science)\n- The World Around Us (TWAU) The World Around Us (TWAU) The World Around Us is a core curricular area recommended by NEP 2020 and the NCF-SE 2023.", "The EVS which was previously offered in the primary classes has now been replaced with TWAU.", "However, both EVS and TWAU are intended only for Classes 3 to 5, and not for Classes 1 and 2.", "Conceptually, TWAU integrates various aspects of knowledge to help children derive generalized concepts related to their immediate environment.", "This area focuses largely on:\n- Patterns in the surroundings\n- Processes (both social and natural), and\n- The interconnections between the environment and human society.", "Nature and Scope of The World Around Us (TWAU) Nature and Scope of The World Around Us (TWAU) Six-Month Certificate Course (Bridge) in Primary Teacher Education Through learning in this area, children are expected to develop inquiry-based capacities that help them make sense of and interact meaningfully with their immediate natural and social surroundings.", "CHECK YOUR PROGRESS 1.3 1.", "Select correct /false statements a.", "TWAU gives emphasis on prevocational skills.", "b.", "EVS is disciplinary in nature.", "c.", "Environmental Education focuses on science concepts d.", "Science is a core area at the preparatory stage Answers:\na) Correct (b) False (c) False (d) False"]}, {"heading": "1.4.1 Nature of TWAU at the Preparatory stage We all know that The World Around Us (TWAU) is a curricular area introduced at the preparatory stage. Unlike Languages and Mathematics, this curricular area is interdisciplinary in nature. You now need to understand the difference between disciplinary and interdisciplinary approaches in any curricular area. · Disciplinary Nature: A disciplinary subject approach means that the concepts, methods, materials, and processes are explored within the boundaries of a specific discipline. For example:", "parts": ["- Physical Sciences such as Physics, Chemistry, Earth Science (Geology) etc.", "- Biological Sciences such as Botany, Zoology, Biotechnology, Microbiology, etc.", "- Mathematics such as Arithmetic, Algebra, Geometry, Calculus, Trigonometry, etc.", "When we study concepts or issues related to Physics, we focus only within the domain of Physics, without drawing upon knowledge from other subjects.", "Similarly, Mathematics is a discipline-based subject that deals with its own concepts, methods, equations, and operations.", "This is what characterizes a disciplinary approach.", "Broadly, the disciplinary nature refers to specific academic fields such as History, Science, or Literature, with the objective of developing expertise in a particular subject area.", "Nature and Scope of The World Around Us (TWAU) Nature and Scope of The World Around Us (TWAU) TWAU Learning is Interdisciplinary in Nature Unlike the disciplinary nature of subjects, The World Around Us (TWAU) follows an interdisciplinary approach in curriculum development.", "In an interdisciplinary approach, a subject combines knowledge, methods, processes, and issues from various other disciplines -such as Natural Sciences, Social Science, Biology, Economics, and other dimensions of the environment and its related concerns.", "This means that TWAU addresses environmental issues and concerns through the lens of multiple subject areas.", "For example, if children are studying ‘Water’ in this area, they will not merely focus on the physical properties of water (such as colour, odour, or shape).", "Instead, they will explore water through real-life and contextual experiences: Social issues (e.g., distribution of water in the locality, who fetches the water), Environmental issues (e.g., causes of water pollution, reasons for water scarcity in society).", "Thus, TWAU helps children understand their surroundings in a holistic and meaningful way.", "TWAU Learning is Integrated in Nature The second important feature of TWAU is its integrated nature.", "You may recall that the EVS curriculum also emphasised this nature of learning.", "So, what does an integrated curricular area mean?", "The integrated nature of a curriculum refers to its ability to draw insights from various subjects (as in an interdisciplinary approach) to create a comprehensive understanding of concepts, issues, and skills.", "It reflects a sense of wholeness, harmony, and unity in the treatment of content / concepts.", "For example, in TWAU, if a child is learning about the theme “Food”, the area presents this concept through multiple perspectives: · Scientific (sources of food, nutrients) · Social (cultural food habits, festivals) · Environmental (sustainable practices, waste management, conservation of resources) · Language (food-related vocabulary, poems or stories) · Health (balanced diet, hygiene) TWAU Learning is Thematic in Nature This area encourages theme-based learning rather than the subject or topical based learning.", "It does not proceed with a list of topics where focus is more on content.", "The ‘Thematic learning’ encourages children to comprehend learning Nature and Scope of The World Around Us (TWAU) Nature and Scope of The World Around Us (TWAU) Six-Month Certificate Course (Bridge) in Primary Teacher Education experiences as a unified form.", "The theme helps children make sense of life experiences by connecting and correlating with knowledge and skills across various topics within and across the subjects.", "For example, in Class 3, in the TWAU textbook, “Food” has been taken as a theme which covers concepts related to science, health, environment and arts education.", "We can say that the nature of TWAU is\n• Integrated\n• Interdisciplinary\n• Thematic (not topical)"]}, {"heading": "1.4.2 What is the status of TWAU in the curriculum at The Preparatory Stage? Due to its integrated and interdisciplinary nature, it is now recognised as a curricular area and as a pedagogical approach to learning. Before NCF 2005, EVS was dealt with in two parts: · EVS I (Social Studies) · EVS II (Environmental Science) This was applicable to Classes 3, 4, and 5. The NEP 2020, restructured school education into four stages as 5+3+3+4. As part of this transformation, EVS has not only changed in structure and status but also in its nomenclature. It is now referred to as “The World Around Us” (TWAU) and has been identified as an independent curricular area for Classes III to V . For Classes I and II, TWAU is not treated as a separate subject but is considered as an important component integrated across all other curricular areas such as Language, Mathematics, Art, and Physical Education. At this stage, it is essential to use the environment as an integrating context for teaching and learning. At the Preparatory Stage (Classes 3-5), the focus is not merely on learning about the environment, but rather on using the immediate environment—including school, family, community, flora and fauna, art and culture, healthy habits, values, and cultural heritage—as a meaningful approach to learn. This leads to a three-fold objective for teaching and learning in TWAU: 1. Learning about the environment – through content drawn from the child’s immediate surroundings. 2. Learning through the environment – by engaging with processes and skills. Nature and Scope of The World Around Us (TWAU) Nature and Scope of The World Around Us (TWAU) 3. Learning for the environment – by developing respect and sensitivity for improving and sustaining the surroundings.", "parts": ["CHECK YOUR PROGRESS 1.4 1.", "The nature of The World Around US (TWAU) is a.", "Integrated b.", "Interdisciplinary c.", "Integrated and interdisciplinary d.", "Disciplinary 2.", "Justify why TWAU learning is not disciplinary in nature.", "Give any two reasons.", "Answers: 1.", "(c)"]}, {"heading": "1.5 INTEGRATED AND INTERDISCIPLINARY APPROACHES TO LEARNING OF THE WORLD AROUND US (TWAU) The NEP-2020 and NCF-FS 2023 recommend a new curricular area under a new name: “The World Around Us” (TWAU). The curricular area of EVS has been radically transformed into this broader area, which places greater emphasis on pre-vocational skills, project-based learning, local to global perspective right from the early years. Examples include: · Gardening · Clay modelling · Emphasis on affective aspects of child behaviour, such as developing attitudes and values for improving their immediate environment. · Project-based learning This area follows a comprehensive approach, encompassing concepts, issues related to:", "parts": ["• Value education\n• Physical and health education\n• Art education Nature and Scope of The World Around Us (TWAU) Nature and Scope of The World Around Us (TWAU) Six-Month Certificate Course (Bridge) in Primary Teacher Education\n• Environmental education\n• Language\n• Mathematics\n• Science\n• Social Science Aim of TWAU Broadly TWAU aims to address environmental concepts/issues/concerns through the experiential learning approach, related to children’s life experiences with the medium of different subjects, which they will study in at the middle stage as the medium, to ensure with a smooth transition."]}, {"heading": "1.5.1 What is an Infused Model in Classes 1 and 2? TWAU is not treated as an independent curricular area in Classes 1 and 2. Therefore, the approach differs at both the levels. In Classes 1 and 2, an infused model is followed. This approach is described as multidisciplinary in nature, where the content, issues, and skills related to the environment are infused into the teaching and learning of Language, Mathematics, and Arts Education. Instead of teaching environmental concepts separately, they are integrated with other subject areas, ensuring holistic and meaningful learning for young children.", "parts": ["Fig.", "1.2: Multi-disciplinary Model of TWAU Infused/Multidisciplinary Approach in Classes 1 & 2 This approach does not create the burden of an additional or separate subject.", "Instead, the issues, skills, and simple concepts related to the environment are Nature and Scope of The World Around Us (TWAU) Nature and Scope of The World Around Us (TWAU) addressed informally through the child’s everyday learning experiences.", "For example, if you look at the Class 2 English textbook titled Mridang, you will notice that the content (Language) has been derived from the child’s immediate surroundings, making learning more relatable and meaningful.", "Example from Language (English Subject) The Theme/Units from Mridang, Class 2 English Textbook 2022\n• Fun with My Friends : e.g.", "My Bicycle\n• Welcome to My World : e.g.", "It is Fun\n• Going Places : e.g.", "Between Home and School\n• Harmony : e.g.", "Little Drops of Water"]}, {"heading": "1.5.2 What is an Interdisciplinary Model in Classes 3-5? In this approach, environmental concepts, issues, concerns, and skills are addressed by considering various perspectives from different subject areas. In other words, different subject perspectives (as illustrated in the Figure 1.3) related to the environment—ranging from the immediate to the wider context— are addressed through the teaching-learning of one subject, rather than being infused across multiple subjects. This model can be better understood by taking an example from the Class 3 TWAU textbook entitled “Our Wondrous World.” TWAU Language Mathematics Social Studies Environmental Educaiton Life Science (Physcial/Biological) Arts Health and Physcial Education V ocational Areas", "parts": ["Fig.", "1.3: Interdisciplinary Model of TWAU We can understand this model by taking an example from the Class 3, textbook of TWAU titled “Our Wondrous World”.", "Nature and Scope of The World Around Us (TWAU) Nature and Scope of The World Around Us (TWAU) Six-Month Certificate Course (Bridge) in Primary Teacher Education Unit I: Our Families and Communities Chapter Domain/Area Issues/Concepts Addressed Family and Friends (C-1) Social concepts and issues · Relationships among family members · Mutual support and respect for family members Going to the Mela (C-2) Social issues Healthy living · Leisure time with family and friends · Taking care of the old and young family members Celebrating Festivals (C-3) Cultural issues (dresses) Science (food issues) · Cultural practices to celebrate festivals · Diversity in the food we eat, dress we wear You can see that in this approach, one can discuss social, natural, and environmental concepts/issues under one unit/chapter.", "Let us take an example from the class 4 of textbook of TWAU UNIT 3: Health and Well Being Chapter Domain/Area Issues Addressed Food for Health (C5) · Science concept (balanced diet) · Food for body building, for energy, for disease prevention · Social Sciences (diversity in food habits) · Traditional food of Andhra Pradesh, Karnataka, Telangana · Health Education (prevention of diseases by eating healthy food items) · Fruits and vegetables increase immunity · ‘Saying no’ to junk food · Water for health While analyzing the content given in the table, one can see that the concepts related to science, health and social aspects are addressed in the same chapter.", "CHECK YOUR PROGRESS 1.5 1.", "‘The World Around Us’ is a.", "Disciplinary and Integrated Nature and Scope of The World Around Us (TWAU) Nature and Scope of The World Around Us (TWAU) b.", "Integrated and Multidisciplinary c.", "Integrated and Interdisciplinary d.", "Disciplinary and Multidisciplinary 2.", "How are the interdisciplinary, disciplinary and multidisciplinary approaches different from each other?", "Give one example for each.", "Answers: 1.", "(c)"]}, {"heading": "1.6 LINKAGES OF THE WORLD AROUND US (TWAU) WITH OTHER SUBJECTS OF THE PREPARATORY STAGE Let us understand the major objectives of learning and teaching TWAU at the preparatory stage. If you look into the nature and approach to learning in this area, it has a five-fold purpose: I. Enhancing knowledge and awareness level II. Developing skills, processes and competencies III. Fostering/nurturing values and attitude development IV . Taking action for improvement of surroundings V . Providing opportunities for creative thinking Encouraging children to become more experimental and creative through activities related to discovery, innovation, and creative work. Some examples are given below. Let us see one by one.", "parts": []}, {"heading": "1.6.1 Linkages of TWAU with Language Learning (Preparatory Stage) Language Learning Linkage with TWAU Language vocabulary (words, terms) · Enhances terminology, vocabulary, to express ideas Speaking and communication skills · Enhances expressing skills · Helps to communicate ideas, concepts Nature and Scope of The World Around Us (TWAU) Nature and Scope of The World Around Us (TWAU) Six-Month Certificate Course (Bridge) in Primary Teacher Education Creative writing on different themes/ own experiences · Enhances creative expression · Helps to express their own points of view Reading skills eg. Reading books, stories, narratives, newspapers · Develops knowledge and awareness · Improves comprehension skills", "parts": ["CHECK YOUR PROGRESS 1.6 1.", "Write one example of linkage of Language and TWAU from class 3 English Textbook."]}, {"heading": "1.6.2 Linkages of TWAU with Mathematics Learning As you know, a child at the preparatory stage is a concrete learner. Therefore, mathematics learning at this stage needs to be made more concrete (rather than abstract) by using various objects, environmental materials, and day-to-day items used by children. Maths learning at this stage should be fun-filled, visually oriented, and possibly comic strip-based. The use of cartoons can make the learning process more interesting, helping to avoid abstraction and boredom. Some of the Mathematics Learning examples are Mathematics Learning Linkage with TWAU · Oral Math / Talk, Poems/talk on seasons, direction, mela/ Fair · Enhances Environmental Literacy/ terminology · Activities related to identification of shapes, size of objects, grouping of objects, seriation · Develops observation, discrimination, identification, classification skills · Data handling, Data recording · Enhances skills of analyzing, record keeping · Pattern making activities (e.g. using rangoli, 1-100 numbers sequence, mehndi design · Develops skills of seriation · Improves drawing skills, creative expression · Use of puzzles, riddles, quiz · Develops analytical skills", "parts": ["CHECK YOUR PROGRESS 1.7 1.", "Write any five environmental objects which can be used for Mathematics learning.", "Nature and Scope of The World Around Us (TWAU) Nature and Scope of The World Around Us (TWAU)"]}, {"heading": "1.6.3 Linkages of TWAU with Science Learning The linkages between Science learning and TWAU can be understood through an analysis of these chapters in the Class 3 TWAU Textbook. Science Concept/Issues in Chapter 7 e.g. Water (Class 3) Linkage with TWAU · Rain and Rainwater · Water as a non-renewable precious resource · Water resources, diversity in water resources and utensils to store water · Water for plants and animals · Making a bird bath · Identifies uses of rainwater in daily life · Conservation of water as a resource and the need to save it · Appreciating diversity in ways to store water in the family, kind of resources of water · Care for plants and animals · Displays sensitivity towards animals", "parts": []}, {"heading": "1.6.4 Linkages of TWAU with Social Studies Learning Let us now examine Chapter 8: Food We Eat in the Class 3 TWAU Textbook. Social Studies Concepts/Issues Linkage with TWAU · Food prepared during festivals in your families · Appreciate/respect diversity in food · Name of crops grown in your area (village/region) · Develops awareness of surroundings/area · Fruits, vegetables available in different seasons · Appreciates diversity in fruits and vegetables availability in different seasons · Food items prepared in summer/ winter/rainy season · Respects different cooking practices in different cultures", "parts": []}, {"heading": "1.6.5 Linkages of TWAU with Arts Learning Art education is one of the subject areas at the preparatory stage of learning. Arts Education is linked with “The World Around Us” in many respects. Few examples are given below: Arts Education Learning Linkage with TWAU Learning · Using environmental objects/ materials to create visuals/pictures (e.g. using leaves to make pictures of animals, designs, patterns · Understands sustainability of the environment · Displays observation skills Nature and Scope of The World Around Us (TWAU) Nature and Scope of The World Around Us (TWAU) Six-Month Certificate Course (Bridge) in Primary Teacher Education · Eco-friendly art/using recycled material · Care, protection of the environment · Develops creative expression · Making posters/drawings/pictures on issues/concerns related to environment eg global warming pollution issues · Displays sensitivity towards environment for its protection · Creates/designs messages/ posters to improve the environment · Play Drama, narratives, songs, related to Environment · Writes messages to protect our planet Earth", "parts": ["CHECK YOUR PROGRESS 1.8 1.", "How is health education linked with the learning of ‘The World Around Us’?", "Give any two examples.", "2.", "‘The World Around Us’ is not a subject area in classes 1 and 2.", "Reflect on this statement and share your views."]}, {"heading": "1.7 CURRICULAR GOALS, KEY COMPETENCIES, AND LEARNING OUTCOMES OF TEACHINGLEARNING OF TWAU Before discussion on curricular goals and competencies, let us know that the school education curriculum framework has been developed at two levels. A. National Curriculum Framework for the Foundational Stages (NCFFS-22): This framework addresses all aspects of the foundational stage i.e. 3 years education of preschool (Preschool, 1,2,3) and two years of education of Classes 1 & 2. These two levels together are called the foundational stage. B. National Curriculum Framework for School Education (NCFSE, 2023): This framework addresses all aspects of different stages of school education. It covers the foundational stage (also in a separate framework), preparatory stage (3 years) middle stage (3 years) and secondary stage (4 years) of school education. What are the Aims, Curricular goals, Key competencies of School Education? As we all know, the prime purpose of school education is to develop all aspects of an individual such as – physical, social, emotional, spiritual (holistic development) so that he/she can grow up to be a productive citizen of the Nature and Scope of The World Around Us (TWAU) Nature and Scope of The World Around Us (TWAU) society. This vision can only be achieved if the curriculum takes care of all these aspects. Hence it is necessary to frame aims and goals in such a manner that it caters to the needs of different sections of the society in general and development of individual aspects in particular. Let us understand the broader meaning of all these aspects one by one.", "parts": []}, {"heading": "1.7.1 The Aims of Education are Vision Statements Derived From Policy Documents The aim will help to define the curricular goals of school education. These aims are very broad and act as ‘vision statements’ and give directions for deliberations for the entire education system. These aims guide the curricular framers to develop curricular goals for all stages of school education. For example, the NEP-2020 states that the aim of the education system is “to develop good human beings, capable of rational thought and action, possessing compassion and empathy, courage and resilience, scientific temper, and creative imagination with sound ethical moorings and values”.", "parts": []}, {"heading": "1.7.2 Curricular Goals are Statements That Give Direction to Curriculum Development and Implementation Curricular goals are derived from the aims of school and are specific to the ‘stage in education’ such as the foundational stage, preparatory stage, middle stage and secondary stage. For example, CG-4 of the preparatory stage states that “sensitivity towards social and natural environment” is a curricular goal at this stage. So, these goals are derived from the aims of school education. Aims of Educaiton Curriular Goals Key Competencies Competencies subject wise Learning Outcomes subject-wise The World Around Us (TWAU)", "parts": ["Fig.", "1.4: Logical Connections – Aims of Education to Learning Outcomes Nature and Scope of The World Around Us (TWAU) Nature and Scope of The World Around Us (TWAU) Six-Month Certificate Course (Bridge) in Primary Teacher Education"]}, {"heading": "1.7.3 Key Competencies and Competencies The key competencies are core competencies. Each key competency may have more than one competency in it. Key competencies are not specific. The competencies are learning achievements of children which are observable (in performance) and can be assessed systematically. These competencies are derived from the curricular goals. These competencies are expected to be attained by the end of a stage. For example, in CG-4 (observed for TWAU), 7 competencies (C-4.1- C-4.7) are there. These 7 competencies are expected to be achieved by the end of Class 5. (To be achieved in 3 years). For example, C-4.1 competency is “Observes and describes diversity among plants and birds and animals in the immediate environment.”", "parts": ["ACTIVITY 1.1 Study the NCF-SE-23 and identify C-4.1 – C-4.7.", "Write the theme in your notebook and discuss it in a group."]}, {"heading": "1.7.4 Learning Outcomes Learning Outcomes (LOs) are derived from the identified competencies. In each competency, there may be one or more than one learning outcomes. The competencies as we discussed are achieved over a period of time. In order to achieve these competencies we require some ‘Markers’ which can assess the performance of children. These markers are called ‘Learning Outcomes’. We can say that “Learning Outcomes are granular Milestones of Learning” and usually progress in a sequence (linear form) leading to the attainment of a competency. So, in a nut-shell, learning outcomes are the basis for planning of teaching and learning in any subject. Thus, teachers have the autonomy to define LOs as per the needs of the children and their context. From this Figure 1.5, we can understand that aims and goals are not observable in behavioral terms while competencies and learning outcomes are observable and illustrative. Nature and Scope of The World Around Us (TWAU) Nature and Scope of The World Around Us (TWAU) Aims Curricular Goals Competencies Learning Outcomes Derived from Aims Stage Specific Not illustrative (Not measurable) Vision Statement Derived from Curricular Goals Derived from Competencies Not illustrative (Not measurable) Illustrative and measurable goals Assessable General to all stages Stages and Subject wise Goals Subject and Class-wise", "parts": ["Fig.", "1.5: Measurable and Non-measurable Markers of Learning\nCHECK YOUR PROGRESS 1.9 1.", "The nature of learning outcomes is a.", "Subject-wise, class-wise, assessable b.", "Subject-wise, class-wise, not assessable c.", "Subject-wise, derived from goals d.", "Subject-wise, derived from aims 2.", "Why do we need Learning Outcomes?", "Give any two reasons.", "Answers: 1.", "(a)"]}, {"heading": "1.8 LINKAGES BETWEEN CURRICULAR GOALS, COMPETENCIES AND LEARNING OUTCOMES IN TWAU As we discussed in the earlier section, the nature of TWAU is interdisciplinary, which means the subject knowledge, skills, processes, tools are derived from different areas i.e., Science, Social Sciences, Arts, Health and Physical Education to address environmental issues holistically. Thus, the broad aim of an interdisciplinary area is three-fold. Nature and Scope of The World Around Us (TWAU) Nature and Scope of The World Around Us (TWAU) Six-Month Certificate Course (Bridge) in Primary Teacher Education  Develop a holistic understanding through interdisciplinary thinking rather than discipline-based (subject-wise) thinking. For example, children view their surroundings (natural, social, cultural) in an integrated form rather than as a natural, social, cultural issue in a separate manner.  Develop an understanding of nature and learn to live in harmony with it. Thus, with this area of learning children would develop an awareness and appreciation of the interdependence between the natural (plants and animals) and the man-made environment. For example, we get a lot of things from plants and animals. In return we take care of them.  Develop an understanding of key ethical and moral dimensions of children’s behavior in the light of human and constitutional values in general and age-specific values in particular.", "parts": []}, {"heading": "1.8.1 Understanding Linkages between Curricular Goals, Competencies and Learning Outcomes in TWAU Curricular Area Example I Let us take this example of TWAU to understand the linkages among them. For this area, the CG- I is as stated below: “Explores and engages with the natural and social environment in their surroundings”. ↓ Under this CG, -I, five competencies have been identified. These are C.1.1, C-1.2, C-1.3, C-1.4 and C-1.5 (please see them in the reference section) ↓ Let us take competency C 1.1 which states that: “Observes and identifies the natural (insects, plants, birds, animals, geographical features, sun, moon, stars, planets, natural resources) and socio-cultural (houses, relationships) components in their immediate environment”. ↓ If you study these competencies, you will find there are 2 major components in it. Nature and Scope of The World Around Us (TWAU) Nature and Scope of The World Around Us (TWAU) Natural Environmental Components Social Environmental Components · Such as plants, animals, insects of immediate surroundings · Geographical features of surroundings (landforms) · Sun, Moon, Stars, Planets · Natural Resources · Such as kind of houses/shelters · Relationship between family member · Relationship with friends This competency (C-1.1) will be developed with the help of learning outcomes. These learning outcomes will be achieved by using appropriate content and teaching learning processes. Let us select- “Plants of the surroundings”, from the natural component. Chapter 4 entitled “Getting to Know Plants” in Class 3 textbook of TWAU is based on this. The major learning outcomes related to this chapter are:  Identifies plants of the surroundings such as trees, shrubs, herbs, climbers, creepers.  Discriminates (similarities and differences) between trees, shrubs, herbs and describes these in her/his own words.  Identifies parts of plants and describes about them.  Draws different parts of the plants and labels them.  Appreciates the beauty of the surroundings i.e. gardens, parks.  Creates / draws patterns by using fallen leaves, petals, feathers, seeds etc.", "parts": ["CHECK YOUR PROGRESS 1.10 1.", "Select any one chapter related to social aspects of the environment and frame five LOs for the Class 3 textbook of TWAU.", "Example 2 Let us take an example from the Class 4 textbook of TWAU.", "Let us first select any CG, for example we select CG- 3 which states “explain how to ensure the safety of self and others in different (normal as well as emergency) situations”.", "Nature and Scope of The World Around Us (TWAU) Nature and Scope of The World Around Us (TWAU) Six-Month Certificate Course (Bridge) in Primary Teacher Education This curricular goal as expected to be achieved in 3 years (Class 3 – Class 5) This curricular goal will be achieved through 3 competencies namely C-3.1, C-3.2, C-3.3, as are given in the reference section.", " Let us select competency C-3.1 which states – “Describes the basic safety needs and protection (Health and Hygiene, food, water, shelter, precautions, awareness of emergency situations abuses and unsafe situations) of humans, birds and animals”.", " When you study this competency, it covers concepts/issues related to\n- Health and Hygiene\n- Safety needs\n- Food, Water\n- Shelter\n- Abuse and unsafe situations  In Class 4, chapter 6 is developed on “Happy and Healthy Living” which covers health components.", "Chapter 6 covers the following major learning points:-\n- When do I feel happy\n- Journey of the grains\n- Mindful eating\n- Valuing food\n- Enjoying sports\n- Sleeping well\n- Feeling safe Now, let us select, “Valuing food” as a learning point and frame the LOs to achieve it.", "- Discusses and shares the kind of food they eat in the family.", "- Share the information related to who cooks the food in the family and learns to respect them.", "- Avoids wastage of food and shows concerns for wastage (found in tiffin of friends, in party, kitchen).", "Nature and Scope of The World Around Us (TWAU) Nature and Scope of The World Around Us (TWAU) All these LOs are to be achieved by using a variety of activities given in this chapter such as (Activity 4) and in text questions on page 93 in TWAU class 4 textbook.", "CHECK YOUR PROGRESS 1.11 1.", "Select any one chapter from the class 3 textbook and analyze a.", "Concepts/information given in the chapter b.", "Different skills used in the chapter c.", "Any values/healthy habits addressed in the chapter"]}, {"heading": "1.9 LET US SUM UP The objective of teaching-learning of TWAU at the preparatory stage is to build the learning bond between Classes 1 and 2 and Classes of the preparatory stage. · At this stage, the environment plays a crucial role and is used as an integrating factor or context in the process of learning. · The World Around Us curriculum helps children to gain systematic understanding of the natural, social environment in their immediate context. · The TWAU curricular area starts from class 3 to class 5 and is taught as a compulsory core subject of ‘Our Wondrous World’. In classes 1 and 2, the concerns/issues of this area need to be addressed through the teaching-learning of languages, Mathematics, Arts education. · ‘The World Around Us’ follows an interdisciplinary, rather than a multidisciplinary approach in Class 3 - 5. Thus, through this area, concepts, issues, concerns related to different disciplines (Science, Social Studies, Art education) have been addressed in a holistic way. · The learning of ‘The World Around Us’ (TWAU) promotes experiential learning through exploration of the immediate environment thus making the child’s mind more experimental and creative. · ‘The World Around Us’ helps in developing awareness, skills, environmental terminology and inculcating values among the children. · In order to meet out the expectations from this area, learning standards have been defined and identified in the form of Learning Outcomes. Nature and Scope of The World Around Us (TWAU) Nature and Scope of The World Around Us (TWAU) Six-Month Certificate Course (Bridge) in Primary Teacher Education", "parts": []}, {"heading": "1.10 END EXERCISES 1) Why is ‘The World Around Us’ not as a curricular area in Classes 1 and 2? Give any 2 reasons. 2) Write any two significance of learning ‘The World Around Us’ curricular area in Classes 3-5. 3) What is an interdisciplinary and multidisciplinary approach to learning? Explain with an example. 4) What is theme-based learning? Explain it with an example. 5) What do we mean by ‘Learning about the environment, learning for the environment and learning through the environment’? Give one example of each. 6) How is TWAU learning different from EVS learning? Give any two differences. 7) Why do we need LOs class and subject –wise? 8) Write any three LOs on the theme ‘Food’.", "parts": []}, {"heading": "1.11 REFERENCES 1. MHRD. (1992). National Policy on Education 1986. 2. MHRD. (2020). National Education Policy 2020 3. MHRD. (2021). Nipun Bharat. Initiatives for proficiency in Reading with understanding and Numeracy (NIPUN BHARA) guidelines for Implementation. 4. NCERT. (2005). Looking Around, A Textbook for class III. Environmental Studies. 5. NCERT. (2006a). Environment education as infused in NCERT syllabus for classes I-XII as per NCF-2005. 6. NCERT. (2022). Foundational stage curriculum framework. 7. NCERT. (2023) National curriculum framework for school education. 8. NCERT. (2024). Our Wondrous world A textbook for class III. The World Around Us. 9. NCERT. (2025). Our Wondrous World. A Textbook for class IV , The World Around Us. 10. Shimray, C. (2016). Teaching Environmental Education. Trends and practices in India.", "parts": []}];let si=0,pi=0,playing=false,synth=speechSynthesis;

function start(i,j){synth.cancel();document.querySelectorAll(".active").forEach(x=>x.classList.remove("active"));si=i;pi=j;playing=true;let z=document.querySelector("#s"+i+" .body").children[j];if(!z)return;z.classList.add("active");z.scrollIntoView({behavior:"smooth",block:"center"});let u=new SpeechSynthesisUtterance(C[i].parts[j]);u.rate=+$("speed").value;u.lang=$("lang").value;let v=[...synth.getVoices()].find(x=>x.name===$("voice").value);if(v)u.voice=v;u.onstart=()=>{$("status").textContent="Reading: "+C[i].heading};u.onend=()=>{z.classList.remove("active");if(playing){if(j+1<C[i].parts.length)start(i,j+1);else if(i+1<C.length)start(i+1,0);else{playing=false;$("status").textContent="Finished"}}};synth.speak(u)}
$("play").onclick=()=>{if(synth.paused){synth.resume();playing=true}else if(synth.speaking){synth.pause();$("status").textContent="Paused"}else start(si,pi)};
