<script>const SECTIONS=[{"heading": "5.1 Introduction", "parts": []}, {"heading": "5.2 Learning Outcomes", "parts": []}, {"heading": "5.3 Learning Resources: Meaning and Importance", "parts": []}, {"heading": "5.4 Identification and Selection of Learning Resources", "parts": []}, {"heading": "5.5 Variety of Resources for Teaching-Learning ‘The World Around Us’", "parts": ["(TWAU)"]}, {"heading": "5.6 Let Us Sum Up", "parts": []}, {"heading": "5.7 End Exercises", "parts": []}, {"heading": "5.8 References 5.1 INTRODUCTION", "parts": ["The National Curriculum Framework for School Education-2023 (NCFSE-2023) advocates for activity-based and inquiry-based teaching, particularly at the preparatory stage.", "This approach is central to “The World Around Us” (TWAU) curriculum for classes 3 to 5.", "This course aims to provide environmental education through experiential learning, connecting children’s real-world experiences with foundational academic concepts.", "Unlike a number of subjects relying on textbooks and memorization, TWAU thrives on a hands-on, inquiry- based approach deeply rooted in children’s immediate surroundings.", "In this context, the role of ‘resources’ transcends the traditional notion of just textbooks or blackboards.", "Resources become the very lifeblood of TWAU pedagogy, transforming abstract concepts into tangible experiences, making learning joyful and meaningful, and enabling children/learners to construct their own knowledge.", "From observing the chirping birds outside the classroom LEARNING RESOURCES IN THE WORLD AROUND US window to a discarded plastic bottle, from a community elder person sharing local lore or song to an interactive digital simulation of the water cycle – everything around us holds the potential to be a powerful learning resource.", "This chapter is designed for preparatory stage teachers, equipping them with a comprehensive understanding of what constitutes a learning resource in the context of the course “The World Around Us” (TWAU).", "In this chapter we delve into why resources are indispensable, establish clear criteria for their effective identification and selection, and explore a rich tapestry of diverse resources", "– both conventional or traditional and unconventional – that can profoundly", "enrich the TWAU classroom.", "Special emphasis is placed on how to leverage the visual richness inherent in NCERT textbooks, using their illustrations as springboards for real-world exploration and deeper conceptual understanding.", "By the end of this lesson, teachers will be empowered to move beyond the confines of the classroom, transforming the entire “The World Around Us” into an active, engaging, and impactful learning laboratory for their children."]}, {"heading": "5.2 LEARNING OUTCOMES", "parts": ["After completion of this chapter, the learner", "• explains the importance of resources in the teaching-learning of", "TWAU;", "• describes the various learning resources for the teaching-learning of", "TWAU;", "• explains the criteria for identification and selection of a learning", "resource;", "• selects the most appropriate learning resource/s in a given teaching-", "learning situation; and", "• uses alternative resources for teaching learning of TWAU."]}, {"heading": "5.3 LEARNING RESOURCES: MEANING AND IMPORTANCE", "parts": ["Learning resources, also known as teaching-learning materials (TLMs) or instructional materials, are much more than simple teaching aids.", "They encompass any materials, tools, devices, people, or environments that teachers utilize to facilitate, enhance, and support the learning journey for learners.", "These resources are integral to the learning experience itself, serving as:", "• Vehicles for knowledge: They deliver, clarify, and help apply information.", "• Building blocks for understanding: They transform abstract concepts", "into something accessible and engaging for children.", "• Tools for holistic development: They are the means through which", "knowledge is gained, skills are honed, and attitudes are shaped.", "The defining feature of a learning resource is its ability to make learning meaningful, tangible, and captivating for the children, moving them beyond passively receiving information to actively participating in and building their own understanding.", "In the context of “The World Around Us” (TWAU), a learning resource is anything that helps children understand, explore, question, or connect with their environment and the concepts being taught.", "These resources extend far beyond traditional or prescribed textbooks and may take many forms:", "Tangible Objects: These are items that children can touch, feel, and manipulate, offering a concrete learning experience.", "Examples: Models, globes, specimens (like leaves, seeds, rocks), educational toys, craft supplies, scientific apparatus (magnifying glasses, measuring tapes), real fruits and vegetables, historical artifacts, science experiment kits, traditional Indian costumes and so on.", "Print Materials: These form the traditional backbone of many classrooms, providing information through written and visual content.", "Examples:", "Textbooks, worksheets, storybooks, flashcards, charts, posters, encyclopedias, picture dictionaries, newspapers, magazines, local brochures, pamphlets, and children’s literature.", "Audio Resources: These resources are primarily designed for listening, engaging the auditory senses.", "Examples: Educational podcasts, audio books, storytelling recordings, lectures, traditional music, educational programmes broadcast on radio and recordings of animals or environmental sounds.", "Visual Resources: These convey information predominantly through sight, making concepts clearer and more memorable.", "Examples: Diagrams, photographs, illustrations, educational films, educational programmes telecasted on television, documentaries, slideshows, info graphics, smart board presentations, and interactive digital displays.", "Digital/Multimedia Resources: These combine various media types, often offering interactive and immersive learning experiences.", "Examples: Educational applications (apps), online simulations, virtual reality (VR) experiences, e-books, educational websites, interactive quizzes, video games designed for learning, and virtual field trips.", "Human Resources: These are individuals who serve as direct sources of knowledge, experience, or guidance, bringing real-world perspectives into the classroom.", "Examples: The teachers themselves, guest speakers and visitors (e.g., a local expert/farmer/artisan, a doctor, a police officer), community elders and leaders, mentors, and peer tutors.", "Environmental/ Community Resources: These leverage the physical surroundings or social structures to provide authentic learning opportunities outside the classroom.", "Examples: The school garden, a nearby pond, a local market, a museum, a historical monument, a library, a community center, a bank, and a post office.", "Experiences and Activities: These involve active engagement and direct participation, fostering deeper understanding and skill development.", "Examples:", "Nature walks, field trips, excursions, experiments, hands-on projects, surveys, interviews, role-playing, debates, storytelling, drama, and games."]}, {"heading": "5.3.1 Importance of Learning Resources in TWAU", "parts": ["The significance of learning resources in TWAU cannot be overstated, especially for the children of classes 3-5 who are still in the concrete operational stage of cognitive development.", "Their learning is most effective when it is directly experienced and connected to their immediate surroundings.", "1.", "Making Learning Concrete and Real: Resources transform abstract", "ideas into observable phenomena.", "TWAU deals with concepts like ‘water cycle’, ‘pollution’, ‘diversity of plants and animals’, or ‘community services’.", "While textbooks provide diagrams and descriptions, a direct visit to a water body, observing a polluted area, or interacting with a community helper makes these concepts tangible, meaningful and real.", "2.", "Capturing Attention and Sustaining Interest: Young children have", "limited attention spans.", "Lecture based classroom teaching can quickly lead to passivity and disengagement.", "Diverse resources, particularly those that are hands-on, visual, auditory, or interactive, naturally capture and hold children’s/learner’s attention.", "A stimulating video about animal habitats, an exciting field trip to a local farm, or soil samples brought into the classroom are far more engaging than just reading about them.", "3.", "Catering to Diverse Learning Styles: Children learn in different ways –", "some are visual learners, others auditory, kinesthetic, or social.", "A variety of resources ensures that all learning styles are addressed.", "Visual learners benefit from charts, pictures, and videos; kinesthetic learners from hands-on experiments and field trips; auditory learners from discussions and stories;", "and social learners from group projects and community interactions.", "Using an NCERT illustration of ‘different modes of transport’ can be followed by a drawing activity (visual), a discussion on their sounds (auditory), or a role-play (kinesthetic/social).", "4.", "Promoting Active Participation and Inquiry: Resources encourage", "children to do, observe, question, and discover rather than passively receive information.", "5.", "Developing Critical Thinking and Problem-Solving Skills: When", "children interact with resources, they are often presented with real-world problems or phenomena.", "Observing a polluted river or a drought-affected area, for instance, can lead to discussions on the causes and solutions, thus fostering critical thinking.", "6.", "Connecting Classroom Learning to Real Life: TWAU is about", "understanding the “world around us.” Resources provide direct links between classroom concepts and children’s everyday experiences.", "Learning about ‘shelter’ from a textbook is one thing; observing different types of houses in the neighbourhood and discussing their construction materials and purposes makes the learning relevant and relatable.", "7.", "Aiding in Retention and Long-Term Memory: Experiences gained", "through interaction or manipulation with resources are often more memorable and lead to deeper understanding than information merely read or heard.", "In essence, learning resources are not optional add-ons but fundamental components of effective TWAU teaching-learning contexts.", "They empower teachers to create dynamic, student-centred classrooms where children are active participants in their own learning journey, connecting with the “world around them” in meaningful and profound ways.", "CHECK YOUR PROGRESS 5.1", "1.", "What is the primary purpose of learning resources according to the text?", "a) To replace teachers in the classroom", "b) To make learning meaningful, tangible, and captivating for the child", "c) To provide entertainment during lessons", "d) To assess students’ knowledge through tests", "2.", "Which type of learning resource would a globe or a specimen of a leaf fall", "under?", "a) Print Materials", "b) Audio Resources", "c) Tangible Objects", "d) Visual Resources", "3.", "A field trip to a local market is an example of which type of learning", "resource?", "a.", "Human Resources", "b.", "Environmental/Community Resources", "c.", "Digital/Multimedia Resources", "d.", "Print Materials", "4.", "What is the role of resources in promoting active participation and inquiry?", "a.", "They encourage children to passively receive information", "b.", "They encourage children to do, observe, question, and discover.", "c.", "They reduce the need for children interaction", "d.", "They are solely for demonstration by the teacher", "5.", "Why are experiences gained through interaction with resources more", "memorable?", "a.", "Because they are often lengthy and repetitive", "b.", "Because they are typically less engaging than textbooks", "c.", "Because they lead to deeper understanding and longer retention", "d.", "Because they are easier to grade", "6.", "Which of the following is an example of a Human Resource in the context", "of learning?", "a.", "A textbook", "b.", "An educational podcast", "c.", "A local farmer invited to speak", "d.", "A virtual reality experience", "7.", "List any three broad categories of learning resources mentioned in the text,", "along with one example for each.", "8.", "Describe any two ways in which diverse learning resources can help cater", "to different learning styles among children.", "Answers:", "1.", "(b), 2.", "(c), 3.", "(b), 4.", "(b), 5.", "(c), 6.", "(c)"]}, {"heading": "5.4 IDENTIFICATION AND SELECTION OF LEARNING RESOURCES", "parts": ["The primary aim of TWAU is to help children understand their natural, social, and cultural environment in an integrated and holistic way, fostering curiosity, observation skills, critical thinking, and a sense of responsibility towards their surroundings.", "The abundance of potential learning resources means that teachers must be discerning in their identification and selection.", "It’s not enough to simply use any resource; the chosen resource must be appropriate, effective, inclusive, gender neutral and aligned with the pedagogical goals of The World Around Us.", "This process requires thoughtful consideration and a clear understanding of the learning outcomes, the children’s/learner’s needs, and the context of the teaching-learning situation.", "Let us discuss on what basis you can select these resources:"]}, {"heading": "5.4.1 Criteria for Identification of Learning Resources (Spotting", "parts": ["Potential Resources) Identification begins with a keen awareness of The World Around Us curriculum theme/lessons (e.g., Family and Friends, Food, Water, Shelter, Travel, Things We Make and Do, Plants, Animals, Our Body, Public Places, Festivals).", "As teachers you should constantly be on the lookout for potential resources within your immediate environment and beyond, considering how they might fit into upcoming lessons.", "When spotting potential learning resources, you should look for items/things that:", "1.", "Directly connect to the child’s/learner’s immediate world: Resources", "should be observable, tangible, and relatable to their daily life, home, school, and local community (e.g., nearby or school garden, local festivals, local food, family members etc.).", "2.", "Offer potential for hands-on exploration and activity: The resource", "should encourage active engagement, experimentation, observation, discussion, or creative tasks rather than passive learning (e.g., materials for sorting, objects for simple experiments, props for role-playing).", "3.", "Possess capacity for integrated learning: Resources should naturally link", "concepts across multiple subjects like science, social studies, mathematics and environmental education (e.g., a farm visit to teach about plants, community, and sustainability).", "4.", "Have visual appeal and engagement potential: The resource should be", "colorful,", "5.", "Attractive, and captivate a child’s attention, featuring clear visuals or", "interactive elements (e.g., brightly illustrated books, educational videos, clear charts).", "6.", "Ensure authenticity and safety: The information provided should be", "accurate and reliable, and the resource itself must be safe for children to handle and age appropriate too (e.g., reputable textbooks, non-toxic natural objects, well-known educational digital content)."]}, {"heading": "5.4.2 Criteria for Selection (Choosing the Best Resource from", "parts": ["the Identified Options) Once potential resources are identified, the selection process involves evaluating them against specific criteria to ensure their suitability and effectiveness.", "This is an important step, as a poorly chosen resource can confuse rather than clarify, or distract rather than engage children in learning.", "The judicious selection of learning resource(s) is crucial for optimising their impact.", "Therefore, as a teacher you should systematically judge the available resources based on the following criteria:", "1.", "Alignment with Learning Outcomes/Curriculum: The resource must", "directly help achieve your teaching goals and match the TWAU curriculum.", "If the learning outcome is “Children will be able to identify different types of leaves,” then a real leaf sample is better than just a general Botany book.", "2.", "Age and Developmental Appropriateness: The language, concepts,", "and activities should be suitable for a child’s cognitive development and attention span.", "For Class 1, choose simple picture cards of animals.", "For Class 4, you might select a documentary clip about animal adaptations.", "Avoid overly complex scientific terms or historical details for younger children.", "3.", "Promotes Inquiry, Critical Thinking, and Problem-Solving: The resource", "should encourage children to ask questions, observe, predict, discuss, and find solutions.", "Instead of just telling them about water, a resource might prompt questions like “What if there was no water?” (as explored in “Water O’ Water!”).", "A hands-on activity where children test what absorbs water and what doesn’t is better than just showing a picture.", "4.", "Fosters Values, Sensitivity, and Environmental Responsibility: Look", "for resources that promote empathy, respect for diversity, and a sense of responsibility towards nature and the community, while steering clear of stereotypes.", "Select stories that highlight conservation efforts, promote sharing, or depict diverse cultural practices respectfully.", "Avoid resources that show animals in distress or propagate gender/caste stereotypes.", "5.", "Feasibility and Accessibility: Consider if the resource is easy to get or", "procure, affordable, and practical to use in the classroom.", "It should cater to the diverse learning needs of the children also.", "Using local waste materials for a craft activity is more feasible than requiring expensive imported art supplies.", "Choose resources with audio descriptions for visually impaired or visual aids for hearing-impaired children.", "6.", "Engagement and Motivation: The resource should excite/stimulate and", "motivate children, keeping them interested and engaged throughout the lesson.", "A story read aloud by you with props and voice modulation is often more engaging than simply reading from a prescribed textbook.", "A puzzle or game related to the topic/lesson will likely be more motivating than a standard worksheet.", "7.", "Potential for Assessment (Formative): The resource should allow you to", "observe and understand how well children are grasping/understanding the concepts during the activity.", "An activity where children have to classify objects (e.g., living/non-living, plant/animal) allows the teacher to directly observe their understanding of classification.", "By thoughtfully applying these criteria, you will be able to effectively identify and select a rich, suitable and diverse range of resources that make learning meaningful, engaging, and impactful for children at the preparatory stage.", "Let us undertake an activity to understand the criteria for selection of learning resources in an easy and better way.", "ACTIVITY 5.1", "Take textbooks of TWAU for Class3, 4 and 5 and go through the chapters related to “Life around Us” and complete the following table Class Chapter Resources Criteria for Identification and selection of Resources 4 Nature Trail A guided nature walk in the school garden or nearby park, supplemented with magnifying glasses for closer observation and a simple checklist/ observation sheet for recording findings.", "Identification: Directly connect to the child’s immediate world Selection: Aligned with the learning outcomes", "CHECK YOUR PROGRESS 5.2", "1.", "If a learning outcome is “Children will identify different types of leaves,”", "what resource would be most suitable according to the text?", "a.", "A general nature book", "b.", "Real leaf samples", "c.", "A documentary about trees", "d.", "A story about a forest", "2.", "Using local waste materials for a craft activity is an example of considering", "which selection criterion?", "a.", "Engagement and Motivation", "b.", "Feasibility and Accessibility", "c.", "Alignment with Learning Outcomes/Curriculum", "d.", "Potential for Assessment (Formative)", "3.", "A resource that prompts questions like “What if there was no water?” and", "encourages children to test “what absorbs water best” aligns with which selection criterion?", "a.", "Engagement and Motivation", "b.", "Potential for Assessment (Formative)", "c.", "Promotes Inquiry, Critical Thinking, and Problem-Solving", "d.", "Fosters Values, Sensitivity, and Environmental Responsibility", "3.", "What kinds of potential does a resource have if it allows a teacher to observe", "how well children are understanding concepts during an activity, such as classifying objects?", "a.", "Visual appeal and engagement potential", "b.", "Capacity for integrated learning", "c.", "Potential for Assessment (Formative)", "d.", "Directly connects to the child’s immediate world", "4.", "List three broad TWAU curriculum themes/lessons that teachers should be", "aware of when identifying learning resources.", "5.", "Why is “Age and Developmental Appropriateness” a critical criterion for", "selecting learning resources?", "Give reasons.", "Answers:", "1.", "(b), 2.", "(b), 3.", "(c), 4.", "(c)"]}, {"heading": "5.5 V ARIETY OF RESOURCES FOR TEACHING- LEARNING ‘THE WORLD AROUND US’", "parts": ["(TWAU) The TWAU curriculum, in classes 3-5, demands a multifaceted approach to teaching and learning.", "Relying solely on the textbook can limit the experiential and exploratory nature of the subject.", "NCERT’s “The World Around Us”", "textbooks themselves are rich with illustrations, activities, and questions designed to spark curiosity and connect learning to real life.", "However, these illustrations serve as powerful springboards, not as substitutes, for real- world interactions.", "This section will explore various categories of resources, detailing how preparatory stage teachers can effectively integrate them into their TWAU lessons, often using the NCERT textbook illustrations as starting points for deeper exploration."]}, {"heading": "5.5.1 Environment/Nature", "parts": ["Children’s initial teachers are their community and local environment, where they build understanding by engaging with everyday objects, events, and phenomena.", "These real-world experiences, brought into the classroom, should be expanded upon with relevant learning opportunities.", "The TWAU curriculum is designed to facilitate this, with themes or topics and content that allow teachers to connect lessons directly to children’s lives.", "The most accessible and potential learning resource for TWAU is the Child’s immediate environment itself.", "This includes the school campus (garden, playground, open spaces), the local neighbourhood (streets, parks, markets, residential areas), and natural elements (plants, animals, soil, water bodies, weather phenomena).", "It’s the ultimate laboratory for TWAU.", "Direct interaction with nature fosters keen observation skills, critical thinking, appreciation for biodiversity, understanding of ecological concepts (e.g., food chains, interdependence), and a sense of environmental responsibility.", "It connects children directly with the “world around us” in its most authentic/ real form.", "Let us explain it with some examples from the textbooks of TWAU, where nature and natural experiences can be utilized as resources.", "Chapter Concept/ Phenomenon Natural Resource How to Use Nature Trail (Class 4) Interdependence in nature and society Animals, birds, insects, leaves, plants Encourage children to share experiences, explore benefits from animals and plants, and discuss how they are interdependent.", "Arrange a nature walk.", "Water a Precious Gift (Class 3) Importance of water Water reservoirs Discuss the importance of rain, show videos/ animations of cloud formation, visit seasonal ponds/water reservoirs, and discuss their importance to plants, animals, and humans throughout the year.", "Many natural objects —such as plants, animals, soil, rivers, ponds, seas, forests, and even dew-covered gardens—along with regular phenomena like seasonal changes, rain, day and night, and disasters such as droughts, floods, and earthquakes, can all be integrated into the teaching-learning process.", "As a teacher, you can strategically use these resources to enhance interaction, interest, and curiosity among your children.", "There are many activities suggested in TWAU textbooks, which expect you to take children out of the four walls of the classroom or even to the school boundaries at times and provide real life experiences such as visit to parks, fields, water bodies, etc. for observation.", "Active engagement and experiential learning of children is crucial for construction of their own knowledge.", "Children’s basic inquiry skills of observation, recording and generalization could be developed and sharpened by providing them the opportunity to feel nature and link it with their learning and the related topic.", "Let’s do an activity to better understand how we can effectively use nature as a resource.", "ACTIVITY 5.2", "Some natural phenomena are listed in Column 1 of the table given below.", "Identify content from the Chapters of class 3 TWAU textbook and explain how you will use it in your classroom teaching.", "Natural Resources Chapter How will you use it to provide learning experience to children?", "Trees Moon Mountain Butterfly Flood Desert Seashore"]}, {"heading": "5.5.2 Community", "parts": ["Community encompasses the people, places, and services that make up the local social environment.", "This includes families, neighbours, community helpers (doctors, police, farmers, artisans), public places (post office, market, hospital, fire station), and local events (festivals, celebrations).", "Interacting with the community helps children understand social roles, interdependence, cultural diversity, civic responsibility, and the functioning of a society.", "It builds empathy and a sense of belonging.", "Family, neighbors, and various community organizations are invaluable learning resources for teaching TWAU.", "Children first learn through their interactions with family, then with neighbors and the wider community.", "Their experiences gained through visiting different local places, attending social events and festivals, and interacting with friends offer diverse informal learning opportunities that can be effectively integrated into TWAU.", "Sharing the experiences of community members on issues, incidents, and concepts covered in the textbooks can deepen children’s understanding and encourage critical thinking, thereby connecting the community to children’s learning and situating it within an authentic social context.", "Here’s are some examples are presented to show how community resources can be used in the teaching-learning of TWAU:", "Community Resource Area Activity which can be planned/organized Local Farmer Food, Agriculture, Seasons Invite a local farmer to share how they grow crops, what tools they use, and how seasons affect their work.", "Discuss how food reaches our plates and the importance of healthy eating.", "Elderly Neighbor/ Senior(elderly) community person Local History, Past Times, Community Changes Ask an elderly person in your neighborhood to share stories about how the neighborhood has changed over time, what games they played as children, or how festivals were celebrated in the past.", "This connects to the theme of time and change.", "Doctor/Primary Health Worker/Trained Nurse General Medicine Arrange a presentation, talk show, or discussion on specific themes like health and hygiene, epidemic diseases, or seasonal illnesses.", "Grandparents Relationships, family structure, family history Facilitate discussions, storytelling sessions by grandparents, or organize a “Grandparents’ Day” to explore family history and structures.", "Traffic Inspector Traffic Rules Organize a presentation or discussion, allowing children to share experiences and stories about air pollution, the role of vehicles, and accident prevention through adherence to traffic rule.", "Local Artist/Artisan Culture, Crafts, Livelihoods Invite a local artist (e.g., a potter, weaver, singer dancer, carpenter) to demonstrate their craft and explain how their work is connected to their culture and provides them a living.", "Children can try a simple related activity.", "Waste Collector/ Recycler/ Safai worker/ Karamchari Waste Management, Cleanliness, Environment Ask a local waste collector or someone involved in recycling to talk about how waste is managed in the area, the importance of segregation, and ways to reduce, reuse, and recycle to keep the community clean.", "Gardeners/Park Keepers or caretakers Plants, Environment, Green Spaces Interact with the gardeners or caretakers of a local park or school garden.", "Learn about different types of plants, how to care for them, and the importance of green spaces for our health and environment.", "Community Fairs (Diwali, Dussehra, Eid, Christmas, etc.) Community Relationships Plan a visit to observe and discuss cultural heritage and diversity, humanistic values, and the overall community spirit, offering direct experience of community values.", "Railway Station/Bus Depot Staff Transport, Connectivity, Safety Arrange a visit to a local railway station or bus depot.", "Talk to the staff about how these transport hubs work, the different types of transport available, and essential safety rules while traveling.", "Veterinarian Animal Care, Health, Human-Animal Relationship Invite a local veterinarian to talk about how they care for animals, the importance of pet health, and responsible pet ownership.", "Discuss how humans and animals coexist.", "You can identify many other community resources and explore how to use them to create meaningful knowledge for children.", "The key is to consider the children’s connection and bonding with community members and assets when selecting and finalizing any community resource for teaching and learning.", "Similarly, children themselves, their family members, the incidents of their life and experiences are also good resources for learning, and as a teacher you may use them.", "An example is presented below to give you an idea on how real-life incidents can be used as learning resources.", "Priya’s River Tale: From Yamuna to Ganga Priya, an enthusiastic and active Class 4 student, lives in Delhi.", "Every day on her way to school, she sees the Yamuna river, and it always looks very dirty to her—murky and full of trash.", "This summer, a welcome change arrived when she went to her grandparents’ house in Uttarakhand, a beautiful State where the mighty Ganga river flows.", "One evening, Priya went for a walk near the Ganga river with her grandparents.", "She was amazed by how clear and clean the water was.", "“Grandma, Grandpa,” she asked, “why is the Yamuna river in Delhi so dirty, but the Ganga here is so clean?”", "Her grandfather smiled gently.", "“Priya, the Ganga here is cleaner because it flows mostly through forests and mountains.", "There aren’t many big factories near these parts, and fewer people live right on its banks here.", "So, less waste gets thrown into it.”", "Her grandmother added, “But as the Ganga flows down from the mountains and reaches big cities like Kanpur , many things start to change.", "Just like the Yamuna, the Ganga also becomes dirty in cities because people throw garbage, and factories release their waste water into it.", "The Yamuna in Delhi faces a lot of these problems because it flows through very big and busy cities with many factories and people.”", "Priya listened carefully, understanding that rivers are like roads for water, and what happens along their path affects how clean they stay.", "Her grandparents explained that it’s everyone’s responsibility to keep rivers clean, whether it’s the Yamuna in Delhi or the Ganga in Uttarakhand.", "ACTIVITY 5.3", "Some Chapters of TWAU are given below.", "Identify the community resources and describe the activity you will undertake to integrate it in classroom transactions.", "Chapter Community Resource How will you use it to provide learning experiences to children?", "Living Together Exploring Our Neighbourhood Happy and Healthy living Family and Friends Going to the Mela"]}, {"heading": "5.5.3 Newspapers and Magazines", "parts": ["Newspapers and magazines are invaluable, dynamic resources for teaching “The World Around Us” (Environmental Studies) to children in Grades 3-5.", "At this level, children are still developing their understanding of complex concepts due to their pre-operational stage of cognitive development, but they possess an innate curiosity about their surroundings and the world at large.", "These print media bridge the gap between abstract textbook knowledge and tangible, real- world events, making TWAU learning more concrete, engaging, and relevant.", "Newspapers as a Resource for TWAU (Grades 3-5): Newspapers, being daily publications, offer a constant stream of current events and information, reflecting the dynamic nature of our world.", "How they enhance TWAU learning:", "● Real-world Connection: Newspapers directly link classroom", "concepts to real-life occurrences.", "A lesson on water conservation becomes much more impactful when children read a news report about a local community facing water scarcity or successfully implementing rainwater harvesting.", "This helps them understand that TWAU is not just theory but reflects actual events shaping their lives.", "● Fostering Curiosity and Inquiry: News reports, especially those with", "human interest stories or local relevance, naturally pique children’s curiosity.", "Following a developing story, like a local conservation effort or the aftermath of a natural disaster like flood or a landslide, encourages them to ask questions, seek more information, and engage in deeper inquiry.", "● Connecting Local to Global: Newspapers often present local events", "within a broader context or discuss global issues that have local implications.", "This helps children understand how their immediate environment is interconnected with larger geographical, social, and environmental systems.", "● Developing Critical Thinking and Literacy Skills: Reading and", "discussing news articles expose children to different perspectives and real-world problems.", "You can guide them to identify facts, express opinions, and even think about solutions, thereby nurturing critical thinking and early media literacy.", "● Vocabulary Expansion: Exposure to varied vocabulary in news", "reports helps expand children’s linguistic skills, especially related to environmental and social themes.", "You can find many news articles and stories about the environment in newspapers and use them as valuable learning tools in your classroom.", "Following are the some ways where Newspapers can be used as a resource:", "● “News of the Day” Discussion: Start a class with a brief discussion of", "a relevant news article.", "TWAU textbook discusses ‘water conservation’ or ‘pollution’, and finds relevant news articles about local water scarcity, river pollution, or successful conservation efforts.", "Show the article/picture from the newspaper.", "Ask children to identify the problem and possible solutions.", "Compare it with NCERT illustrations of ‘clean vs. polluted water bodies’ or ‘water-saving techniques’.", "● Theme-Based Clipping Collection: Divide children into small groups", "and assign groups to collect news clippings on specific TWAU themes (e.g., “Animals in the News,” “Weather Watch,” “Cleanliness Drives,”", "“Community Helpers”).", "● Project Reports/Collages: Children can compile their collected", "clippings into project reports, reflective notes, or visual collages for classroom display.", "● Tracking an Issue: Choose a significant local or national TWAU", "-related issue and follow its development over a period (e.g., a local", "tree-planting campaign, a report on air quality) through daily newspaper updates.", "● Visual Analysis: Discuss photographs in the newspaper, asking", "children what they see, how it makes them feel, and what story the picture tells.", "Let us discuss a detailed activity where the newspaper is used as a resource.", "Concepts: Water scarcity, sources of water, water conservation methods, community responsibility towards water.", "Nature of activity: News reading and discussion, creating a “Water Saving Tips” chart or short skit or a poem.", "Skills to be nurtured: Observation, critical thinking, problem-solving, collaboration, communication.", "Materials required: Newspaper reports/articles on water scarcity or drought (local or national), pictures of different water sources and conservation methods, drawing sheets/charts, colors, markers.", "Procedure: Children will be shown a recent newspaper report or an article (or even a picture from the internet/magazine) about water scarcity in a particular region, a village or a city struggling for water, or a report on a local water conservation initiative.", "Example :Visual (the teacher would present a similar article/image):", "Source: The Times of India (11th June, 2022)", "After showing the news report/picture to children, the teacher can discuss various aspects of the problem through the following questions:", "● What important points are given in this news report/picture?", "● What are the problems the people in this news report/picture are", "facing?", "● Where do we get water from in our homes/schools?", "(Tap, well,", "handpump, tank, river)", "● Do we always have enough water?", "What happens if there is less rain?", "● What can we do to save water?", "(Think about brushing teeth, bathing,", "washing clothes, and watering plants.)", "● Have you seen anyone saving water in your locality?", "How?", "● Who do you think is responsible for ensuring everyone gets enough", "water (Government, community, individuals)?", "The teacher can then guide children to understand the importance of water, the various sources, and simple methods of water conservation at home and in the community.", "Then, they can be asked to:", "1.", "Design a “Water Saving Tips” chart: In groups, children will", "design a creative chart listing practical ways to save water in their daily lives.", "2.", "Prepare a short skit: Some groups can prepare a short skit", "demonstrating scenes of water wastage and then showing how water can be saved.", "Children will observe the news report/picture and analyze the given information.", "They will be engaged in discussion to make them reason out and draw inferences about the concerned issue.", "Children’s learning in this activity can be assessed on the following indicators:", "● Observation and Reporting", "● Reasoning and Problem Identification", "● Creative Expression (Poster/Skit Designing)", "● Discussion and Collaboration", "● Understanding of Conservation Methods", "Magazines as a Resource for TWAU (Grades 3-5): Magazines, especially those tailored for children or general knowledge publications, offer more in-depth features, vivid photography, and often a more engaging layout than newspapers.", "Magazines significantly enhance learning by enabling a deeper exploration of concepts through longer articles and special reports on topics like biodiversity, animal habitats, and environmental technologies.", "Their rich visual content, including high-quality photographs and infographics, is particularly effective for young learners/ children, helping them visualize abstract ideas and complex processes like the water cycle.", "Furthermore, magazines stimulate interest through engaging features such as stories, puzzles, and interactive activities related to nature, science, and social studies.", "They also introduce children to diverse writing genres, offering more descriptive and analytical styles than newspapers, thereby broadening their reading comprehension.", "Finally, magazines allow for the exploration of a wide array of TWAU themes, from endangered species and specific ecosystems to historical environmental interactions and sustainable innovations, providing content often not found in the daily news.", "You can use magazine in the following ways in your learning-teaching:", "● Topic Research: Use magazine articles as supplementary reading", "material for specific TWAU topics being covered in class.", "● Visual Aids: Cut out relevant pictures, maps, or diagrams to use as", "visual aids for lessons or to create classroom displays.", "● “Show and Tell”: Encourage children to bring interesting TWAU", "-related articles or pictures from magazines to share and discuss with", "the class.", "● Creating Storyboards/Presentations: Children can use magazine", "cut-outs to create visual storyboards or simple presentations on TWAU themes.", "● Debate Starters: A compelling magazine article on an environmental", "or a social issue can be used to spark a class debate or start discussion.", "By thoughtfully integrating both newspapers and magazines, you as teachers can provide a rich, current, and multisensory learning environment that truly brings “The World Around Us” to life for preparatory level children.", "ACTIVITY 5.4", "Suggest an activity where you can use a newspaper or magazine as a resource for teaching a topic from the Class 3 TWAU textbook.", "CHECK YOUR PROGRESS 5.3", "1.", "What is considered the “ultimate laboratory” for teaching “The World", "Around Us”?", "a.", "The school library", "b.", "The immediate environment", "c.", "The science lab", "d.", "The computer room", "2.", "What do newspapers offer that directly links classroom concepts to real-life", "occurrences?", "a.", "Abstract theories", "b.", "Historical facts only", "c.", "Real-world connection", "d.", "Fictional stories", "3.", "What unique feature of magazines makes them particularly effective for", "young learners to visualize abstract ideas and complex processes?", "a.", "Daily news updates", "b.", "Only text-based articles", "c.", "Rich visual content like high-quality photographs", "d.", "Focus on local gossip", "4.", "How does interacting with the community help children understand social", "roles and civic responsibility?", "5.", "Describe any one advantage of using magazines over newspapers as a", "resource for teaching TWAU for classes 3-5.", "Answers:", "1.", "(b), 2.", "(c), 3.", "(c)"]}, {"heading": "5.5.4 Radio and Television", "parts": ["While often seen as older forms of media, radio and television continue to be powerful and accessible resources for enriching the curriculum of ‘The World around Us’ (TWAU) especially in diverse geographical and socio-economic contexts.", "They offer a unique blend of auditory and visual learning experiences that can bring distant places, complex concepts, and varied perspectives directly into the classroom.", "Radio: Radio, particularly community radio or educational broadcasts, serves as a highly effective auditory resource.", "It fosters active listening skills, imagination, and can convey a sense of immediacy and connection to local contexts.", "• Educational Programmes: Many educational institutions or", "government bodies broadcast specific programmes tailored for children on various environmental or social themes, which teachers can utilize.", "• Storytelling and Dramatization: Radio plays or audio stories", "about nature, historical events, or community issues can captivate children and encourage them to visualize the content, developing their imaginative capacities.", "• Interviews and Soundscapes: Recordings of interviews with local", "experts or natural soundscapes (e.g., bird calls, rain) can provide authentic insights and spark discussions about different environments.", "• News and Current Events: Simplified radio news segments can", "be used to discuss current environmental issues or local community developments relevant to TWAU themes, fostering awareness.", "Television: Television, through its combination of visuals, audio, and motion, offers a highly engaging and immersive learning experience.", "Educational television channels and specific programmes can visually transport children to different ecosystems or cultural settings, or illustrate scientific phenomena that are difficult to observe directly.", "• Documentaries and Educational Series: High-quality documentaries", "on wildlife, different cultures, geographical features, and scientific concepts from educational channels (e.g., Doordarshan’s educational segments) can enhance visual understanding of topics like the water cycle or animal habitats.", "• News Segments with Visuals: Visual news reports on environmental", "conservation efforts or local community initiatives can be used to initiate discussions and build empathy, provided the content is child- appropriate.", "• Demonstrations: Television can effectively showcase processes or", "phenomena that are otherwise hard to demonstrate live in a classroom.", "For example, a video showing how a seed grows into a plant over time (time-lapse), or different types of shelters built by animals (birds nests, ant hills, beehives), or how water flows and gets collected in different forms (rivers, ponds, wells) can provide clear visual understanding.", "These traditional media outlets, when judiciously selected and integrated, serve as valuable tools for expanding children’s understanding and engagement with ‘The World Around Us’, bringing a breadth of information and experiences into the classroom that might otherwise be inaccessible."]}, {"heading": "5.5.5 ICTs", "parts": ["The landscape of education has profoundly shifted, with Information and Communication Technologies (ICTs) now playing a pivotal role in teaching and learning.", "This transformation is largely fueled by today’s children being “digital natives,” who are inherently accustomed to interacting with, sharing, and processing information through technology.", "ICT resources encompass a wide array of tools, including computers, the internet, specialized educational software, interactive whiteboards, projectors, educational applications (apps), digital videos, immersive simulations, and virtual reality (VR) tools.", "These diverse resources collectively provide unparalleled access to vast amounts of information and facilitate dynamic, engaging learning experiences.", "Benefits of Integrating ICTs in Learning: The strategic integration of ICTs offers numerous pedagogical advantages:", "● Enhanced Visual Learning: Makes abstract concepts concrete", "through rich visuals and animations.", "● Interactive Exploration: Encourages active participation and hands-", "on discovery.", "● Access to Inaccessible Environments: Facilitates virtual field trips to", "remote or historically significant locations.", "● Personalized Learning: Caters to diverse learning styles and paces,", "offering differentiated instruction.", "● Global Perspectives: Exposes children to different cultures,", "environments, and global issues, broadening their worldview.", "● Increased Engagement: Its dynamic and multimedia nature naturally", "captures and sustains their interest in children.", "Leveraging ICTs for “The World Around Us” (TWAU): ICT is a powerful tool for teaching, a curriculum area that inherently connects to geography, environmental studies, global issues, and diverse cultures.", "Here’s how ICT can be effectively utilized:", "● Virtual Field Trips/Tours: ICT allows children to “travel” to remote,", "historical, or ecologically significant sites, and even explore different countries without leaving the classroom.", "Platforms like Google Earth, Google Arts and Culture, and numerous museum/zoo virtual tours offer immersive 360-degree views, interactive maps, and multimedia content.", "To discuss diverse ecosystems (e.g., a desert, a rainforest, the polar region) or explore a historic monument, virtual tours can bring these places to life, allowing children/learners to navigate and observe details.", "Following are a few links for virtual tours https://www.indiaculture.gov.in/virtual-museums, https://artsandculture.google.com/", "● Interactive Simulations: Digital simulations provide a safe and", "controlled environment for children to explore complex processes.", "Through these tools, they can manipulate variables and observe phenomena such as the water cycle, plant growth, food chains, or volcanic activity.", "This hands-on, interactive approach fosters curiosity, active learning, and a deeper understanding of environmental processes and human impact.", "● Educational Videos: Animated videos are excellent for explaining", "intricate processes like human digestion or blood circulation, which are typically presented as static diagrams in NCERT textbooks.", "Videos make these concepts more comprehensible and memorable.", "You can use videos available on the DIKSHA portal.", "● Digital Maps and Globes: When discussing ‘travel,’ ‘different regions", "of India,’ or ‘global geography’ tools like Google Earth, NavIC based maps or online atlases provide interactive, zoomable, and real-time perspectives that traditional maps cannot.", "Following is the link https:// www.google.com/maps.", "● Interactive Whiteboards and Presentations: These tools transform", "traditional lessons into dynamic experiences.", "Teachers can seamlessly integrate multimedia clips, annotate maps in real-time, highlight key areas, and facilitate engaging, interactive discussions, thereby significantly enhancing children participation and comprehension.", "In essence, ICTs transform the “The World Around Us” into an accessible, interactive, and endlessly explorable classroom, empowering children to become globally aware and critical thinkers."]}, {"heading": "5.5.6 TWAU Kit", "parts": ["An TWAU Kit is a collection of curated, hands-on materials specifically chosen to support the learning of TWAU or EVS concepts.", "These kits can be purchased commercially or assembled by teachers using readily available items.", "Typical contents might include magnifying glasses, measuring tapes, seeds, soil samples, plant specimens (dried/pressed leaves, flowers), animal models, human body models, thermometers, compasses, simple tools, craft materials, flashcards, maps and picture charts.", "These kits promote direct observation, experimentation, classification, measurement, and tactile learning.", "They make abstract concepts tangible and encourage scientific inquiry skills.", "They are excellent for group activities and discovery-based learning.", "Let’s see how you can use the kit in teaching-learning.", "Topic Resource from the kit How to use?", "Different types of leaves Magnifying glass Children collect leaves, observe their venation, shape, and margin using magnifying glasses, and classify them based on the criteria, compared to NCERT illustrations.", "Seed Germination Seeds, soil, and small pots Provide seeds, soil, and small pots from the kit.", "They plant seeds and observe their growth over time, maintaining a log and comparing.", "Directions Compass A compass can be used to understand directions, complementing maps in the textbook.", "By thoughtfully selecting and integrating a variety of resources, teachers can transform the TWAU classroom into a dynamic, interactive, and highly effective learning environment.", "The NCERT textbook serves as a foundational guide, but the real learning happens when its illustrations and concepts are brought to life through hands-on exploration, community engagement, and the innovative use of all available resources.", "CHECK YOUR PROGRESS 5.4", "1.", "What is the primary characteristic that defines an educational Kit?", "a.", "It is a collection of digital software", "b.", "It contains only commercially purchased items", "c.", "It is a collection of curated, hands-on materials", "d.", "It is solely for individual learning, not group activities", "2.", "Which of the following is an ICT resource?", "a.", "Interactive whiteboards", "b.", "Textbooks", "c.", "Virtual reality (VR) tools", "d.", "Educational applications (apps)", "3.", "Today’s children/learners are often referred to as “digital natives” because", "they are:", "a.", "Born before the advent of the internet", "b.", "Inherently accustomed to interacting with technology", "c.", "Primarily learn through traditional methods", "d.", "Resistant to using digital tools for learning", "4.", "List any three different types of ICT resources.", "5.", "Give any one example of how ICT can provide “Access to Inaccessible", "Environments.”", "Answers:", "1.", "(c), 2.", "(b), 3.", "(b)"]}, {"heading": "5.6 LET US SUM UP", "parts": ["In this chapter, we have explored the critical role of resources in making the teaching and learning of “The World Around Us” (TWAU) a truly meaningful and experiential journey for children at the preparatory stage school classes (Grades 3-5).", "We began by understanding that ‘learning resources’ encompass a vast array of materials, environments, people, and experiences, extending far beyond the traditional classroom tools.", "These resources are not mere aids but are fundamental to creating concrete, engaging, and relevant learning opportunities.", "We delved into the profound importance of resources in TWAU, highlighting how they make learning real, sustain interest, clarify abstract concepts, cater to diverse learning styles, promote active inquiry, develop critical thinking, connect learning to real life, and aid long-term retention.", "We then discussed the systematic process of identifying and selecting appropriate resources, emphasising key criteria such as relevance, accuracy, appropriateness (age, cultural, safety), engagement potential, feasibility, versatility, promotion of inquiry, diversity, and connection to local context.", "Finally, we explored a rich spectrum of resource categories, demonstrating their specific utility for TWAU and providing concrete examples of how they can be effectively integrated, often leveraging the visual richness and thematic connections found within the NCERT “The World Around Us” textbooks.", "From the immediate environment/nature (school garden, local park) offering direct observational experiences, to the community (people, places, services) providing real-world social context, to newspapers and magazines connecting TWAU to current events, to ICT opening doors to virtual explorations, and finally dedicated TWAU Kits enabling hands-on scientific inquiry."]}, {"heading": "5.7 END EXERCISES", "parts": ["1.", "Select a specific illustration from a Grade 3, 4, or 5 NCERT “The World", "Around Us” textbook.", "For this illustration, brainstorm at least one activity each for how you could use:", "a.", "The immediate environment/nature", "b.", "Community members/places", "c.", "Newspapers/magazines", "d.", "ICT tools", "e.", "Items from a TWAU/TWAU kit Explain how each resource extends the learning beyond the textbook illustration.", "2.", "Define “Learning Resources”, elaborating on their significance beyond", "simple teaching aids.", "Subsequently, discuss how the integration of diverse learning resources is crucial for catering to the varied learning styles of children in classes 3-5, providing specific examples for visual, auditory, and kinesthetic learners.", "3.", "Explain the two-fold process of acquiring appropriate learning resources", "for TWAU: “Identification” and “Selection.” Describe the purpose of each stage and then detail at least two key criteria for identification and two key criteria for selection, providing a specific example for each criterion in the context of ‘The World Around Us’."]}, {"heading": "5.8 REFERENCES", "parts": ["1) Ministry of Education, Government of India.", "(2020).", "National Education", "Policy 2020. https://www.education.gov.in/sites/upload_files/mhrd/files/ NEP_Final_English_0.pdf", "2) NCERT (2022).", "National Curriculum Framework for Foundational Stage", "2022. https://ncert.nic.in/pdf/NCF_FS_2022_20Oct2022.pdf", "3) NCERT (2023).", "National Curriculum Framework for School Education", "2023. https://ncert.nic.in/pdf/NCF_SE_2023.pdf", "4) NCERT.", "(2024).", "Our Wondrous World.", "A Textbook for Class III, The World", "Around Us.", "5) NCERT.", "(2025).", "Our Wondrous World.", "A Textbook for Class IV , The World", "Around Us.", "6) NCERT.", "(2025).", "Our Wondrous World.", "A Textbook for Class V , The World", "Around Us."]}];
const C=SECTIONS;let si=0,pi=0,playing=false,synth=speechSynthesis;
const $=x=>document.getElementById(x);
function voices(){let lang=$("lang").value,s=$("voice");s.innerHTML="";let v=speechSynthesis.getVoices().filter(x=>x.lang?.toLowerCase().startsWith(lang.toLowerCase()));if(!v.length)v=speechSynthesis.getVoices().filter(x=>/^en-/i.test(x.lang||""));v.sort((a,b)=>((/india|rishi|veena|heera|hemant|kalpana|ravi|neerja|prabhat|aditi|raveena|lekha/i.test(a.name)?0:1)-(/india|rishi|veena|heera|hemant|kalpana|ravi|neerja|prabhat|aditi|raveena|lekha/i.test(b.name)?0:1)));v.forEach(x=>{let o=document.createElement("option");o.value=x.name;o.textContent=x.name+" — "+x.lang;s.appendChild(o)})}
function render(){let r=$("content");C.forEach((s,i)=>{let c=document.createElement("section");c.className="card";c.id="s"+i;c.innerHTML="<h2>"+esc(s.heading)+'</h2><button class="listen">🔊 Listen to this section</button><div class="body"></div>';c.querySelector("button").onclick=()=>start(i,0);let b=c.querySelector(".body");s.parts.forEach((p,j)=>{let z=document.createElement("span");z.className="sentence";z.textContent=p+" ";z.onclick=()=>start(i,j);b.appendChild(z)});r.appendChild(c)})}
function esc(x){return x.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function progress(){let total=C.reduce((a,s)=>a+s.parts.length,0),done=C.slice(0,si).reduce((a,s)=>a+s.parts.length,0)+pi;$("bar").style.width=Math.min(100,100*done/Math.max(1,total))+"%"}
function start(i,j){synth.cancel();document.querySelectorAll(".active").forEach(x=>x.classList.remove("active"));si=i;pi=j;playing=true;progress();let z=document.querySelector("#s"+i+" .body").children[j];if(!z)return;z.classList.add("active");z.scrollIntoView({behavior:"smooth",block:"center"});let u=new SpeechSynthesisUtterance(C[i].parts[j]);u.rate=+$("speed").value;u.lang=$("lang").value;let v=[...synth.getVoices()].find(x=>x.name===$("voice").value);if(v)u.voice=v;u.onstart=()=>{$("status").textContent="Reading: "+C[i].heading};u.onend=()=>{z.classList.remove("active");if(playing){if(j+1<C[i].parts.length)start(i,j+1);else if(i+1<C.length)start(i+1,0);else{playing=false;progress();$("status").textContent="Finished"}}};synth.speak(u)}
$("play").onclick=()=>{if(synth.paused){synth.resume();playing=true}else if(synth.speaking){synth.pause();$("status").textContent="Paused"}else start(si,pi)};
$("stop").onclick=()=>{playing=false;synth.cancel();document.querySelectorAll(".active").forEach(x=>x.classList.remove("active"));$("status").textContent="Stopped";progress()};
$("prev").onclick=()=>start(Math.max(0,si-1),0);$("next").onclick=()=>start(Math.min(C.length-1,si+1),0);
$("lang").onchange=()=>{synth.cancel();playing=false;voices()};$("theme").onclick=()=>{document.body.classList.toggle("dark");$("theme").textContent=document.body.classList.contains("dark")?"☀ Light":"☾ Dark"};
synth.onvoiceschanged=voices;render();voices();progress();
</script></body></html>
