<script>
const C=[{"heading": "3.1 Introduction", "parts": []}, {"heading": "3.2 Learning Outcomes", "parts": []}, {"heading": "3.3 Different Approaches to Teaching", "parts": ["• Process Approach\n• Inquiry Approach\n• Interdisciplinary and Multidisciplinary Approach\n• Constructivist Approach"]}, {"heading": "3.4 Experiential Learning", "parts": []}, {"heading": "3.5 Integrated Approach", "parts": ["• Art-integrated Learning\n• Toys, Games/Play Integrated Learning\n• Sports Integrated Learning"]}, {"heading": "3.6 Collaborative Learning and Real-World Challenges", "parts": []}, {"heading": "3.7 Let Us Sum Up", "parts": []}, {"heading": "3.8 End Exercises", "parts": []}, {"heading": "3.9 References", "parts": []}, {"heading": "3.1 INTRODUCTION Imagine the Following Scenarios in a Primary Classroom Scenario 1: In a primary class of 20 children a teacher is standing in front Pedagogy and Resources Teaching Learning in The World Around Us (TWAU) of the classroom and reading aloud a lesson. The children Students are sitting and passively listening to her. She occasionally explains the difficult words. The children are only listening to her but do not ask any question and are not engaged of all. Scenario 2: In the same classroom another teacher is facilitating activities with the help of concrete materials. He has divided the class into small groups. He has provided the children with drawings; flash cards related to the lesson. He started the lesson by narrating a story. The children are constructively engaged and enjoying the lesson. They are excited and continuously asking. The teacher is also asking prompt questions so that they can think and reflect. Now, let’s analyse both the scenarios. Scenario 1: It is a teacher - centred classroom with minimum knowledge construction. The children are not thinking critically. Scenario 2: It is a child - centred classroom. The children are active and constructing their knowledge through collaboration and application. In this kind of a class room the children can develop knowledge beyond the content. Looking at both the scenarios we can easily conclude the children are curious at this age and connecting with them as a facilitator would make them think critically and develop problem solving skills. This chapter, “Teaching learning in The World Around Us” explores exactly that—how meaningful, hands-on, and joyful teaching learning can help children connect to their immediate surroundings and also help grasp concepts easily. The National Education Policy (NEP) 2020 strongly emphasises that learning at the foundational and preparatory stage should be experiential and inquiry based. The policy focused on the holistic development of children from a very early stage. The academic as well as social development of children depends on their learning at the foundational stage. In today’s scenario, with a changing educational landscape and global dynamics, it is necessary to build a strong foundation for the child. Knowing about the world around us gives plenty of scope to develop socio–emotional skills among children. It gives scope for teachers to integrate various subjects and explore the possibility of an interdisciplinary approach in teaching. NEP 2020 also focuses on foundational literacy and numeracy. Therefore, more efforts should be made in order to improve literacy and numeracy at this stage. The preparatory stage from 8-11 years of age (classes 3-5) is also the stage of joy and play. However, at this stage, learning is more structured. This stage should emphasise reinforcing good reading, writing and mathematical skills. There is scope for experiential learning and enhancing creativity among children at this stage. The purpose of teaching at this stage should be to make learning more enjoyable and playful and to ensure holistic development of children in the early years of education. Pedagogy and Resources Teaching Learning in The World Around Us (TWAU). Six-Month Certificate Course (Bridge) in Primary Teacher Education NEP 2020 emphasised that all curriculum and pedagogy at the foundational stage should be embedded with stories, toys, games, art, craft, local and folk knowledge. This was advocated to design a holistic curriculum which is deeply rooted in Indian tradition, culture and ethos. It is strongly recommended that the curriculum and pedagogy should be relatable to the Indian context. Our indigenous and traditional knowledge has enormous creative ideas that can be incorporated into our pedagogy. The aim is to ensure that education should nurture a child who can address the challenges of the contemporary world, nonetheless, strongly rooted in the Indian ethos. This chapter focuses on different approaches which can be used at the foundational and preparatory stages for teaching ‘The World Around Us’.", "parts": []}, {"heading": "3.2 LEARNING OUTCOMESS After completion of this chapter, the learner", "parts": ["● explores various approaches to teaching and learning of TWAU at the foundational and preparatory stage;\n● integrates hands-on learning experiences through experiential learning methods to address diverse learners;\n● sensitises children to collaborative learning and identifying real-world challenges; and\n● designs suitable play-based activities for the holistic development of children at these stages."]}, {"heading": "3.3 OVERVIEW OF DIFFERENT APPROACHES TO TEACHING Mansi is teaching the children of class 5 about different plants and trees. She decided to take her class to the school garden. She divided the children into small groups and asked them to do sowing, ploughing with small equipment, feeding birds and watering the plants. She also decided to do group activities like singing a song related to nature. She distributed worksheets to draw whatever children observed during the garden visit. Children were highly enthusiastic and enjoyed the garden visit. What do you think? Did the children of her class find the learning process engaging and exciting? The learning was more experiencebased and close to nature. Knowing about the world around us is full of enthusiasm and curiosity for children at the foundational and preparatory stage. At this stage, children are curious about the things and people around them. A teacher can facilitate and encourage children to develop the skill of observation, questioning and creative thinking. For example, they often ask the question, “From where do the clouds come”? “Why do things always fall downwards”? To Pedagogy and Resources Teaching Learning in The World Around Us (TWAU) address their curiosity, teachers can use numerous transformative approaches to their teaching and learning process. Some approaches suggested by NEP 2020 are a holistic and integrated approach, process approach, inquiry approach, interdisciplinary approach, constructive approach, experiential learning and many more. Teachers can ensure the development of reading, writing and mathematical skills by incorporating different approaches in their teaching strategies. The kind of activities at the foundational and preparatory stage should be:", "parts": ["● Enjoyable and connected to nature and the immediate surroundings of the children;\n● Hands-on and experiential rather than memorising concepts;\n● Related to skill development, like observation and sensory awareness;\n● Based on sensitivity towards the environment and society;\n● To instill a sense of collaboration, harmony and inclusiveness;\n● Integrated and interdisciplinary in approach;\n● Inclusive taking all the children irrespective of their learning abilities and special needs into consideration We will discuss these approaches in detail."]}, {"heading": "3.3.1 Process Approach In the foundational stage, the process approach focuses on how students acquire knowledge instead of just what they know. This helps children cultivate their capacity to face difficulties on their own by promoting critical thinking, problem-solving, including independent learning. You will be learning more about the Process Approach in detail in Chapter 4. 3.3.2. Inquiry Approach Inquiry-based approach is child-centred approach where children can explore concepts by self-learning through asking questions, doing experiments and through real life experiences. The children in this approach are actively engaged in the activity; the teacher’s role is to create disequilibrium in their cognition so that they can think and find the solution to their questions on their own. This approach helps children to develop the skills of questioning, manipulating data and problem solving. This is basically a scientific approach where the children ask questions, create hypotheses, conduct experiments and find the results. They investigate a topic, pose questions, and use an array of resources to discover answers through inquiry based learning. Children draw conclusions Pedagogy and Resources Teaching Learning in The World Around Us (TWAU). Six-Month Certificate Course (Bridge) in Primary Teacher Education while investigating a topic, and they review and subsequently revisit it again and again as they complete their investigation. Before further discussion, reflect on the following example of an inquiry-based approach. Concept: Seed growth investigation Topic: Germination of a seed Question: How do seeds grow into a big plant?", "parts": ["Activity: Students do an activity of seed germination in a small pot and observe the growth of the sapling.", "They also make predictions about the days of germination, the effect of light, water and soil.", "After a few weeks, they discuss their observations in the classroom.", "ACTIVITY 3.1 Discuss strategies with your colleagues to explore and exchange strategies for inquiry-based learning."]}, {"heading": "3.3.3 Interdisciplinary and Multidisciplinary Approach NEP 2020, talks about transitioning school education to a more multidisciplinary and holistic education. “There should be no hard separation between ‘arts’ and ‘science’ streams, or between ‘academic’ and ‘vocational’ streams, or between ‘curricular’ or ‘extracurricular’ activities” (NCF Foundational stage 2022). The aim is to develop the child’s capacities in all aspects such as physical, social, ethical, mental and emotional. Applying a multidisciplinary approach allows the child to think independently and in a rational way. With the changing landscape of education, it has become important that subjects cannot be taught in isolation. Blending different disciplines in a single concept is not only a sustainable idea but also fosters holistic learning in children. An interdisciplinary approach means integrating multiple subjects and drawing connections between the concepts. For example, science, maths, arts, and language can be integrated to understand a single concept. An interdisciplinary approach builds on the natural curiosity of young children and allows them to address real-life challenges. This approach helps in developing problemsolving skills and the ability for creative thinking in young children. It allows them to see different subjects intertwining with each other, making the concept more meaningful from multiple perspectives. Using an interdisciplinary approach, teachers from different areas engage to enhance learning. They can design classes that integrate concepts from multiple areas. As a result, Pedagogy and Resources Teaching Learning in The World Around Us (TWAU) children develop a deeper understanding of subjects from various perspectives. For example, to explain the concept of “water pollution” a Science teacher can explain the concept in collaboration with an English teacher who can ask the children to write a short essay on any environmental issues. Art teachers can ask students to design a poster on water pollution. In this way, integration of different subjects can be done in planning a concept. Let’s recite this poem on Rain A Rain song Look at the dark clouds in the sky, The rain will come by and by, Oh, how we love to soak in the rain, See raindrops on the window panes. Paper boats we see in puddles, Birds on trees together, huddled, Peacocks dance with feathers bright, Oh, what a beautiful rainy sight. (Source: NCERT Textbook Class 3) In the above poem, an interdisciplinary approach can be applied by intertwining subjects like science by exploring the concept of rain, rainbow, sky and clouds. Can you think of introducing different shapes and paper folding to make a boat? You can encourage children to draw a peacock and colour its feathers. Children can recite the poem in their own language as well. This will enhance their language skills and extend their imagination. In this way, different subjects like Science, Maths, Arts and Language can be blended to understand a single topic or concept in a holistic manner.", "parts": ["CHECK YOUR PROGRESS 3.1 1.", "Create a game for the children of Class 3, to understand pollution through teamwork, storytelling, and creative play—using simple language and hands-on activities.", "2.", "What are the benefits of using an Inquiry based approach?", "3.3.4.", "Constructivist Approach Have you ever wondered why two children observing the same rainbow will Pedagogy and Resources Teaching Learning in The World Around Us (TWAU).", "Six-Month Certificate Course (Bridge) in Primary Teacher Education describe it differently?", "One child may talk about its colours, while another about the shape of the rainbow—and yet both are right in their own.", "Here, you are encouraging the curious young minds to construct their own understanding based on what they already know and have seen.", "Similarly in a classroom, you will find that children are not blank slates.", "They come with many anecdotes and experiences to share, and plenty of never-ending questions.", "What they need is “You” as a co-player in their learning as they create and construct.", "The Constructive Learning Theory describes that learning is a cognitive process and takes place on the basis of prior knowledge.", "Constructivist psychologists such as Jean Piaget, Lev Vygotsky, and Bruner emphasised that children construct their own knowledge through interacting with their environment.", "Their learning is also influenced by social and cultural knowledge.", "Children learn to understand their world through accommodation and collaboration.", "In a constructive approach, children are active learners and build their knowledge on prior experiences.", "The teacher plays the role of a facilitator in this approach.", "“Constructivism is based on the concept that individuals actively construct or create their own knowledge and that their learning experiences determine the nature of reality.", "Learners use their prior knowledge as a foundation and build upon it as they acquire new information” (Chand, Satish.", "2024).", "For example, if you are teaching ‘Water: A precious Gift’, you will find that children may already have some knowledge about water and its sources.", "In rural areas they might see their parents and family members fetch water from faraway places like wells, rivers and springs, etc.", "They may be well aware of water saving at home.", "You may discuss these experiences in the classroom.", "You may also encourage them to share how they preserve water at home.", "In this way, you are facilitating them to discover their knowledge of water conservation.", "This creates a space where every child becomes a co-constructor of knowledge.", "You can also ask for their ideas on how to conserve water in school.", "This helps them to learn not only from the teacher but also from each other and also get peer feedback.", "Children from diverse regions also get a chance to contribute to such group discussions on school-level water conservation practices."]}, {"heading": "3.4 EXPERIENTIAL LEARNING NEP 2020 Para 4.6 mentioned “In all stages, experiential learning will be adopted, including hands-on learning, arts-integrated and sports-integrated education, story-telling-based pedagogy, among others, as standard pedagogy within each subject, and with explorations of relations among different subjects”. “Experiential learning shifts the learning design from being teacher-centred, where the teaching is largely transmissive and the students may remain unmotivated and disengaged, to an approach that is semi-structured and requires students to cooperate and learn from one another through direct experiences Pedagogy and Resources Teaching Learning in The World Around Us (TWAU) tied to real-world problems. The role of the teacher in this process is to facilitate rather than direct the student’s progress” (Kolb & Kolb, 2009).", "parts": ["Fig.", "3.1: Kolbs Learning Cycle (1984) Source: https://upload.wikimedia.org/wikipedia/commons/8/82/Kolb%27s_Experiential_ Learning_CYCLE_%289443035785%29.jpg The main goal of education at this stage should be to develop creativity, problem-solving skills and interpersonal skills among the children.", "Ultimately, the children have to step out into the real world to solve real-world challenges.", "Education plays an important role in taking children beyond the classroom and learn from the environment and society with real-life experiences.", "Taking children outside the classroom and providing them with experiences helps in inculcating cultural, social and environmental values.", "Read and analyse the following example and try to come up with other strategies.", "Moni is teaching the subject ‘The World around Us’ in class 4 in Assam.", "She has decided to take her class for a nature walk near her school.", "She encouraged her children to observe different birds, plants, herbs, trees and insects.", "When they came back to the classroom, she discussed with each child about her or his observation.", "With this activity, she gave an opportunity to connect with the environment and nurture compassion and interest in our natural world.", "Let’s see another example, Wahida from Kerala, a class 3 teacher, decided to create community-based learning.", "She chose a local community and asked children to collect plastic materials from different households.", "She also joined Pedagogy and Resources Teaching Learning in The World Around Us (TWAU).", "Six-Month Certificate Course (Bridge) in Primary Teacher Education them.", "After collecting the plastic material, she handed over all the stuff collected by the children to the plastic recycling unit of their school.", "This communitybased activity fosters social responsibility and collaboration among children at a very early age.", "NEP 2020, has given due emphasis on experiential learning of children at a very early age for the development of socially responsible citizens in the future.", "You can think of many such activities for initiating experiential learning right from the foundational stage.", "When children explore their environment and interact with others, they’re not just having fun—they’re also learning how to care for our mother earth, respect differences, and work together.", "Such kind of social and environmental exposure prepares them to start understanding bigger issues like climate change etc, which they later study in the higher classes.", "Storytelling, an all-time favourite—is yet another powerful example of experiential learning.", "Local tales, cultural stories, and folklore are rich sources of knowledge and values.", "When you weave these stories into your daily teaching-learning practices, you will notice that children are enthused and their imagination gets sparked!", "Isn’t simple to nurture empathy and values through stories!", "Now, let us think and discuss about children who may not have access to important resources such as architectural sites, monuments, historical buildings, or public gardens.", "Many schools are located in remote areas, where offering direct experiential learning opportunities can be challenging for teachers.", "In such cases, you as teachers need to be even more creative in designing meaningful, engaging, and hands-on learning experiences using locally available materials and resources.", "For example, incorporating digital tools can make it possible to learn from faraway places.", "Before moving ahead, try to think about how we can incorporate technology-enriched experiential learning.", "One hint is given: Try to fill in the other circles in the following diagram.", "Pedagogy and Resources Teaching Learning in The World Around Us (TWAU)\nACTIVITY 3.2 Plan an activity for class 4 or 5 on the theme “My Neighbourhood”, to include people and places.", "Plan a walk of approximately one hour in a neighbourhood near the school.", "Ask the children to observe the people, places and services in the neighbourhood.", "You can plan different activities before and after the nature walk.", "For example, a pre activity can be a small story related to people living in a community.", "Post activity can be making pictures or drawings of the children observed during their walk.", "The activity should be joyful and engaging."]}, {"heading": "3.5 INTEGRATED APPROACH NEP 2020 Para 4.6 says, “In all stages, experiential learning will be adopted, including hands-on learning, arts-integrated and sports-integrated education, story-telling-based pedagogy, among others, as standard pedagogy within each subject, and with explorations of relations among different subjects”. Integration means a cohesive approach by connecting different concepts together to find the solution in real-world scenarios. It means that teaching a concept by weaving an element of different disciplines fosters holistic learning instead of teaching a subject in isolation. Teaching of TWAU provides an opportunity to blend various subjects like art, sports, music, science, social science, etc, to enhance cooperative learning and problem-solving skills. For example, the concept of ‘Food’ can integrate arts (drawing and colouring food items), sports (banana race), Language (reciting a poem on any fruit), etc. Blending different subjects for a common concept enhances a wide range of knowledge in children at Foundational and preparatory stage. An integrated approach provides handson experiences to the learners and makes the concept more meaningful to them.", "parts": ["ACTIVITY 3.3 Design a lesson plan for duration of 40 minutes on the topic “Climate” for Class 3 children.", "Integrate activities combining Science, Maths, Language and Art Subjects in your lesson plan.", "For example, use charts, storybooks, crayons etc."]}, {"heading": "3.5.1 Art-integrated Learning “Art-integration is a cross-curricular pedagogical approach that utilises various aspects and forms of art and culture as the basis for learning of concepts across subjects” (NEP 2020). For many decades, arts as a subject has been a neglected or Pedagogy and Resources Teaching Learning in The World Around Us (TWAU). Six-Month Certificate Course (Bridge) in Primary Teacher Education less appreciated subject in our country. However, with the changing educational paradigm, it has been given much emphasis, especially at the early stages of schooling. Art-integrated approach not only develops creative thinking but also creates an association between subjects and culture. “Arts integration has been shown to improve student attitudes and engagement, along with a potential to ‘transfer’ skills and knowledge to other subject areas” (Flynn, 2017). Integrating art in TWAU creates a joyful learning experience for the children. They would get exposure to different Indian art and culture and admire the ethnic diversity of India. Art-integrated learning also helps children to imbibe the Indian ethos and values at a very early stage. For example, teaching the concept of food at a foundational level can be done through art integration, like creating pictures, making models, drawing, colouring, and pasting helps children to learn the concepts joyfully and in a meaningful way. At the preparatory level, you can explore different forms of Indian arts like Madhubani, Warli, Aipan and integrate them with different concepts. The types of art you can integrate are visual art (drawing, painting, etc.), performing art (dance, drama, skits, etc.) and culinary art (cooking without fuel). Our Wondrous World | Class 3 Families are people, Who care about you, My family is special, And yours is too! Would you call Bela’s family a big or a small family? Source: NCERT textbook Class 3, Our Wondrous World Example Activity: “Family and Friend” Art style: “Warli Art” (Drawing of a family in Warli art) In this activity, children can create a Warli-style painting in which they can draw their family, with elementary geometric shapes. They can draw family members and the bonding between them. In this way, they can learn art as well as family and cultural ethos, which is deeply rooted in Indian society. You can also discuss with them the origin of Warli art and simple geometrical shapes. This activity can also develop thinking skills among children. Ask them to create trees, plants, a house, etc, with this art and discuss their importance in our daily life. Reflect upon the above activity and think of a similar activity for teaching the concept of “Climate” with some other forms of arts, like performing arts. Pedagogy and Resources Teaching Learning in The World Around Us (TWAU)", "parts": ["Fig.", "3.2: Art Integrated Learning Source: https://ncte.gov.in/website/PDF/NMM/Art%20Integreted%20Learning.pdf\nCHECK YOUR PROGRESS 3.2 1.", "What types of art can you integrate in your pedagogy for teaching the concept of “Climate”?", "Give 2 examples.", "2.", "What is the role of a teacher in experiential learning?", "3.", "Design an experiential learning activity for any ‘The World Around Us” topic from the NCERT textbook."]}, {"heading": "3.5.2 Toys, Games/Play Integrated Learning The NEP 2020 and the NCF FS 2022 emphasised the role of toy based pedagogy as one of the important teaching-learning strategies. Play and toybased pedagogy is an approach to learning that includes different games and toys used for teaching and learning. Toy and game-based pedagogy enhances social, emotional and cognitive development in children. Using local toys and local games could be a sustainable pedagogy rooted in indigenous knowledge. Play integrated learning encourages children to think, imagine and explore the various concepts through experiential learning. Toy integrated approach improves fine and gross motor skills and hand-eye coordination. Children learn Pedagogy and Resources Teaching Learning in The World Around Us (TWAU). Six-Month Certificate Course (Bridge) in Primary Teacher Education to collaborate, communicate and learn to accept others’ perspectives. It is a multisensory approach that provides opportunities for learners with special needs to engage in various activities. For example, Channapatna wooden toys made in Karnataka can be used for different learning activities like colour concepts, animal stories, etc. These handcrafted wooden toys are wonderful for experiential learning as their designs often include animals, birds, and cultural themes. You can think of your local toys and games that can be used in learning at the foundational and preparatory stage. You can choose any type of play like free play, guided play and structured play.", "parts": ["Fig.", "3.3: Dice game prepared by teacher interns in MCD school of Delhi Free Play Guided Play Structured Play Roles Child-led Child directed Child-led Teacher supported Teacher-led Children actively participate What do Children do?", "Children decide all aspects of their play - what to play, how to play it, for how long to play, with whom to play.", "Children plan and lead their own play, similarly as they do during free play.", "Children active - ly listen, follow rules, participate in activities and games planned by Teachers.", "Pedagogy and Resources Teaching Learning in The World Around Us (TWAU) What do Teachers do?", "Teachers organise a stimulat - ing play environment in the classroom, observe children, and help when children ask for support.", "Teachers offer support and actively facilitate play.", "Teachers guide the chil - dren in different tasks that they are involved in, ask questions, play with the children to meet specific learning objectives.", "Teachers carefully plan activities and games with specific rules to promote compe - tencies in a learning sequence.", "Language and mathematics games, nature walks, songs and rhymes are planned on a daily basis.", "Source: National Curriculum Framework for Foundation Stage 2022 Some illustrative, but specific, examples of different kinds of play are given below.", "Type of Play Examples 1 Dramatic Play/ Fantasy Play Use a small stick for a horse to dramatize a story.", "Acting like family members, teachers, doctors.", "Dramatizing a favourite character, e.g., Jhansi ki Rani, Rani Chennamma, Chota Bheem, Shaktimaan.", "2 Exploratory play Jodo, Todo, Phir Jodo - dismantling and assembling objects (e.g., clock, toilet, flush, tricycle).", "Experiments with instruments (e.g., magnets, prism, magnifying glass).", "Mixing dals, chana, rajma and sorting.", "Sand play, Water play.", "3 Environment/ Small World play Using miniature animals, furniture, kitchen set, doctor set to recreate the real world and engage with it.", "Nature walk identifying trees, plants, insects, birds, animals, sounds, colours.", "4 Physical Play Exploring the body through music, movement, dramatization, outdoor play, balancing, games.", "Pedagogy and Resources Teaching Learning in The World Around Us (TWAU).", "Six-Month Certificate Course (Bridge) in Primary Teacher Education 5 Games with Rules Hopscotch (Kith Kith, Stapu, Langdi), Taang Tag, Snakes and Ladders, Chaupad, Spinning tops (Lattu, Buguri), Marbles (Goli), Kokla Chapaki, Pitthu, Pallanguzhi.", "Source: National Curriculum Framework for Foundation Stage 2022"]}, {"heading": "3.5.3 Sports Integrated Learning Sports integration is yet another multidisciplinary teaching approach that includes physical activities in the educational process. Integrating sports encourages the acquisition of abilities like collaborative learning, critical thinking, determination, self-discipline, leadership quality, etc. Teachers should encourage and promote local and indigenous sports in education to develop a national ethos. For holistic development of children in the early years, physical", "parts": ["activity is advocated by many philosophers and psychologists.", "Sports activities are of utmost importance at this stage to enhance cognitive, social, emotional and physical development.", "In today’s digital world, children lead a sedentary lifestyle with preformed periods of inactivity leads to childhood obesity, emotional problems, anxiety and depression in the later stages of life.", "By integrating sports in the curriculum and the learning process, such issues can be addressed, and a well-rounded development of children can be achieved.", "Sports education is not only about running or physical sports.", "It can be beyond the routine exercises, which can be blended with academics to enhance children’s Motor skills with joyful learning.", "At the Foundation Stage, simple sports like drills, yoga, fruit race, etc, can be integrated with different subjects.", "Integrating sports with subjects at the Foundation stage can cultivate a sense of inclusivity and nurture citizens for the future who are physically, socially and emotionally fit to adapt to the changing global scenarios.", "Example: Jumping Sports and Fruits for Class 1 Ask a child to jump and name a fruit, similarly another child will jump and name a different fruit.", "You can think of some other activities for children, including sports in different topics.", "It would be fun for children if you organised a long jump competition for the students and asked them to measure who jumped farthest.", "You can also organise mild yoga sessions like deep breathing, Anulom Vilom for children and work on their mental well-being.", "While organizing basic sports activities, you should keep in mind children with special needs.", "Suppose any child in your class is visually impaired or has a physical disability.", "You can modify your sports activity accordingly.", "For that, modify rules in a simpler form, clear any kind of obstacles, provide clear instructions, verbal cues and most importantly peer support.", "Pedagogy and Resources Teaching Learning in The World Around Us (TWAU)\nFig.", "3.4: Inclusive Learning (Source: AI Generated Image)\nACTIVITY 3.4 Create a Reflective journal on your own experiences of teaching and the approach to ‘The World Around Us’.", "CHECK YOUR PROGRESS 3.3 1.", "What is toy-based pedagogy?", "2.", "Write down any two activities including your local toys that can be used in teaching learning at the foundational stage."]}, {"heading": "3.6 COLLABORATIVE LEARNING AND REALWORLD CHALLENGES Collaborative learning at the primary level can develop critical thinking and problem-solving skills in children. They develop a cooperative approach that helps them to face real-world challenges. Today, the world is facing many real challenges such as climate change, water scarcity and other environmental issues. Collaborative learning helps them to think scientifically and develop skills and abilities to address these issues. Lesson Plan Based on Universal Design for Learning Class: 3 NCERT Curriculum Area : (The World Around Us) Chapter: Making Things Time Duration: 40–45 mins Learning Outcomes: After the completion of the topic, learners will be able to: · Identify different resources for making simple objects. · Recognise traditional methods of making things. · Appreciate the efforts of craftsmen and other local workers. · Explore collaborative learning for making things. Materials Needed · Pictures of common patterns in things and plants (e.g pot, cup, bottle, leaf, flowers) · Chart paper, coloured paper, scissors (plastic) and clay · Audio-visual aid (video on pot-making, paper flower making ) · Models of objects or toys made from different materials · Worksheets (drawing, matching, fill up the blanks) Instructional Plan Introduction: (5 Min) Start your instructions with assessing children’s prior knowledge. Make them enthusiastic about the activity. After that, show a short video of local potters making pots. Follow this with questions to increase their curiosity. Exploration (10–15 minutes) Show real objects, flashcards or photos of different objects like a clay pot, fabric, or wooden toys. (Use tactile pictures for children with visual impairment) Follow this with engaging questions. Show a short 3–4 minute video on one traditional craft (e.g., how clay pots are made). Pedagogy and Resources Teaching Learning in The World Around Us (TWAU). Six-Month Certificate Course (Bridge) in Primary Teacher Education", "parts": []}, {"heading": "3.6.1 Collaboration with the Parents and the Community Collaboration is an important part of learning at the foundational stage. The role of the teachers becomes important at this stage. Children learn family values and a sense of belongingness towards the family and community. TWAU provides opportunities to explore how families and communities create a collaborative and inclusive society. For example, Class 3 NCERT Chapter 2 “Going to the Mela” gives an opportunity to children to explore the concept of family and community. They enjoy being together and exploring the roles of different people in the community. You can discuss how Nita and Radha are excited about the mela with their family. Children also learn how to work in harmony, values, the importance of family and the community. A teacher can collaborate with parents and the community by organising different activities such as interactive workshops, volunteering in the school programs, classroom teaching, etc. Parents can also participate and help the teachers in various cocurricular activities. In this way, children can also learn to collaborate with different members of the society.", "parts": []}, {"heading": "3.6.2 Examples of Collaborative Learning from ‘The World Around Us’ Themes (e.g., Climate)", "parts": ["Fig.", "3.5: Collaborative Learning Pedagogy and Resources Teaching Learning in The World Around Us (TWAU)"]}, {"heading": "3.6.3 Example of UDL Based Lesson Plan on A Topic from NCERT Textbook Universal Design for Learning (UDL) is constructed on three principles: 1. Multiple Means of Engagement – Encouraging participation through varied activities. 2. Multiple Means of Representation – Presenting information in different modes, such as visuals, audio, and text. 3. Multiple Means of Action and Expression – Allowing children to express their considerate in different ways. Lesson Plan Based on Universal Design for Learning Class: 3 NCERT Curriculum Area : (The World Around Us) Chapter: Making Things Time Duration: 40–45 mins Learning Outcomes: After the completion of the topic, learners will be able to:", "parts": ["• Identify different resources for making simple objects.", "• Recognise traditional methods of making things.", "• Appreciate the efforts of craftsmen and other local workers.", "• Explore collaborative learning for making things.", "Materials Needed\n• Pictures of common patterns in things and plants (e.g pot, cup, bottle, leaf, flowers)\n• Chart paper, coloured paper, scissors (plastic) and clay\n• Audio-visual aid (video on pot-making, paper flower making )\n• Models of objects or toys made from different materials\n• Worksheets (drawing, matching, fill up the blanks) Instructional Plan Introduction: (5 Min) Start your instructions with assessing children’s prior knowledge.", "Make them enthusiastic about the activity.", "After that, show a short video of local potters making pots.", "Follow this with questions to increase their curiosity.", "Exploration (10–15 minutes) Show real objects, flashcards or photos of different objects like a clay pot, fabric, or wooden toys.", "(Use tactile pictures for children with visual impairment) Follow this with engaging questions.", "Show a short 3–4 minute video on one traditional craft (e.g., how clay pots are made).", "Pedagogy and Resources Teaching Learning in The World Around Us (TWAU).", "Six-Month Certificate Course (Bridge) in Primary Teacher Education Hands-on Activity (10-15 min)\nActivity 1: Make It Manually (Hands-on)\n• Ask the children to make small groups and use clay, paper, or cardboard to make a simple item of their interest (e.g., a toy, a fruit, a pencil holder).", "Activity 2: Draw and colour\n• Ask the children to draw any article or object they use at home (like a book, mop, tray) and colour it.", "For visually impaired children, ask them to colour inside the tactile boundaries of the pictures given.", "Activity 3: Role Play or Story Writing\n• Create a short skit and ask the children to enact a scene in which a child is buying a pot from the local potter.", "• Ask the children to write a short story about going local market to buy a flower pot with their parents.", "Reflection and Discussion (10–15 minutes)\n• Ask students to present their group work and activities to the class.", "• Discuss the importance of local workers and craftsmen in the classroom.", "• Allow extra time and support for children with learning difficulties throughout activities.", "• Pair students of different abilities for peer support and the buddy system.", "Assessment Use multiple methods of assessment, like observation, discussions, peer feedback, worksheets, etc.", "Homework\n• Visit a local potter (with parental or guardians guidance) and make a small toy with clay."]}, {"heading": "3.8 END EXERCISES 1. Which of the items listed below closely describes the approach to constructive learning?", "parts": ["a) Firm standardized teaching methods\nb) Passive listening to teacher\nc) Memorization the concept\nd) Learning through active participation and knowledge construction 2.", "Experiential learning emphasizes learning through which method?", "a) Lecture method\nb) Direct hands - on experiences\nc) Noting down the concept\nd) Rote memorization 3.", "How can learning be enhanced through toy-based pedagogy?", "a) By recognising only traditional methods of learning\nb) By fostering social, emotional and cognitive development in children\nc) By focusing learning only through structured play\nd) By developing only on the cognitive aspect 4.", "Which principle is core to Universal Design for Learning (UDL)?", "a) Providing one size fit all learning method\nb) Presenting multiple means of engagement, representation, and expression\nc) Providing traditional paper pencil method of assessments\nd) Limited flexibility in the teaching learning process 5.", "What is a significant feature of adopting a constructive learning approach in the classroom?", "Pedagogy and Resources Teaching Learning in The World Around Us (TWAU).", "Six-Month Certificate Course (Bridge) in Primary Teacher Education\na) It nurtures inactive knowledge\nb) It ensures children’s active participation so that they can construct their own knowledge\nc) It lessens child’s participation in the learning process\nd) It restricts collaboration between children and teachers 6.", "How can you design classroom activities for primary students that help them to construct their own knowledge instead of simply memorizing facts?", "7.", "What do you understand by Experiential Learning?", "Discuss with examples.", "8.", "How can learning be enhanced through toy-based pedagogy?", "9.", "Discuss the core principles of Universal Design for Learning (UDL)?", "10.", "What is a significant feature of adopting a constructive learning method in the classroom?"]}];let si=0,pi=0,playing=false,synth=speechSynthesis;

function voices(){let lang=$("lang").value,s=$("voice");s.innerHTML="";let v=speechSynthesis.getVoices().filter(x=>x.lang?.toLowerCase().startsWith(lang.toLowerCase()));if(!v.length)v=speechSynthesis.getVoices().filter(x=>/^en-/i.test(x.lang||""));v.sort((a,b)=>((/india|rishi|veena|heera|hemant|kalpana|ravi|neerja|prabhat|aditi|raveena|lekha/i.test(a.name)?0:1)-(/india|rishi|veena|heera|hemant|kalpana|ravi|neerja|prabhat|aditi|raveena|lekha/i.test(b.name)?0:1)));v.forEach(x=>{let o=document.createElement("option");o.value=x.name;o.textContent=x.name+" — "+x.lang;s.appendChild(o)})}
function render(){let r=$("content");C.forEach((s,i)=>{let c=document.createElement("section");c.className="card";c.id="s"+i;c.innerHTML="<h2>"+s.heading+'</h2><button class="listen">🔊 Listen to this section</button><div class="body"></div>';c.querySelector("button").onclick=()=>start(i,0);let b=c.querySelector(".body");s.parts.forEach((p,j)=>{let z=document.createElement("span");z.className="sentence";z.textContent=p+" ";z.onclick=()=>start(i,j);b.appendChild(z)});r.appendChild(c)})}
function start(i,j){synth.cancel();document.querySelectorAll(".active").forEach(x=>x.classList.remove("active"));si=i;pi=j;playing=true;let z=document.querySelector("#s"+i+" .body").children[j];if(!z)return;z.classList.add("active");z.scrollIntoView({behavior:"smooth",block:"center"});let u=new SpeechSynthesisUtterance(C[i].parts[j]);u.rate=+$("speed").value;u.lang=$("lang").value;let v=[...synth.getVoices()].find(x=>x.name===$("voice").value);if(v)u.voice=v;u.onstart=()=>{$("status").textContent="Reading: "+C[i].heading};u.onend=()=>{z.classList.remove("active");if(playing){if(j+1<C[i].parts.length)start(i,j+1);else if(i+1<C.length)start(i+1,0);else{playing=false;$("status").textContent="Finished"}}};synth.speak(u)}
$("play").onclick=()=>{if(synth.paused){synth.resume();playing=true}else if(synth.speaking){synth.pause();$("status").textContent="Paused"}else start(si,pi)};
$("stop").onclick=()=>{playing=false;synth.cancel();document.querySelectorAll(".active").forEach(x=>x.classList.remove("active"));$("status").textContent="Stopped"};
$("prev").onclick=()=>start(Math.max(0,si-1),0);$("next").onclick=()=>start(Math.min(C.length-1,si+1),0);
$("lang").onchange=()=>{synth.cancel();voices()};$("theme").onclick=()=>{document.body.classList.toggle("dark");$("theme").textContent=document.body.classList.contains("dark")?"☀ Light":"☾ Dark"};
synth.onvoiceschanged=voices;render();voices();
