const C=[{"t": "7.1 INTRODUCTION", "p": ["You are aware that preparation is the key to making any task easier. Let’s take an example of a small trip to a historical place as a study tour. Now, how do we undertake it? You all know we think of all the points that we have to do, or in other words, we plan. Similarly, when you wish to travel anywhere, you do not get into a vehicle or start your journey without planning. Here you start thinking of the time you have to reach, the mode of transport you will choose, and the activities to do before, during and at the destination of your journey. You consider your journey successful if you have accomplished that you had to do on time and as planned. In a nutshell, planning is a critical and essential part of the successful completion of any activity. Every teacher wants to teach effectively and confidently. Planning for a lesson or unit is a crucial activity for a teacher to teach systematically. Experience makes most tasks easier. However, detailed planning is an essential part of preparing for a lesson, until you gain vast experience. You are already aware that teaching-learning is a planned and systematic activity to be carried out by teachers. Teachers analyze the content of the textbooks, outline the learning outcomes, plan to transact the analyzed content using several resources available to them, and further plan to assess their learners to help them acquire the expected learning outcomes. Assessment essentially completes the cycle from learning outcomes or curricular goals. Curriculum is designed with curricular goals in view; hence, planning is the key to achieving these curricular goals. In the earlier chapters, you have been acquainted with different types of resources and prescribed textbooks at the preparatory stage in the subject The World Around Us. You will also learn about various assessment tools and techniques in the following lesson. It is imperative for a teacher to have good knowledge of textbooks, resources, assessment tools, and techniques to be able to plan their teaching-learning effectively in a given context."]}, {"t": "7.2 LEARNING OUTCOMES", "p": ["After completion of this chapter, the learner ● explains the importance of planning in general and specifically in the teaching of TWAU at the preparatory stage; ● describes the significance of lesson and unit planning in teaching-learning of TWAU; ● relates to learning outcomes and curricular goals as the basis of planning to teach TWAU; ● develops lesson plans to teach TWAU lessons; ● prepares unit plans to teach TWAU; ● formulates/designs a term plan/course plan to teach TWAU for a term or a year; ● reflects on the essential elements of a unit plan as well as a lesson plan; and ● deliberates on the measures for planning an inclusive lesson plan."]}, {"t": "7.3 IMPORTANCE OF PLANNING", "p": ["Ms. Uma is an experienced and popular teacher in a primary school. She says that she enjoys teaching and is enthusiastic about teaching children. She likes to observe and interact with children frequently and also mentors new and young teachers in the school. She also listens to new teachers and tells them what she has learned from her seniors as well as through her on-the-job experience. She believes that if a teacher devotes time to planning, then she can truly enjoy her teaching. She has always thought carefully about the key things that she wants the children to learn, on the one hand, and on the other, how best to enable them to achieve this through a variety of learning experiences. That is precisely the crux or heart of a planning process. The new teachers who were Ms. Uma’s mentees discussed among themselves the magic mantra shared by her. They, too, wanted to be learner-focused like her. It means they would have to think firstly, how each child will experience the learning activities that they have planned, and secondly, how this learning activity will fulfill the intended learning outcomes along with how the assessment is to be carried out. The planning process helps a teacher to explain or justify how and why teaching will be effective for every learner. Ms. Uma listed the reasons why she liked preparing plans for teaching to her colleagues. Generally, plans relieve daily stress; learners/children are more engaged and participative, and hence, teachers feel more confident. Planning helps teachers to cater to the needs of all learners and also allows teachers to be innovative in their teaching. Her fellow teachers realized why Ms. Uma Ma’am had advanced professionally, too. Ms. Uma explained to her fellow teachers that planning is not always an everyday affair. Generally, planning for teaching and learning involves three levels– ● The first level is the content points of a theme or topic that a teacher is teaching in a lesson or a period of say 30-35 mins or a lesson plan. ● The Second level is planning the teaching-learning process of a topic or theme i.e., planning for a theme i.e., unit plan. A unit plan contains lesson plans for all the lessons covered in a theme. The above two levels of planning are called –Short-Term Planning– Lesson Plan and Unit Plan. ● Planning the teaching-learning process for a semester and/or the whole academic year. This is called Long-Term Planning– Annual Plan or Course Plan Before going to the next section, let us recall how much we understand about planning. CHECK YOUR PROGRESS 7.1 1. Why is lesson planning crucial for effective teaching? a) It reduces teachers’ preparation time b) It allows complete spontaneity in class c) It ensures content is presented coherently and systematically d) It eliminates the need for student feedback 2. How does planning help in classroom management? 3. Is planning required, especially by new teachers? Give reasons to justify your response. Answers: 1. (C)"]}, {"t": "7.4 CURRICULAR GOALS AND LEARNING OUTCOMES", "p": ["“Planning is a deliberate act carried out to bring about learning in students. This deliberate act needs to be well-planned. Planning is central to good teaching” (NCFSE, 2023). Planning includes the construction and organization of classroom tasks as per competencies and learning outcomes to be achieved, pedagogy to be followed, resources to be used, and assessment to be carried out. Planning also includes support activities for students, home assignments, and displays in the class relevant to what is being taught. (NCFSE, 2003) The major components of a teaching plan are: a) Competencies, learning outcomes, and intended lesson objectives b) Teacher-directed, teacher-guided, and/or student-led activities to achieve objectives c) Prior understanding of the student on which choice of pedagogy is based d) Content and materials to be used e) Duration and sequence of activities f) Classroom arrangements (e.g., seating, displays, arrangement of materials) g) Specific strategies for students who need extra help h) Methods of assessment Good planning requires an understanding of the aims of education, curricular goals, competencies, and learning outcomes to be achieved. Let us see these: Aims of Education -The Aims of Education are broad values and dispositions expected of students regarding their character-building, Indian-rootedness, physical, socio-emotional, intellectual, and spiritual development, etc., as espoused in NEP-2020. Curricular Goals — Curricular Goals are more specific statements that give direction to curriculum development and implementation in order to achieve the Curricular Aims. They are also specific to a school stage (e.g., the Preparatory Stage) and a Curricular Area (e.g., TWAU). Some of the curricular goals in TWAU are to enhance students’ sensitivity towards their environment, develop skills to work with the community, foster positive attitudes towards various professionals, etc. Competencies — Competencies are specific learning achievements that are observable and can be assessed systematically. Competencies are directly derived from a Curricular Goal and are expected to be attained by the end of the Preparatory Stage for TWAU. Summative assessments at the end of each Stage of schooling should be based on these Competencies. Learning Outcomes — Learning Outcomes (LOs) are small milestones of learning and usually progress in a sequence leading to the attainment of a competency. These LOs enable teachers to plan their content, pedagogy, and assessments toward achieving specific competencies. These are statements summarising the knowledge, skills, attitudes, and values that all children must possess and demonstrate upon the completion of a learning experience(s). At the Preparatory Stage, The World Around Us (TWAU) is designed as an interdisciplinary area of study, specifically meant to help learners observe, engage with, and understand their immediate social and natural environment. The learning outcomes in TWAU focus on knowledge and understanding of their surroundings, skills like observation, recording, classifying, etc, and attitudes necessary to care for and protect their environment. Hence, learning outcomes (LOs) of TWAU are to be achieved throughout a lesson, then throughout the entire academic or grade year, leading to the achievement of competencies and ultimately the achievement of curricular goals and aims at the end of a school stage. For example, The learner will be able to identify and describe the five senses through observing the natural world. This learning outcome encourages students to engage with their environment by using their senses to explore and understand the world around them. It aligns with the curricular goals of TWAU, promoting observation and sensory experiences as important learning tools at the preparatory stage. CHECK YOUR PROGRESS 7.2 1. Why does a teacher need to know about curricular goals before planning to teach? Explain. 2. What are the different levels of planning in the teaching-learning process?"]}, {"t": "7.5 SHORT-TERM PLANNING: LESSON PLANS", "p": ["AND UNIT PLANS Unit planning is an effective way of organizing instruction. It provides a complete picture of what is to be accomplished by the teacher while transacting a unit. A unit is a large segment of subject matter having a common theme or idea. A unit can be split up into smaller meaningful subunits called lesson topics, and the topics are linked to one another by a common idea or a principle. This includes not only the syllabus but a whole range of situations to be experienced and skills to be developed in TWAU. A unit plan creates coherence and connection between lessons. Planning for a unit may take time initially, but it is worthwhile for the teacher because subsequent lesson planning becomes easier. Unit Planning for TWAU Content in TWAU is divided into coherent units. For example, there are 12 chapters in the content of Textbook of Class 3, ‘Our Wondrous World’. These 12 chapters are placed under four units and there are three chapters in each unit. Observe the content of the textbook which is given below. Can you observe the coherence within each unit? Unit 1: Our Families and Communities Chapter 1: Family and Friends Chapter 2: Going to the Mela Chapter 3: Celebrating Festivals Unit 2: Life Around Us Chapter 4: Getting to Know Plants Chapter 5: Plants and Animals Live Together Chapter 6: Living in Harmony Unit 3: Gifts of Nature Chapter 7: Water — A Precious Gift Chapter 8: Food We Eat Chapter 9: Staying Healthy and Happy Unit 4: Things Around Us Chapter 10: This World of Things Chapter 11: Making Things Chapter 12: Taking Charge of Waste Planning for learning in TWAU needs to be based on an integrated and thematic unit. Unit planning must ensure that all facets of TWAU, such as Mathematics and Language (specifically for Classes 3 and 4), Arts and Crafts, Physical Education, Science, Social Science, and Environmental Education, as well as curricular goals and learning outcomes of TWAU, are included. For example, Unit-1 includes topics from Social Science such as family and friends, festivals, and a Mela. Planning to teach Unit-1 will include topics such as games played within families and in friends’ groups; drawing family pictures in any folk-art style such as Warli or Madhubani; calculating how many Kumbh Melas will be held in this century, etc. The unit is approached as a whole and not in fragments; hence, this kind of learning is relevant to children in the primary classes. The components of unit planning include: A. Goals and Learning Outcomes B. The learners C. Teaching-learning strategies D. The content E. Resources and materials F. An assessment system For example, the second unit of the Class-3 textbook ‘Our Wondrous World’ namely ‘Life Around Us’ has been chosen for unit planning. The unit planning here is meant for learners of Class-3. You may make necessary changes in other unit plans depending on the context, needs, and interests of children. A. Goals and Learning Outcomes Goals are general rationales of learning the unit and learning outcomes are specific learning behaviours. Some curricular goals of this unit are: (Reference: NCFSE, 2023) ● Recognising and respecting the well-being of both plants and animals ● Fostering a more compassionate society The learning outcomes must include objectives based on cognitive as well as process skill domains. Learning Outcomes for this unit are: - ● Recognizing the names of trees growing in their community ● Observing features of trees, shrubs, herbs, and creepers in their environment ● Observing leaves, bark, etc, and identifying plants from their features ● Observing soil in their surroundings and relating soil quality to the presence of plants ● Relating animals with their natural dwelling, such as trees/leaves, etc. Since one of the features of TWAU is its integration with the life of children, the goals of the theme as well as the objectives should reflect this. It is important to identify objectives so that there is a match between learning activities and learning outcomes. Let us reflect: What kind of skill and knowledge learning outcomes are expected of children of Class 3 in the unit ‘Life Around Us’ in the above paragraph? Answer: The learning outcomes are based on developing process skills of observation, communication, raising questions, gathering information, etc., along with the content of TWAU. It is aimed to arrive at the content area of ‘Life Around Us’ through the process skills. It is integral for children to acquire the process skills and to arrive at content areas through those processes at the preparatory stage B. The Learners The needs and interests of the learners are crucial. Ascertaining their notions as well as alternative conceptions held by them may be achieved through a brief discussion. These help the teacher to understand how individual learners understand the theme. Children with different abilities should be kept in mind while planning. Visual, aural, and kinaesthetic experiences should be planned to cater to children with varied interests and needs. While studying ‘Life Around Us’, it is necessary to perceive it from the context of an individual learner. Children of Class 3 may have their own notion of animals. They may consider birds and insects separate from animals. C. Teaching Learning Strategies It is necessary to select a strategy that would best enable children to learn and develop conceptual understanding through exploration of their environment. A strategy that takes into account the topic, context, children’s interests, and the available resources would create better learning. Activities to find out different birds in the surroundings of children and identifying their sounds would be one of the strategies to be used in the unit ‘Life Around Us’. The teacher must select a strategy that will best meet the needs of the learners or the goals determined by the teacher. D. Resources and Materials Resources and materials enrich the learning process. A variety of resources are available, and if used appropriately, they become effective. For the present unit on ‘Life Around Us’, a small animation video showing different types of plants, habitat of animals, etc., would make teaching worthwhile. It is necessary to plan a visit to a botanical garden/ neighbourhood park/zoo purposefully, to fulfil the objectives of teaching. TWAU focuses on learning about the environment by using the environment itself. Thus, easily available materials and resources from the environment may act as valuable inputs. E. The Content It is observed that pre-service teachers focus on developing and managing student activities, and content takes a back seat; on the other hand, in-service teachers tend to overemphasize content at the cost of activities. A careful analysis of content aids teachers in achieving (a) continuity, (b) sequencing, and (c) integration. Content analysis allows us to identify the number of lessons to complete the unit, activities to be planned, resources to be organised to transact the unit, and assessment procedures to achieve the learning outcomes of the unit. So, content analysis can be the start of planning to teach a unit as well as a lesson plan. F. Assessment System Assessment will follow from the goals and objectives set out in the beginning. Hence, in the unit ‘Life Around Us’, the assessment will include: - Making posters on ‘How plants depend on animals?’ and ‘How animals depend on plant?’ - Drawing parts of plants (one specimen each of herbs, shrubs, creepers, climbers, and trees) - Responding to a quiz on types of plants and uses of plants - Writing/discussing the common animals, insects, birds, and plants found in the nearby area. - Explaining the formation of soil and the fertility of soil - Answering questions from the chapters that reflect understanding Now that we have understood the various facets of planning, let us see how a teacher starts the process. The teacher may consider any component first while preparing a unitthe students, the content, the materials, or the objectives. A teacher need not necessarily proceed linearly from goals and objectives and so on. Typically, the experience of planning to teach a topic is led by considerations of the students’ familiarity with the topic; in other instances, the availability of resource material may guide how the teacher plans to introduce the topic to her or his class. She or he may also think about teaching strategies. Effective planning for a topic allows for individual treatment depending on the topic/ teacher/learners/learning environment/goals, though all aspects of planning need to be included. Table 7.1: Suggestive Example of a Unit Plan From Our Wondrous World (TWAU) Name of the Teacher: Class: 3 Subject: The World Around Us Unit Title: Unit 2 - Life Around Us Chapters: 4, 5 and 6 Subunit/ chapter Lesson Plan Content Analysis Learning Outcomes Teaching-Learning Strategies/ Activities Learning Resources AssessGetting to Know ter-4) 1 Trees Shrubs local trees/ trees with leaves and smelling Giving examples of trees and Adopting a shrub and taking care of it Make bark signature /stamp with different trees Potted plants Herbs/leaves Mobiles of types of leaves/flowers/ fruits (Animal or Plant mobiles are made by students. These are mostly 2D, made from thick sheets or thin cardboard. The animal or plant cut outs are hung by ropes or thread so that students can see them)", "Short answers 2 Herbs and Grasses local herbs/ trees with herbs and smelling different herbs Giving examples of trees and Story books/ poems based on trees/ gardens/ parks/flowers/ fruits/leaves Questions 3 Climbers and Creepers Climbers with Creepers climbers and creepers Videos of creepers and climbers, vineyards etc. 4 Leaves Flowers Fruits Leaves, Flowers and Fruits cut and uncut fruits/ vegetables Prepare fresh lemonade/ salad or chaat with herbs, vegetables, and fruits. etc Integrating with Art – leaf zoo/ vegetable block painting/Rangoli with dried flowers and leaves Flash cards of flowers/plants Specimens of locally available leaves/flowers/ fruits Collect a specimen of a plant from the surrounding area and draw and label", "Activity and Animals Live Together ter-5) 5 Animals eat plants for food insects/ caterpillar, grazing animals, birds eating grains or fruits plants or plant parts with food for Visiting a park/ zoo/nature Videos/ pictures of herbivorous animals eating food Enacting eating food 6 Animals live on Trees/ birds’ nests the dwelling place of animals on trees or in nature dependence of animals for shelter on plants/trees Visiting a park/ zoo/nature Videos/ pictures of herbivorous animals/birds living in nature Drawing animals/ birds in natural dwelling 7 Soil is important for plants and soil from placeswith plants/without plants topsoil and identifying components of topsoil sprouting of plants after rains with plant seeds on topsoil Visiting a nearby park/natural place Videos/pictures of soil profile Soil Profile 8 Bird Sounds birds from their sounds the time at which birds make more sounds Visiting places where birds are seen in nature Videos of birds Audio based quiz Living in Harmony ter-6) 9-10 Animals /birds/ insects living with us Communicating commonly seen animals/ birds/insects near them Discussing students’ experiences of animals/insects/ birds through games Discussing wanted and unwanted Visiting animal shelter Games Videos showing animals /birds/ insects living with children Animal Mobiles Animal Masks Flashcards of 11-12 Plants around us -inside the house and outside Communicating about plants like Tulsi, rose, marigold, and other unwanted plants around the children Discussing wanted and unwanted Potting plants/ celebrating Van Mahotsav Visiting plant nursery Related Stories. Videos of horticultural plants grown by human beings Flashcards of 13 Uses of and communicating different uses of Plants for us Visiting nature to see dependence of animals on plants for shelter, discussing furniture, timber, food eaten by animals/ humans, clothes, and jute, etc. and Ayurvedic/homeopathic medicine labels Samples of plantbased medicines or labels, different grains, plant fibres, pictures of fruits and vegetables, and furniture, etc. Grain boxes of different pulses/ cereals etc Drawing flow chart/ mindmaps Creating stories based on uses of 14 We Need Each Other-Harmony Discussing dependence of animals and plants on each other Journaling -Getting to know an animal JournalingMaking a tree friend Playing games like dumb charade to enact animals and naming Story cards based on animals and plants, and adoption of plants and Videos of real stories based on caring/preserving Videos of real stories based on afforestation such as Jadhav Payeng Journals sheets Lesson Planning Good lesson planning is key to successful teaching. Teachers need to plan their lessons to reflect the goals of TWAU teaching and be able to translate the goals into learning outcomes that are achieved through child-centred activities. There is no accepted format for designing a lesson plan. The long-form lesson plans describe all aspects of each lesson in detail. A new teacher or a pre-service student needs to prepare a long-form lesson plan, and after years of experience, may shift to the short-form lesson plan, also called a daily plan. The following list suggests elements that one might incorporate in a TWAU lesson plan. 1. Curricular Goals/ Competencies (General Objectives) 2. Learning outcomes (Instructional objectives/ Behavioural objectives) 3. Major concepts and process skills 4. Materials and resources 5. Teaching-learning activities/Instructional activities", "▪ Introduction", "▪ Presentation", "▪ Closure and Review (Concluding and recapitulation) 6. Assessment of instructional objectives (Worksheet/Question-Answers/ Quizzes) 1. Curricular Goals/ Competencies (General Objectives) These are the broad aims of the lesson and are concerned with what the lesson will cover. E.g., Students will be able to infer the interdependence of plants and animals. Learners will relate the need to live in harmony with animals and 2. Learning Outcomes (Instructional /Behavioural Objectives) These are outcomes that precisely define what learners will be able to do by the end of the lesson. With carefully worded objectives, you will have a clear idea of what the learners are expected to achieve and how you are going to assess it. You will be able to plan activities that will allow learners to demonstrate individually and collectively what they have learned. Carefully worded objectives give confidence to the teacher because teaching-learning activities and resources, as well as assessment procedures, are easily planned, leading to the success of teaching. A good objective is learner-oriented, observable, clear, understandable and, descriptive of a learning outcome of skill or cognitive function. For example, ‘Learners identify different types of plants’, ‘Learners measure different volumes of liquids using a known measure’. Here are some examples: Learning Outcome: Students can make a simple recall of factual information about TWAU.", "▪ List the types of plants", "▪ Label the diagram of a plant", "▪ Identify parts of a plant Locate, match, name, and state are some other verbs. Learning Outcome: Students can understand/comprehend concepts of TWAU.", "▪ Describe the use of technology in obtaining our food from farm to hearth", "▪ Classify herbs, shrubs, and trees", "▪ Differentiate between shrubs and trees", "▪ Students can apply concepts related to TWAU to different contexts. They can think critically.", "▪ Relate different types of habitats to the types of plants that grow there (Determine, predict, infer, solve, analyze, differentiate, relate, compare, and contrast are some of the verbs to represent analysis and creating new information. Arrange, compile, construct, devise, design, summarize, assess, conclude, interpret are some of the suggestive verbs to write learning outcomes.) The process skill outcomes have been discussed in detail in the chapter on Process Skills. 3. Major Concepts and Process Skills Teachers are using concept maps to see and show how concepts and sub-concepts are linked hierarchically. You may refer to the content section of the Unit plans. The process skills related to the lesson will be identified by the teacher. 4. Materials and Resources A number of teaching-learning materials are used by a teacher to make the topic relevant, interesting, and concrete for the learners. The resources may be newspapers, textbooks, specimens, field trips, community, television programs, or ICT resources (Information and Communication Technology). You have learned about resources and textbooks in the previous chapters. 5. Teaching-Learning Activities Teaching-learning activities include introduction, presentation, and closure activities. Teaching-learning activities are timed plans of how the lesson will proceed. Since you have decided on the learning outcomes of the lesson, you have an idea of the activities that the learners will do to be able to achieve those objectives, and to demonstrate their achievement through assessment tasks. There are many activities in all contexts for introducing a lesson. The best activity suited to the lesson would be chosen by a teacher to arouse natural curiosity, which leads them to the next level of inquiry. It should raise children’s interest and enthusiasm. Teachers are innovative in creating a story or a short poem, role plays, narration, display of pictures, images, etc. for the starter activities. Let us reflect: Which activity will you choose to introduce a topic on ‘Water’ for Class-3? Answer: The topic ‘Water’ can be introduced by an activity where learners would pour water into containers of different shapes and observe the level of water in each of them. Another activity can be the observation of evaporation of water from different things like a clay pot, a piece of cloth, on the floor, and a metal container, etc. The teaching-learning activities can be held within or outside the classroom. The obvious benefits of peer group learning should be kept in mind; groups of two or more students should be placed together to do an activity, observe and discuss among the group peers, and then report to the whole class and the teacher. Inquiry-based pedagogy of TWAU would be a reality through planned activities for this phase of the lesson. Different formats of lesson plans are available in books or on the web, which make changes in the teaching-learning phase only. Constructivist learning theorists suggest that lessons and units could follow a format where the lesson moves from presentation to exploration, followed by reflection and consolidation. Initial testing of previous knowledge is followed by the presentation of a problem, together with an introduction to a set of activities to help the children arrive at the rules and definitions. In the exploration stage, the children do the activities introduced at the beginning of the lesson. After the exploration stage, they proceed to the reflective stage. The teacher and the children together review what has been observed, with the teacher posing scaffolded questions to help children form conclusions. Finally, the lesson has an application and discussion stage. This involves a whole-class activity to share conclusions, where the main points of the lesson are recapitulated. You can refer to the 5-E instructional plan as discussed in Chapter 6 (Textbooks). The closure of the lesson is the logical conclusion of the lesson. The teacher ascertains whether learners have understood the concepts discussed and have acquired the process skills intended at the beginning of the plan: by asking suitable questions, giving a short objective type test or by asking learners to draw sketches etc. Recapitulation is very important. It is only through a review that a teacher can judge how well the children have learned the concepts / skills and how effective the teaching strategies have been. No lesson should be completed without an overview of the topic. 6. Assessment Assessment will be discussed in detail in Chapter -8. The range of assessment activities have been discussed which gives an opportunity to you to assess children’s learning at every stage of the lesson. Games, riddles, puzzles like “Spot the Difference”, “Match the Columns”, etc. provide an informal way to demonstrate children’s’ and exercises’ understanding. Learners should not be expected to give answers right away; you should give time and if required, clues to come up with answers. While the children are doing an activity or you are demonstrating something, questions should be asked about what to observe, e.g., during the activity regarding evaporation of water from different surfaces, asked the children to observe the time taken for the water to disappear from different surfaces like, floor, metal, clay pot, cloth, etc. Their responses will tell you about their understanding of whether they are using communication meant for TWAU and whether the activity needs to be repeated. Some assessment strategies can be used to measure the progress of individuals and some other strategies to keep track of the whole class. Learners are motivated to know their achievements; hence, it is important to plan assessment strategies for children with different abilities to provide a sense of achievement and to make inclusion a reality. CHECK YOUR PROGRESS 7.3 1. Why is framing learning outcomes an important step in lesson planning? 2. Which of the following steps is done to analyze the content for unit /lesson planning? a. The content is read again and again by the teacher b. A concept map is drawn to identify the hierarchy of concepts c. Related textbooks are referred to in order to identify the concepts d. All of the above Answers 2. (d) Planning for Inclusion From the foregoing discussion, it may have been clear that curriculum adaptation does not focus exclusively on learning objectives and content. It also sets out all the access alterations required for curricular development, like the environmental, material, and personal conditions that improve the teaching process. It may seem to some of you that teaching differently abled children is a complex task. There are many simple modifications that can be considered to assist children with disabilities in the classroom. Many of them are not timeconsuming, well within the control of a general teacher, and can make a world of difference. A few such strategies are given below:", "• Give independent work to the children in small segments. For example, a worksheet could be folded in half. These children can finish one by one. This prevents the child from feeling rushed or anxious about the amount of work.", "• Allow extra time for children who have difficulty. Also, reducing the assignments is helpful.", "• Find out from the special teacher the objectives that have been written in the Individualized Education Plan (IEP) of the child and make your plans accordingly. For example, the whole class might be expected to write a paragraph about something you have taught, but the child with intellectual impairment may write only three facts and the child with visual impairment may write in Braille and be allotted additional time.", "• Present information in both visual and auditory modes, it will help all learners.", "• Providing concrete material and the opportunity to learn by manipulating concrete objects is another strategy beneficial for all.", "• Display a large variety of multi-level reading books in your classroom.", "• Put some of your textbooks in audio format. This will help the visually impaired students and also those who have reading difficulties due to various reasons.", "• Use story maps and graphic organizers to assist students with writing tasks.", "• Provide cognitive support for content and activities", "• Summarize big ideas", "• Provide scaffolding for learning and generalization", "• Build fluency through practice", "• Provide assessments for background knowledge", "• Use technology appropriately. Technology can contribute to the effectiveness of curriculum adaptation. Research studies have shown that the selection and the practice of technology, such as software, computer games, the internet, and multimedia, need to follow the child’s individualised plan and can help in curriculum adaptation. You also need to recognize that computer experience may vary greatly among children with disabilities. So, you need to obtain and provide information about individual children to incorporate technology. Suggestive Example of a Unit Plan From Our Wondrous World (TWAU) (Note: Suggestions of activities are made in bullets for inclusion) Lesson Plan Number: 1 Name of the Student Teacher: Date: Class: 3 Period: Subject: The World Around Us Chapter: Getting to Know Plants (4) Topic: Trees and Shrubs Content OutlineTrees have a big trunk of wood and many branches, leaves, and deep roots. Shrubs, in comparison, are medium-sized, with several woody stems and branches close to the ground. Learning Outcomes: - Identifying local trees/shrubs - Comparing trees with shrubs - Observing leaves and smelling them - Giving examples of trees and shrubs Previous Knowledge: Students have observed trees and shrubs around them, and they may not distinguish between the trees and shrubs. Learning Resources: 1. Potted plants 2. Herbs/leaves 3. T ypes of leaves/flowers/fruits 4. Grain boxes of different pulses Activity Set-up: Small group for out of classroom activities, such as visit to a park/nature Introduction: Story of Gopu/Simmi/Raj given on Page-47, Our Wondrous World, Class-3 Instructions to children regarding being in groups of 4 to 5 during the visit to park/nature Presentation: (Teacher plans activities for students to explore, explain, and elaborate the learning points, and plans board work and assessment to check learning outcomes) S. No Learning Points Teaching-Learning Activities Assessment/Board Work 1 Observing a Tree Teacher-Observe trunk, stems, bark, and other parts of a tree and note in groups Make bark signatures of a tree in Groups", "• Include students with impairment in each group", "• Allow students to touch and feel the tree and shrub surface Oral quiz on characteristics of a tree Draw a tree.", "• Describe parts of a tree in a voice note", "• Smell the leaves etc and report 2 Names of Trees Try to find names of trees Teacher helps to find names with the help of Phone-based apps", "• Students can listen to the names of trees from teacher’s phone and speak loudly 3 More Examples Teacher and students together recall the names of trees they have seen around Name some trees 4 Observing a Shrub Teacher-Observe trunk, stems, bark, and other parts of a shrub and note in groups Make bark signatures of a shrub in Groups Oral quiz on characteristics of a Shrub Draw a shrub", "• Make a voice note on how a shrub feels 5 Examples of Shrubs Teacher and students together recall the names of shrubs they have seen around Name some shrubs 6 Comparing a shrub and tree Groups will present the difference between a tree and shrub Make a flow chart/mind map showing the difference between a tree and a shrub", "• V oice note of comparing a shrub and tree Recapitulation: Short quiz/ worksheet on trees and shrubs Extension of Learning: Watch videos of trees and shrubs and journal your observations Prepare a project report on 5 trees around you showing their bark signature/ stamp, leaves, branches through drawings or photographs, etc.", "• Prepare an audio note on your experiences with trees and shrubs Self-reflection:"]}, {"t": "7.6 LONG-TERM PLANNING: TERM PLANS AND COURSE PLANS", "p": ["Just as lesson planning is done to teach during a teaching period and unit planning is done to teach a unit, course planning and term planning are done at the beginning of the academic year by teachers. All the teachers teaching a particular class and subject sit together and plan to teach the term/course, keeping the annual calendar in view. The annual calendar mentions the beginning of the session, holidays and vacations, field trips, visits, term-end and session-end examinations, etc., Teachers plan activities ahead for the whole year as per the curricular goals and competencies to be developed in children. Major activities, such as trips and workshops, are planned throughout the year in the academic calendar. Often, teachers are allotted paper-setting duties and organizing resources, etc, during term planning. Units/ Chapters/Topics to be taught during specific months/days of the year are planned. For example, the topic of ‘Water’ excites the children, especially when they wonder whether it will rain on that particular day. Hence, that topic needs to be taught during the rainy season. Example of A Course Plan: Our Wondrous World, Class 3, NCERT Chapters Month Major Activities Assessments Chapter 1: Family and Friends April Project on Family Quiz on Chapter1 Chapter 8: Food We Eat April Groups of students can prepare food items without fire and hold a food fair/ food esyk Participation -FormaChapter 9: Staying Healthy and Happy May Interaction with a health and nutrition expert Holiday Homework - Project Work based on Chapter 1/7/10 Quiz on Chapter 9 SUMMER V ACATIONS Chapter 4: Getting to Know Plants July Visit to a Park/Nature Presenting ProjectsFormative AssessUnit-test based 1,8 and 9 Chapter 5: Plants and Animals Live Together July Visit to a Zoo Reporting/Journaling -Formative AssessChapter 6: Living in Harmony August Preparing animal and plant mobiles Plantation Reporting and PresentingFormative Chapter 7: Water — A Precious Gift August Water-based activities Participation and journalingFormative Chapter 2: Going to the Mela September Students’ Festival Half-yearly Examinations Chapter 3: Celebrating Festivals October -November Diwali Mela Participation and presentation-Formative Chapter 10: This World of Things December Projects to journal different materials and students’ experiences with those things Journaling -FormaChapter 11: Making Things January Projects /Exhibition of things made by students Presenting and Par - ticipatingFormative Chapter 12: Taking Charge of Waste January Plogging/ Cleaning the Classroom / Cleanliness Campaigns ParticipatingFormaRevision February Revision Tests Annual Examinations CHECK YOUR PROGRESS 7.4 1. Which of the following is most appropriate for a unit plan? a) It extends over more than 5 lesson plans b) Detailed learning activities for each lesson plan are given c) It is planning for a large coherent block of subject matter d) It is a sum of more than 10 daily action plans 2. Which of the following is the best resource to teach a topic on ‘Living in harmony’? a) Newspaper b) Field trip c) Images of Forests d) Textbook 3. Prepare a lesson plan topic as an example and show how it could be adapted for inclusion. Answers 1. (c), 2. (b)"]}, {"t": "7.7 LET US SUM UP", "p": ["• Unit and lesson planning are effective ways of organizing instruction and providing a complete picture of what is to be accomplished by the teacher for a unit or a lesson.", "• Unit plan extends over 8 to 10 periods, depending on the theme of the subject matter, the objective to be achieved, and the learning activities, while Lesson Plan (LP) is a daily action plan.", "• Content is presented in the form of major concepts in the Unit plan, while content is presented in the form of subtopics/teaching points in logical and psychological order in LP.", "• Learning activities are mentioned in a unit plan, while it is detailed in LP.", "• Assessment systems in the form of tools and techniques are just mentioned in a unit plan while actual assessment items are mentioned in LP.", "• A unit plan is made up of several lesson plans, and a lesson plan is part of the whole.", "• A good objective is student-oriented, observable, clear, and understandable, descriptive of a learning outcome of skill or cognitive function.", "• A TWAU teacher uses several teaching-learning materials to make a topic relevant, interesting, and concrete for the learners, such as newspapers, textbooks, specimens, field trips, community, television programs, or ICT resources (Information and Communication Technology).", "• The lesson plan must include opportunities for differently abled children to participate fully and achieve the learning outcomes to make the pedagogy inclusive."]}, {"t": "7.8 END EXERCISES", "p": ["1. How are curricular goals fulfilled by teachers in their classrooms? 2. Why is it important to plan for lessons before teaching? 3. Evaluate the statement ‘Learning Outcomes are assessed inside classrooms and not through term-end examinations.’ 4. Describe briefly an activity you will plan to teach: ‘All families help each other in a community.’ 5. Mention an activity listing of Learning-Teaching Resources, you will require to teach a topic on ‘Water’ to Class 5. 6. Develop a lesson plan for a topic from TWAU of a preparatory class, mentioning the learning outcomes, activities, resources, and assessment."]}, {"t": "7.9 REFERENCES", "p": ["1. https://cte.smu.edu.sg/lesson-planning 2. https://scarfedigitalsandbox.teach.educ.ubc.ca/concept-maps-for-teachingand-learning/"]}];
const KEY="twau_ch7_resume_v2";
const doc=document.getElementById('doc'), $=id=>document.getElementById(id);
const S=[];
const sentenceRe=/[^.!?]+(?:[.!?]+|$)/g;
C.forEach((c,si)=>{
  const sec=document.createElement('section');
  const h=document.createElement('h2'); h.textContent=c.t; sec.append(h);
  c.p.forEach(par=>{
    const p=document.createElement('p');
    const parts=par.match(sentenceRe)||[par];
    parts.forEach(raw=>{
      const text=raw.trim(); if(!text)return;
      const span=document.createElement('span'); span.className='s'; span.textContent=text+' ';
      const i=S.length;
      span.onclick=()=>jumpTo(i);
      S.push({el:span,sec:si,text});
      p.append(span);
    });
    sec.append(p);
  });
  doc.append(sec);
});

const ss=window.speechSynthesis;
let voices=[], idx=0, charOffset=0, playing=false, paused=false, token=0, utteranceStart=0;

const INDIAN=/(india|rishi|veena|heera|hemant|kalpana|ravi|neerja|prabhat|aditi|raveena|lekha)/i;

function loadVoices(){
  if(!ss)return;
  const L=$('lang').value;
  const rank=v=>{
    const lg=(v.lang||'').replace('_','-').toLowerCase();
    if(L==='en-IN') return lg==='en-in'?0:(INDIAN.test(v.name)&&/^en/.test(lg)?1:/^en-(gb|au|nz)/.test(lg)?3:/^en/.test(lg)?4:9);
    return lg===L.toLowerCase()?0:/^en/.test(lg)?2:9;
  };
  voices=ss.getVoices().filter(v=>rank(v)<9).sort((a,b)=>rank(a)-rank(b));
  const sel=$('voice'); sel.innerHTML='';
  voices.forEach((v,i)=>{const o=document.createElement('option');o.value=i;o.textContent=v.name+' ('+v.lang+')';sel.append(o);});
  if(!voices.length){$('warn').hidden=false;$('warn').textContent='No English speech voice was found on this device. Please enable an English voice in your device/browser speech settings.';}
  else {$('warn').hidden=true;}
}
loadVoices(); if(ss)ss.onvoiceschanged=loadVoices;

function save(){
  try{localStorage.setItem(KEY,JSON.stringify({idx,charOffset}));}catch(e){}
}
function restore(){
  try{
    const x=JSON.parse(localStorage.getItem(KEY)||'null');
    if(x && Number.isInteger(x.idx) && x.idx>=0 && x.idx<S.length){
      idx=x.idx; charOffset=Math.max(0,Math.min(Number(x.charOffset)||0,S[idx].text.length));
      mark(idx);
      $('now').textContent='Saved place found. Press “Read chapter” to resume.';
      return true;
    }
  }catch(e){}
  return false;
}
function clearSaved(){try{localStorage.removeItem(KEY);}catch(e){}}

function mark(i){
  S.forEach(x=>x.el.classList.remove('on'));
  const s=S[i]; if(!s)return;
  s.el.classList.add('on');
  s.el.scrollIntoView({block:'center',behavior:'smooth'});
  $('prog').firstElementChild.style.width=((i+1)/S.length*100)+'%';
  $('now').textContent='Now reading: '+C[s.sec].t;
}

function speakCurrent(){
  if(!ss || !playing)return;
  if(idx>=S.length){finish();return;}
  const my=++token;
  const full=S[idx].text;
  const start=Math.max(0,Math.min(charOffset,full.length));
  const remaining=full.slice(start);
  if(!remaining.trim()){idx++;charOffset=0;save();speakCurrent();return;}
  utteranceStart=start;
  const u=new SpeechSynthesisUtterance(remaining);
  const v=voices[$('voice').value];
  u.lang=$('lang').value;
  if(v){u.voice=v;u.lang=v.lang;}
  u.rate=parseFloat($('rate').value);
  mark(idx);
  u.onboundary=e=>{
    if(my!==token)return;
    if(typeof e.charIndex==='number'){
      charOffset=utteranceStart+e.charIndex;
      save();
    }
  };
  u.onend=()=>{
    if(my!==token)return;
    idx++; charOffset=0; save();
    if(playing) setTimeout(speakCurrent,40);
  };
  u.onerror=e=>{
    if(my!==token)return;
    if(e.error==='canceled'||e.error==='interrupted')return;
    playing=false; paused=false; $('play').textContent='Read chapter';
    save(); $('now').textContent='Speech stopped because the selected voice reported an error. Press Read chapter to try again.';
  };
  ss.speak(u);
}

function startOrResume(){
  if(!ss){$('warn').hidden=false;$('warn').textContent='This browser does not support speech playback. Please use Chrome, Edge, Safari, or Firefox.';return;}
  ss.cancel(); token++;
  playing=true; paused=false;
  $('play').textContent='Pause';
  setTimeout(speakCurrent,80);
}

function jumpTo(i){
  if(!ss)return;
  ss.cancel(); token++;
  idx=i; charOffset=0; save();
  playing=true; paused=false; $('play').textContent='Pause';
  setTimeout(speakCurrent,80);
}

function finish(){
  playing=false; paused=false; idx=0; charOffset=0; clearSaved();
  S.forEach(x=>x.el.classList.remove('on'));
  $('prog').firstElementChild.style.width='100%';
  $('play').textContent='Read chapter';
  $('now').textContent='Finished. Press “Read chapter” to listen again from the beginning.';
}

$('play').onclick=()=>{
  if(!playing){startOrResume();return;}
  if(paused){ss.resume();paused=false;$('play').textContent='Pause';$('now').textContent='Resuming…';}
  else{ss.pause();paused=true;$('play').textContent='Resume';$('now').textContent='Paused. Press Resume to continue.';}
};

$('stop').onclick=()=>{
  if(!ss)return;
  // Keep idx/charOffset so the next Play resumes here.
  ss.cancel(); token++;
  playing=false; paused=false; save();
  $('play').textContent='Resume';
  $('now').textContent='Stopped. Your place has been saved. Press Resume to continue.';
};

$('lang').onchange=()=>{
  loadVoices();
  if(playing&&!paused){ss.cancel();token++;setTimeout(speakCurrent,80);}
};
['rate','voice'].forEach(id=>$(id).onchange=()=>{
  if(playing&&!paused){ss.cancel();token++;setTimeout(speakCurrent,80);}
});

window.addEventListener('beforeunload',()=>ss&&ss.cancel());
restore();
</script>
