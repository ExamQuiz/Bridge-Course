<script>const SECTIONS=[{"heading": "8.1 Introduction", "parts": []}, {"heading": "8.2 Learning Outcomes", "parts": []}, {"heading": "8.3 Meaning and Scope of Assessment", "parts": []}, {"heading": "8.4 Assessment Based on Learning Outcomes", "parts": ["· Formative Assessment", "· Summative Assessment"]}, {"heading": "8.5 Strategies for Continuous and School Based Assessment", "parts": []}, {"heading": "8.6 Formative and Summative Assessment, Formal, Informal and", "parts": ["360°Assessment"]}, {"heading": "8.7 Qualitative Assessment", "parts": []}, {"heading": "8.8 Let Us Sum Up", "parts": []}, {"heading": "8.9 End Exercises", "parts": []}, {"heading": "8.10 References 8.1 INTRODUCTION", "parts": ["As primary teachers, we are constantly observing, listening, guiding, and nurturing the learning of young children.", "Every smile of discovery, every curious question, every new attempt tells us something valuable.", "This – in its essence – is assessment.", "In today’s world, children grow up surrounded by an ever-changing landscape— full of information, technology, diverse cultures, and complex social interactions.", "They need not just knowledge, but the ability to understand, analyze, relate, and act responsibly.", "Assessment, when thoughtfully designed and purposefully implemented, becomes a powerful tool to help children make sense of the world around them and their place within it."]}, {"heading": "8.2 LEARNING OUTCOMES", "parts": ["After completion of this chapter, the learner", "· develops a comprehensive understanding of the various assessment", "strategies and tools;", "· chooses suitable assessment methods and tools aligned with children’s", "learning needs;", "· analyses assessment data to gain meaningful insights into children’s", "learning;", "· utilizes assessment data to set learning goals and develop targeted", "learning plans for TWAU;", "· integrates data from multiple sources to form a comprehensive view", "of children and class performance, and supports learning through appropriate remediation;", "· communicates the performance data to of children and their parents", "effectively, offering constructive feedback on progress;", "· provides specific, actionable feedback on children’s’ performance to", "parents and caregivers;", "· engages and collaborates with parents and community members to", "support and guide learning; and", "· interprets and uses the concept and application of the Holistic Progress", "Card effectively to assess the progress of children in TWAU."]}, {"heading": "8.3 MEANING AND SCOPE OF ASSESSMENT", "parts": []}, {"heading": "8.3.1 Concept of Assessment", "parts": ["The National Education Policy (NEP) 2020 and the National Curriculum Framework-School Education 2023 (NCF-SE) emphasize that the purpose of assessment is not to label children or rank them, but to support and enrich their learning journey.", "At the primary level, assessment should help us understand:", "· what children are thinking and how they are making meaning of their", "experiences.", "UNIT - 8", "· what they are curious about, and how they explore their environment.", "· what they are finding difficult, and how we can support them better.", "In short, assessment is not a separate activity—it is woven into the fabric of everyday teaching and learning.", "Assessment beyond Marks Traditional assessments often focused on right or wrong answers, usually through tests or exams.", "But real learning is much broader.", "Can a child explain how a plant grows?", "Can they observe carefully and ask questions about their surroundings?", "Can they work in a group and listen to others?", "These are all signs of learning.", "The NEP 2020 calls for a shift from “rote-based” assessment to “competency- based” assessment.", "This means focusing on conceptual understanding, critical thinking, application of knowledge, and skills for life.", "Assessment in the Context of The World Around Us Children are natural explorers.", "They learn by engaging with their environment— family, community, nature, stories, play, and day-to-day experiences.", "For instance, when they measure ingredients while helping in the kitchen, or share toys with a friend, they are learning maths, language, and social skills.", "In this light, assessment should also be situated in real-life contexts.", "A simple nature walk can become an opportunity to assess observation skills, language expression, and environmental awareness.", "A class discussion about a festival can reveal values, cultural understanding, and communication abilities.", "Assessment for, as, and of Learning In the classroom, assessment plays three important roles:", "1.", "Assessment for Learning: To understand how children are learning and to", "inform our teaching.", "(Formative)", "2.", "Assessment as Learning: When children reflect on their own learning and", "take charge of it.", "(Self and peer assessment)", "3.", "Assessment of Learning: To understand what has been achieved at a", "particular point.", "(Summative) All three roles are important and must be thoughtfully balanced, especially in the primary years.", "Our Role as Teachers As teachers, we are not just assessors—we are guides, observers, listeners, and facilitators.", "We use simple tools like observation notes, child portfolios, classroom conversations, project work, and joyful tasks to understand learning deeply.", "We also share this understanding with children and their families—not through numbers or ranks, but through descriptive feedback that tells a story of learning:", "where the child is, what they are doing well, and what they can work on next."]}, {"heading": "8.3.2 Types of Assessment – Looking at Learning from Different", "parts": ["Angles We look at a child’s growth through many lenses—health, behaviour, interests, and emotions, we must also look at their learning through different kinds of assessment.", "Each type of assessment tells us something unique.", "Below are the major types of assessment categorized by purpose, nature of data, domain, and standards.", "1.", "Based on Purpose", "Formative Assessment (Assessment for learning)", "· Continuous and classroom-based", "· Helps track learning during activities.", "Example: While exploring plants in the school garden, the teacher notes which children can identify parts of a plant and asks questions.", "Summative Assessment (Assessment of learning)", "· Done at the end of a unit or term", "· Captures overall learning achievement", "Example: Children create a nature scrapbook showing seasons, labeled draw- ings, and reflections.", "Diagnostic Assessment", "· Identifies specific learning gaps", "· Used before or during teaching", "Example: If a child cannot describe their surroundings, a teacher uses a picture discussion to check language or observation issues.", "2.", "Based on Nature of Data", "Qualitative Assessment", "· Rich descriptions, observations, child samples", "UNIT - 8", "· Captures process, creativity, thinking", "Example: Anecdotal records of how a child interacts with peers during a group project on “My Neighborhood”.", "Quantitative Assessment", "· Numerical scores, tallies, or checklist totals", "· Gives a measurable snapshot of learning", "Example: Counting how many children can sort living and non-living things correctly in a worksheet.", "3.", "Based on Standards of Comparison", "Criterion-Referenced Assessment", "· Compares performance against learning outcomes", "· Focus on individual mastery", "Example: Checking if each child can identify five sources of water after a na- ture walk, based on lesson goals.", "Norm-Referenced Assessment", "· Compares one child’s performance to others", "· Less suitable for primary years, but may be used for broader", "benchmarking Example: District-level surveys to understand general trends in children’s awareness about their environment."]}, {"heading": "8.3.3 Relationship between Learning and Assessment with", "parts": ["Reference to “The World Around Us” Learning and assessment go hand in hand—especially in the early grades, where children learn most effectively through real-world experiences.", "In the context of The World Around Us (TWAU), learning unfolds as children observe nature, engage in everyday activities, ask questions, and interact with people and their environment.", "Assessment plays a vital role in understanding and nurturing this learning journey.", "Key Relationships:", "1.", "Assessment Reflects Learning in Real-Life Contexts", "Children make sense of their surroundings by connecting classroom content with their everyday environment.", "When assessment is based on real-life tasks—like drawing their home, identifying community helpers, or describing a nature walk—it becomes a natural extension of learning.", "2.", "Assessment Informs Teaching", "Through assessment, teachers gain insights into what children understand, what they are curious about, and where they need support.", "For example, if children confuse man-made and natural objects, the teacher can plan hands- on sorting activities in the next lesson.", "3.", "Learning Becomes Visible Through Assessment", "In TWAU, learning is often not limited to books.", "It is seen in how a child asks questions, explains observations, or works in a group.", "Assessment tools like anecdotal records, portfolios, and oral discussions help make this learning visible.", "4.", "Assessment Encourages Reflection", "When children are given opportunities to talk about their experiences—such as describing a market visit or drawing their family—they begin to reflect, connect, and express.", "This strengthens both learning and self-awareness.", "5.", "Continuous and Contextual Assessment Supports Holistic Learning", "TWAU promotes integrated learning—combining language, environmental awareness, values, and social skills.", "Continuous assessment allows teachers to capture growth across these areas, rather than limiting it to a one-time test.", "In “The World Around Us”, learning and assessment are deeply interconnected.", "Assessment helps teachers recognize the richness of children’s learning as they engage with real-world experiences.", "When thoughtfully used, it guides instruction, supports individual needs, and nurtures curiosity—making learning joyful, relevant, and lasting."]}, {"heading": "8.3.4 Considerations for Assessment at the Preparatory Stage", "parts": ["· Assessment should not contribute to any additional burden for children", "or teachers; it must be seamlessly integrated into regular classroom activities.", "· Assessment should be stress-free, age-appropriate, and aligned with", "the natural learning process of children at the Preparatory Stage.", "· Assessment should be a reliable and valid source of information", "that accurately reflects children’s understanding, skills, and learning progress.", "UNIT - 8", "· Assessment must be based on varied and continuous evidence gathered", "through multiple tools and methods, such as observations, checklists, and student work samples.", "· Assessment should recognize and respect the diversity among learners,", "including their languages, learning styles, interests, and developmental needs.", "· Assessment should allow children to demonstrate learning in multiple", "ways—through speaking, drawing, performing, or writing—beyond written tests.", "· Assessment practices should be inclusive and equitable, ensuring", "every child gets a fair opportunity to show what they know and can do.", "· Assessment should enable meaningful documentation through", "portfolios, learning stories, and progress records to track individual growth over time.", "· Assessment should support teachers in planning appropriate", "learning experiences and provide valuable insights for instructional improvement.", "· Assessment should also strengthen communication between teachers,", "parents, and other stakeholders by providing a clear picture of the child’s learning journey.", "CHECK YOUR PROGRESS 8.1", "1.", "What are the main differences between quantitative and qualitative", "assessment?", "2.", "How does assessment help in identifying children’s curiosity and learning", "needs?", "3.", "Why is it important to integrate assessment with everyday teaching-learning", "processes?", "4.", "Mention two ways in which informal assessment can be conducted during", "regular classroom interactions.", "5.", "List three features that make assessment child-centric in the context of NEP", "2020."]}, {"heading": "8.4 ASSESSMENT BASED ON LEARNING OUTCOMES", "parts": []}, {"heading": "8.4.1 Designing Assessment for TWAU Based on Learning", "parts": ["Outcomes Assessment in “The World Around Us” (TWAU) must be closely aligned with the learning outcomes derived from its key competencies.", "It should help teachers understand how well children are progressing in their ability to observe, question, understand, express, and act in relation to their environment.", "Assessment in TWAU is not just about facts—it should capture how children think, feel, and respond to the world around them."]}, {"heading": "8.4.2 Formative Assessment", "parts": ["Formative assessment is continuous and conducted during the learning process.", "It provides real-time feedback to support and improve student learning.", "Examples in TWAU:", "· Observing how a child classifies natural and man-made objects during", "an activity.", "· Noting children’s responses during group discussions on cleanliness or", "water conservation.", "· Using checklists, anecdotal notes, or drawing-based tasks.", "· Encouraging self and peer assessment (“What did you find most", "interesting in today’s exploration?”).", "Formative assessment helps identify children who may need more support and allows teachers to adjust their instruction accordingly."]}, {"heading": "8.4.3 Summative Assessment", "parts": ["Summative assessment is conducted at the end of a term or unit to evaluate overall learning achievements based on the expected outcomes.", "Examples in TWAU:", "· A written task where a child explains the importance of trees in their", "neighborhood.", "· A simple project on water sources in the locality with pictures and", "observations.", "· Drawing a sketch/map and labelling key places in the school or home", "surroundings.", "· Oral presentations on how to reduce waste at home or school.", "Summative assessment in TWAU should be designed to reflect children’s understanding and ability to apply what they’ve learned, not just recall information.", "Assessment in TWAU must be purposeful, diverse, and child- UNIT - 8 sensitive.", "Both formative and summative assessments should be used thoughtfully to track progress against learning outcomes and support holistic development in primary learners."]}, {"heading": "8.4.4 Curricular Goals and Competencies of “The World", "parts": ["Around Us” (TWAU) Curricular Goals and Competencies are central elements of the National Curriculum Framework for School Education (NCFSE 2023).", "Curricular Goals (CGs) describe the broad learning expectations from a curricular area at a particular stage of schooling.", "They reflect what learners should engage with and understand meaningfully.", "Each Curricular Goal is further broken down into specific Competencies (Cs)—these are observable and assessable achievements that learners are expected to demonstrate by the end of the stage.", "For example, in The World Around Us (TWAU), a Curricular Goal “Explores and engages with the natural and socio-cultural environment” includes competencies such as observing and identifying elements in the environment, asking questions, and explaining local systems.", "These competencies guide teachers in planning classroom activities, selecting pedagogy, and conducting assessments that are developmentally appropriate and meaningful.", "As per NCF-SE 2023, there are 7 Curricular Goals (CGs) and 25 Competencies which are aligned with these Curricular Goals in the teaching and learning of TWAU.", "Example from TWAU Chapter for CG-1 and C-1.1: Curricular Goal (CG-1): Explores and engages with the natural and so- cio-cultural environment in their surroundings Competency (C-1.1): Observes and identifies the natural (insects, plants, birds, animals, geographical features, sun and moon, stars, planets, natural resources) and social (houses, relationships) components in their immediate environment Illustration from TWAU Text Book ‘Our Wondrous World’:", "In a suggested classroom activity given in Chapter 3: Nature Trail of Unit 2: Life Around Us from the textbook for class 4, children are encouraged to take a nature walk around the school or home area and observe the plants, in- sects, birds, and nearby houses.", "After the walk, they are asked to draw or describe what they saw, such as a flowering tree, a flying bird, or the layout of a neighbour’s home.", "The teacher facilitates a discussion around how these elements are part of their everyday life and environment, helping children relate classroom learning to their lived experiences."]}, {"heading": "8.4.5 Need of Competencies for Students and Teachers", "parts": ["A fundamental shift in education, moving from rote memorization to competency-based learning is the major recommendation of the NEP 2020.", "This shift is especially important for children at the Preparatory Stage (Grades 3–5) and for primary teachers, who play a key role in shaping early learning experiences.", "For children, competencies such as critical thinking, communication, collaboration, creativity, and curiosity are essential.", "At this age, children are naturally inquisitive and learn best through exploration and interaction with their environment.", "Competency-based learning helps them build a deep understanding of concepts, apply knowledge in real-life situations, and develop the ability to solve problems.", "These competencies support the holistic development of children—encompassing cognitive, emotional, social, and ethical dimensions—and help them become confident, responsible, and active participants in their communities.", "Competency refers to the ability to apply knowledge, skills, and behaviors effectively to perform a task or activity, often within a specific context or role.", "For teachers, the development of professional competencies is equally important.", "In a competency-based approach, teachers are not just knowledge transmitters but facilitators of learning.", "They need to be reflective practitioners, skilled in using inclusive, engaging, and inquiry-based pedagogies.", "Teachers must also be responsive to the diverse needs of learners and be equipped to guide children in developing essential skills."]}, {"heading": "8.4.6 NEP 2020 for Competency-Based Assessment", "parts": ["Shift from Rote Learning to Meaningful Assessment NEP 2020, proposes a paradigm shift from traditional memory-based testing to assessments that focus on understanding, application, and skill development.", "The aim is to make assessment more authentic and relevant to real-life situations.", "For instance when children collect information on how waste is managed in their homes or locality and create a chart or model showing segregation of biodegradable and non-biodegradable waste, it’s a hands on experience.", "Justification: This connects textbook knowledge to real-life environmental concerns and promotes responsible behaviour — a goal of holistic education.", "Focus on Core Competencies and Skills The policy emphasizes assessing not just content knowledge, but also key competencies such as critical thinking, problem-solving, communication, creativity, and collaboration.", "These cannot be measured through traditional pen-and-paper tests alone.", "Therefore, assessment should reflect a child’s ability to apply concepts in real-life and meaningful contexts.", "UNIT - 8 For instance: In TWAU, instead of merely recalling facts about plants, children can be asked to grow a plant, observe changes, and record observations, thereby applying the scientific method.", "Such tasks embody the “pedagogy of learning by doing”, where children engage actively, reflect on their experiences, and construct knowledge.", "Assessment in this context becomes a natural extension of learning, capturing not just what children know, but how they think, solve problems, and communicate ideas.", "This approach ensures that assessment supports holistic development and provides a more accurate, child-centric understanding of learning.", "Formative, Holistic, and Continuous NEP 2020, promotes formative, holistic and continuous assessment over one- time exams.", "It supports ongoing feedback that helps children improve, teachers refine instruction, and learning becomes more personalized and supportive.", "Diverse Tools and Methods The policy encourages the use of varied assessment methods—such as observation, discussion, project work, oral responses, portfolios, self- and peer- assessment—instead of relying only on pen-and-paper tests.", "Inclusive and Child-Centric Assessments must be age-appropriate, stress-free, and designed to cater to individual learning needs.", "Hence, NEP envisions assessment that allows every child to progress at their own pace and in their own way, valuing diversity in learning.", "Assessment for Learning, Not Just of Learning The purpose of assessment is redefined—not merely to grade children, but to guide them.", "It should support the learner’s growth, help teachers adapt their strategies, and involve parents in understanding their child’s holistic development.", "Towards Competent and Future-Ready Learners Ultimately, NEP-2020, envisions a system where assessment drives the development of confident, capable, and future-ready learners—who not only know, but can think, create, and contribute meaningfully to society."]}, {"heading": "8.4.7 Deriving Grade-Specific Learning Outcomes from TWAU", "parts": ["Competencies “The World Around Us” (TWAU) curricular area as envisioned in the NCF-SE 2023, focuses on helping children understand and engage with their immediate environment—natural, social, and human-made—through meaningful experiences.", "It is based on a set of broad competencies such as observation, inquiry, communication, empathy, critical thinking, and participation.", "To implement these competencies effectively in classrooms, they must be translated into grade-specific learning outcomes that are age-appropriate, measurable, and contextual.", "Understanding the Process Deriving learning outcomes from competencies involves breaking down each broad skill area into specific expectations aligned to the developmental stage of the learner.", "For the Preparatory Stage (Grades 3–5), these outcomes reflect the growing cognitive, social, and emotional capabilities of children.", "Steps in Deriving Grade-Specific Learning Outcomes", "1.", "Identify Core Competencies", "Start with key TWAU competencies from the NCF, such as: o Observing and questioning the world around o Understanding relationships in nature and society o Communicating findings and ideas o Demonstrating care and responsibility", "2.", "Contextualize to Grade-Level", "Match the competency with what children in a specific grade can realistically understand and do.", "For example:", "o Grade 3: Recognize and name different plants and animals in the local environment. o Grade 4: Classify living and non-living things based on their features.", "o Grade 5: Explain the interdependence of plants, animals, and humans.", "3.", "Define Observable and Measurable Outcomes", "Each outcome should clearly state what a child is expected to know and be able to do.", "For example: o “Identifies sources of water in the locality and describes their uses.”", "o “Draws a simple map of the school or neighbourhood and labels key places.” o “Shares ideas about how to keep the surroundings clean and safe.”", "UNIT - 8", "4.", "Ensure Integration Across Domains", "TWAU learning outcomes often overlap with literacy, numeracy, and values education.", "Outcomes should allow for this integration.", "For example, a class 4 child may “Collect and represent data on types of houses in the neighbourhood using pictures or tallies,” linking environmental understanding with mathematical representation.", "5.", "Include Socio-Emotional and Ethical Aspects", "Since TWAU also includes awareness of self, others, and community, outcomes should include aspects like:", "o “Expresses concern for animals and plants.” o “Shows willingness to help peers and participate in group work.”", "By deriving clear learning outcomes from TWAU competencies, educators ensure that children’s learning is purposeful, developmentally appropriate, and deeply connected to the real world they live in.", "This process supports the shift from content-heavy teaching to meaningful, competency-based learning envisioned in NEP 2020 and NCF-SE 2023.", "CHECK YOUR PROGRESS 8.2", "1.", "Define formative assessment and give one classroom-based example from", "TWAU.", "2.", "What is the purpose of using anecdotal records in early grade assessment?", "3.", "Write any two advantages of using a portfolio for student assessment.", "4.", "Which tools can a teacher use to capture student performance in group", "activities?"]}, {"heading": "8.5 STRATEGIES FOR CONTINUOUS AND SCHOOL-BASED ASSESSMENT", "parts": ["Continuous and School-Based Assessment (CBA) is an essential approach recommended by the National Education Policy (NEP) 2020 and the National Curriculum Framework for School Education (NCF-SE) 2023.", "It promotes ongoing, flexible, and inclusive ways of assessing children’s learning during day-to-day classroom activities.", "Instead of relying solely on high-stakes exams, CBA focuses on real-time understanding of the child’s progress, strengths, and learning needs.", "The following strategies help teachers capture the holistic development of each learner across cognitive, social, emotional, and ethical domains.", "School-Based Assessment (SBA) is a holistic and continuous process of evaluating children’s learning that is conducted by the school as part of regular classroom activities.", "It goes beyond traditional exams and focuses on assessing not just academic knowledge but also skills, values, attitudes, and overall development.", "SBA is integrated with everyday teaching–learning processes and includes activities such as projects, group work, observations, discussions, and self or peer assessments.", "It aims to understand each child’s progress, identify learning needs, and provide timely feedback for improvement.", "By making assessment more meaningful and child-centric, SBA supports the development of key competencies like critical thinking, collaboration, and creativity, in alignment with the goals of NEP 2020 and NCF-SE 2023."]}, {"heading": "8.5.1 Teacher’s Observation", "parts": ["Teachers’ observation is a natural and non-intrusive way to assess children during classroom interactions, play, or group activities.", "Teachers observe how children respond, participate, solve problems, express emotions, and interact with peers.", "Such observation:", "· helps identify learning gaps, interests, and social behaviours.", "· can be done daily during regular activities.", "· should be systematic, with focused observation goals (e.g., teamwork,", "use of vocabulary, curiosity).", "· can be recorded through observation sheets or logs."]}, {"heading": "8.5.2 Question and Answer", "parts": ["Interactive questioning is an effective way to assess conceptual clarity and en- courage thinking.", "· Teachers can ask open-ended, probing, or reflective questions related", "to a concept or activity.", "· For example, “Why do you think plants need sunlight?” or “What", "happens if we waste water?”", "· It helps assess both knowledge and reasoning skills.", "· It can be used as quick informal checks or as a part of classroom", "discussions."]}, {"heading": "8.5.3 Teacher’s Designed Task and Test", "parts": ["These are teacher-created short assessments that directly relate to learning outcomes.", "UNIT - 8", "· Can include worksheets, matching tasks, drawing and labelling,", "puzzles, or simple experiments.", "· Should be low-stress and age-appropriate.", "· Designed to assess specific competencies or content areas.", "For", "example, a task like “Draw and label sources of water” helps assess environmental understanding and expression."]}, {"heading": "8.5.4 Work Sample/Portfolio", "parts": ["A portfolio is a purposeful collection of a child’s work that demonstrates learning progress over time.", "· May include drawings, writings, worksheets, photographs of group", "work, and personal reflections.", "· Helps capture growth in both academic and creative areas.", "· Encourages student ownership and self-assessment.", "· Can be shared with parents during meetings or used in student-led", "conferences."]}, {"heading": "8.5.5 Project", "parts": ["Projects provide opportunities for deeper exploration of a theme or topic.", "· Encourages inquiry, observation, and collaboration.", "· Children can explore local issues like “Clean Neighborhood” or “Types", "of Homes in Our Area.”", "· Involves a variety of tasks—drawing, writing, field visits, model-", "making, interviews.", "· Helps in assessing integration of knowledge, application, and", "communication skills.", "For instance, in the Class 3 TWAU textbook “Our Wondrous World”, Unit 3 “Gifts of Nature”, Chapter 7 “Water: A Precious Gift”, a suggested project task asks:", "“Is there a stream, river, pond or lake near your village or city?", "Find out its name and some information about it.", "Visit it and draw its picture.", "Draw any trees, birds or animals that you see around it.”", "This task is a clear example of authentic, school-based assessment that reflects learning by doing.", "It encourages children to observe their surroundings, gather information, and represent their understanding through drawing and oral or written description.", "This kind of task assesses not only content knowledge about water bodies and ecosystems but also builds critical observation skills, environmental awareness, creativity, and expression.", "It makes learning experiential and contextually rooted, and the assessment naturally becomes a part of the learning process."]}, {"heading": "8.5.6 Anecdotal Records", "parts": ["These are brief, narrative descriptions of significant learning incidents or behaviors observed in children.", "· Helps track individual progress, personality traits, social interaction,", "and emotional responses.", "· For example, “Riya helped a classmate who was shy to speak during", "the group activity.”", "· Maintained systematically for all the children.", "· Can be used during teacher reflections or parent-teacher discussions."]}, {"heading": "8.5.7 Rubrics", "parts": ["Rubrics are clear and structured tools used in School-Based Assessment to check how children are progressing in different areas like thinking, emotions, body movement, and creativity.", "According to PARAKH’s (Performance Assessment, Review, and Analysis of Knowledge for Holistic Development) Holistic Progress Card (HPC) guidelines, rubrics include specific abilities such as awareness, sensitivity, and creativity, with three levels of performance: Beginner, Proficient, and Advanced.", "These rubrics are directly linked to the learning goals in the curriculum.", "Teachers use them during everyday classroom activities to see how well children are developing different skills.", "For example, in an art activity, teachers may look at how well a children notice details (awareness), expresses feelings (sensitivity), and creates something new (creativity).", "One important feature of rubrics in the HPC is that they focus on the overall development of the child.", "Teachers observe children and take short notes (called anecdotal records).", "Children also think about their own learning and give feedback to each other.", "Parents are involved too, making it a 360-degree view of the child’s growth—both academic and personal.", "Rubrics help teachers make fair and clear decisions about learning.", "The language used is simple and based on what can actually be seen.", "Over time, rubrics show how a child is improving, helping teachers give the right support.", "They also encourage children to reflect on their learning and take charge of it.", "UNIT - 8 In line with NEP 2020, rubrics shift the focus from just giving marks to understanding each child’s journey.", "They support a learning system that is inclusive, stress-free, and continuous, where every child’s progress is valued.", "So, rubrics are not just tools for grading—they are tools for knowing the child, supporting their growth, and celebrating their learning in a thoughtful and joyful way.", "CHECK YOUR PROGRESS 8.3", "1.", "What is meant by “school-based assessment”?", "2.", "Write any two examples under CG-1 of TWAU.", "3.", "How do curricular goals guide the planning of assessment tasks?", "4.", "Prepare a rubric on any topic of your interest from of TWAU curricular", "area."]}, {"heading": "8.6 FORMATIVE AND SUMMATIVE ASSESSMENT, FORMAL, INFORMAL AND", "parts": ["360°ASSESSMENT Formative and summative assessments are two complementary approaches to understanding student learning.", "Formative assessment is ongoing and embedded within the teaching-learning process, helping teachers to continuously monitor progress and provide timely feedback for improvement.", "In contrast, summative assessment takes place at the end of a term or unit, aiming to evaluate the extent of learning achieved against the set objectives.", "Alongside these, assessment can be formal or informal in nature.", "Formal assessment is structured, planned, and often includes tools like tests, assignments, and rubrics, whereas informal assessment is spontaneous and occurs naturally during classroom interactions, such as through observation or casual questioning.", "Another comprehensive approach is 360° assessment, which involves multiple perspectives—teachers, peers, self, and even parents—to build a holistic understanding of a child’s development across academic and non-academic domains.", "Together, these forms of assessment support a more balanced, inclusive, and child-centric evaluation system."]}, {"heading": "8.6.1 Formative Assessment", "parts": ["Formative assessment is an integral part of the teaching-learning process that helps both teachers and learners identify learning progress and gaps in real time.", "It is not a separate or final evaluation, but a continuous and dynamic process that is embedded in everyday classroom practices.", "Unlike summative assessment, which evaluates learning at the end of a term, formative assessment occurs during the process of learning and aims to support and enhance learning rather than merely measure it.", "Purpose of Formative Assessment The key purpose of formative assessment is to:", "· Monitor student learning regularly.", "· Provide immediate and constructive feedback.", "· Identify students’ strengths and areas needing improvement.", "· Adjust teaching strategies to meet learners’ diverse needs.", "· Promote student involvement and self-assessment.", "Key Characteristics", "· Continuous: It happens throughout the learning journey.", "· Diagnostic: It helps identify what students have understood and what", "needs reinforcement.", "· Interactive: Encourages dialogue between the teacher and the learner.", "· Flexible and Informal: Often embedded in classroom activities,", "without high pressure or formal structure.", "Methods and Tools of Formative Assessment Formative assessment can take various forms depending on the context and subject.", "Some commonly used methods include:", "· Observation: Teachers observe students’ participation, behavior, and", "interaction during lessons, group work, and activities.", "· Oral questioning: Asking open-ended or probing questions to assess", "understanding and stimulate thinking.", "· Worksheets and activities: Short tasks, games, or exercises that test", "comprehension of concepts.", "· Peer and self-assessment: Students assess each other’s or their own", "work using simple rubrics or checklists, encouraging reflection.", "· Exit slips: Asking students to write one thing that they have learned", "or one question they need to ask about a lesson on topic before leaving class.", "· Learning journals: Children write or draw what they’ve learned,", "helping teachers gauge understanding in a personalized way.", "UNIT - 8", "· Use of portfolios: Collecting a series of students’ work over time to", "track progress and effort.", "Role of the Teacher Teachers play a central role in formative assessment.", "They:", "· Plan activities that allow observation and feedback.", "· Provide specific, timely, and constructive feedback.", "· Use assessment insights to adapt instruction for individual learners.", "· Encourage students to reflect on their learning process.", "Benefits of Formative Assessment", "· Makes learning more inclusive and child-centric.", "· Builds a growth mindset and reduces exam-related anxiety.", "· Encourages active participation and deeper engagement.", "· Fosters critical thinking, communication, and collaboration.", "· Helps maintain a comprehensive record of learner development over", "time.", "Formative Assessment in NEP 2020 and NCF-SE 2023 Both NEP 2020 and NCF-SE 2023 emphasize the importance of formative assessment as a means of making learning more meaningful and aligned with competency-based education.", "The focus is on assessment for learning, not merely assessment of learning.", "Teachers are encouraged to assess students in ways that support their curiosity, creativity, problem-solving ability, and emotional well-being.", "Formative Assessment Instance: “Exploring Local Water Sources” (TWAU) Objective: Learners investigate a local pond or river, observe water quality and organisms, and present findings to their classmates.", "Activity Design and Curricular Alignment", "This multidisciplinary activity aligns with TWAU curricular goals in environmental awareness—and taps into competencies like observation, reasoning, communication, and community engagement .", "Activities include guided questions (“What lives in water?”, “Is the water clean?”), sketching water-dwellers, and group discussions, weaving together scientific inquiry, language skills, and ethical habits.", "Rubric-Based Observation Rubric-Based Assessment Using the Holistic Progress Card (Abilities and Levels) Holistic Progress Card: The Holistic Progress Card (HPC) is a comprehensive and child-centric assessment tool that captures a learner’s growth across multiple domains—Physical, socio-emotional, cognitive, language and literacy, aesthetic and cultural development.", "It moves beyond marks to focus on core abilities such as awareness, sensitivity, and creativity .", "These abilities are assessed using a rubric-based approach, where each ability is mapped against three performance levels—Beginner, Proficient, and Advanced.", "This creates a 3×3 matrix that helps teachers observe, record, and report a child’s progress in a more structured, descriptive, and meaningful way.", "Aligned with NEP 2020 and NCF-SE 2023, the HPC supports reflective learning and holistic development through continuous, competency-based assessment.", "1.", "Awareness (Observational skills, connection to concepts)", "· Beginner: Identifies basic features (e.g., “There is water and some", "animals”)", "· Proficient: Observes details, names living beings, and shares simple", "connections (e.g., “Frogs live here because it is wet”)", "· Advanced: Explains interdependence, poses questions, and connects", "to prior learning (e.g., “If people throw garbage, animals here can fall sick.", "I remember we studied this in class.”)", "2.", "Sensitivity (Empathy and care for the environment)", "· Beginner: Needs prompting to respond to environmental issues", "· Proficient: Shows concern and suggests basic actions (e.g., “We", "should not dirty water”)", "· Advanced: Expresses empathy and offers thoughtful, actionable ideas", "(e.g., “We should keep dustbins near the pond and stop using soap there”)", "3.", "Creativity (Original expression, solutions, representation)", "· Beginner: Describes or draws common features in expected ways", "· Proficient: Adds personal ideas or tries a different mode of expression", "(e.g., story, song, or role-play)", "· Advanced: Presents unique insights or innovative ideas (e.g., “What if", "we design a fish-friendly water filter?”) UNIT - 8 Rich Documentation and Triangulation The teacher documents observations during fieldwork, records student reflections (e.g., “I worried about the fish”), and gathers brief peer/parent input (“My friend helped me recognize bugs in water”).", "This creates a holistic snapshot in Part B of the HPC, blending teacher, self, peer, and parent voices .", "Self- and Peer-Assessment After the visit, learners complete simple smiley-based checklists (e.g., “I helped, I asked questions, I cared for animals, I liked working together”).", "A peer also offers feedback (“They shared their sketch and helped me identify insects”) .", "This reflection fosters metacognition, belonging, and growth.", "Formative Feedback and Next Steps The teacher uses observations and rubric ratings to offer targeted feedback:", "“You asked thoughtful questions— next you might suggest a way to clean water,” and plans follow-up lessons e.g., brainstorming community action.", "This example illustrates a cohesive formative process: from planning a meaningful TWAU activity to using HPC rubrics for multidimensional assessment, integrating documentation and stakeholder feedback, and using insights for further learning."]}, {"heading": "8.6.2 Summative Assessment", "parts": ["Summative assessment is a comprehensive evaluation conducted at the end of a defined instructional period—such as a unit, term, or academic year—to determine how well students have achieved the intended learning outcomes.", "It is assessment of learning, where the focus is on measuring the level of knowledge, understanding, and skills attained by the learner after the completion of teaching.", "Purpose of Summative Assessment The primary objectives of summative assessment are:", "· To evaluate students’ cumulative learning over time.", "· To determine if the learning outcomes and competencies have been", "achieved.", "· To provide information for reporting progress to stakeholders like", "parents, school authorities, and policymakers.", "· To support decisions related to promotion, certification, or future", "learning pathways.", "Key Characteristics", "· Periodic and structured: Conducted at specific intervals, often at the", "end of a term or academic session.", "· Outcome-based: Focused on evaluating what students have learned", "rather than how they have learned.", "· Formal in nature: Uses standardized tools and scoring methods.", "· High-stakes: Often carries significant weight in grading and reporting.", "Methods and Tools of Summative Assessment Summative assessments typically include formal testing methods but can be diversified for a more holistic approach.", "Common tools and formats include:", "· Written tests: Objective or descriptive question papers designed", "around the curriculum and learning outcomes.", "· Performance tasks: Assignments or projects that require the", "application of concepts in real-life or interdisciplinary contexts.", "· Oral examinations: For language or conceptual understanding", "through interviews or verbal presentations.", "· Portfolios and final project reviews: Used to assess cumulative work,", "creativity, and development.", "· Standardized tests: Used by systems for broader comparisons across", "schools or regions.", "Role of the Teacher Teachers are responsible for:", "· Designing fair and inclusive assessments aligned with learning", "outcomes and grade-level competencies.", "· Ensuring assessments are age-appropriate and stress-free, especially at", "the primary stage.", "· Analyzing results to understand learning trends and modify future", "instruction accordingly.", "· Communicating results clearly to parents and students with suggestions", "for improvement.", "Benefits of Summative Assessment", "· Provides a clear snapshot of a student’s progress at the end of a", "learning cycle.", "UNIT - 8", "· Helps in curriculum planning by highlighting strengths and areas for", "improvement.", "· Encourages goal-setting among students when feedback is used", "constructively.", "· Acts as a formal record of student performance for future references.", "Summative Assessment in NEP 2020 and NCF-SE 2023 NEP 2020 and NCF-SE 2023 advocate for a shift in summative assessment from rote-based testing to tools that measure competencies, application, and higher-order thinking skills.", "Summative assessments should be developmentally appropriate, reduce undue stress, and ensure that students are assessed on what they understand and can do, and not just on what they can recall.", "There is also a recommendation to include portfolios and performance-based tasks alongside traditional tests."]}, {"heading": "8.6.3 Difference between Formative and Summative Assessment", "parts": ["Aspect Formative Assessment Summative Assess - ment Purpose To support and improve learning during the process To evaluate learning at the end of a unit or term Timing Ongoing and continuous Conducted periodically (e.g., end of term) Nature Diagnostic and develop - mental Evaluative and judg- mental Focus Learning progress and pro- cess Final outcomes and achievement Tools/Methods Observations, quizzes, peer/ self-assessment, oral ques- tions, journals Tests, exams, final proj- ects, standardized as- sessments Feedback Immediate, specific, and constructive Usually delayed, often in the form of grades or marks Stress Level Low-pressure, supportive Often high-stakes, linked to grading or pro- motion Learner Involve- ment High – encourages reflection and self-assessment Limited – typically teacher-directed Use To modify teaching strate - gies and guide student learn- ing To report achievement to stakeholders (parents, schools) Relation to Learning Assessment for learning Assessment of learning NEP 2020 Em- phasis Strongly encouraged for competency-based learning Recommended to be reformed to align with learning outcomes"]}, {"heading": "8.6.4 Formal Assessment", "parts": ["Formal assessment refers to a planned, systematic, and structured process of evaluating student learning using predefined tools, criteria, and standards.", "These assessments are designed in advance and are administered under set conditions to ensure consistency and objectivity.", "In primary classrooms, formal assessments are used not only for grading but also to guide instruction, identify learning needs, and inform stakeholders about a student’s progress.", "Purpose of Formal Assessment", "· To measure specific learning outcomes and competencies.", "· To evaluate the effectiveness of instructional strategies.", "· To provide standardized data for reporting and analysis.", "· To support decision-making related to student progression and", "curriculum planning.", "Key Characteristics", "· Planned and scheduled: Conducted at specific intervals during the", "academic year.", "· Tool-based: Uses instruments such as tests, checklists, rubrics, and", "worksheets.", "· Objective and structured: Based on clearly defined criteria, often", "scored uniformly.", "· Recordable and reportable: Results are documented for parents,", "schools, and systems.", "Common Forms of Formal Assessment", "· Written tests: Including multiple-choice, short-answer, and long-", "answer questions.", "· Oral examinations: Structured question-and-answer sessions to", "assess verbal understanding.", "UNIT - 8", "· Assignments and homework: Regular tasks to evaluate application", "and comprehension.", "· Performance assessments: Tasks or activities judged using rubrics.", "· Standardized tests: Uniform assessments administered across schools", "or regions.", "Role of the Teacher Teachers are responsible for:", "· Designing assessments that align with grade-specific learning", "outcomes and competencies.", "· Ensuring that tools are age-appropriate and culturally relevant.", "· Using assessment data to diagnose learning gaps and adjust instruction", "accordingly.", "· Reporting results meaningfully to parents and administrators."]}, {"heading": "8.6.5 Informal Assessment", "parts": ["Informal assessment refers to the spontaneous, flexible, and ongoing observation-based methods of evaluating a child’s learning, behavior, and development.", "It is embedded in daily classroom activities and interactions, without the use of structured testing tools or formal settings.", "Informal assessment is child-friendly and stress-free, and it helps teachers gain rich insights into how children learn, think, and express themselves.", "Purpose of Informal Assessment", "· To understand children’s learning styles, pace, and preferences", "· To gather real-time information about children’s conceptual", "understanding", "· To identify strengths, interests, and learning gaps without pressure", "· To make instructional decisions and provide timely support", "· To foster a joyful and responsive learning environment", "Key Characteristics", "· Non-threatening: It does not involve marks, ranks, or pressure.", "· Flexible and contextual: Conducted during routine classroom", "activities and interactions.", "· Narrative and descriptive: Often involves observations and notes", "instead of scores.", "· Holistic: Captures cognitive, emotional, social, and physical aspects", "of learning.", "· Child-centric: Adapts to the child’s pace and developmental stage.", "Common Strategies of Informal Assessment", "· Anecdotal records: Short notes on observed behaviors or responses.", "· Classroom interactions: Listening to children during discussions and", "group work.", "· Learning conversations: Informal dialogue between teacher and", "student about a topic.", "· Games and play: Observing how children apply concepts through", "play-based activities.", "· Work samples: Reviewing drawings, writings, models, or other", "creations.", "· Daily routines: Observing how children follow instructions or take", "responsibility in class.", "· Peer interactions: Understanding collaborative skills, empathy, and", "social development.", "Role of the Teacher Teachers play a vital role by:", "· Being keen observers and active listeners.", "· Noticing patterns in children’s behavior, responses, and choices.", "· Interpreting observations to adapt teaching to children’s needs.", "· Creating a safe, inclusive environment where every child feels seen", "and valued.", "· Using informal insights to complement formal assessment records."]}, {"heading": "8.6.6 Difference between Formal and Informal Assessment", "parts": ["Aspect Formal Assessment Informal Assessment Purpose To evaluate learning using structured tools and criteria To understand learning through observation and interaction Nature Structured, planned, and systematic Flexible, spontaneous, and continuous UNIT - 8 Aspect Formal Assessment Informal Assessment Setting Conducted in a formal setting (e.g., tests, exams) Embedded in daily classroom activities and routines Tools/ Methods Tests, written exams, standardized assessments, rubrics Observations, anecdotal records, conversations, play- based tasks Feedback Often delayed, in the form of grades or scores Immediate, descriptive, and personalized Stress Level Can create pressure or anxiety for learners Stress-free and child-friendly Use For reporting, certification, and grading For understanding and supporting learning Data Type Usually quantitative (scores, marks) Mostly qualitative (narratives, notes) Child Involvement Less active; often passive recipients of assessment Highly active; observed in natural learning situations Examples Periodic written tests, oral exams, summative assessments Observing play, listening to discussions, collecting work samples Alignment with NEP/ NCF Encouraged to be reformed to be more competency-based Strongly promoted for early and primary years to support holistic learning"]}, {"heading": "8.6.7 360° Assessment", "parts": ["The 360° assessment represents a comprehensive and multi-dimensional approach to understanding student learning, development, and progress.", "It shifts the focus from marks and grades to capturing the overall growth of children, including cognitive, emotional, social, and physical aspects.", "NEP 2020 and NCF-SE 2023 strongly advocate 360° assessment as a way to make education more holistic, learner-centric, and inclusive, particularly from the early years through the preparatory stage."]}, {"heading": "8.6.7.1 360° Holistic Assessment", "parts": ["360° holistic assessment refers to assessing a child from multiple dimensions and perspectives.", "This includes not just academic achievement but also values, life skills, peer relationships, creativity, participation, and emotional well-being.", "It involves inputs from teachers, parents, peers, and the children themselves.", "For “The World Around Us (TWAU)”, such an approach is crucial as it reflects the interconnectedness of knowledge and skills—understanding nature, community, environment, and human relationships, all of which require observation beyond just academic tasks."]}, {"heading": "8.6.7.2 360° Feedbacks for Continuous Learning", "parts": ["The 360-degree assessment, as envisioned in PARAKH’s Holistic Progress Card (HPC) and aligned with the NCF 2022 and NCF-SE 2023, is a child- centric, competency-based approach that captures the multidimensional growth of each learner.", "It involves comprehensive feedback from teachers, peers, parents, and learners themselves to assess cognitive, social, emotional, physical, and creative development.", "Moving beyond marks, this assessment emphasizes continuous, formative, and qualitative evaluation through observations, portfolios, projects, and rubric-based performance indicators.", "Rooted in the philosophy of “assessment for and as learning,” it encourages self-reflection, peer interaction, and active engagement from all stakeholders.", "The HPC serves as a structured record of progress, highlighting competencies through descriptive indicators and contextual learning experiences such as toy- based, art-integrated, and experiential activities.", "By promoting transparency, inclusivity, and personalized feedback, 360-degree assessment fosters holistic development and supports the creation of an equitable, joyful, and meaningful learning environment.", "· Teacher feedback focuses on competencies, effort, creativity, and areas", "of improvement.", "· Peer feedback encourages collaboration and social learning.", "· Self-assessment fosters reflection and ownership.", "· Parental feedback adds a home perspective to the learning process.", "This cycle of feedback supports continuous learning by helping children understand their progress and set goals in a non-threatening way."]}, {"heading": "8.6.7.3 Paradigm Shift in Conventional Practices", "parts": ["The adoption of 360° assessment marks a paradigm shift from conventional examination practices that rely heavily on rote memorization and standardized testing.", "Traditional assessments often focused solely on scholastic achievement, ignoring co-scholastic areas, creativity, and emotional development.", "In conventional practices, the responsibility of assessment rested solely with the teacher, who independently decided how and when to assess a child, without involving other perspectives or stakeholders in the process.", "UNIT - 8 The new approach:", "· Values process over product", "· Recognizes multiple intelligences and diverse ways of learning", "· Emphasizes competency-based learning rather than syllabus", "completion", "· Shifts from a report card to a progress card—descriptive, child-", "centric, and inclusive This change aligns with the goals of NEP 2020 to make learning more meaningful and learner-driven."]}, {"heading": "8.6.7.4 Holistic Progress Card of TWAU", "parts": ["The Holistic Progress Card (HPC) for TWAU is a tool that records children’s development across multiple domains.", "It:", "· Captures both scholastic and co-scholastic areas.", "· Reflects progress in environmental awareness, critical thinking,", "observation skills, and values developed through TWAU.", "· Uses descriptive indicators and visuals (e.g., symbols, colours,", "learner portfolios).", "· Includes feedback from all key stakeholders—teachers, peers,", "parents, and children.", "· Tracks progress over time, not just performance in one instance.", "Why the Holistic Progress Card is Important", "· The Holistic Progress Card (HPC) offers a comprehensive and child-", "centric way to assess students beyond just academic performance.", "· It tracks learners’ growth across cognitive, emotional, social, physical,", "and creative domains, capturing the full range of their development.", "· HPC serves as a powerful tool for formative assessment, enabling", "teachers to monitor student progress regularly and adjust instruction accordingly.", "· It supports 360-degree assessment by incorporating feedback from", "teachers, peers, parents, and the learners themselves, providing a well-rounded view.", "· The card emphasizes qualitative assessment, using descriptive,", "rubric-based feedback rather than marks or grades.", "· HPC helps assess not only what a student has learned but also how", "they learn, including their thinking processes, curiosity, collaboration, and behavior.", "· It encourages self-assessment and reflection, promoting learner", "agency and responsibility.", "· The process strengthens school-home partnerships by involving", "parents as co-assessors and observers of their child’s growth.", "· It ensures inclusive and equitable evaluation, recognizing diverse", "abilities, interests, and learning styles.", "· By regularly documenting progress, the HPC helps in identifying", "individual learning needs and support areas in a timely manner.", "· It promotes a joyful and meaningful learning experience , aligning", "with the vision of NEP 2020, NCF 2022, and NCF-SE 2023.", "· Overall, the HPC nurtures well-rounded individuals and supports the", "development of lifelong learners.", "The HPC ensures that learning in TWAU is visible, celebrated, and supported in a holistic and non-comparative manner."]}, {"heading": "8.6.7.5 Role of the Teacher in Preparing a Holistic Progress Card for TWAU", "parts": ["Teachers play a central role in creating meaningful and authentic holistic progress cards.", "Their responsibilities include:", "· Observing students in natural settings—classroom activities, group", "work, discussions, play.", "· Documenting progress in learning outcomes related to TWAU", "competencies (e.g., environmental sensitivity, questioning, critical thinking).", "· Engaging parents and students in the assessment process.", "· Using varied assessment tools like portfolios, anecdotal records, rubrics,", "and checklists.", "· Writing child-friendly, descriptive feedback that celebrates", "uniqueness and gives direction for further growth.", "· Ensuring inclusivity and fairness, recognizing diverse learning styles", "and socio-cultural backgrounds.", "By preparing such cards, teachers become facilitators of learning rather than evaluators, and children are seen as learners in progress, not performers in exams.", "UNIT - 8", "CHECK YOUR PROGRESS 8.4", "1.", "What does 360-degree assessment include, and who are the stakeholders", "involved?", "2.", "How does the Holistic Progress Card (HPC) support inclusive and formative", "assessment?", "3.", "Explain the role of self- and peer-assessment in promoting reflective", "learning.", "4.", "List three types of feedback involved in HPC documentation.", "5.", "In what ways does the teacher support the preparation of the HPC in TWAU?"]}, {"heading": "8.7 QUALITATIVE ASSESSMENT", "parts": []}, {"heading": "8.7.1 Meaning", "parts": ["Qualitative assessment is a non-quantitative method of evaluating children’s learning and development.", "Unlike conventional assessments that rely on numerical scores, qualitative assessment emphasizes narrative, interpretative, and holistic observations of children’s learning processes, behavior, interests, and values.", "It allows educators to gain insights into the how and why of children’s learning, not just what they have learned.", "In the context of The World Around Us (TWAU), this becomes especially meaningful.", "TWAU deals with real-life experiences , environmental awareness, social relationships, and empathy—all of which are better captured through descriptive and contextual assessments."]}, {"heading": "8.7.2 Characteristics of Qualitative Assessment", "parts": ["1.", "Descriptive and Narrative-Based: Emphasizes written observations and", "feedback rather than grades or scores", "2.", "Child-Centric: Focuses on individual learning journeys, interests, and", "pace rather than comparative performance", "3.", "Contextual and Situational: Occurs in authentic learning situations like", "nature walks, class discussions, or community visits", "4.", "Process-Oriented: Recognizes the value of learning processes—how", "children engage, explore, question, and reflect", "5.", "Flexible and Adaptive: Allows teachers to modify tools and strategies", "according to children’s responses and learning styles", "6.", "Supports Reflective Teaching: Encourages teachers to reflect on their", "instructional strategies and make informed decisions", "7.", "Inclusive and Equitable: Embraces diversity in children’s language,", "background, expression, and interests"]}, {"heading": "8.7.3 Qualitative Assessment Tools for TWAU", "parts": []}, {"heading": "8.7.3.1 Interview", "parts": ["· Interviews can be used to understand children’s thinking and", "reasoning—for example, asking a child why they think trees are important, or what they observed during a nature walk.", "· It can be conducted one-on-one or in small groups, and often reveals", "personal experiences and values."]}, {"heading": "8.7.3.2 Observation", "parts": ["· Teachers observe children during activities like planting saplings, role-", "playing a community helper, or drawing their neighbourhood.", "· These observations are documented through anecdotal records", "or checklists, focusing on skills like cooperation, curiosity, and responsibility."]}, {"heading": "8.7.3.3 Composition and Expression", "parts": ["· At the primary stage, children can maintain drawing journals or", "picture diaries along with simple written reflections.", "· This helps teachers assess emerging environmental awareness,", "emotional responses, and moral development."]}, {"heading": "8.7.3.4 Portfolio", "parts": ["· A portfolio is a curated collection of a child’s work—photos, artwork,", "observations, projects, and writings.", "· It showcases growth over time and helps identify patterns in learning", "interests and strengths."]}, {"heading": "8.7.3.5 Project Work and Presentation", "parts": ["· Small group discussions encourage children to share ideas, express", "opinions, and listen to others.", "· It promotes collaborative learning and helps teachers assess", "communication, empathy, and perspective-taking.", "UNIT - 8"]}, {"heading": "8.7.4 Need of Qualitative Assessment", "parts": ["Qualitative assessment plays a vital role in capturing the full spectrum of a child’s development.", "It goes beyond written tests to include aspects like social interaction, environmental sensitivity, imagination, and moral growth— areas that are best explored through observation and dialogue.", "It supports competency-based learning by effectively assessing TWAU competencies such as questioning, observing, relating, and caring.", "Recognizing that each child learns differently, qualitative assessment respects individual differences without resorting to labelling or ranking.", "It nurtures essential lifelong learning skills like reflection, communication, problem-solving, and creativity.", "Furthermore, it strengthens the teacher-learner relationship through ongoing observation and personalized feedback, fostering trust and support.", "The insights gathered help teachers respond to learners’ needs, adapt instruction, and set meaningful goals.", "When shared with parents, qualitative records promote collaboration between home and school.", "In essence, qualitative assessment builds a classroom culture rooted in listening, observing, and understanding.", "It brings learning alive in The World Around Us by connecting knowledge with real-life experiences, values, and relationships, perfectly aligning with the vision of NEP 2020 for joyful, inclusive, and competency- based learning.", "CHECK YOUR PROGRESS 8.5", "1.", "Define qualitative assessment in your own words.", "2.", "Name any four tools used for qualitative assessment in the primary classes.", "3.", "How does qualitative assessment capture children’s emotional and social", "development?", "4.", "Why is it important to use interviews or reflective journals at the primary", "level?", "5.", "Give one reason why qualitative assessment aligns well with the goals of", "TWAU.", "Answers", "2.", "Anecdotal Records, Portfolio, Interview, Observation"]}, {"heading": "8.8 LET US SUM UP", "parts": ["This chapter provides a comprehensive understanding of assessment in early and primary education, emphasizing its integration with real-life learning, especially in the domain of “The World Around Us” (TWAU).", "Rooted in the vision of NEP 2020, NCF 2022, and NCF-SE 2023, the chapter promotes a shift from rote-based, exam-driven practices to competency-based, child-centric, and holistic assessment.", "It highlights that assessment is not separate from teaching, but an ongoing process woven into daily classroom interactions.", "Teachers play a key role as observers, facilitators, and recorders of learning, using tools like anecdotal records, portfolios, checklists, rubrics, and student work samples.", "The chapter classifies assessment by purpose (formative, summative, diagnostic), by nature (qualitative and quantitative), by domain (scholastic and co-scholastic), and by standard (criterion- or norm-referenced).", "The importance of formative and 360-degree assessment is emphasized, where feedback is drawn from teachers, peers, parents, and learners themselves.", "The chapter elaborates on the Holistic Progress Card (HPC) as a structured, descriptive, and inclusive tool to record learning progress.", "The teacher’s role in preparing HPCs is central, involving observation, documentation, interpretation, and communication of learning.", "It also underscores the relevance of qualitative assessment—focusing on processes, values, emotions, and creativity—which is especially suitable for evaluating the experiential and integrated learning of TWAU.", "Assessment strategies like interviews, group discussions, project work, and reflective journals are advocated to capture diverse learner abilities.", "The chapter concludes that assessment must be inclusive, age-appropriate, stress- free, and contextually meaningful, supporting learner agency, personalized learning, and continuous growth.", "This approach aligns with the NEP’s goal of developing thoughtful, competent, and future-ready learners."]}, {"heading": "8.9 END EXCERCISES", "parts": ["1.", "Explain the concept of assessment in the context of primary education.", "How has the approach to assessment changed under NEP 2020 and NCF- SE 2023?", "Illustrate your answer with examples from ‘The World Around Us’ (TWAU).", "2.", "Describe the types and tools of assessment discussed in the chapter.", "How", "can a teacher effectively use these tools in a preparatory classroom while teaching TWAU?", "3.", "What is 360-degree assessment?", "Discuss its importance and implementation", "in the preparation of the Holistic Progress Card (HPC) for TWAU.", "What roles do teachers, learners, parents, and peers play in this process?", "UNIT - 8", "4.", "What are the key curricular goals and competencies of TWAU at the", "preparatory stage?", "How are these translated into grade-specific learning outcomes and assessed through school-based activities?", "Give suitable examples.", "5.", "Define qualitative assessment.", "What are its characteristics and why is it", "especially relevant in the domain of TWAU?", "Describe any four tools used for qualitative assessment with examples."]}, {"heading": "8.10 REFERENCES", "parts": ["1.", "National Education Policy (NEP 2020)", "Ministry of Education.", "(2020).", "National Education Policy 2020.", "Government of India. https://www.education.gov.in/sites/upload_files/mhrd/files/NEP_Final_ English_0.pdf", "2.", "National Curriculum Framework for Foundational Stage (NCF-FS", "2022) NCERT.", "(2022).", "National Curriculum Framework for Foundational Stage", "2022.", "New Delhi: National Council of Educational Research and Training.", "https://ncert.nic.in/pdf/ncf/ncf_fs_english.pdf", "3.", "National Curriculum Framework for School Education (NCF-SE", "2023) NCERT.", "(2023).", "National Curriculum Framework for School Education", "2023.", "New Delhi: National Council of Educational Research and Training.", "https://ncert.nic.in/pdf/ncf/National_Curriculum_Framework_School_ Education_2023.pdf", "4.", "PARAKH – Performance Assessment, Review, and Analysis of", "Knowledge for Holistic Development NCERT.", "(2023).", "Assessment guidelines and frameworks by P ARAKH.", "New Delhi: National Council of Educational Research and Training.", "https://parakh.education.gov.in/", "5.", "CBSE Guidelines on Competency-Based Education", "Central Board of Secondary Education.", "(2020).", "Guidelines on Competency- Based Education (CBE). https://cbseacademic.nic.in/web_material/Circulars/2020/89_ Circular_2020.pdf", "6.", "Learning Assessment Framework by NCERT", "NCERT.", "(2021).", "Assessment and Learning: Framework for Students’ Assessment in School Education.", "New Delhi: NCERT.", "https://ncert.nic.in/pdf/announcement/Learning_Assessment_Framework. pdf", "7.", "Holistic Progress Card – Concept Note", "Ministry of Education.", "(2021).", "Holistic Progress Card for Foundational Stage – Concept Note under NIPUN Bharat.", "https://dsel.education.gov.in/sites/default/files/HPC_ConceptNote.pdf"]}];
const C=SECTIONS;let si=0,pi=0,playing=false,synth=speechSynthesis;
const $=x=>document.getElementById(x);
function voices(){let lang=$("lang").value,s=$("voice");s.innerHTML="";let v=speechSynthesis.getVoices().filter(x=>x.lang?.toLowerCase().startsWith(lang.toLowerCase()));if(!v.length)v=speechSynthesis.getVoices().filter(x=>/^en-/i.test(x.lang||""));v.sort((a,b)=>((/india|rishi|veena|heera|hemant|kalpana|ravi|neerja|prabhat|aditi|raveena|lekha/i.test(a.name)?0:1)-(/india|rishi|veena|heera|hemant|kalpana|ravi|neerja|prabhat|aditi|raveena|lekha/i.test(b.name)?0:1)));v.forEach(x=>{let o=document.createElement("option");o.value=x.name;o.textContent=x.name+" — "+x.lang;s.appendChild(o)})}
function render(){let r=$("content");C.forEach((s,i)=>{let c=document.createElement("section");c.className="card";c.id="s"+i;c.innerHTML="<h2>"+esc(s.heading)+'</h2><button class="listen">🔊 Listen to this section</button><div class="body"></div>';c.querySelector("button").onclick=()=>start(i,0);let b=c.querySelector(".body");s.parts.forEach((p,j)=>{let z=document.createElement("span");z.className="sentence";z.textContent=p+" ";z.onclick=()=>start(i,j);b.appendChild(z)});r.appendChild(c)})}
function esc(x){return x.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function progress(){let total=C.reduce((a,s)=>a+s.parts.length,0),done=C.slice(0,si).reduce((a,s)=>a+s.parts.length,0)+pi;$("bar").style.width=Math.min(100,100*done/Math.max(1,total))+"%"}
function start(i,j){synth.cancel();document.querySelectorAll(".active").forEach(x=>x.classList.remove("active"));si=i;pi=j;playing=true;progress();let z=document.querySelector("#s"+i+" .body").children[j];if(!z)return;z.classList.add("active");z.scrollIntoView({behavior:"smooth",block:"center"});let u=new SpeechSynthesisUtterance(C[i].parts[j]);u.rate=+$("speed").value;u.lang=$("lang").value;let v=[...synth.getVoices()].find(x=>x.name===$("voice").value);if(v)u.voice=v;u.onstart=()=>{$("status").textContent="Reading: "+C[i].heading};u.onend=()=>{z.classList.remove("active");if(playing){if(j+1<C[i].parts.length)start(i,j+1);else if(i+1<C.length)start(i+1,0);else{playing=false;progress();$("status").textContent="Finished"}}};synth.speak(u)}
$("play").onclick=()=>{if(synth.paused){synth.resume();playing=true}else if(synth.speaking){synth.pause();$("status").textContent="Paused"}else start(si,pi)};
$("stop").onclick=()=>{playing=false;synth.cancel();document.querySelectorAll(".active").forEach(x=>x.classList.remove("active"));$("status").textContent="Stopped";progress()};
$("prev").onclick=()=>start(Math.max(0,si-1),0);$("next").onclick=()=>start(Math.min(C.length-1,si+1),0);
$("lang").onchange=()=>{synth.cancel();playing=false;voices()};$("theme").onclick=()=>{document.body.classList.toggle("dark");$("theme").textContent=document.body.classList.contains("dark")?"☀ Light":"☾ Dark"};
synth.onvoiceschanged=voices;render();voices();progress();
</script></body></html>
