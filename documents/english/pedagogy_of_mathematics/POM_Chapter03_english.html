<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mathematical Communication – Audio Chapter</title>
<style>
:root{--bg:#f3f4fa;--ink:#1d2340;--mute:#5b6288;--card:#fff;--line:#d5d8ea;--ac:#2b3990;--hi:#ffe9a8}
@media (prefers-color-scheme:dark){:root{--bg:#141833;--ink:#e9ebf8;--mute:#a3a9cf;--card:#1d2245;--line:#343a70;--ac:#8f9dff;--hi:#4a3f14}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.7 Georgia,"Times New Roman",serif}
header{padding:28px 20px 10px;max-width:760px;margin:auto}
header small{color:var(--mute);font:14px system-ui,sans-serif}
h1{margin:4px 0 0;font-size:2rem;color:var(--ac)}
.bar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
.bar div{max-width:760px;margin:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font:14px system-ui,sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--ac);background:var(--card);color:var(--ac);cursor:pointer;max-width:100%}
button.main{background:var(--ac);color:var(--card)}
button:focus-visible,select:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
#prog{flex:1 1 100%;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
#prog i{display:block;height:100%;width:0;background:var(--ac)}
#now{flex:1 1 100%;color:var(--mute)}
main{max-width:760px;margin:auto;padding:10px 20px 60px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 22px 14px;margin:18px 0}
h2{font-size:1.25rem;color:var(--ac);display:flex;justify-content:space-between;gap:10px;align-items:center}
h2 button{font-size:13px;padding:4px 10px;flex:none}
p{margin:.7em 0}
.s{cursor:pointer;border-radius:3px}
.s:hover{text-decoration:underline dotted}
.s.on{background:var(--hi)}
.note{color:var(--mute);font:14px system-ui,sans-serif;padding:0 20px;max-width:760px;margin:auto}
</style>
</head>
<body>
<header><small>Pedagogy of Mathematics · Unit 1 · Chapter 3</small><h1>Mathematical Communication</h1></header>
<div class="bar"><div>
<button class="main" id="play">Play</button>
<button id="stop">Stop</button>
<button id="prev" aria-label="Previous section">Prev section</button>
<button id="next" aria-label="Next section">Next section</button>
<label>Speed <select id="rate"><option value="0.8">0.8x</option><option value="0.9" selected>0.9x</option><option value="1">1x</option><option value="1.2">1.2x</option><option value="1.5">1.5x</option></select></label>
<label>Language <select id="lang"><option value="en-IN" selected>English (India)</option><option value="en-GB">English (UK)</option><option value="en-US">English (US)</option></select></label>
<label>Voice <select id="voice"></select></label>
<div id="prog"><i></i></div>
<span id="now">Press Play to listen from the start, or tap any sentence or section button. Language is set to English (India); you can change it above.</span>
</div></div>
<p class="note" id="warn" hidden></p>
<main id="doc"></main>
<script>
const C=[{"t": "3.1 Introduction", "p": ["This chapter equips you with the essential knowledge and practical strategies for teaching fundamental mathematical concepts to children at the foundational and preparatory stages. In their early years, children are naturally curious explorers, constantly interacting with numbers, shapes, and patterns. The chapter covers two crucial areas: Data Handling, and Visualisation and Spatial Thinking.", "We explore how to make these concepts accessible and engaging, connecting abstract ideas to concrete experiences, and the importance of developing precise mathematical vocabulary."]}, {"t": "3.2 Learning Outcomes", "p": ["After completing the chapter, the learner explains the concept of data and its relevance to daily experiences, and guides children in sorting, classifying, and representing data using pictographs and tally marks.", "The learner also uses appropriate data-handling vocabulary, articulates the importance of visualisation and spatial thinking, integrates spatial vocabulary into daily classroom routines, and applies these strategies to strengthen mathematical communication."]}, {"t": "3.3 Data Handling", "p": ["Data handling cultivates logical thinking and problem-solving by encouraging young learners to observe, categorise, and interpret information from their surroundings. It strengthens counting, number recognition, and mathematical vocabulary, and prepares children for more complex statistical reasoning."]}, {"t": "3.3.1 What is Data?", "p": ["Children constantly interact with information without realising it, like counting pencils in their bags. Begin a lesson with questions such as: What is your favourite fruit? How many pencils do you have in your bag? How do you travel to school: by bus, on foot, or by bicycle?", "Ask all students who like mangoes to raise their hands, then do the same for bananas and apples. Count the raised hands and record the results on the board, using pictures or tally marks. Students begin to understand that the information we collect is called data.", "Data is a collection of facts, figures, or observations that help us answer questions or understand patterns. It helps children answer questions such as: Which fruit is most favoured? What is the difference between the number of children who like mangoes and those who like apples? By asking a question and collecting responses, children are conducting an inquiry. Figure 3.1 shows informal data collection: counting mangoes in a basket, asking friends about favourite colours, counting boys and girls in class, and recording modes of transport.", "Encourage reflection by asking: What have you just done? Did you ask a question? Did you collect the responses? Did you record the numbers? Think and reflect: is asking, How many children like mangoes, a valid data question?", "Pedagogical tips. Ask questions like, let us find out how many learners like mangoes. Make a tally chart or draw pictures. Involve learners in collecting the information. Ask about pets, food habits, or favourite cartoon characters."]}, {"t": "3.3.2 Sorting and Classifying", "p": ["Sorting and classifying are fundamental precursors to data management. Children naturally sort when they organise crayons by colour, toys into containers, or buttons by size or shape.", "Give students real-life items such as buttons, leaves, or shells, and ask them to categorise these by an attribute like colour, size, or shape. Ask: What groups have you made? How many items are in each group? A student might say, I have five large leaves and three small ones. Sorting means organising similar items together, while classifying means grouping objects based on common characteristics such as colour, shape, size, or texture.", "Give everyday examples: fruits organised into different bowls, clothes sorted for washing by colour, books arranged by subject, and leaves gathered in a park and categorised by shape or size.", "Pedagogical tips. Use real objects like buttons, leaves, pebbles, and bottle caps. Ask: Can you create a group that includes all the red objects? Which of these are round? Let children explain their grouping, which develops reasoning and communication."]}, {"t": "3.3.3 Representation of Data", "p": ["Presenting collected information clearly, so that others can read and compare it, is called data representation. It progresses from concrete objects to pictorial and symbolic forms, including tally marks and simple tables.", "First, early representations. Children collect erasers of various colours, categorise them by colour, and arrange them in rows on a table. By observing these groups, they can identify which colours are most and least common. This is their first experience of data representation, without any numbers or symbols. After seeing three green erasers and seven pink ones side by side, they can conclude that more children have pink erasers.", "Second, pictographs. Each picture represents a single object or unit. If four children prefer the swing, the teacher draws four swings on the board. Pictographs are engaging, especially for young children who connect better with images than with abstract numbers.", "Third, tally marks. Each item is a short vertical line, and after every four lines, a fifth line is drawn diagonally across them to make a bundle of five. Four lines equal four. A bundle of five plus one line equals six. In the practice table, children write the number of fruits shown by tally marks for mango, banana, and apple."]}, {"t": "3.3.4 Reading and Interpreting Data", "p": ["Representation alone is insufficient; children must interpret data, question it, and form conclusions. From a tally chart, ask: Which fruit is the most liked? How many children selected apples? Which fruit is the least favoured?", "Consider a pictograph of favourite fruits: apple four, banana two, mango three. Which fruit is liked by the most children? Apple, as it has four images. Which is liked by the least? Banana, only two children. How many children were asked in total? Four plus two plus three equals nine. How many more children like apples than bananas? Four minus two equals two.", "Now a table of books read in a week: Anu three, Ravi five, Seema two, Arjun four. Who read the most books? Ravi, five. Who read the least? Seema, two. How many did Anu and Arjun read together? Three plus four equals seven. What is the total? Three plus five plus two plus four equals fourteen.", "Another pictograph shows fruits eaten: apples four, bananas three, mangoes two, oranges five. The most eaten is orange, the least is mango, four students ate apples, and three more oranges than mangoes were eaten.", "Students can also collect data on favourite fruits in their own class, and build their own pictograph or table, such as Favourite Ice Cream Flavours, and frame three questions about it. Children then begin to ask: How can we determine which option is greater or lesser? Can we find answers just by looking at the chart?", "Pedagogical tips. Use real-life contexts such as classroom data, favourite foods, and birthday months. Use simple visuals on a blackboard or chart paper. Ask open-ended questions like, What do you notice? What is the difference between? Let children create and interpret their own charts."]}, {"t": "3.3.5 Mathematical Vocabulary in Use", "p": ["Mathematical vocabulary is the set of specific words children use to describe numbers, quantities, shapes, patterns, and data. A strong vocabulary helps children understand instructions, take part in discussions, and express their thinking with clarity. Early exposure within meaningful contexts boosts their confidence in justifying their reasoning.", "Key terms: More means greater in quantity, as in, Rani has more pencils than Ravi. Less means smaller in quantity. Most is the largest quantity, as in, most children like mangoes. Least is the smallest quantity. Equal means same in number, as in, both jars have an equal number of marbles. Group is a collection of items. Total is the sum or complete amount. Count means find the number of items. Data is information collected. Same means exactly alike in number or type. Different means not the same.", "Integrate these terms into classroom interactions. During a fruit survey, say: Let us count the total number of children who like bananas. Which fruit is the most liked? Do any fruits have an equal quantity of likes?", "Pedagogical tips. Pair spoken language with real objects. Encourage children to talk about their observations, for example, Which group has more? Are these equal? Reinforce vocabulary through games, stories, songs, flashcards, and posters. Create a math word wall in the classroom."]}, {"t": "Check Your Progress 3.1 and Activity 3.1", "p": ["Check your progress 3.1. One, how would you explain what data is to young children? Two, describe two engaging questions that connect data collection to everyday life. Three, give two reasons why teachers should actively teach words like more, less, and equal. Four, which of these is not an example of data: number of pencils students have, a student's drawing, or types of fruits in a basket? The answer is B, a student's drawing. Five, which question helps us understand collected data better: What is your name, or Which fruit is most liked? The answer is B.", "Activity 3.1. Students have collected data on their favourite colours. How would you help them realise they have sorted and classified this information? Give one specific activity. Also, to introduce pictographs for favourite animals, if five children like dogs, how would you show this on the board?"]}, {"t": "3.4 Visualisation and Spatial Thinking", "p": ["Spatial thinking and visualisation are foundational cognitive skills that affect learning across all subjects. They enable children to mentally manipulate objects, understand how things fit together in space, and picture relationships between items and their environment. This is crucial for geometry and measurement, and helps students visualise number lines and shapes."]}, {"t": "3.4.1 Position and Direction", "p": ["Whether identifying a water bottle in a bag, racing to the playground entrance, or building a tower with blocks, children use spatial reasoning. These skills help them understand position, direction, and movement. Teachers can begin with simple directives such as, raise your left hand, or look outside the window.", "Position indicates the specific location of an object. Left means on the left-hand side. Right means on the right-hand side. Top is the highest point, as in, the clock is at the top of the wall. Bottom is the lowest point, as in, shoes are kept at the bottom of the shelf. Near means close to. Far means at a distance. Inside means within something. Outside means not within something. Above means higher than something, and below means lower than something. These notions are best understood through hands-on experience and physical movement.", "Direction specifies the orientation or the path to follow. In the classroom: turn to your right and pick up the red book. The board is in front of you; the window is behind. In the playground: run towards the tree, or stand near the swing and face the slide. At home or locally: the kitchen is next to the living room, or the post office is near the school.", "Pedagogical tips. Use body movements. Play games like Simon Says, treasure hunts, or classroom mazes. Use puppets, arrows, floor markings, and local landmarks. Create opportunities to give and follow verbal instructions."]}, {"t": "3.4.2 Shape and Structure", "p": ["Children learn about their surroundings by observing the shapes of everyday items, such as a window, a ball, a slice of pizza, and a mobile phone. Teachers help them recognise and label two-dimensional and three-dimensional shapes and connect the formal names with real objects.", "Two-dimensional shapes: a circle, like a coin or a clock. A square, with all sides the same, like a window. A triangle, with three sides, like a slice of pizza. A rectangle, like a door or a book. An oval, like an egg.", "A circle has zero sides and zero corners; examples are a clock, coin, or bangle. A square has four equal sides and four corners, like a handkerchief or a chessboard tile. A rectangle has four sides and four corners, like a book, door, or mobile screen. A triangle has three sides and three corners, like a road sign, sandwich, or hanger. A square has all sides equal, while a rectangle has opposite sides equal.", "Three-dimensional shapes: a sphere, like a ball. A cube, like a dice or a box. A cuboid, like a brick or a book. A cylinder, like a can. A cone, like an ice cream cone. Children can describe shapes, match objects to shapes, and draw or colour them using blocks or paper cutouts.", "Shapes denote the visual characteristics of objects, whereas structure relates to how a thing is constructed and supported. A bridge has parts that hold it up. A house has walls, a roof, and a door. A chair has legs that support the seat. Children focus on the parts of structures, the materials such as wood, brick, or metal, and the purpose, for example, why do we need it strong? They can build towers, houses, or gates with blocks, clay, or straws.", "Pedagogical tips. Use local, concrete materials: bangles for circles, cardboard boxes for rectangles, and leaves for triangles. Integrate touch and movement, like tracing shapes in the air or sand. Display a shape chart. Ask: How many sides does it have? Which shapes have no corners?"]}, {"t": "3.4.3 Patterns and Designs", "p": ["Patterns are configurations that repeat or develop in a systematic manner, in flower petals, floor tiles, and musical beats. Identifying and generating patterns develops logical reasoning, planning, observation, and foundational algebraic reasoning. Children see them in rangoli, mehendi, beads, blocks, and stamps.", "A repeating pattern is one where a part repeats again and again, like alternating circle colours. A growing pattern increases or changes regularly, like one, two, three, four, or squares of increasing size.", "Patterns are found in nature, such as petals, animal stripes, and ripples in water; in art, such as rangoli, mehendi, embroidery, and block prints; and in daily life, such as floor tiles, bead strings, window grills, and music beats.", "Children can create their own patterns with leaves or flowers, beads or buttons, stamps or blocks, rangoli or floor designs, and clap-tap rhythms or dance steps. Encourage them to extend a pattern, identify the unit of repetition, or make a new one. Pattern recognition helps in making predictions and prepares children for algebraic reasoning.", "Pedagogical tips. Use real objects. Encourage children to extend, describe, and create patterns. Ask: What comes next? What changes in each step? Can you make your own pattern? Integrate patterns into art, music, dance, and craft."]}, {"t": "3.4.4 Mirror Images and Symmetry", "p": ["Symmetry appears in nature, art, architecture, and the human body, like a butterfly's wings. A shape is symmetrical when it can be divided into two equal and congruent sections. The line that divides a figure into two congruent parts is the line of symmetry. A square has four lines of symmetry. Your left hand is the mirror image of your right. If folding a shape along a line makes the halves overlap exactly, it is symmetrical.", "Activities. Mirror play: place a mirror along the centre line of half a butterfly to see the full image. Paper folding: fold cut-outs of circles, squares, triangles, or leaves. Symmetrical drawing: complete vases, hearts, or butterflies along a dotted central line. Alphabet symmetry: explore capital letters such as A, M, O, T, U, and X.", "Pedagogical tips. Use real mirrors and folding paper. Begin with objects in nature. Use clay or paper cutting. Ask: Can you find something symmetrical in the classroom? What if this side were the mirror image, how would it look?", "Activity 3.2. Describe one hands-on activity to teach symmetry and explain how it helps students understand the concept."]}, {"t": "3.4.5 Map Reading and Drawing", "p": ["Children build mental maps, from recalling a friend's seat to finding the shortest path to the playground. Ask: Can you show where the teacher's table is? Where is the whiteboard? Who sits in front of you, and who sits behind? Ask them to imagine the classroom from above, like a bird. Sketch the door, windows, benches, and teacher's table on the board. You have just created a mental map.", "A map is a drawing of a place showing how things are arranged when seen from above, in a bird's-eye or top view. It helps us know where things are, find our way, and understand how places are connected. Children can map their classroom, school, home, park, village, or market, using symbols such as small pictures for a house, tree, door, or chair.", "Key map terms. Map: a drawing showing a place from above. Symbols: small pictures or signs representing real things. Legend or key: a box that explains the symbols. Direction: usually shown with an arrow pointing north, and the top of the map is north. Perspective: seeing things from above, like looking down on your desk.", "Maps connect children with left and right, up and down, and North, South, East, and West. Pedagogical tips. Start with real spaces. Teach map symbols through drawing and role play. Encourage children to give and follow directions using the map. Ask: What is near the blackboard? Which object is farthest from the door?"]}, {"t": "3.4.6 Developing Spatial Vocabulary", "p": ["Spatial vocabulary refers to the words we use to describe the position, direction, and movement of objects in space. It helps children follow instructions, and supports learning in maps, geometry, and physical movement.", "Position words. In front of and behind: place your pencil box in front of your book; hide your eraser behind the water bottle. Beside or next to: sit beside your friend. Between: who is sitting between Student A and Student B? Under and above: put your feet under the chair; can you see the fan above your head? Inside and outside: keep your crayon inside the box.", "Direction words. Left and right: raise your left hand, turn to your right to face the window, and stay consistent with their own body parts. Top and bottom. Near and far. Clockwise and anticlockwise: turn your arms clockwise, like the clock hands, using a real clock face as a visual aid. Go forward, turn around, move to the left, walk in a circle: create an obstacle course with these instructions.", "Pedagogical tips. Model these words consistently and correctly. Provide hands-on experiences. Encourage active use: ask, where is the book, and expect, it is under the table. Use visual aids such as diagrams, puppets, and word walls. Integrate them into daily routines, like, please stand behind your chair, or, put the toys inside the basket."]}, {"t": "Check Your Progress 3.2", "p": ["One, why is spatial thinking considered a foundational skill, important for more than just mathematics? Give two reasons. Two, explain the difference between position and direction with an everyday example. Three, a child calls a book a rectangle. Name two other two-dimensional shapes they should identify in the classroom, with a real-life example each. Four, what is the main difference between a two-dimensional and a three-dimensional shape? Five, how does a simple classroom map help develop spatial reasoning, particularly perspective? Six, a student struggles with left and right. Which two pedagogical tips would you use?"]}, {"t": "3.5 Let Us Sum Up", "p": ["This chapter explored Data Handling and Visualisation and Spatial Thinking. Data is simply information gathered from everyday life. We guided children in sorting and classifying, moving from concrete objects to pictographs and tally marks, and stressed that they must also read and interpret data. Mathematical vocabulary empowers children to express observations and reasoning.", "In visualisation and spatial thinking, we covered position and direction, shapes and structures in two and three dimensions, patterns and designs, mirror images and symmetry, and map reading and drawing. These concepts are powerful tools that help children make sense of their world, develop critical thinking, and build a foundation for future learning."]}, {"t": "3.6 End Exercises", "p": ["One. Why is collecting data useful in a primary classroom? Two. What does classifying mean in early learning? Three. Why is it important to teach sorting and classifying to young learners? Four. What does representation of data mean in a classroom context? Five. What is a pictograph, and how is it useful for young learners? Six. What are tally marks, and how are they used to count? Seven. Why is it better to use pictures instead of numbers for young children? Eight. What does it mean to interpret data? Nine. Why is it important for children to use mathematical vocabulary like more, less, same, and group?"]}];
const doc=document.getElementById('doc'),$=id=>document.getElementById(id);
const S=[];
C.forEach((c,si)=>{
  const sec=document.createElement('section');
  const h=document.createElement('h2');h.append(c.t);
  const b=document.createElement('button');b.textContent='Listen';b.onclick=()=>start(firstOf(si));h.append(b);
  sec.append(h);
  c.p.forEach(par=>{
    const p=document.createElement('p');
    (par.match(/[^.?!]+[.?!]+(\s|$)|[^.?!]+$/g)||[par]).forEach(t=>{
      const s=document.createElement('span');s.className='s';s.textContent=t.trim()+' ';
      const i=S.length;s.onclick=()=>start(i);
      S.push({el:s,sec:si,text:t.trim()});p.append(s);
    });
    sec.append(p);
  });
  doc.append(sec);
});
const firstOf=si=>S.findIndex(x=>x.sec===si);
const ss=window.speechSynthesis;
if(!ss){$('warn').hidden=false;$('warn').textContent='This browser does not support speech playback. Please open the file in Chrome, Edge, Safari or Firefox.';}
let idx=0,playing=false,paused=false,token=0,voices=[];
const INDIAN=/(india|rishi|veena|heera|hemant|kalpana|ravi|neerja|prabhat|aditi|raveena|lekha)/i;
function loadVoices(){
  if(!ss)return;
  const L=$('lang').value,base=L.slice(0,2);
  const rank=v=>{
    const lg=v.lang.replace('_','-');
    if(L==='en-IN')return lg.toLowerCase()==='en-in'?0:(INDIAN.test(v.name)&&/^en/i.test(lg))?1:/^en-(GB|AU)/i.test(lg)?3:/^en/i.test(lg)?4:9;
    return lg.toLowerCase()===L.toLowerCase()?0:/^en/i.test(lg)?2:9;
  };
  voices=ss.getVoices().filter(v=>rank(v)<9).sort((a,b)=>rank(a)-rank(b));
  const sel=$('voice');sel.innerHTML='';
  voices.forEach((v,i)=>{const o=document.createElement('option');o.value=i;o.textContent=v.name+' ('+v.lang+')';sel.append(o);});
  const w=$('warn');
  if(!voices.length){w.hidden=false;w.textContent='No English voices were found on this device. Please check your system speech settings.';}
  else if(rank(voices[0])>1){w.hidden=false;w.textContent='No '+$('lang').selectedOptions[0].text+' voice was found on this device, so the closest English voice is selected. For Indian English, install an en-IN voice in your phone or computer speech settings (for example, English India in Google Text-to-speech on Android, or Rishi and Veena on iPhone and Mac).';}
  else w.hidden=true;
}
loadVoices();if(ss)ss.onvoiceschanged=loadVoices;
function mark(i){
  S.forEach(x=>x.el.classList.remove('on'));
  const s=S[i];if(!s)return;s.el.classList.add('on');
  s.el.scrollIntoView({block:'center',behavior:'smooth'});
  $('prog').firstElementChild.style.width=((i+1)/S.length*100)+'%';
  $('now').textContent='Now reading: '+C[s.sec].t;
}
function speak(){
  if(idx>=S.length){finish();return;}
  const my=++token,u=new SpeechSynthesisUtterance(S[idx].text);
  const v=voices[$('voice').value];u.lang=$('lang').value;if(v){u.voice=v;u.lang=v.lang;}
  u.rate=parseFloat($('rate').value);
  mark(idx);
  u.onend=()=>{if(my===token&&playing){idx++;speak();}};
  u.onerror=()=>{if(my===token&&playing&&!paused){idx++;speak();}};
  ss.speak(u);
}
function start(i){ss.cancel();token++;idx=i;playing=true;paused=false;$('play').textContent='Pause';setTimeout(speak,60);}
function finish(){playing=false;paused=false;idx=0;$('play').textContent='Play';$('now').textContent='Finished. Press Play to listen again.';}
$('play').onclick=()=>{
  if(!playing)return start(idx);
  if(paused){ss.resume();paused=false;$('play').textContent='Pause';}
  else{ss.pause();paused=true;$('play').textContent='Resume';}
};
$('stop').onclick=()=>{ss.cancel();token++;playing=false;paused=false;idx=0;$('play').textContent='Play';
  S.forEach(x=>x.el.classList.remove('on'));$('prog').firstElementChild.style.width='0';$('now').textContent='Stopped.';};
$('next').onclick=()=>{const s=Math.min(C.length-1,(S[idx]?S[idx].sec:0)+1);start(firstOf(s));};
$('prev').onclick=()=>{const cur=S[idx]?S[idx].sec:0;start(firstOf(idx>firstOf(cur)?cur:Math.max(0,cur-1)));};
$('lang').onchange=()=>{loadVoices();if(playing&&!paused)start(idx);};
['rate','voice'].forEach(id=>$(id).onchange=()=>{if(playing&&!paused)start(idx);});
window.addEventListener('beforeunload',()=>ss&&ss.cancel());
</script>
</body>
</html>
