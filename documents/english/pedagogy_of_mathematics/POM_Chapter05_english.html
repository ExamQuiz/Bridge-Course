<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resources in Learning Mathematics – Audio Chapter</title>
<style>
:root{--bg:#f3f4fa;--ink:#1d2340;--mute:#5b6288;--card:#fff;--line:#d5d8ea;--ac:#2b3990;--hi:#ffe9a8}
@media (prefers-color-scheme:dark){:root{--bg:#141833;--ink:#e9ebf8;--mute:#a3a9cf;--card:#1d2245;--line:#343a70;--ac:#8f9dff;--hi:#4a3f14}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.7 Georgia,"Times New Roman",serif}
header{padding:28px 20px 10px;max-width:760px;margin:auto}
header small{color:var(--mute);font:14px system-ui,sans-serif}
h1{margin:4px 0 0;font-size:2rem;color:var(--ac)}
.bar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
.bar div{max-width:760px;margin:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font:14px system-ui,sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--ac);background:var(--card);color:var(--ac);cursor:pointer;max-width:100%}
button.main{background:var(--ac);color:var(--card)}
button:focus-visible,select:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
#prog{flex:1 1 100%;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
#prog i{display:block;height:100%;width:0;background:var(--ac)}
#now{flex:1 1 100%;color:var(--mute)}
main{max-width:760px;margin:auto;padding:10px 20px 60px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 22px 14px;margin:18px 0}
h2{font-size:1.25rem;color:var(--ac);display:flex;justify-content:space-between;gap:10px;align-items:center}
h2 button{font-size:13px;padding:4px 10px;flex:none}
p{margin:.7em 0}
.s{cursor:pointer;border-radius:3px}
.s:hover{text-decoration:underline dotted}
.s.on{background:var(--hi)}
.note{color:var(--mute);font:14px system-ui,sans-serif;padding:0 20px;max-width:760px;margin:auto}
</style>
</head>
<body>
<header><small>Pedagogy of Mathematics · Unit 2 · Chapter 5</small><h1>Resources in Learning Mathematics</h1></header>
<div class="bar"><div>
<button class="main" id="play">Play</button>
<button id="stop">Stop</button>
<button id="prev" aria-label="Previous section">Prev section</button>
<button id="next" aria-label="Next section">Next section</button>
<label>Speed <select id="rate"><option value="0.8">0.8x</option><option value="0.9" selected>0.9x</option><option value="1">1x</option><option value="1.2">1.2x</option><option value="1.5">1.5x</option></select></label>
<label>Language <select id="lang"><option value="en-IN" selected>English (India)</option><option value="en-GB">English (UK)</option><option value="en-US">English (US)</option></select></label>
<label>Voice <select id="voice"></select></label>
<div id="prog"><i></i></div>
<span id="now">Press Play to listen from the start, or tap any sentence or section button. Language is set to English (India); you can change it above.</span>
</div></div>
<p class="note" id="warn" hidden></p>
<main id="doc"></main>
<script>
const C=[{"t": "5.1 Introduction", "p": ["Mathematics learning at the primary stage forms the foundation for higher conceptual understanding and problem-solving skills. This unit invites you to go beyond the fundamentals, and explore how to make mathematics meaningful, joyful, and rooted in the child's world. We look at manipulatives, local and digital resources, and cross-curricular projects that nurture curious and confident problem-solvers."]}, {"t": "5.2 Learning Outcomes", "p": ["After completing the chapter, the learner understands the pedagogical role of diverse resources in primary mathematics, designs and documents contextual, inclusive, and age-appropriate resources, appreciates and applies socially and culturally responsive mathematics learning, plans the integration of mathematics across the curriculum through meaningful projects, and critically analyses mathematics textbooks and supplementary materials."]}, {"t": "5.3 Importance of Resources in Primary Mathematics Learning", "p": ["Confining mathematics to textbook-based instruction often leads to rote learning, superficial understanding, and disinterest, especially among young learners. Resources help make mathematics relatable, tangible, and visible.", "The Concrete, Semi-concrete, Abstract approach, or CSA, gives a developmental pathway. Students first use concrete manipulatives, then pictorial representations, and finally abstract symbols and notation. Research shows that manipulatives, story cards, games, real-life objects, and technology make ideas tangible and promote conceptual clarity and sustained engagement."]}, {"t": "5.3.1 Importance of Resources Through a Theoretical Lens", "p": ["Piaget and Vygotsky both stressed hands-on experience. According to Piaget, primary school children largely fall in the Concrete Operational Stage, seven to eleven years, when they begin to think logically about concrete events, and can classify, order in series, and understand conservation. Learning must match the developmental stage, so manipulatives help children internalise number sense, operations, volume, and area.", "Vygotsky saw manipulatives as mediating tools. With guidance from teachers and peers, they help children achieve tasks beyond their current stage but within the Zone of Proximal Development. The ZPD is the gap between what a learner can do independently and what they can do with guidance or collaboration. Think of a child learning to ride a bicycle with support wheels. In Class 5, multiplying whole numbers is already mastered. Multiplying fractions by fractions is not yet achievable alone. But working together with a tool like a pizza model, students ask questions, make mistakes, and correct themselves, with the teacher guiding. Over time, with help becomes, I can do it myself. Vygotsky also emphasised language and dialogue around manipulatives, and the learner's social context, so folklore, indigenous stories, and real-life experiences support understanding. Piaget emphasises developmental readiness, while Vygotsky stresses social context and scaffolding.", "Maria Montessori placed hands-on learning at the heart of education. The hand is the instrument of the mind. Children move from concrete, tactile materials, like number rods, bead chains, and golden beads, to abstract understanding. The prepared environment lets children choose self-correcting materials, which grows independence and concentration. Materials such as the golden bead material for place value, spindle boxes, and the stamp game help children visualise and manipulate numbers and build a foundation before symbols.", "Jerome Bruner described three modes of representation: enactive, or action-based; iconic, or image-based; and symbolic. Children should experience concepts physically before pictorial and symbolic forms. Zoltan Dienes advocated multiple representations, structured games, and perceptual variability, and developed tools like Dienes blocks for place value. Seymour Papert extended constructivism into constructionism, where learning is best when learners construct meaningful products, using concrete tools and technology such as the Logo programming language.", "Together, these thinkers show that resources are essential, not supplementary. They support the transition from concrete to abstract thinking, suit developmental stages, encourage exploration, and foster collaboration."]}, {"t": "Check Your Progress 5.1", "p": ["One, why should instruction move beyond textbook routines to diverse resources, and what risks arise if we neglect this? Two, in what ways can manipulatives transform engagement? Consider at least three advantages, and reflect on limitations. Three, how does Piaget's theory validate hands-on manipulatives, and what are the boundaries of his assumptions today? Four, how does Vygotsky's Zone of Proximal Development encourage shared, resource-based exploration, and how does the teacher's role shift? Five, name one limitation of manipulatives.", "Answers. Six: one, C, textbook routines often limit conceptual understanding and engagement; two, B, it encourages passive note-taking is not an advantage; three, B, they use hands-on materials to manipulate ideas. Seven: one, disengagement; two, concrete; three, universal or linear."]}, {"t": "5.3.2 Types of Resources for Teaching Mathematics", "p": ["Effective teaching integrates a range of resources that engage students, put abstract ideas in context, and encourage active learning. They may be digital, visual, auditory, or physical. These examples are not exhaustive.", "One, concrete and manipulative resources. The Magic Box, or Jadui Pitara, created by NCERT under the NIPUN Bharat Mission, has puzzles, number cards, bead strings, and measuring tapes. The Jodo Gyan Kit has Ganit Mala, a number necklace, Rangometry for geometric shapes, and place value cards; the Ganit Mala helps children see addition as jumps on a number line. Arvind Gupta Toys turn recycled materials into tools, like matchstick geometry sets or spinning tops for symmetry.", "Two, print resources. Books, story cards, charts, and workbooks support procedural learning, mathematical language, and reasoning. The new NCERT textbooks, 2025 edition, begin chapters with contexts like a fair or a train journey, and embed activities, stories, and games. For example, the Class 3 chapter Give and Take introduces money through grocery purchases. The Man Who Counted by Malba Tahan uses stories such as The Horse Problem to bring in division and problem solving. Mathematwist: Number Tales from Around the World by T. V. Padma uses folk tales from different cultures. Posters and wall charts give constant reinforcement.", "Three, games and recreational mathematics. Sudoku promotes pattern recognition and logical reasoning. Snakes and Ladders and Ludo practise counting and chance. Hopscotch, or Stapu, can teach addition, subtraction, and sequencing. Math Bingo or Number Tambola reinforces number recognition and multiples. Playing cards develop early probability thinking.", "Four, rhymes, songs, and folk stories. Number rhymes like, one, two, buckle my shoe, introduce counting. Folk tales about sharing among animals or distributing sweets can introduce division or estimation. Teachers and students can create songs about shapes and measurements.", "Five, digital and technological resources. The DIKSHA app and portal provides teacher-developed content, lesson plans, and videos aligned with NCERT. Desmos has an interactive number line. GeoGebra helps visualise geometry through drag-and-drop and transformations. Interactive whiteboards and smart class content should be critically analysed before use.", "Six, environmental and contextual resources. Stones, leaves, and matchsticks for counting, patterns, and shapes. Local markets for money, weight, estimation, and data. Classroom objects for measurement and comparison. Math walks, where children observe and record numbers and shapes around them, such as room numbers or steps in a staircase, and learn the difference between cardinal numbers, used for counting, and ordinal numbers, used for position. In a school garden they can note shapes of manhole covers and arrangements of trees.", "Seven, teacher-created and student-made resources, which foster ownership and reduce alienation. Children can make flashcards, handmade dice, and angle testers. Student projects include models of 3D shapes, math posters, or board games. Math journals record data about themselves, their families, addresses, and neighbourhoods."]}, {"t": "Check Your Progress 5.2", "p": ["One, give an example each of a concrete manipulative, a thematic kit, and a digital resource from your experience. Two, integrating traditional and modern resources connects abstract concepts with real-life experiences and fosters curiosity. Manipulatives like ginladi or bead strings help visualise abstract concepts and support active learning. Teacher-created and student-made resources address math anxiety by giving ownership and linking maths to personal experience. Three, the Jadui Pitara was developed by NCERT; creating resources fosters ownership and creativity; math walks differentiate cardinal numbers from ordinal numbers."]}, {"t": "5.4 Contextual and Inclusive Use of Resources", "p": ["Contextual use means embedding mathematics in the lived realities of children: their culture, language, environment, and everyday activities. For example, grains, bangles, or rangoli patterns can teach counting, measurement, and geometry. Local currency, mangoes and marbles, and market scenes or festivals help children internalise addition, measurement, and patterns.", "Inclusive use ensures that all children, regardless of ability, language, gender, or socio-economic background, can benefit. Krishna Kumar argued for culturally responsive pedagogy. NCF 2023, NCF for Foundational Stage 2022, and NEP 2020 foreground experiential, play-based, competency-driven, and equitable learning. NCF 2005 had earlier stressed local, low-cost materials.", "Teachers can adapt resources for children with special needs, such as tactile materials, large-print charts, audio tools, and abacuses with tactile markings. Teachers must be sensitive to gender, caste, and cultural biases in resource selection. This aligns with constructivist pedagogy and the principles of Universal Design for Learning.", "Universal Design for Learning, or UDL, means designing resources and lessons from the start to reach all learners, rather than adding accommodations later. It offers multiple means of representation, using visuals, manipulatives, and tech tools; multiple means of action and expression, such as explaining verbally, creating a visual proof, or using an app; and multiple means of engagement, such as contextualised problems using sports, architecture, or budgeting. It promotes equity and deeper understanding without lowering rigour."]}, {"t": "Check Your Progress 5.3", "p": ["One, give an example of teaching a concept through a real-life scenario from your students' local culture, and explain how you would modify resources for learners of different abilities, languages, or learning styles. Two, how could a trip to the local market offer hands-on exploration of data handling, measurement, money, or geometry? Three, the primary goal of contextual resources is to make concepts relatable and meaningful. Tracking plant growth and recording measurements integrates maths with environmental studies. UDL encourages teachers to design resources from the start to meet diverse learners' needs."]}, {"t": "5.4.1 Integration of Mathematical Concepts Across the Curriculum", "p": ["Mathematics connects naturally with environmental studies, language, art, and physical education. In environmental studies, children record rainfall or track plant growth, using units, data collection, and graphing. Language lessons reinforce vocabulary like more than and equal to. Art activities like symmetrical patterns, tessellations, and rangoli apply geometry. In physical education, children use counting, estimation, and time in games.", "The theoretical basis lies in John Dewey's learning through experience, and Howard Gardner's Theory of Multiple Intelligences. NCF 2023, NCF-FS 2022, NEP 2020, and NCF 2005 all highlight integrated, multidisciplinary, experiential learning. Integration makes mathematics more enjoyable, relevant, and meaningful, and encourages collaboration and critical thinking.", "Check your progress 5.4. Where do you see natural overlap between your subjects and mathematics? Design an activity or project, such as a science experiment or a map-reading task, where students apply number operations, measurement, data analysis, or patterns."]}, {"t": "5.4.2 Socially and Culturally Integrated Mathematics Learning", "p": ["This approach uses resources that reflect learners' lived realities, cultural knowledge, and social contexts, drawing on Eric Gutstein, Bob Peterson, Brian Greer, and Swapna Mukhopadhyay. Gutstein and Peterson advocate teaching mathematics for social justice, using resources like charts comparing water consumption across neighbourhoods, surveys on school facilities, or infographics on gender disparities in education, to apply statistics, averages, and ratios.", "Greer and Mukhopadhyay highlight ethnomathematics, the study of mathematical ideas present in cultural practices, from local architecture and handicrafts to traditional games and measurement systems. Using patterns from local textiles to teach symmetry, or indigenous farming calendars to explore measurement and time, affirms cultural identity. Involving learners in posing problems and collecting real data supports student agency. Resources such as neighbourhood maps, family budgets, and school surveys increase ownership.", "Check your progress 5.5. What is ethnomathematics? Which local art forms, games, or community practices in your classroom involve patterns, measurement, or symmetry? How could you use social issues like water availability or power cuts in a lesson using graphs, percentages, or comparisons? The scholar associated with teaching mathematics for social justice is Eric Gutstein. Ethnomathematics explores mathematical ideas embedded in cultural practices."]}, {"t": "5.4.3 Socially and Culturally Responsive Mathematics Teaching: Examples and Activities", "p": ["Spatial concepts. Children draw a map of their neighbourhood showing the market, park, place of worship, and their homes, to explore position, direction, distance, and shapes, using words like left, right, above, and below.", "Traditional games. Pachisi, Stapu, or Gilli-Danda can practise skip counting, addition, strategy, and probability. Students can tabulate scores or create new rules.", "Patterns in art and crafts. Rangoli, tribal painting, or fabric prints introduce repeating patterns and lines of symmetry. Children can make symmetrical patterns from natural materials.", "Data from daily life. A class survey on modes of transport to school or favourite local food, using tally marks, pictographs, bar graphs, and the mode.", "Festivals and time. Explain how festivals relate to lunar and solar calendars, and create a classroom calendar of local festivals. Students can make event timelines based on birth dates, festivals, and family celebrations.", "Income and budget. Shopping at a local market or festival preparation introduces budgeting, addition, subtraction, and estimation, with a mock market day using play money.", "Resources need not always be purchased; many can be built from the life, culture, and community of the student. This builds confidence, respect, and inclusivity.", "Check your progress 5.6. How might you use rangoli, mandala designs, Warli art, or kolam to explore rotational symmetry, tessellation, or fractions? How can festivals be used to teach days, months, leap years, and timelines, including lunar versus solar calendars?"]}, {"t": "5.5 Critical Analysis of Mathematics Textbooks and Supplementary Materials", "p": ["Textbooks and supplementary materials must be critically evaluated against the curriculum. A well-designed resource leads to deeper learning, while a poorly conceived one creates conceptual gaps. NCERT textbooks serve as examples.", "Curriculum alignment. The Class 3 old-edition chapter Fun with Numbers aligns with learning outcomes on number sense and place value. Each activity should connect to a specific mathematical goal.", "Conceptual clarity and progression. The Class 4 chapter Building with Bricks introduces patterns, spatial understanding, and multiplication through visuals and local contexts. Teachers can help learners move from visual observation to explicit reasoning about area or symmetry.", "Pedagogical strategies. The Class 2 chapter Counting in Groups introduces grouping, repeated addition, and early multiplication through games. Adding prompts for peer discussion enriches inquiry.", "Inclusivity and contextual relevance. The Class 5 chapter Smart Charts presents data handling through surveys and market shopping. Teachers can adapt examples to diverse regional and socio-economic backgrounds.", "Visual and linguistic accessibility. The Class 1 chapter Shapes and Space uses familiar objects with simple language. Teachers should check for visuals open to multiple interpretations and avoid bias related to caste, class, race, or gender.", "Manipulatives integration. Classes 1 to 3 recommend matchsticks, bottle tops, or beads, favouring low-cost materials in line with Piaget and Bruner. Teachers may need extra support and time to put these into practice.", "Teachers should regularly check the clarity and logical flow of ideas, the accessibility and relevance of examples, and the support given to diverse learners."]}, {"t": "Check Your Progress 5.7", "p": ["One, which three criteria matter most when selecting a textbook, and how do they affect learning? Two, do you prioritise curriculum alignment, contextual relevance, inclusivity, or a problem-solving focus? Three, critically analyse the 2025 NCERT Mathematics textbooks for Classes 1 to 5. Four, critical evaluation is necessary to ensure alignment with curriculum goals and promote deeper learning. For Counting in Groups, the suggestion is to add more peer discussion prompts. Five, NCERT textbooks are rich in day-to-day contexts; visuals should be checked for bias related to caste, class, race, and gender; every activity should connect to a learning goal."]}, {"t": "5.6 Let Us Sum Up", "p": ["Resources are central to meaningful mathematics learning. They must be diverse, inclusive, culturally responsive, and integrated across subjects. Developmental theorists support manipulatives because they build conceptual understanding, support developmentally appropriate learning, encourage exploration and problem solving, and help the transition from concrete to abstract thinking.", "Piaget stressed the concrete operational stage. Vygotsky stressed social interaction and the Zone of Proximal Development. Montessori promoted independent, hands-on learning. Bruner introduced the enactive, iconic, and symbolic stages. Dienes and Papert advocated variability and meaningful construction.", "Resource types include concrete resources like Jadui Pitara, ginladi, and Arvind Gupta toys; print resources like The Man Who Counted; games like hopscotch, sudoku, and tambola; songs and rhymes; digital resources like DIKSHA, Desmos, and GeoGebra; environmental resources like stones, local markets, and math walks; and teacher and student-created resources. The key is not the number of resources but how creatively and contextually they are used.", "Ethnomathematics affirms identity, and recognises that cooking a dish or baking a cake is as relevant a mathematical skill as one in the textbook. It reduces fear of the subject. Textbooks should be used judiciously after critical evaluation against these criteria: curriculum alignment, concept clarity, pedagogical strategy, inclusivity, visual and linguistic accessibility, differentiated learning, and integration of manipulatives."]}, {"t": "5.7 End Exercises", "p": ["One. Discuss the role of culturally responsive pedagogy in mathematics. Two. Design a math activity based on a local game. Three. Critically evaluate a Class 3 NCERT math chapter using the given criteria. Four. Create a cross-curricular project integrating maths and art."]}];
const doc=document.getElementById('doc'),$=id=>document.getElementById(id);
const S=[];
C.forEach((c,si)=>{
  const sec=document.createElement('section');
  const h=document.createElement('h2');h.append(c.t);
  const b=document.createElement('button');b.textContent='Listen';b.onclick=()=>start(firstOf(si));h.append(b);
  sec.append(h);
  c.p.forEach(par=>{
    const p=document.createElement('p');
    (par.match(/[^.?!]+[.?!]+(\s|$)|[^.?!]+$/g)||[par]).forEach(t=>{
      const s=document.createElement('span');s.className='s';s.textContent=t.trim()+' ';
      const i=S.length;s.onclick=()=>start(i);
      S.push({el:s,sec:si,text:t.trim()});p.append(s);
    });
    sec.append(p);
  });
  doc.append(sec);
});
const firstOf=si=>S.findIndex(x=>x.sec===si);
const ss=window.speechSynthesis;
if(!ss){$('warn').hidden=false;$('warn').textContent='This browser does not support speech playback. Please open the file in Chrome, Edge, Safari or Firefox.';}
let idx=0,playing=false,paused=false,token=0,voices=[];
const INDIAN=/(india|rishi|veena|heera|hemant|kalpana|ravi|neerja|prabhat|aditi|raveena|lekha)/i;
function loadVoices(){
  if(!ss)return;
  const L=$('lang').value,base=L.slice(0,2);
  const rank=v=>{
    const lg=v.lang.replace('_','-');
    if(L==='en-IN')return lg.toLowerCase()==='en-in'?0:(INDIAN.test(v.name)&&/^en/i.test(lg))?1:/^en-(GB|AU)/i.test(lg)?3:/^en/i.test(lg)?4:9;
    return lg.toLowerCase()===L.toLowerCase()?0:/^en/i.test(lg)?2:9;
  };
  voices=ss.getVoices().filter(v=>rank(v)<9).sort((a,b)=>rank(a)-rank(b));
  const sel=$('voice');sel.innerHTML='';
  voices.forEach((v,i)=>{const o=document.createElement('option');o.value=i;o.textContent=v.name+' ('+v.lang+')';sel.append(o);});
  const w=$('warn');
  if(!voices.length){w.hidden=false;w.textContent='No English voices were found on this device. Please check your system speech settings.';}
  else if(rank(voices[0])>1){w.hidden=false;w.textContent='No '+$('lang').selectedOptions[0].text+' voice was found on this device, so the closest English voice is selected. For Indian English, install an en-IN voice in your phone or computer speech settings (for example, English India in Google Text-to-speech on Android, or Rishi and Veena on iPhone and Mac).';}
  else w.hidden=true;
}
loadVoices();if(ss)ss.onvoiceschanged=loadVoices;
function mark(i){
  S.forEach(x=>x.el.classList.remove('on'));
  const s=S[i];if(!s)return;s.el.classList.add('on');
  s.el.scrollIntoView({block:'center',behavior:'smooth'});
  $('prog').firstElementChild.style.width=((i+1)/S.length*100)+'%';
  $('now').textContent='Now reading: '+C[s.sec].t;
}
function speak(){
  if(idx>=S.length){finish();return;}
  const my=++token,u=new SpeechSynthesisUtterance(S[idx].text);
  const v=voices[$('voice').value];u.lang=$('lang').value;if(v){u.voice=v;u.lang=v.lang;}
  u.rate=parseFloat($('rate').value);
  mark(idx);
  u.onend=()=>{if(my===token&&playing){idx++;speak();}};
  u.onerror=()=>{if(my===token&&playing&&!paused){idx++;speak();}};
  ss.speak(u);
}
function start(i){ss.cancel();token++;idx=i;playing=true;paused=false;$('play').textContent='Pause';setTimeout(speak,60);}
function finish(){playing=false;paused=false;idx=0;$('play').textContent='Play';$('now').textContent='Finished. Press Play to listen again.';}
$('play').onclick=()=>{
  if(!playing)return start(idx);
  if(paused){ss.resume();paused=false;$('play').textContent='Pause';}
  else{ss.pause();paused=true;$('play').textContent='Resume';}
};
$('stop').onclick=()=>{ss.cancel();token++;playing=false;paused=false;idx=0;$('play').textContent='Play';
  S.forEach(x=>x.el.classList.remove('on'));$('prog').firstElementChild.style.width='0';$('now').textContent='Stopped.';};
$('next').onclick=()=>{const s=Math.min(C.length-1,(S[idx]?S[idx].sec:0)+1);start(firstOf(s));};
$('prev').onclick=()=>{const cur=S[idx]?S[idx].sec:0;start(firstOf(idx>firstOf(cur)?cur:Math.max(0,cur-1)));};
$('lang').onchange=()=>{loadVoices();if(playing&&!paused)start(idx);};
['rate','voice'].forEach(id=>$(id).onchange=()=>{if(playing&&!paused)start(idx);});
window.addEventListener('beforeunload',()=>ss&&ss.cancel());
</script>
</body>
</html>
