<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teaching Learning in Mathematics – Audio Chapter</title>
<style>
:root{--bg:#f3f4fa;--ink:#1d2340;--mute:#5b6288;--card:#fff;--line:#d5d8ea;--ac:#2b3990;--hi:#ffe9a8}
@media (prefers-color-scheme:dark){:root{--bg:#141833;--ink:#e9ebf8;--mute:#a3a9cf;--card:#1d2245;--line:#343a70;--ac:#8f9dff;--hi:#4a3f14}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.7 Georgia,"Times New Roman",serif}
header{padding:28px 20px 10px;max-width:760px;margin:auto}
header small{color:var(--mute);font:14px system-ui,sans-serif}
h1{margin:4px 0 0;font-size:2rem;color:var(--ac)}
.bar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
.bar div{max-width:760px;margin:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font:14px system-ui,sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--ac);background:var(--card);color:var(--ac);cursor:pointer;max-width:100%}
button.main{background:var(--ac);color:var(--card)}
button:focus-visible,select:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
#prog{flex:1 1 100%;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
#prog i{display:block;height:100%;width:0;background:var(--ac)}
#now{flex:1 1 100%;color:var(--mute)}
main{max-width:760px;margin:auto;padding:10px 20px 60px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 22px 14px;margin:18px 0}
h2{font-size:1.25rem;color:var(--ac);display:flex;justify-content:space-between;gap:10px;align-items:center}
h2 button{font-size:13px;padding:4px 10px;flex:none}
p{margin:.7em 0}
.s{cursor:pointer;border-radius:3px}
.s:hover{text-decoration:underline dotted}
.s.on{background:var(--hi)}
.note{color:var(--mute);font:14px system-ui,sans-serif;padding:0 20px;max-width:760px;margin:auto}
</style>
</head>
<body>
<header><small>Pedagogy of Mathematics · Unit 2 · Chapter 4</small><h1>Teaching Learning in Mathematics</h1></header>
<div class="bar"><div>
<button class="main" id="play">Play</button>
<button id="stop">Stop</button>
<button id="prev" aria-label="Previous section">Prev section</button>
<button id="next" aria-label="Next section">Next section</button>
<label>Speed <select id="rate"><option value="0.8">0.8x</option><option value="0.9" selected>0.9x</option><option value="1">1x</option><option value="1.2">1.2x</option><option value="1.5">1.5x</option></select></label>
<label>Language <select id="lang"><option value="en-IN" selected>English (India)</option><option value="en-GB">English (UK)</option><option value="en-US">English (US)</option></select></label>
<label>Voice <select id="voice"></select></label>
<div id="prog"><i></i></div>
<span id="now">Press Play to listen from the start, or tap any sentence or section button. Language is set to English (India); you can change it above.</span>
</div></div>
<p class="note" id="warn" hidden></p>
<main id="doc"></main>
<script>
const C=[{"t": "4.1 Introduction", "p": ["Children are inherently curious and explore the world by interacting with it. They love hands-on experiences, and by engaging with new things they try to address complexity and discover their own solutions. This curiosity is the primary motivation for learning. Constructivists advocate children's self-construction of knowledge, especially when learning abstract mathematical concepts. But what does knowledge construction truly mean? Is it simply the teacher's explanation, taking notes, reading a book, or asking questions?", "This chapter helps you understand the teaching approaches advocated by NEP 2020: Experiential Learning, the ELPS approach, and the Four-Block teaching method. You will learn to use them in daily practice, and to use textbooks and other readily available materials to make learning meaningful."]}, {"t": "4.2 Learning Outcomes", "p": ["After completing the chapter, the learner identifies and explains the core approaches advocated by NEP 2020, which are Experiential Learning, ELPS, and the Four-Block Teaching method, incorporates ELPS and Four-Block Teaching into classroom practice, and uses textbooks and other readily available materials for teaching mathematics meaningfully."]}, {"t": "4.3.1 Experiential Learning", "p": ["Sudha, a Grade 2 teacher, wanted to teach three-digit addition. Before starting, she gave a few questions with and without regrouping. Radha solved all correctly using the standard algorithm except one. She correctly added 67 plus 24 equals 91, but for 48 plus 7, she answered 118. What could be the reason for this mistake? Is Sudha's approach appropriate? What three insights would you gain as a teacher?", "Sudha aimed to assess prior knowledge and identify misconceptions. The next day, the class played Snakes and Ladders in small groups. On day three, she used the same game with class discussion, and at times used bundles and sticks to address confusions. What could be the reasons for this strategy?", "Sudha was providing a hands-on experience. Experiential learning is a process where learning occurs by doing rather than just receiving information. Discussion lets children reflect and move beyond mere activity to deeper understanding. Kolb's experiential learning has four pillars: concrete experience, reflective observation, abstract conceptualisation, and active experimentation.", "Concrete experience means hands-on opportunities, or learning by doing. For example, while teaching shapes in Grade 4, children can explore shapes and relate them to daily life, and create something using shapes, which builds spatial understanding.", "Reflection means revisiting the process and expressing it in one's own words. It lets learners analyse what worked and what did not, and helps the teacher understand the learner's thinking.", "Abstract conceptualisation means learners develop new concepts based on their reflections, and relate them to existing ideas. For example, after discussion, a project on making a model of a building lets the child reuse existing knowledge in creating new ideas.", "Active experimentation means testing new concepts by applying them in new situations, such as through the varied questions in the textbook.", "Think and reflect. How often do you incorporate hands-on activities that let children do mathematics? What opportunities do you give students to reflect on their experiences and explain their understanding in their own words? Activity 4.1. Redesign part of a recent lesson using the four pillars of experiential learning."]}, {"t": "4.3.2 ELPS", "p": ["Aarti introduced division to Class 3. She began with the textbook example: Hari has 15 pencils and distributes them equally among his 5 friends. How many does each get? A few students answered immediately. She asked, how did you find the answer? Very few responded. Then she declared she would teach how to divide, and explained the algorithm on the chalkboard. Is this the right way to introduce division in Grade 3? Why?", "The ELPS approach is built on the belief that a learner constructs knowledge most effectively when actively engaged. It moves from tangible experiences to abstract symbols in four stages.", "E stands for Experience, the concrete stage. Children explore with concrete objects. To introduce place value, they make groups or bundles of ten using sticks, straws, an abacus, or other manipulatives.", "L stands for Language. Children describe the experience in spoken form. The teacher asks: How did you make your bundles? What did you observe when grouping these? Can you use these bundles and sticks to represent numbers like 11 or 20? This develops mathematical vocabulary and connects actions to the emerging concept.", "P stands for Picture. The concept is represented visually, through drawings, charts, or sketches. For example, show 23 using bundles and sticks: the child draws two bundles and three sticks. This bridges concrete actions and abstract symbols, such as two representing two tens.", "S stands for Symbol. The concept is introduced using numerals or notations. The symbol may be introduced alongside its picture, but it must not precede the concrete and pictorial stages. Symbols should be understood as concise representations of real experiences, not isolated characters.", "ELPS is recommended because it reduces the abstractness of concepts. Direct presentation of abstract rules often promotes rote memorisation. Presenting concepts first in concrete form, then pictorially, and finally symbolically, always with language, builds a sound and durable understanding. Expressing experiences in their own language also builds vocabulary and metacognition.", "Siddhi introduced division with ELPS to her Class 3. She took students to the ground and played, Bol Bhai Kitnay, meaning, tell me, how many? She called a number, say 8, and students formed groups of 8; those left out were out of the game. The next day, with the same game, she discussed the procedure, then gave buttons and asked students to distribute them equally into that many groups, followed by discussion. The next day she moved to pictures on the blackboard, again with discussion on the what and how. Then she introduced symbols along with pictures: 24 apples divided among 3 children makes 3 groups of 8, so each child gets 8 apples. In symbols, 24 divided by 3 equals 8. On the fifth day she introduced the standard procedure of division.", "Think and reflect. What is your opinion of Siddhi's strategy? Compare the pedagogy of Aarti and Siddhi. Activity 4.2. Choose a concept, such as multiplication, fractions, or measurement, and outline how you would introduce it through Experience, Language, Picture, and Symbol."]}, {"t": "4.3.3 Four-Block Approach", "p": ["The Four-Block Approach is advocated in NCF 2023 to strengthen foundational numeracy. It has four blocks: oral math talk, skill teaching, skill practice, and math games.", "Block 1, Oral Math Talk, is a warm-up that links what children know with what they will learn. Keep it short and fun. Use rhymes and poems, puzzles and riddles, storytelling, such as a story about sharing cookies to introduce division, and situation-based questions like, if we have 3 red pencils and 2 blue pencils, how many pencils in total?", "Block 2, Skills Teaching, is where conceptual understanding happens. Connect the how, the procedure, with the why, the concept. Use concrete materials such as counting blocks, abacuses, play money, or pebbles. Use charts, diagrams, flashcards, and drawings. Model the skill step by step, explaining your thinking aloud.", "Block 3, Skills Practice, reinforces understanding and builds fluency. Use focused worksheets with varied problem types, group activities where children discuss and solve together, and independent activities where they work at their own pace.", "Block 4, Math Game, ends the session on a high note. Options include board games, card games, interactive digital games, and physical games such as Math Hopscotch.", "Suggested timing from the NCF for Foundational Stage: oral math talk, five to ten minutes; skills teaching, twenty to twenty-five minutes; skills practice, fifteen minutes; and a math game, fifteen minutes.", "Activity 4.3. Identify a topic from the Class 3 NCERT Mathematics textbook and plan it using the Four-Block Approach."]}, {"t": "Check Your Progress 4.1", "p": ["One, how does the mode of representation facilitate thinking among learners? Two, in what aspects do the three approaches connect? Three, fill in the blanks: oral math talk is an engaging activity; the third block deals with practising the attained skills in various situations; in experiential learning, reflection should be taken after concrete experience.", "Four, choose the correct option. Which is not an aspect of the four-block approach? Writing skill. Oral Math Talk should not involve: explanation. Which block emphasises conceptual understanding? Skill teaching. A teacher blindfolded a student, gave her an object, and asked her to describe its corners and faces while introducing three-dimensional shapes. How does this help? It develops spatial understanding while exploring objects, identifying features, and expressing them in language."]}, {"t": "4.4 Manipulatives and Resources", "p": ["Manipulatives and other resources bridge the gap between abstract concepts and concrete understanding. They can be physical or digital. They reduce abstractness by letting students interact directly with objects and break complex ideas into manageable pieces. Resources can be material, such as charts, models, and geoboards, non-material, such as daily-life activities, discussions, and language, and human, such as teachers and peers.", "NCF 2023 notes that resources enable students to comprehend concepts more effectively, as they connect verbal instruction with real experience, concretise abstract concepts, and develop curiosity. Research shows manipulatives, used consistently with guided instruction, improve conceptual thinking and engagement, and are particularly beneficial for children with disabilities. Their success depends on thoughtful selection and integration with instruction. Give learners the chance to explore manipulatives freely first.", "Why manipulatives? First, concrete experience: hands-on activity builds connections between aspects of a concept. Second, engagement and motivation: a tangible way to present abstract ideas raises interest. Third, inclusive learning: a multi-sensory approach caters to diverse learning styles, giving every learner a pathway to understanding.", "But manipulatives are not inherently effective. They should be chosen purposefully, with the lesson objectives in mind, and with planned instructions. Compare two teachers. Nalini, in Grade 4, asked students to bring boxes of various shapes, distributed them in groups, asked them to create something with the shapes, and then to describe how and why. Sunita started by defining solid shapes and drawing them in the notebook, then showed objects and demonstrated faces and edges. Nalini used manipulatives more effectively, because of hands-on exploration and construction, conceptual understanding through discovery, and engagement and ownership. Sunita's approach involved passive learning, little exploration, and limited engagement.", "Think and reflect. Anita, a Grade 5 teacher, took students to visit a monument. Is this visit a type of manipulative? What topics of mathematics will you relate to the Qutub Minar?"]}, {"t": "4.5 Mathematics Textbook at Primary Stage", "p": ["Most Indian classrooms revolve around textbooks. What is to be done, and how, is based on the assigned textbook. It is easily available and, in many remote areas, one of the main resources. It also links classroom teaching with parents and other stakeholders.", "For the teacher, the textbook is a model for interpreting the curriculum. But it should not be the only source; it is a path director. The teacher bridges the gap between the prescribed content and the learner's social milieu. Before using the book, go through the curriculum's philosophy and goals. With NCF 2023, textbooks include new activities, new ideas, and different types of questions, especially divergent ones.", "Go beyond the text. In the Class 3 chapter Toy and Joy, on 3D shapes, students can make things with clay or soil, explore boxes and bottles, or list the shapes used in an old building or monument nearby. Local artwork, heritage, and occupations can be used for patterns, measurement, and shapes. While teaching measurement, describe how local terms relate to standard terms. Discuss improper use of terms, like milk, a liquid measured in litres, being asked for in kilograms. In Class 4, the chapter Thousands Around Us uses langar, a community lunch common in temples and Gurdwaras; learners can explore when such an occasion happens locally.", "Select one common chapter from the old and new textbooks and identify the changes made, and reflect on why.", "Characteristics of a good book. It should be colourful, attractive, and easy to understand at the primary level. Its language should be easy to comprehend. It should not carry too much content, and should give scope to think, talk, and work mathematically. It should offer opportunities to think critically and discuss. It should allow learners to express their thoughts and reflect. It should suggest resources and strategies for teachers. And it should carry a variety of activities and questions that foster mathematical thinking rather than mugging up facts and algorithms.", "Think and reflect. How are the new NCERT books better than the previous ones? Activity 4.4. Compare two books of the same class. List five to seven good points in each, and five to six that need to change, and why."]}, {"t": "Check Your Progress 4.2", "p": ["One, what makes experiential learning a step ahead of learning by doing? Two, fill in the blanks: the textbook is a vital resource of Indian classrooms; a good book should provide opportunity to observe, think and reflect; manipulatives act as elements that transform abstract ideas into tangible, comprehensible experiences; puzzles and riddles provide a platform for mathematical and critical thinking.", "Three, choose the correct option. Textbooks promote critical thinking by offering questions that encourage analysis, comparison, and evaluation. A drawback of relying solely on textbooks is that they may not be up to date with the latest research. The primary purpose of a textbook is to serve as a comprehensive and structured source of information on a specific subject."]}, {"t": "4.6 Let Us Sum Up", "p": ["Classroom teaching should weave around children's knowledge construction, for which they need hands-on experiences. Experiences, facilitated by reflection and modes of representation, namely picture then symbol, help children articulate new ideas. Manipulatives and resources make the classroom lively and should be selected purposefully. Mathematics textbooks at the primary level are an essential resource, but not the only source of teaching and learning."]}, {"t": "4.7 End Exercises", "p": ["One. Comment on the three approaches discussed above. Two. Why does giving experience facilitate learning? Three. Compare NCERT's new books with any private publisher's book and reflect on the philosophy behind both. Four. Discuss the role and importance of manipulatives in teaching shapes in primary classes."]}];
const doc=document.getElementById('doc'),$=id=>document.getElementById(id);
const S=[];
C.forEach((c,si)=>{
  const sec=document.createElement('section');
  const h=document.createElement('h2');h.append(c.t);
  const b=document.createElement('button');b.textContent='Listen';b.onclick=()=>start(firstOf(si));h.append(b);
  sec.append(h);
  c.p.forEach(par=>{
    const p=document.createElement('p');
    (par.match(/[^.?!]+[.?!]+(\s|$)|[^.?!]+$/g)||[par]).forEach(t=>{
      const s=document.createElement('span');s.className='s';s.textContent=t.trim()+' ';
      const i=S.length;s.onclick=()=>start(i);
      S.push({el:s,sec:si,text:t.trim()});p.append(s);
    });
    sec.append(p);
  });
  doc.append(sec);
});
const firstOf=si=>S.findIndex(x=>x.sec===si);
const ss=window.speechSynthesis;
if(!ss){$('warn').hidden=false;$('warn').textContent='This browser does not support speech playback. Please open the file in Chrome, Edge, Safari or Firefox.';}
let idx=0,playing=false,paused=false,token=0,voices=[];
const INDIAN=/(india|rishi|veena|heera|hemant|kalpana|ravi|neerja|prabhat|aditi|raveena|lekha)/i;
function loadVoices(){
  if(!ss)return;
  const L=$('lang').value,base=L.slice(0,2);
  const rank=v=>{
    const lg=v.lang.replace('_','-');
    if(L==='en-IN')return lg.toLowerCase()==='en-in'?0:(INDIAN.test(v.name)&&/^en/i.test(lg))?1:/^en-(GB|AU)/i.test(lg)?3:/^en/i.test(lg)?4:9;
    return lg.toLowerCase()===L.toLowerCase()?0:/^en/i.test(lg)?2:9;
  };
  voices=ss.getVoices().filter(v=>rank(v)<9).sort((a,b)=>rank(a)-rank(b));
  const sel=$('voice');sel.innerHTML='';
  voices.forEach((v,i)=>{const o=document.createElement('option');o.value=i;o.textContent=v.name+' ('+v.lang+')';sel.append(o);});
  const w=$('warn');
  if(!voices.length){w.hidden=false;w.textContent='No English voices were found on this device. Please check your system speech settings.';}
  else if(rank(voices[0])>1){w.hidden=false;w.textContent='No '+$('lang').selectedOptions[0].text+' voice was found on this device, so the closest English voice is selected. For Indian English, install an en-IN voice in your phone or computer speech settings (for example, English India in Google Text-to-speech on Android, or Rishi and Veena on iPhone and Mac).';}
  else w.hidden=true;
}
loadVoices();if(ss)ss.onvoiceschanged=loadVoices;
function mark(i){
  S.forEach(x=>x.el.classList.remove('on'));
  const s=S[i];if(!s)return;s.el.classList.add('on');
  s.el.scrollIntoView({block:'center',behavior:'smooth'});
  $('prog').firstElementChild.style.width=((i+1)/S.length*100)+'%';
  $('now').textContent='Now reading: '+C[s.sec].t;
}
function speak(){
  if(idx>=S.length){finish();return;}
  const my=++token,u=new SpeechSynthesisUtterance(S[idx].text);
  const v=voices[$('voice').value];u.lang=$('lang').value;if(v){u.voice=v;u.lang=v.lang;}
  u.rate=parseFloat($('rate').value);
  mark(idx);
  u.onend=()=>{if(my===token&&playing){idx++;speak();}};
  u.onerror=()=>{if(my===token&&playing&&!paused){idx++;speak();}};
  ss.speak(u);
}
function start(i){ss.cancel();token++;idx=i;playing=true;paused=false;$('play').textContent='Pause';setTimeout(speak,60);}
function finish(){playing=false;paused=false;idx=0;$('play').textContent='Play';$('now').textContent='Finished. Press Play to listen again.';}
$('play').onclick=()=>{
  if(!playing)return start(idx);
  if(paused){ss.resume();paused=false;$('play').textContent='Pause';}
  else{ss.pause();paused=true;$('play').textContent='Resume';}
};
$('stop').onclick=()=>{ss.cancel();token++;playing=false;paused=false;idx=0;$('play').textContent='Play';
  S.forEach(x=>x.el.classList.remove('on'));$('prog').firstElementChild.style.width='0';$('now').textContent='Stopped.';};
$('next').onclick=()=>{const s=Math.min(C.length-1,(S[idx]?S[idx].sec:0)+1);start(firstOf(s));};
$('prev').onclick=()=>{const cur=S[idx]?S[idx].sec:0;start(firstOf(idx>firstOf(cur)?cur:Math.max(0,cur-1)));};
$('lang').onchange=()=>{loadVoices();if(playing&&!paused)start(idx);};
['rate','voice'].forEach(id=>$(id).onchange=()=>{if(playing&&!paused)start(idx);});
window.addEventListener('beforeunload',()=>ss&&ss.cancel());
</script>
</body>
</html>
