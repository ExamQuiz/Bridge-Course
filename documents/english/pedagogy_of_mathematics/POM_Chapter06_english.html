<style>
:root{--bg:#f3f4fa;--ink:#1d2340;--mute:#5b6288;--card:#fff;--line:#d5d8ea;--ac:#2b3990;--hi:#ffe9a8}
@media (prefers-color-scheme:dark){:root{--bg:#141833;--ink:#e9ebf8;--mute:#a3a9cf;--card:#1d2245;--line:#343a70;--ac:#8f9dff;--hi:#4a3f14}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.7 Georgia,"Times New Roman",serif}
header{padding:28px 20px 10px;max-width:760px;margin:auto}
header small{color:var(--mute);font:14px system-ui,sans-serif}
h1{margin:4px 0 0;font-size:2rem;color:var(--ac)}
.bar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
.bar div{max-width:760px;margin:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font:14px system-ui,sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--ac);background:var(--card);color:var(--ac);cursor:pointer;max-width:100%}
button.main{background:var(--ac);color:var(--card)}
button:focus-visible,select:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
#prog{flex:1 1 100%;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
#prog i{display:block;height:100%;width:0;background:var(--ac)}
#now{flex:1 1 100%;color:var(--mute)}
main{max-width:760px;margin:auto;padding:10px 20px 60px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 22px 14px;margin:18px 0}
h2{font-size:1.25rem;color:var(--ac);display:flex;justify-content:space-between;gap:10px;align-items:center}
h2 button{font-size:13px;padding:4px 10px;flex:none}
p{margin:.7em 0}
.s{cursor:pointer;border-radius:3px}
.s:hover{text-decoration:underline dotted}
.s.on{background:var(--hi)}
.note{color:var(--mute);font:14px system-ui,sans-serif;padding:0 20px;max-width:760px;margin:auto}
</style>

<body>
<header><small>Pedagogy of Mathematics · Unit 3 · Chapter 6</small><h1>Planning in Mathematics</h1></header>

<main id="doc"></main>
<script>
const C=[{"t": "6.1 Introduction", "p": ["Teaching involves four steps: planning, delivering the content, which is called transaction, evaluation, and remediation. In a class where learners differ in capability, interest, caste, creed, language, and culture, effective planning is what makes teaching successful for each learner.", "Effective planning answers three questions: what to teach, when to teach, and how to teach. This needs annual, monthly, and daily planning. You should know the curricular goals of mathematics for the class, the learning outcomes for each unit, the activities for concept development, the learning resources, the strategies for sustaining interest, and the evaluation techniques. This chapter discusses the importance of planning, curricular goals, learning outcomes, unit planning, and lesson planning at the foundational and preparatory stages."]}, {"t": "6.2 Learning Outcomes", "p": ["After completing the chapter, the learner designs curricular goals and learning outcomes, explains the importance of planning, and develops a unit plan and a daily plan for mathematics learning."]}, {"t": "6.3.1 Curricular Goals", "p": ["Curricular goals are statements about a course or subject that tell us broadly about its goals and implications. They are derived from the philosophy and approaches in the National Curriculum Framework. They help educationists, teachers, and learners understand the what and why of a subject, and give curriculum developers a framework for teaching-learning strategies and assessment.", "Curricular goals give direction to all stakeholders. Teachers learn about learning outcomes, instructional strategies, and assessment techniques, and learners learn what is expected of them. Curricular goals have a definite purpose, state the intended aims of a subject, guide curriculum developers, are framed by aligning the broader aims of education with the nature of the subject, form the basis for designing any curriculum, help assess the overall effectiveness of a course, and provide a road map of learning outcomes."]}, {"t": "6.3.3 Writing of Curricular Goals", "p": ["Curricular goals should be observable and should specify what learners will be able to perform or apply. Active verbs describe the action we want learners to show. Goals must be feasible and achievable for the majority of learners. Writing them involves five steps.", "Step one, purpose. Is the goal for a course, subject, unit, or lesson? What is the time duration? What are the learning outcomes?", "Step two, expectations from learners. What will learners be able to do at the end? What outcomes will they achieve in terms of the levels of Bloom's Taxonomy? What important competencies must they acquire?", "Step three, specific objectives. Do the verbs describe measurable behaviour? Is the language clear and free from ambiguity?", "Step four, achievability. Do the objectives align with the standard of the curriculum? Are they feasible for a majority of learners? Do learners have the resources to achieve them?", "Step five, reflection. Learners are assessed through formative and flexible techniques at regular intervals, and the goals are reflected upon for relevance to learners' needs.", "Consider writing specific objectives. Learners understand a triangle is vague, as it is not clear how understanding is assessed. Clear objectives are: the learner is able to identify, draw, define, classify, or name a triangle."]}, {"t": "Bloom's Taxonomy", "p": ["Bloom's Taxonomy is a hierarchical framework for framing learning objectives in measurable terms, developed by Benjamin Bloom and his committee in the 1950s and later revised. It has three domains: cognitive, or thinking; affective, or feeling; and psychomotor, or physical. The cognitive domain, the most widely used, has six levels.", "Remember means recalling facts, for example reciting a table or defining a triangle. Key verbs: define, describe, identify, list, recall, and recognise.", "Understand means explaining ideas, for example explaining the difference between a square and a rectangle. Key verbs: explain, interpret, summarise, translate, and simplify.", "Apply means using learned information in a new situation, for example using a formula to solve word problems. Key verbs: apply, calculate, demonstrate, solve, and use.", "Analyse means breaking information into parts and understanding relationships, for example identifying what is given and what is to be found. Key verbs: analyse, compare, differentiate, distinguish, and examine.", "Evaluate means making judgments based on criteria, for example evaluating the solution of a problem. Key verbs: assess, critique, evaluate, justify, support, and recommend.", "Create means producing something new, for example designing a new product or formulating a new hypothesis. Key verbs: build, create, design, and develop.", "The affective domain covers attitudes, values, interests, and emotions: receiving, responding, valuing, organising, and internalising. The psychomotor domain covers physical skills: imitation, manipulation, precision, articulation, and naturalisation.", "Learning activities and curricular goals are not the same. Activities are a way to achieve goals, while for curricular goals, learners' previous knowledge and learning environment should be given due weightage.", "Check your progress 6.1. A Class 4 teacher wrote the objective, learners will understand the concept of triangle. What suggestions would you give to improve it? Write any two learning objectives for the concept of triangle."]}, {"t": "6.3.4 Examples of Curricular Goals in Mathematics", "p": ["Some curricular goals at the preparatory stage. Learners are able to perform the four fundamental operations of addition, subtraction, multiplication, and division fluently. They can solve problems based on these operations, including reasoning and analysing the answer. They can explain numbers, measurement, data handling, patterns, and shapes in simple language. They gain a positive attitude towards mathematics through joyful, engaging, and hands-on activities. They apply mathematical knowledge in real-life situations. And they develop critical thinking skills through mathematical concepts.", "Activity 6.1. Frame three curricular goals in mathematics at the foundational stage. Compare the goals of the foundational and preparatory stages, and note what you observe."]}, {"t": "6.3.5 Learning Outcomes", "p": ["Learning outcomes are precise, focused, and measurable statements that define what learners are expected to know, perform, apply, and value by the end of a course. They work as a road map for authorities, teachers, and learners. They are clear, specific, and accurate; assessed through well-defined questions, so they are objective, without subjectivity or ambiguity; measurable; and learner-centric, framed from the learner's perspective. Curricular goals are assessed through learning outcomes, and expected behaviour is assessed mostly through action verbs.", "Check your progress 6.2. What are the advantages of writing learning outcomes in a mathematics classroom? Which of the following is reflected by the National Curriculum Framework 2003? The answer is A: a major goal is to eliminate fear of mathematics among students."]}, {"t": "6.3.6 Examples of Learning Outcomes", "p": ["Counting and number recognition. The learner will be able to count a given number of objects, up to 20, and represent the number correctly. Read a given number and draw the same number of seeds from a box. Read a number and tell its predecessor, and its successor, with reasons. Represent numbers through Dienes Blocks. Compare two numbers and put the appropriate sign, greater than, less than, or equal to, between them.", "Four fundamental operations. Add, subtract, multiply, or divide two numbers with concrete objects or tally marks. Solve daily-life word problems accurately.", "Shapes. Identify and name a rectangle, square, triangle, or circle. Tell their properties in terms of edges and corners. Draw closed and open figures with reasons.", "Measurement. Measure the length of a tabletop, a textbook, or a copy with a scale. Estimate and classify the weight of a pencil, book, pencil box, or lunch box as more than half a kilogram or less than half a kilogram.", "Data handling. Draw simple information from a bar graph and histogram. Draw bar graphs and histograms from given data. Tell the use of bar graphs and histograms.", "Patterns. Identify whether a unit is repeated in a pattern. Extend a given number pattern. Extend a given geometric pattern with different shapes.", "Activity 6.2. Go through the Class 1 mathematics textbook and frame learning outcomes for the first three lessons. Then go through the Class 2 textbook and frame outcomes for the last three lessons.", "Check your progress 6.3. Write four characteristics of learning outcomes in classroom teaching."]}, {"t": "6.4 Importance of Planning", "p": ["Planning of any task, smaller or bigger, plays a pivotal role in its success, as the planner pays attention to each detail, challenge, and constraint before conducting it. Teaching mathematics is challenging, as we must align the learning expectations of the course with learners of different experiences, interests, abilities, and cultures. Systematic planning aligns the goals of learning with the needs of the learner by managing time and resources effectively.", "First, define the goals, objectives, and learning outcomes for the course, and then for each lesson. Second, plan teaching strategies and engaging activities for different learners. Planning helps deal with anticipated challenges and manage learners' behaviour. Third, it enables time management, so that each topic is delivered within its time, with room for practice, oral work, and sharing of learners' experiences.", "Fourth, well-planned lessons create a positive learning environment, with clear goals, participation, motivation, and feedback that make mathematics joyful. Fifth, planning enables assessment techniques aligned with learning outcomes. Sixth, it improves the teacher's self-confidence. Seventh, planning is a collaborative effort, where teachers of the same subject and class share experiences and best practices.", "To sum up, planning in mathematics creates a joyful, dynamic, and active learning environment, and is a must in the teaching-learning process.", "Check your progress 6.4. How does planning in mathematics help build a learning environment? Which is not a characteristic of effective planning? The answer is B: focus on rote memorisation of formulas."]}, {"t": "6.4.1 Types of Mathematics Planning: Yearly Planning", "p": ["Mathematics planning ranges from yearly plans to lesson plans. A yearly plan is made just before the new session begins. Lessons are arranged hierarchically based on psychological principles, maxims of teaching, and the time schedule. Content may be arranged by three or four terms, with each term covering some facts, concepts, procedures, and applications. At the foundational and preparatory stages, each term covers concepts on numbers, geometrical thinking, data handling, and so on, to avoid monotony.", "Sometimes the yearly plan is given by authorities, like KVS, NVS, the Directorate of Education, or the Municipal Corporation of Delhi, prepared by senior teachers and experts. This brings uniformity to the course and evaluation. Feedback on the previous year's design and execution is used to avoid earlier challenges. The plan makes room for project work, field visits, technical resources, hands-on activities in the mathematics lab, peer tutoring, group work, and self-learning, in line with the holistic approach of NEP 2020.", "There is no fixed format. The exemplar for Class 3, using the textbook Maths Mela, lists lessons by term with teaching method, assessment, and project work. For example, the lesson What's in a Name uses experiential learning, and the project asks children to write the name of each family member and observe which has the largest and smallest number of letters. Toy Joy has a project to make an object with three boxes of different shapes. Fun with Shapes suggests making a rangoli using three shapes on grid paper. Raksha Bandhan asks children to list the arrangements made in their family. Time Goes On asks children to calculate holiday days from the annual calendar. Fair Share asks them to colour one-half red, one-third green, and one-sixth yellow. The Surajkund Fair asks them to describe a local fair and draw three things they saw. Teaching methods include play way, activity-based, and discovery-based methods, with formative assessment and 360-degree evaluation. You may also include the number of periods for each lesson.", "Activity 6.3. Develop a term-wise yearly plan for the Class 4 textbook, and a month-wise plan for the Class 2 textbook, according to the resources in your school.", "Check your progress 6.5. How many types of mathematics planning are there, and how do they differ? Yearly planning is done by teachers, option D."]}, {"t": "6.5 Unit Planning", "p": ["Before unit and lesson plans, we need a clear idea of the curricular goals and the learning outcomes of a unit. In a mathematics textbook, some lessons have common objectives; together they make a unit, consisting of related concepts. For example, the first unit of Maths Mela for Class 3, from the chapter What's in a Name, covers numbers one to one hundred, with methods of counting and grouping through activities and materials. The book has fourteen chapters, from What's in a Name to The Surajkund Fair. Unit planning helps decide the sequence of concepts, the support material, and the assessment technique.", "6.5.1 Need of unit planning. Unit planning improves the quality of teaching. It treats the unit as a whole and recognises the interconnectedness of its components. It helps organise the structure with time and resources, design content in a sequential, graded, and systematic manner, plan multiple approaches for individual differences, plan unit-wise assessment, organise remedial teaching and enrichment, and give harmonious arrangement to the elements of the unit."]}, {"t": "6.5.2 Steps of Unit Planning", "p": ["Unit planning involves selecting the content and arranging it in a logical sequence, while avoiding imbalance, such as one unit taking over a month while another finishes in a few periods. Guidelines: list the complete course content or competencies for the class. Estimate the total time available. Arrange content in a logical sequence based on psychological principles of learning. Identify relations and linkages between content and competencies. Then form units on these principles: a unit should be neither too small nor too lengthy; it should have elements of commonness; it should not need more than a month, to avoid boredom; it should give a feeling of accomplishment to teacher and learner; and it should be divisible into lesson plans. There is no hard rule, but generally a unit is completed within 20 days, with no more than 10 competencies."]}, {"t": "6.5.3 Development of a Unit Plan", "p": ["There is no fixed format. A suggestive format has: unit plan number, class, subject, duration, and name of the teacher; the area, for example, Understanding Numbers up to 100, Part 1; the competencies covered, such as counting objects in groups, making a grid of 100 units using ten strips, regrouping numbers in tens and ones, comparing quantities up to 100, estimating the number of objects and verifying by counting, and recognising numbers as labels.", "Then the unit and lesson; the pedagogy, where NEP 2020 suggests the play way method, activity-based method, demonstration method, and experiential learning at the foundational and preparatory stages; teaching learning material, such as unit and ten cards, objects like seeds, leaves, and beads, cubic rods, and Dienes blocks; learner activities, such as hands-on activities, group work, peer learning, problem solving, and joyful activities; and assessment, through rubrics, projects, problem solving, or activities. NEP 2020 focuses on 360-degree assessment.", "Activity 6.4. Choose a topic from the Class 3 textbook and develop a unit plan, and do the same for Class 4."]}, {"t": "6.5.4 Limitations of Unit Plan", "p": ["A unit plan gives a partial view of the year's content. It is sometimes difficult to anticipate the method and the number of days beforehand. Sometimes the division of content gives artificial views. It reduces the teacher's flexibility and spontaneity if followed rigidly. And not all teachers may be able to make a good unit plan.", "Check your progress 6.6. How is a unit plan important for teachers? Which is not part of a unit plan: a detailed daily schedule, option C. Which is not a benefit of unit planning: allowing rigid adherence to a predefined teaching approach, option D."]}, {"t": "6.6 Lesson Plan", "p": ["A lesson plan is a plan for teaching a lesson in one period in advance. It helps teachers foresee problems that may arise during delivery, and transact focus points, linkages, and comparisons logically. It is a method of taking decisions about the selection, sequencing, delivery, and execution of activities to provide learning experiences.", "6.6.1 Need of lesson planning. It helps avoid getting stuck during a class, finishing before the period is over, or leaving out important elements. It makes teaching organised, systematic, and effective; helps select and sequence content; uses time properly; develops insight into learners' needs and achievements; plans activities that strengthen participation, making teaching two-way communication; strengthens self-confidence; and helps identify and remedy learning difficulties as assessment is done along with teaching."]}, {"t": "6.6.2 Steps of Lesson Planning", "p": ["First, select the content. It should be interesting, meaningful, and relevant to the learner's day-to-day life. Second, formulate general and specific objectives, keeping in mind the competency to be developed. Third, select an appropriate method of teaching, according to the content and learners' needs, giving active participation through hands-on activities. Fourth, select appropriate techniques of assessment to evaluate the lesson."]}, {"t": "6.6.3 Development of a Lesson Plan", "p": ["The Herbartian method of lesson planning was traditionally used. In the constructivist approach, learners actively participate and construct learning on their own. So we use a constructivist lesson plan based on the 5 Es: Engage, Explore, Explain, Elaborate, and Evaluate.", "Engage: interest learners with puzzles, problems, a demonstration, a task, pictures, or video clips, linking previous knowledge to the new concept.", "Explore: learners explore concepts through hands-on activities or experiments, independently or in small groups, to discover and verify ideas.", "Explain: the teacher explains the concepts through key words and new ideas, helping learners construct their own learning.", "Elaborate: learners apply their learning to new situations, deepen understanding, and use the concept in real-world applications.", "Evaluate: evaluate understanding and foster reflection through quizzes, projects, activities, or problem-solving tasks.", "Example: a 5Es lesson plan on Counting in Groups, Class 2, Lesson 1, A Day at the Beach, forty minutes. Learning objectives: the learner will be able to count objects in groups of ten, and give examples of objects that come in groups of ten.", "Engage: show a picture of a fruit seller selling bananas, oranges, chikoos, and watermelon. Ask learners what they observe, the names of the fruits, and to count the different fruits.", "Explore: ask how they counted, one by one or in groups, and which is easier and faster. Give cut-outs of boxes, each containing ten pencils or ten pens, and ask them to count the total in two or three boxes, guiding them to discover that counting in groups of ten is easier.", "Explain: show how counting 27 pencils, 18 pens, or 32 beads is easier in groups of ten. For example, 25 pencils are 2 boxes and 5 pencils; 32 beads are 3 malas and 2 beads; 45 chikoos are 4 trays of ten and 5 chikoos.", "Elaborate: word problems. Eshan helps in his father's stationery shop, where three customers buy pencils. Help Eshan choose the number of boxes and loose pencils by filling in a table.", "Evaluate: a quiz on counting in groups; naming three objects that come in groups of ten; and a project to name three things that come in groups other than ten. The plan may also list adaptations for learners with special educational needs, such as hearing or visual impairment and learning difficulties.", "Activity 6.5. Develop a lesson plan on Fun with Shapes for Class 3, and on parts and wholes for Class 4."]}, {"t": "6.6.4 Limitations of Lesson Planning", "p": ["Too much emphasis on lesson planning may make classroom teaching a routine. It is also difficult to anticipate all classroom situations, so sometimes a plan lacks relevance.", "Check your progress 6.7. The most important aspect of a mathematics lesson plan is organising instructions, activities, and content systematically, option B. A limitation of lesson planning in contemporary practice is that it may restrict teacher flexibility by encouraging rigid adherence to predetermined steps, option A."]}, {"t": "6.6.5 Conversion of a Unit Plan into Lesson Plans", "p": ["A unit plan is converted into daily lesson plans by breaking the broader goals and content into smaller lessons. Follow these steps. One, understand the unit plan, with its goals and learning outcomes. Two, analyse the content into meaningful chunks: concepts, topics, operations, facts, formulae, and skills. Three, align formative and summative assessments with the objectives. Four, break the unit into lessons. Five, sequence the content logically and decide what each lesson covers. Six, formulate specific, measurable lesson objectives from the unit's objectives. Seven, design engaging, interactive activities that give practice and application. Eight, select resources such as textbooks, articles, videos, learning material, or online materials. Nine, connect each lesson to prior knowledge, building new concepts on previous lessons for a cohesive experience."]}, {"t": "6.7 Let Us Sum Up", "p": ["It is important for teachers to appreciate the need for planning before teaching. Planning helps the teacher think in advance about the sequence of teaching and learning activities and organise classroom interaction meaningfully.", "Yearly planning considers the curricular goals of the course, giving a broad understanding of what is to be taught in the session. Unit planning emphasises the learning outcomes or competencies, and arranges related lessons systematically. Lesson planning, for a single lesson of about forty to fifty minutes, organises teaching efficiently. Teachers should develop the habit of planning units and lessons regularly. Lesson plans based on the 5Es approach are learner-centred and encourage students to construct learning on their own."]}, {"t": "6.8 End Exercises", "p": ["One. How does a unit plan help in building a learning environment in the classroom? Two. According to you, when should a mathematics teacher do unit planning for the course? Three. Write the steps of the 5Es lesson plan on shapes for Class 3. Four. Justify the statement, lesson planning is a roadmap for teachers."]}];
const doc=document.getElementById('doc'),$=id=>document.getElementById(id);
const S=[];
C.forEach((c,si)=>{
  const sec=document.createElement('section');
  const h=document.createElement('h2');h.append(c.t);
  const b=document.createElement('button');b.textContent='Listen';b.onclick=()=>start(firstOf(si));h.append(b);
  sec.append(h);
  c.p.forEach(par=>{
    const p=document.createElement('p');
    (par.match(/[^.?!]+[.?!]+(\s|$)|[^.?!]+$/g)||[par]).forEach(t=>{
      const s=document.createElement('span');s.className='s';s.textContent=t.trim()+' ';
      const i=S.length;s.onclick=()=>start(i);
      S.push({el:s,sec:si,text:t.trim()});p.append(s);
    });
    sec.append(p);
  });
  doc.append(sec);
});
const firstOf=si=>S.findIndex(x=>x.sec===si);
const ss=window.speechSynthesis;
if(!ss){$('warn').hidden=false;$('warn').textContent='This browser does not support speech playback. Please open the file in Chrome, Edge, Safari or Firefox.';}
let idx=0,playing=false,paused=false,token=0,voices=[];
const INDIAN=/(india|rishi|veena|heera|hemant|kalpana|ravi|neerja|prabhat|aditi|raveena|lekha)/i;
function loadVoices(){
  if(!ss)return;
  const L=$('lang').value,base=L.slice(0,2);
  const rank=v=>{
    const lg=v.lang.replace('_','-');
    if(L==='en-IN')return lg.toLowerCase()==='en-in'?0:(INDIAN.test(v.name)&&/^en/i.test(lg))?1:/^en-(GB|AU)/i.test(lg)?3:/^en/i.test(lg)?4:9;
    return lg.toLowerCase()===L.toLowerCase()?0:/^en/i.test(lg)?2:9;
  };
  voices=ss.getVoices().filter(v=>rank(v)<9).sort((a,b)=>rank(a)-rank(b));
  const sel=$('voice');sel.innerHTML='';
  voices.forEach((v,i)=>{const o=document.createElement('option');o.value=i;o.textContent=v.name+' ('+v.lang+')';sel.append(o);});
  const w=$('warn');
  if(!voices.length){w.hidden=false;w.textContent='No English voices were found on this device. Please check your system speech settings.';}
  else if(rank(voices[0])>1){w.hidden=false;w.textContent='No '+$('lang').selectedOptions[0].text+' voice was found on this device, so the closest English voice is selected. For Indian English, install an en-IN voice in your phone or computer speech settings (for example, English India in Google Text-to-speech on Android, or Rishi and Veena on iPhone and Mac).';}
  else w.hidden=true;
}
loadVoices();if(ss)ss.onvoiceschanged=loadVoices;
function mark(i){
  S.forEach(x=>x.el.classList.remove('on'));
  const s=S[i];if(!s)return;s.el.classList.add('on');
  s.el.scrollIntoView({block:'center',behavior:'smooth'});
  $('prog').firstElementChild.style.width=((i+1)/S.length*100)+'%';
  $('now').textContent='Now reading: '+C[s.sec].t;
}
function speak(){
  if(idx>=S.length){finish();return;}
  const my=++token,u=new SpeechSynthesisUtterance(S[idx].text);
  const v=voices[$('voice').value];u.lang=$('lang').value;if(v){u.voice=v;u.lang=v.lang;}
  u.rate=parseFloat($('rate').value);
  mark(idx);
  u.onend=()=>{if(my===token&&playing){idx++;speak();}};
  u.onerror=()=>{if(my===token&&playing&&!paused){idx++;speak();}};
  ss.speak(u);
}
function start(i){ss.cancel();token++;idx=i;playing=true;paused=false;$('play').textContent='Pause';setTimeout(speak,60);}
function finish(){playing=false;paused=false;idx=0;$('play').textContent='Play';$('now').textContent='Finished. Press Play to listen again.';}
$('play').onclick=()=>{
  if(!playing)return start(idx);
  if(paused){ss.resume();paused=false;$('play').textContent='Pause';}
  else{ss.pause();paused=true;$('play').textContent='Resume';}
};
$('stop').onclick=()=>{ss.cancel();token++;playing=false;paused=false;idx=0;$('play').textContent='Play';
  S.forEach(x=>x.el.classList.remove('on'));$('prog').firstElementChild.style.width='0';$('now').textContent='Stopped.';};
$('next').onclick=()=>{const s=Math.min(C.length-1,(S[idx]?S[idx].sec:0)+1);start(firstOf(s));};
$('prev').onclick=()=>{const cur=S[idx]?S[idx].sec:0;start(firstOf(idx>firstOf(cur)?cur:Math.max(0,cur-1)));};
$('lang').onchange=()=>{loadVoices();if(playing&&!paused)start(idx);};
['rate','voice'].forEach(id=>$(id).onchange=()=>{if(playing&&!paused)start(idx);});
window.addEventListener('beforeunload',()=>ss&&ss.cancel());
</script>
</body>
</html>
