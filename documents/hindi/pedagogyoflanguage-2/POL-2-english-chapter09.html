<script>
const C=[{"t":"9.1 INTRODUCTION","p":["Reading is not merely a basic academic skill but a gateway to learning in all content areas. Historically, the assessment of reading was limited to rote testing, oral recitation, and recognition of printed words—methods that often overlooked deeper comprehension and critical thinking. The need for reading assessment arises from its centrality in academic success and lifelong learning. Without accurate assessment, educators cannot identify student needs, differentiate instruction, or evaluate the effectiveness of teaching strategies. Older methods of reading assessment primarily focused on surface-level proficiency. These included:","• Oral Reading Tests: Students read aloud while teachers noted errors, often emphasising speed and accuracy over meaning.","• Word Lists and Flashcards: Tools to assess sight word recognition and decoding skills, useful but limited in scope. Assessment of Oral Language: Tools and Strategies","● Reading Readiness Tests: Common in early education, these measured basic perceptual and motor skills, often failing to predict future comprehension abilities.","● Standardised Silent Reading Tests: Typically multiple-choice, assessing literal recall without insight into thought processes or inferential understanding. While these tools offered some insight, they often failed to account for students' diverse linguistic backgrounds, learning styles, and cognitive strategies. The modern landscape of reading assessment calls for a broader, more nuanced approach. This chapter explores the foundational concepts, diverse tools, and comprehensive strategies essential for assessing reading in educational settings. Through detailed explanations and examples, we examine how reading comprehension, textual engagement, miscue analysis and thoughtful assessment design work in concert to support literacy development."]},{"t":"9.2 LEARNING OUTCOMES","p":["After completion of this chapter, the learner:","• Recalls prior knowledge about reading and its processes, and develops an understanding of the need for assessment in light of contemporary approaches to literacy learning.","• Develops a better understanding of the assessment of reading and various types of tools and strategies","• Designs tasks for reading and creates assessment rubrics tailored for the classroom environment.","• Gives proper feedback to students after understanding the nature of errors in reading and miscue analysis.","• Creates a question paper on the basis of understanding of reading its assessment, following the new approaches."]},{"t":"9.3 READING WITH COMPREHENSION","p":[]},{"t":"9.3.1 What is Reading?","p":["Reading is a multi-dimensional process that encompasses the ability to decode written language, understand and interpret meaning, and critically engage with text. It includes both lower-level skills (decoding, fluency) and higher-level thinking (analysis, synthesis, evaluation). Assessment of Oral Language: Tools and Strategies Key Components:","• Decoding: Translating written symbols (letters and words) into spoken language.","• Phonemic Awareness: Recognising and manipulating sounds in spoken words.","• Fluency: The ability to read text accurately, quickly, and with expression.","• Vocabulary: The body of words students must understand to read meaningfully.","• Comprehension: The process of constructing meaning from text."]},{"t":"9.3.2 Importance of Reading Assessment","p":["Reading assessment serves various critical functions, each playing a vital role in shaping instruction and enhancing literacy development:","• Diagnosis: This function involves identifying studentsʼ current reading abilities, including their strengths, weaknesses, and learning needs. Diagnostic assessment is essential for understanding where a student stands before instruction begins. For example, a diagnostic test may reveal that a student can decode individual words but struggles with comprehending longer texts. Such insights allow teachers to personalise instruction.","• Monitoring: Monitoring refers to the continuous process of tracking student progress over time. It enables teachers to see how well students are responding to instruction. Frequent formative assessments—such as running records, reading journals, or informal questioning—help teachers adjust pacing, strategies, or materials as needed. Effective monitoring prevents students from falling behind unnoticed.","• Evaluation: Evaluation is a summative function that measures the effectiveness of reading programs, teaching methods, and student learning outcomes. Unlike diagnosis or monitoring which inform daily instruction, evaluation typically occurs at the end of a unit, term, or academic year. Standardised reading tests, final projects, and comprehensive reading exams are examples of tools used for evaluation.","• Accountability: Accountability ensures that teachers, schools, and educational systems are meeting established learning standards. Assessment of Oral Language: Tools and Strategies Assessment results are often reported to parents, school boards, or government agencies to demonstrate educational quality and equity. Accountability data may influence funding decisions, curriculum development, or instructional training. Each function plays a complementary role, creating a feedback loop that supports effective teaching and responsive learning. Diagnostic assessments inform instruction; monitoring guides ongoing teaching decisions; evaluation judges outcomes; and accountability ensures transparency and systemic improvement."]},{"t":"9.3.3 Types of Reading Skills","p":["• Basic Reading: Involves phonics, word recognition, and simple comprehension. For example, a basic reading assessment might include a phonics activity where students are shown a set of letters (e.g., “c-a-t”) and asked to blend the sounds to form the word. Another task could involve identifying high-frequency sight words like “the,” “and,” or “is” from a list. In terms of comprehension, a simple task might ask students to read a short story about a dog playing in a park and answer basic questions such as “What animal is the story about?” or “Where is the dog playing?” These tasks evaluate students’ foundational reading abilities and ensure they are equipped with the skills necessary for more complex literacy tasks.","• Intermediate Reading: Includes summarising, predicting, and identifying main ideas. For example, an intermediate reading task might involve reading a short story or article and summarising it in five sentences, capturing the main events or key information. A predictive reading activity could ask students to read the first two paragraphs of a narrative and then predict what might happen next, providing justification based on textual clues. Identifying main ideas might involve highlighting or underlining the most important sentence in each paragraph or selecting a suitable title for a passage. These tasks build students’ abilities to grasp the essence of a text and anticipate or infer meaning, which are crucial for independent reading and comprehension.","• Advanced Reading: Requires critical analysis, evaluating arguments, and synthesising information. For example, an advanced reading task might present students with two editorials offering opposing viewpoints on a controversial issue such as climate policy. Students would be asked to identify each author’s main argument, evaluate the strength of the Assessment of Oral Language: Tools and Strategies supporting evidence, and write a comparative analysis discussing the persuasiveness of both pieces. Another activity could involve reading a complex informational text (e.g., a journal article on neuroscience) and then integrating ideas from that article with prior readings to create a new synthesis in the form of an essay or presentation. These tasks assess a student’s ability to process complex information, make evaluative judgments, and construct coherent responses that draw from multiple sources. Why Basic and Intermediate Skills Suit Primary Students? The first two stages of reading—basic and intermediate—are especially important for primary children because they focus on building strong foundations. At this age, children are still learning to recognise letters, join sounds, and read simple words, which comes under basic reading. As they grow more confident, they can handle short stories, retell them in their own words, and make small predictions, which are part of intermediate reading. These activities are simple, enjoyable, and age-appropriate, helping young learners gain confidence and develop a love for reading before moving on to advanced skills in higher classes."]},{"t":"9.3.4 Reading with Comprehension","p":["Reading comprehension is the ability to process text, understand its meaning, and integrate it with existing knowledge. It is essential for learning in all subjects. For example, in the NCERT Class V English textbook, the lesson \"The Talkative Barber\" includes a story followed by questions that require students to recall details, infer characters’ motives, and express opinions about actions taken in the narrative. These tasks help assess comprehension at multiple levels—literal, inferential, and evaluative—illustrating how reading comprehension activities are embedded in curricular materials to develop and measure understanding. Dimensions of Comprehension","• Literal Comprehension: Understanding factual information directly stated.","• Inferential Comprehension: Reading between the lines to draw conclusions.","• Evaluative Comprehension: Making judgments about the text based on evidence. Assessment of Oral Language: Tools and Strategies"]},{"t":"9.3.5 Selection of texts and introducing children to different genres","p":["When selecting texts for children, it is important to strike a balance between literary value, age-appropriateness, and variety. The vocabulary and sentence structure should be suited to the child’s reading ability. For younger readers, picture books like ʻʻThe Very Hungry Caterpillarʼʼ by Eric Carle or ʻʻBrown Bear, Brown Bear, What Do You See?ʼʼ by Bill Martin Jr. offer repetition and rhythm, while slightly older children might enjoy early chapter books such as Magic Tree House by Mary Pope Osborne or Geronimo Stilton. A practical approach is to ensure that the text is neither too easy nor overwhelmingly hard; the “five-finger rule” is a useful guide—if a child struggles with more than five words on a page, the book might be too advanced. Texts should also connect with children’s lives while broadening their horizons. For instance, Indian folktales like Tenali Raman stories or Akbar-Birbal tales give cultural familiarity, while books like Last Stop on Market Street by Matt de la Peña or Sulwe by Lupita Nyong’o introduce diverse settings and perspectives. Including a wide range of authors and voices ensures that children see themselves in stories but also step into worlds very different from their own. Children’s interests are a powerful motivator for reading. For example, an animal lover may enjoy The Wild Wisdom Quiz Book by WWF-India or Ruskin Bond’s nature stories like The Jungle Omnibus. A child fascinated by mysteries might gravitate toward Byomkesh Bakshi stories by Sharadindu Bandyopadhyay (in simplified versions for younger readers) or the Famous series by Enid Blyton. Even within the classroom, allowing students to choose from a small curated selection helps them feel ownership over their reading. For instance, adventure lovers may enjoy Chandrakanta (adapted for children) or The Adventures of Feluda by Satyajit Ray; those who prefer humor might connect with Sudha Murty’s Grandma’ s Bag of Stories; while science-enthusiasts may find inspiration in Scientists of India by Nandita Basu or The Vedic Maths series. It is also essential to offer a mix of genres so children learn to appreciate different styles and purposes of writing. Fiction can range from fairy tales like Cinderella or The Snow Queen to contemporary realistic stories like Wonder by R.J. Palacio. Non-fiction can include biographies such as I Am Malala (Young Readers Edition) or nature books like The Big Book of Bugs by Yuval Zommer. Poetry might be introduced through ʻʻA Light in the Atticʼʼ by Shel Silverstein or Tiger, Tiger Burning Bright! edited by Fiona Waters, while drama Assessment of Oral Language: Tools and Strategies could be explored with short plays for children, such as adaptations of Alice in Wonderland or The Jungle Book. Folktales and myths from around the world— Greek myths like Percy Jackson’s Greek Gods or African folk tales like Anansi the Spider—also expand children’s cultural literacy. Teachers can help children notice the distinctive features of each genre through simple classroom practices. A “genre wall” with colourful covers and short descriptions encourages exploration. Read-aloud sessions can rotate between genres—for example, one week a humorous short story, the next week an informational text about space, and later a lyrical poem about the moon. Discussions after reading can focus on what made each text unique, whether it was the structure, the tone, or the way information was presented. Comparative reading is another engaging strategy; for example, a poem like ʻʻRainʼʼ by Robert Louis Stevenson can be paired with a short factual article on the water cycle, encouraging children to compare the mood and purpose of the two pieces. Over time, this variety of reading experiences builds genre awareness and confidence. Children begin to recognise patterns—poems use imagery and rhythm, non-fiction uses headings and diagrams, and fairy tales often start with “Once upon a time” and have a moral lesson. With such rich exposure, they not only develop stronger reading skills but also discover what they love most, whether it’s the thrill of a mystery, the beauty of poetry, or the wonder of true stories about the world. Carefully curated texts help children explore language, culture, and ideas from various perspectives. It’s important to include a balance of genres— such as fiction, non-fiction, poetry, drama, biography, and folktales—so that learners develop not only comprehension skills but also curiosity, empathy, and analytical thinking. For instance, in the NCERT Class V English textbook, children encounter folk tales like “The Talkative Barber”, which introduce cultural storytelling traditions, moral lessons, and humor; adopted classics such as “Rip Van Winkle”, which offer exposure to timeless literature in age-appropriate llanguage; poetry like “My Shadow” by Robert Louis Stevenson which helps students appreciate rhythm, imagery, and figurative language; fantasy fiction in stories like “The Magic Garden” (Class III–V bridge) sparks imagination and creativity. In Class IV , students read informational texts such as “Pinocchio,” which, although a narrative, introduces concepts of honesty and consequences in a Assessment of Oral Language: Tools and Strategies child-friendly way; biographies like “Helen Keller” (Class IV), inspire through real-life stories and develop an understanding of personal struggles and perseverance. Incorporating non-fiction passages from science, history, or current affairs helps connect reading to real-world knowledge, while plays and dialogues, such as “Class Discussion” (Class VI), enhance speaking, listening, and interpretive skills. Using a genre-based approach enables teachers to create targeted comprehension activities, for example, predicting events in fiction, extracting facts in informational texts, or identifying rhyme and metaphor in poetry. This diverse exposure also helps children recognise features of each genre—such as structure, tone, and purpose—supporting deeper understanding and more versatile reading habits."]},{"t":"9.3.6 Tools for Assessing Comprehension","p":["• Reading Comprehension Passages: Short or long texts can be followed by structured questions to assess comprehension at multiple levels. For example, in the NCERT Class V English textbook, the story “Rip Van Winkle” is followed by questions such as “Who was Rip Van Winkle?” and “What happened to Rip after he drank the liquor?” These questions address literal understanding (recalling facts from the text), inferential thinking (like why Rip’s village did not recognise him), and evaluative reasoning (students reflecting on whether Rip was right to escape his responsibilities). This format offers a systematic approach to assessing different levels of reading comprehension in alignment with curriculum objectives.","• Cloze Tests: Words are omitted from a passage at regular intervals; students fill in the blanks. This tool assesses contextual understanding, vocabulary knowledge, and grammatical accuracy. For example, in the NCERT Class VII English textbook, a cloze activity might involve a passage on environmental awareness where every fifth word is removed. Students must use their understanding of the topic and sentence structure to complete the text meaningfully. A sample sentence could be: “Pollution is a major _____ affecting cities today. People must take _____ to reduce it.” Here, correct answers might be “issue” and “steps,” but alternate valid responses can also demonstrate comprehension. Such tasks promote critical thinking and contextual reasoning. Assessment of Oral Language: Tools and Strategies","• Retelling Exercises: Students recount the text in their own words to demonstrate understanding. This activity assesses a student’s ability to grasp the main ideas, sequence events, and express comprehension verbally or in writing. For example, in the NCERT Class IV English textbook, after reading the story “The Tiny Teacher,” students are asked to retell the story, focusing on important events such as how the tiny insect helped the boy learn patience. This exercise helps teachers evaluate comprehension beyond simple recall, checking for understanding of the story’s message and details.","• Think-Aloud Protocols: Students verbalise their thought process while reading. This strategy involves students speaking aloud their thoughts as they engage with a text, revealing how they decode, interpret, and make sense of the material. For example, in the NCERT Class IV English textbook, while reading the story “Bringing Up Kari,” students might verbalise their predictions about what will happen next or explain why a character acted a certain way. This method provides teachers with insight into studentsʼ comprehension processes, misconceptions, and strategies used, enabling targeted support.","• Graphic Organisers: Visual tools like Venn diagrams, story maps, and flowcharts help assess comprehension. Graphic organisers like Venn diagrams, story maps, and flowcharts are visual tools that help students organise and represent information from texts, making comprehension easier and more concrete. For example, after reading the Grade IV NCERT story “The Friendly Mongoose,” students can use a story map to break down the story into key parts:","STORY MAP","CHARACTERS -Mongoose -farmer -baby","SETTING -Farmhouse Assessment of Oral Language: Tools and Strategies","PROBLEM -Snake threatens baby","RESOLUTION -Mongoose saves baby This visual helps students clearly see the sequence and structure of the story, supporting deeper understanding and recall. Using graphic organisers like this encourages students to think critically about stories and organise their thoughts, which enhances comprehension and retention.","• Multiple-choice and Open-ended Questions: Used to evaluate both factual recall and deeper interpretation. These are commonly used to assess different levels of reading comprehension. Multiple-choice questions typically test factual recall or literal understanding, where students select the correct answer from given options. Open-ended questions, on the other hand, encourage students to think more deeply, interpret, and express their own understanding of the text. Example from NCERT Class IV: After reading the story “A Visit to the Zoo,” a multiple-choice question might ask: “What animal did the children like the most?”","a) Elephant b) Monkey","c) Tiger d) Parrot This question checks if the student remembers specific details from the story. An open-ended question for the same story could be: “Why do you think the children enjoyed their visit to the zoo?” This invites students to give personal opinions or explanations grounded in the story, promoting deeper comprehension and critical thinking. Together, these types of questions help teachers evaluate both surface-level understanding and deeper interpretive skills. Assessment of Oral Language: Tools and Strategies"]},{"t":"9.3.7 Strategies to Support and Assess Comprehension","p":["Pre-reading Activities: Pre-reading Activities are strategies done before reading a text to help students engage better, activate prior knowledge, and prepare them for comprehension. Table 9.1: Strategies to Build Comprehension Before Reading Strategy Description Example (NCERT Grade IV) KWL Chart A three-column chart where students list what they Know (K), Want to know (W), and Learned (L) about a topic Before reading the story “The Friendly Mongoose,” students might fill in:","● Know: “Mongooses are small animals.”","● Want to know: “Do mongooses live near farms?”","● Learned: Added after reading the story Vocabulary Preview Teacher introduces key words before reading to support understanding and reduce confusion Words previewed before reading “The Selfish Giant”: giant, garden, spring. Both strategies prepare students cognitively and linguistically, improving comprehension and engagement. During-Reading Strategies for Primary Grades: Table 9.2: Strategies to Build Comprehension During Reading Post-reading Activities: Strategy What to Do Why it Helps Examples Mark the Text (Annotation) Children circle or underline interesting words, then add small symbols (⭐ ,❓ , 😊 ). Keeps them alert and makes reading playful","● “The Cap Seller and the Monkeys”: Circle “cap” and “monkey,” draw a monkey face.","● “The Clever Crow”: Underline “crow” and “jug,” add ❓ : “What is the crow trying to do?” Assessment of Oral Language: Tools and Strategies Ask Questions Pause and ask:","● “What just happened?”","● “Why did the character do this?”","● “What will happen next?” Builds curiosity and helps them think deeper","● “Two Little Hands”: Ask “Why do our hands help us every day?”","● “The Greedy Dog”: Ask “Why did the dog lose his bone?” Take Turns Leading (Reciprocal Teaching) In groups, children take roles:","● Summariser (what happened)","● Questioner (ask something)","● Word Helper (explain/draw word)","● Predictor (guess next). Gives every child a role and makes reading teamwork (i) “A Farm”:","● Summariser: “Animals on a farm.”","● Questioner: “Why does the cow moo?”","● Word Helper: explains “cow.”","● Predictor: “Maybe farmer will come next.” (ii) “The Lion and the Mouse”:","● Summariser: “The lion caught a mouse.”","● Questioner: “Why didn’t he eat it?”","● Word Helper: explains “net.”","● Predictor: “The mouse may help the lion.” These strategies are well-suited for primary children because they involve simple and engaging tasks that match their developmental level. Activities like circling, starring, or drawing beside words make reading playful and help children connect visually with the text. Asking short and direct questions such as “What happened?” or “Why did the character do that?” keeps them Assessment of Oral Language: Tools and Strategies Post-reading Activities: These activities help students consolidate understanding and reflect on the text after reading. Table 9.3: Strategies to Build Comprehension After Reading Strategy What to Do Example (NCERT Grade 3) Summarising Students briefly retell the main points or events in their own words. “Two Stories about Flying”: Students summarise how the characters learnt about flying and what they discovered. Discussion Students engage in group or class conversations about themes, characters, and lessons. “Who I Am”: Students discuss the character’s feelings and connect them with their own experiences. Written Responses Students answer questions or write reflections to deepen engagement. “The Little Bully”: Students write a paragraph on why bullying is harmful and ways to be kind. curious while ensuring the questions remain within their understanding. Group roles like Summariser, Questioner, Word Helper, and Predictor turn reading into a small game, making it social and enjoyable. Together, these approaches transform reading from a passive task into an active, fun, and memorable learning experience for young learners. These activities encourage deeper comprehension and a personal connection to the text.","CHECK YOUR PROGRESS 9.1","1. Which of the following is not a key component of reading?","a) Decoding","b) Fluency","c) V ocabulary","d) Drawing Assessment of Oral Language: Tools and Strategies","2. In reading assessment, which function is used to identify a student’s strengths and weaknesses?","a) Monitoring","b) Evaluation","c) Diagnosis","d) Accountability 3.Which tool requires students to speak their thoughts while reading?","a) Cloze Test","b) Retelling","c) Think-Aloud","d) Story Map 4.Which activity is a pre-reading strategy?","a) KWL Chart","b) Summarising","c) Written response","d) Discussion","5. Identify the sentences as True or False. a. Basic and Intermediate Reading skills are most suitable for primary students. b. Evaluation is a summative assessment that judges the effectiveness of programs and outcomes. c. Graphic organisers like Venn diagrams and story maps help students organise information visually. d. Monitoring in reading assessment is done only at the end of the year. e. Literal comprehension means “reading between the lines.” f. Pre-reading vocabulary previews help students understand the text better.","Answers:","1. d), 2. c), 3. c), 4. a)","5. a) True, b) True, c) True, d) False, e) False, f) True Assessment of Oral Language: Tools and Strategies"]},{"t":"9.4 VARIOUS TOOLS AND STRATEGIES FOR READING","p":["ASSESSMENT"]},{"t":"9.4.1 Assessment as a Part of Learning","p":["Assessment is not merely an end-of-unit activity; it is an integral part of the learning process, continually shaping and supporting how students acquire skills and knowledge. In reading, assessment serves as a tool for guiding instruction, fostering engagement, and enabling both teachers and learners to reflect on progress. When a teacher pauses during a story to ask, “What do you think might happen next?” the question is more than a check for understanding—it is a formative assessment that reveals whether students have grasped the storyline and can anticipate logical outcomes. If responses suggest confusion about a key event, the teacher can revisit the relevant passage, clarify ideas, and strengthen comprehension before moving forward. Assessment can also take the form of purposeful activities that blend learning with evaluation. For instance, after reading a descriptive passage, students may be asked to underline all the adjectives that describe the main character. While this measures their ability to identify descriptive language, it also draws their attention to how the author’s choice of words shapes the reader’s perception. Similarly, maintaining a “reading response journal,” where students summarise chapters and jot down questions, not only assesses comprehension but also encourages self-reflection. Teachers’ feedback on these journals—such as suggesting strategies for finding the main idea or re-reading challenging sections—helps students refine their reading approaches. Even creative tasks can serve as forms of assessment embedded within the learning process. Asking students to draw a scene from the story and write a caption using details from the text assesses visualisation and detail recall while keeping the activity enjoyable. Over time, regular assessments, such as oral reading fluency checks help to track growth in speed, accuracy, and expression, making progress visible and motivating for learners. In this way, assessment in reading is not separate from instruction—it is woven into every step, helping teachers adapt their methods and enabling students to become active, reflective participants in their own learning journey. Assessment of Oral Language: Tools and Strategies"]},{"t":"9.4.2 Need for Multiple Tasks for Assessment","p":["A teacher should have multiple tasks for assessment because no single activity can capture the full range of a student’s abilities, learning styles, and progress. Reading, for example, involves decoding, vocabulary, comprehension, inference, and critical thinking—each requiring different types of evidence to assess accurately. When a teacher uses a variety of assessment tasks, several benefits emerge. First, it provides a more complete picture of learning. A comprehension worksheet might reveal whether a student understood key events, but an oral retelling could show their grasp of sequence and fluency, while a creative project might reveal deeper interpretation. Second, varied tasks cater to different strengths. Some learners express themselves better through writing, others through speaking, drawing, or dramatising. Offering multiple assessment formats ensures that no student is disadvantaged by a single method. Multiple tasks also help teachers identify specific learning needs. For instance, if a student performs well in oral discussion but struggles with written comprehension questions, the teacher can pinpoint that the challenge is lack of writing skills and not the understanding. This diagnostic insight is only possible when the assessment is diverse. Finally, varied tasks keep the assessment engaging and motivating. If students only ever take written tests, they may see assessment as repetitive and stressful. Mixing formats—such as quizzes, reading journals, peer discussions, and performance tasks—turns assessment into an active part of learning, making it feel less like an external judgment and more like an opportunity to demonstrate growth in different ways. In essence, multiple assessment tasks ensure fairness, inclusivity, and accuracy, and at the same time enrich the learning experience."]},{"t":"9.4.3 Documentation and record-keeping","p":["Documentation and record-keeping are vital in assessing reading skills because they provide a continuous, evidence-based account of each learner’s development rather than a one-time snapshot. Teachers can use a variety of documentation tools—such as observation notes, running records, checklists, anecdotal records, reading logs, book response journals, and portfolios—to capture different aspects of reading growth. For example, a running record Assessment of Oral Language: Tools and Strategies taken during oral reading can reveal patterns of errors, self-corrections, and fluency rate, helping the teacher identify whether a child needs phonics reinforcement, decoding strategies, or pacing support. Similarly, a reading response journal where students regularly write or draw about the stories that they read can indicate not only comprehension but also emotional engagement and interpretive thinking. Another example is the use of reading conference notes—brief, individual conversations where the teacher records the student’s choice of reading material, summaries, and reflections. Over time, these notes can highlight shifts in reading preferences, the complexity of chosen texts, and the student’s ability to make text-to-self or text-to-world connections. Checklists for specific skills, such as “recognises sight words,” “uses context clues,” or “identifies main idea,” allow for quick yet consistent tracking across multiple lessons. Documentation also plays a crucial role in differentiated instruction. For instance, if a teacher’s records show that a student struggles with non-fiction text features like headings, captions, and diagrams, the teacher can plan targeted mini-lessons on navigating informational texts. In contrast, another student’s portfolio might reveal strong decoding skills but limited inferential comprehension, prompting activities that encourage predicting, connecting, and deducing. Importantly, documentation supports communication and collaboration. During parent-teacher meetings, concrete samples such as dated reading logs or annotated comprehension worksheets provide clear evidence of progress or areas needing attention. They also help in setting shared goals with parents, such as reading aloud at home or visiting the library regularly. In team meetings, teachers can share records to seek peer input or design intervention plans. When shared with students, documented progress—such as graphs showing increased reading fluency over months or a “before and after” comparison of written responses—helps them recognise their own growth, boosting motivation and self-confidence. In this way, record-keeping transforms assessment from a mere evaluation tool into a guide for continuous improvement in reading. Assessment of Oral Language: Tools and Strategies Table 9.4: Documentation Tools for Classroom Documentation Tool Purpose in Reading Assessment Examples of Use in Class Running Records Track accuracy, fluency, and decoding skills Note types of errors (substitutions, omissions), self- corrections, and words read per minute Observation Capture real-time behaviours and strategies during reading Record how a child uses finger- pointing, re-reading, or picture clues Checklists Monitor specific skills and strategies over time Tick “identifies main idea” or “uses context clues” as observed in different lessons Anecdotal Records Provide qualitative insights into reading habits and attitudes “Student was eager to read aloud today and tried new vocabulary without prompting.” Reading Logs Document volume and variety of reading Record book titles, authors, genres, and dates completed Book Response Journals Assess comprehension, interpretation, and personal engagement Students write summaries, character sketches, or reflections after reading Portfolios Showcase growth over time through collected work Include early and later reading worksheets, written responses, and project work Reading Conference Track individual discussions and set goals “Prefers mystery novels—needs encouragement to read non- fiction” Audio/Video Recordings Analyse oral reading fluency, expression, and progression Compare recordings from the start and end of the term Graphic Organisers Check comprehension of text structure and key ideas Story maps, Venn diagrams, cause-effect charts completed by students Assessment of Oral Language: Tools and Strategies"]},{"t":"9.4.4 Rubrics in Reading Assessment","p":["Rubrics are structured scoring guides that describe specific criteria for evaluating a learner’s performance. In reading assessment, rubrics help teachers make evaluations clear, consistent, and objective by outlining expectations for different aspects of reading skills. They not only guide teachers in giving fair scores but also help students understand what is expected and how they can improve. A well-designed rubric for reading addresses both process (how the learner reads) and product (what the learner understands or produces after reading). It can include observable skills such as reading aloud with accuracy, silent reading comprehension, vocabulary understanding, and composing and sentence formation. By using rubrics, teachers can:","● Provide transparent criteria for assessment","● Ensure uniformity in evaluation across students","● Offer constructive feedback aligned with specific skills","● Track progress over time The following rubric is an example that can be used for assessing various reading-related skills in a classroom. Table 9.5: Reading Assessment Rubrics Criteria Indicators Excellent (4) Proficient (3) Developing (2) Beginning (1) Silent Reading Comprehension, focus, reading speed, and the ability to infer Reads fluently with full comprehension, infers ideas beyond text, and answers all questions accurately Reads fluently with good comprehension, answers most questions correctly Reads slowly, misses some details, and has limited inference Struggles to read silently, poor comprehension Reading Aloud Pronunciation, expression, pace, accuracy Clear pronunciation, natural expression, appropriate pace, no errors Minor errors, good pace, and expression Frequent pauses, incorrect stress, and some mispronun- ciations Reads word-for -word, many errors, lacks expression Assessment of Oral Language: Tools and Strategies V ocabulary Understanding and use of words in context Demonstrates wide vocabulary, uses precise words in speech/writing Understands and uses grade- appropriate vocabulary well Understands basic words, struggles with advanced terms Limited vocabulary, frequent misuse of words Composing Ability to create coherent text Writes clear, organized, and creative content with correct structure Writes coherent text with minor errors in organisation Writes basic text with limited structure, some repetition Incomplete or disorganised writing Sentence Formation Grammar, syntax, variety Uses varied and complex sentence structures correctly Uses simple and compound sentences correctly Limited variety, frequent grammar errors Mostly incomplete or incorrect sentences"]},{"t":"9.4.5 Storytelling and Assessment","p":["Storytelling is one of the oldest and most effective methods of teaching. It engages learners emotionally and intellectually, enabling them to develop language skills, comprehension, imagination, and empathy. In the classroom, storytelling is not only a medium for delivering content but also a valuable tool for assessment. Through storytelling activities, teachers can evaluate listening comprehension, sequencing abilities, critical thinking, and expressive language in a natural and enjoyable way. Role of Storytelling in Learning","• Language Development: Exposure to rich vocabulary, varied sentence structures, and expressive speech.","• Imagination and Creativity: Stimulates mental imagery and encourages original thinking.","• Cultural Awareness: Introduces traditions, values, and diverse perspectives through folk tales and narratives.","• Social and Emotional Growth: Enhances empathy, moral understanding, and collaborative interaction. Storytelling as an Assessment Tool Storytelling can be integrated into both formative (continuous) and summative (end-of-unit) assessments. Teachers can evaluate: Assessment of Oral Language: Tools and Strategies a. Listening Comprehension: Retelling the story in one’s own words, identifying main ideas and details. b. Sequencing Skills: Arranging events in the correct order. c. Critical Thinking: Explaining reasons for a character’s actions, predicting outcomes, or imagining alternative scenarios. d. Creativity and Expression: Inventing new endings, expanding the plot, or narrating a personal experience related to the theme. e. Language Proficiency: Observing vocabulary range, grammatical accuracy, and fluency during narration or writing. Table 9.6: Assessment Methods in Storytelling Method Focus Area Example Oral Retelling Comprehension, sequencing, vocabulary “Tell the story in your own words.” Story Mapping Structure (beginning, middle, end) Fill in a story map after listening. Illustrated Story Comprehension, creativity Draw the main events in order. Question & Answer Recall, inferencing “Why do you think the character made that choice?” Role-play/Drama Empathy, expression Act out a scene from the story. Alternate Ending Writing Creativity, writing skills Create a new ending for the given story. Table 9.7: Rubric for Storytelling Assessment Criteria Excellent (4) Good (3) Satisfactory (2) Needs Improvement (1) Comprehension Complete and accurate retelling with all key details Mostly accurate with minor omissions Includes only basic events Many inaccuracies Sequencing Events in perfect logical order One event misplaced Several events misplaced No clear order Assessment of Oral Language: Tools and Strategies Expression & V ocabulary Rich vocabulary, varied tone, expressive gestures Good vocabulary with some repetition Limited vocabulary and expression Very basic vocabulary and monotone delivery Creativity Highly original ideas and connections Some originality in ideas Few original elements No originality shown Engagement Fully confident and engaging narration Engaged most of the time Occasionally engaged Disengaged and flat delivery Tips for Integrating Storytelling in Assessment","• Maintain anecdotal records of student performance over time.","• Use audio or video recordings for tracking progress.","• Combine teacher feedback with peer and self-assessment.","• Provide a variety of story formats—folk tales, real-life incidents, and student-created narratives—to assess different skills. Sample Storytelling Assessment Activity Story Prompt: “One day, while walking through the forest, a child found a mysterious key…” Assessment Steps:","1. Read the story aloud or present it through audio/video.","2. Ask students to retell it in their own words.","3. Provide a set of jumbled events to arrange in the correct order.","4. Ask open-ended questions: ○ “What do you think the key opened?” ○ “How else could the story have ended?”","5. Use the rubric to score performance in comprehension, sequencing, creativity, language, and engagement. Assessment of Oral Language: Tools and Strategies"]},{"t":"9.4.6 Miscue Analysis","p":["Miscue Analysis is a qualitative tool used by educators to gain insight into how students process written language during oral reading. The purpose of this technique is not merely to count errors but to understand the types of errors (miscues) and what they reveal about a readerʼs strategy and comprehension. What is a Miscue? A miscue is any deviation from the actual printed text during oral reading. It can include:","• Substitution: Replacing a word with another (e.g., reading “home” instead of “house”).","• Omission: Skipping a word or words.","• Insertion: Adding a word not present in the text.","• Repetition: Repeating a word or group of words.","• Self-correction: Recognising and correcting a miscue independently. Types of Miscues:","1. Graphophonic miscues: Errors involving letters and sounds, such as reading “cat” as “cap.”","2. Syntactic miscues: Errors that maintain grammatical structure but alter the meaning slightly, like reading “ran” instead of “runs.”","3. Semantic miscues: Errors that retain meaning but change specific words, like “father” instead of “dad.” Purpose of Miscue Analysis:","● To understand the reading process and what cues the reader uses.","● To identify strengths, such as self-correction or use of context.","● To diagnose needs, such as difficulties with phonics or fluency. Classroom Example (from NCERT Grade 3 English): In the NCERT Class 3 English book, the story “The Magic Garden” can be used. Printed text: “The children loved the flowers very much.” Student’s reading: “The kids liked the flowers a lot.” Assessment of Oral Language: Tools and Strategies Analysis:","● Substituted “children” with “kids,” “loved” with “liked,” and “very much” with “a lot.”","● All substitutions retained the overall meaning (semantic miscues).","● Indicates strong comprehension and contextual prediction skills. How to Conduct Miscue Analysis:","1. Have the student read a passage aloud.","2. Record the reading (audio or transcript).","3. Note and categorise the miscues.","4. Evaluate whether the miscues change the meaning or structure.","5. Use findings to adapt instruction—focus on decoding, context use, or fluency. Miscue analysis promotes a strengths-based view of reading, encouraging teachers to see errors as windows into students’ thinking rather than as failings. Miscue analysis is a diagnostic tool used to evaluate the types and patterns of errors readers make when reading aloud. It provides insight into the reading process by focusing not only on what errors are made, but also on how they affect comprehension. Key Concepts:","● Miscue: A departure from the text during oral reading that may or may not affect meaning (e.g., substitutions, omissions, insertions).","● Meaning Retention: Not all miscues are detrimental; if the meaning is retained, it might indicate the reader is using contextual cues effectively. Types of Miscues: ○ Semantic: Word substitutions that retain meaning (e.g., reading “dad” instead of “father”). ○ Syntactic: Errors that still fit grammatically within the sentence. ○ Graphophonic: Mistakes that reveal confusion about letter-sound relationships. Assessment of Oral Language: Tools and Strategies Purpose and Use:","● To diagnose the reading strategies and cue systems used.","● To inform instruction by identifying strengths and weaknesses.","● To promote reader reflection and self-monitoring. Example: A student reads the sentence “The girl ran quickly to her mother” as “The child rushed to her mom.” Though several words differ, the essential meaning remains intact, showing semantic strength. Teachers use miscue analysis to design targeted interventions, especially for struggling readers. It encourages a holistic view of reading, moving beyond error counting to understanding reading behaviors.","CHECK YOUR PROGRESS 9.2","1. Why do you think rubrics are better than giving only marks without criteria?","2. How does storytelling help teachers understand a child’s creativity?","3. If a student reads “happy” as “joyful,” should the teacher treat it as a mistake? Why/Why not?","4. What can miscues tell us about how a child thinks while reading?","5. Why is it important to include both comprehension and expression in a storytelling rubric?","6. Imagine a child skips words while reading aloud—what might this show about their reading process?","7. How does miscue analysis encourage teachers to see “errors” in a positive way?"]},{"t":"9.5 WORKSHEET AND QUESTION PAPER DESIGN","p":["Effective assessment requires well-structured worksheets and question papers that reflect students’ cognitive levels, curricular goals, and diverse reading abilities. Design Principles:","● Align tasks with learning outcomes (e.g., inferential vs literal understanding).","● Use age-appropriate, culturally relevant texts. Assessment of Oral Language: Tools and Strategies","● Include a variety of question types: multiple choice, short answer, and long response.","● Balance open-ended questions with factual recall.","● Scaffold complexity: begin with simple comprehension, move toward application, and synthesis. Components to Include:","● Reading passage with glossary (if needed).","● Instructions that are clear and concise.","● Question types as per comprehension level (literal, inferential, evaluative","• Space for annotation and student notes. Sample Structure:","1. Title and Instructions","2. Reading Passage (with vocabulary box)","3. Questions: ○ Literal (e.g., \"What did the boy find?\") ○ Inferential (e.g., \"Why do you think the boy hid it?\") ○ Evaluative (e.g., \"Was the boy’s action justified? Why/why not?\") ○ V ocabulary (e.g., \"Find a synonym for 'happy' from the passage.\") Effective worksheets and papers are not just tools of assessment, but instruments of learning. They promote critical thinking, self-reflection, and the transfer of skills across contexts. Table 9.8: Question Types by Comprehension Level Comprehension Level Question Type Sample Question Literal Fact-based recall What did the boy find? Inferential Deductive reasoning Why do you think the boy hid it? Evaluative Critical judgment or opinion Was the boy’s action justified? Why/why not? V ocabulary Word meaning in context Find a synonym for 'happy' from the passage. Assessment of Oral Language: Tools and Strategies Predictive Anticipating future events based on context What do you think might happen next in the story? Analytical Comparing or contrasting ideas or characters How are the two characters different in their thinking? Sample Structure of Worksheet/Question Paper:","1. Title and Instructions: Clearly state the objective and steps.","2. Reading Passage: Choose a developmentally appropriate text. Include a glossary box if unfamiliar vocabulary is used.","3. Questions Section: ○ Start with literal questions to build confidence. ○ Move to inferential and evaluative to deepen engagement. ○ Include vocabulary and analytical tasks for language development.","4. Reflection/Extension Task: Invite creative or personal responses, such as a short paragraph or drawing. Effective worksheets and papers are not just tools of assessment, but instruments of learning. When designed thoughtfully, they promote critical thinking, self- reflection, and the transfer of skills across contexts.","CHECK YOUR PROGRESS 9.3","1. A reading passage may include a __________ box to explain difficult words.","2. Evaluative questions invite students to make __________ about a text.","3. Predictive questions encourage students to __________ what might happen next.","4. Analytical tasks ask students to __________ or contrast ideas and characters.","5. The final section of a worksheet should include a __________ or extension task to connect learning personally. Assessment of Oral Language: Tools and Strategies","Answers:","1. glossary","2. judgement","3. anticipate","4. compare","5. reflection"]},{"t":"9.6 PARAKH (RELEVANCE IN READING ASSESSMENT)","p":["The Holistic Progress Card (HPC), developed by PARAKH (Performance Assessment, Review, and Analysis of Knowledge for Holistic Development), a standard-setting body under NCERT, is a transformative assessment model envisioned under NEP 2020. It aims to provide a multi-dimensional, learner- centric evaluation that moves well beyond traditional marks-based report cards. 9.6.1. What Is the Holistic Progress Card (HPC)?","● 360° Evaluation: HPC includes assessments from teachers, peers, parents, and even self about the student’s strengths and areas for improvement.","● Developmental Coverage: It is currently operational for the foundational (Class 1–2), preparatory (Class 3–5), and middle stages (Class 6–8), with the secondary stage in progress.","● Descriptive & Reflective Format: Students self-reflect using statements like \"I was able to learn something new\", circling indicators, or using smileys (yes/no/not sure).","● Goal Setting (Middle Stage): Learners articulate personal academic and non-academic goals via an “ambition card,” detailing skills to develop and timelines.","● Home–School Link: Parents contribute valuable observations—e.g., on homework completion, class engagement, screen-time balance.","● Peer Feedback: Students assess classmatesʼ contributions, such as their understanding and collaboration during activities. 9.6.2. Why HPC Matters for Reading Assessment Reading proficiency involves more than decoding—it encompasses comprehension, critical thinking, emotional reflection, and communication. HPCʼs multi-faceted structure supports this complexity: Assessment of Oral Language: Tools and Strategies","1. Multidimensional Focus Evaluates not just textual understanding, but also interpretative skills, metacognition, empathy, and narrative creativity—crucial components of reading assessment.","2. Self-Assessment Enhances Metacognition When students reflect, for instance, whether they “could ask for help” or “understood the activity,” it promotes reader awareness, self-monitoring, and critical reading strategies.","3. Peer Feedback Cultivates Collaborative Learning Engaging in peer evaluation encourages readers to articulate comprehension, pose questions, provide feedback, and deepen their interpretive skills through group discussion.","4. Parent Input Supports Contextual Growth Home observations—like reading habits, attention span, and balancing reading with other activities—offer valuable insight into studentsʼ reading behaviors outside the classroom.","5. Descriptive Structure Enables Nuanced Feedback Instead of numeric scores, students receive actionable, narrative feedback about their reading abilities—highlighting strengths (e.g., inference-making) and areas to build (e.g., critical analysis).","6. Goal-Setting Fosters Ownership of Reading Development Through the ambition card, students can set specific reading goals (e.g., “I aim to read a chapter of a book independently in two weeks”), and track their growth. Table 9.9: Sample Layout for Implementing HPC in Reading Assessment Component Reading-Related Tasks / Prompts Self-Reflection “I understood the story,” “I could ask questions about the text,” “I could connect the story to my experiences.” (Student circles) Peer Evaluation “My peer explained the story well,” “helped me understand difficult words,” “asked good questions.” Assessment of Oral Language: Tools and Strategies Parent Feedback “Reads at home without prompting,” “asks for help when a word is difficult,” “sets aside reading time.” Teacher Descriptive Comments on vocabulary usage, inference-making, fluency, narrative engagement, and comprehension strategies. Ambition Card “To read one short story every weekend,” “to summarize key ideas after reading,” “to ask two questions on what I read.” Final Reflection A narrative summary: strengths, reading milestones, and next steps for improvement."]},{"t":"9.6.3 ALIGNMENT WITH NEP 2020 AND NCF-SE","p":["HPC embodies the shift from summative to continuous, formative assessment through multiple evidence sources and learner agency. It supports assessment through projects, experiential learning, portfolios, and self- and peer-assessment techniques. 9.6.5. Summary & Benefits for Reading Assessment","● Holistic Insights: HPC captures cognitive, affective, and social-emotional aspects of reading.","● Reflective Engagement: Fosters metacognitive habits essential for becoming independent readers.","● Collaborative Engagement: Encourages communicative and interpretive skills through peer discourse.","● Narrative Feedback: Moves beyond grades to provide meaningful, actionable feedback.","● Goal-Oriented Growth: Motivates students to take ownership of their reading journey. The Holistic Progress Card, as designed by PARAKH, provides a comprehensive, learner-centred assessment model that is particularly effective in capturing the full spectrum of reading skills—from comprehension to metacognition to emotional engagement. By integrating self, peer, teacher, and parent observations within a descriptive framework, HPC enriches reading assessment and aligns deeply with NEP 2020’s vision of holistic, continuous, and meaningful evaluation. Assessment of Oral Language: Tools and Strategies","CHECK YOUR PROGRESS 9.4","1. One-Word Answer i. Who contributes observations about reading at home in HPC? ii. What card do middle-stage learners use for goal setting? iii. What is the short form of Holistic Progress Card?","2. Why do you think peer feedback is important in HPC for reading assessment?","3. How does replacing marks with descriptive notes make assessment more meaningful?","4. Why is goal-setting useful for students in reading development?","Answers:","1. i. Parents ii. Ambition iii. HPC"]},{"t":"9.7 LET US SUM UP","p":["• Reading is not a mechanical act of decoding words on a page. It requires learners to construct meaning by comprehending, interpreting, and critically engaging with text. Good readers connect what they read with prior knowledge, make inferences, and evaluate information rather than simply pronouncing words correctly.","• Traditional rote-based methods of assessment focus only on memory and recall, often neglecting comprehension and application. Modern assessment practices emphasise higher-order thinking, problem-solving, and the ability to engage with diverse types of texts. This shift is necessary to prepare learners for real-world literacy demands.","• Reading assessment serves multiple, interconnected purposes. It helps to diagnose the learner’s current level of reading ability, identify strengths and weaknesses, and monitor progress over time. It also evaluates learning outcomes, provides accountability for both teachers and learners, and ensures that instructional practices are aligned with literacy goals.","• There are different levels of reading skills that learners develop over time. Assessment of Oral Language: Tools and Strategies i. Basic Level: Involves word recognition, fluency, and simple comprehension of familiar texts. ii. Intermediate Level: Learners begin to summarise information, interpret meanings, infer ideas, and expand vocabulary. iii. Advanced Level: Readers critically analyse, compare, interpret perspectives, and engage with abstract or multi-layered texts.","• The choice of reading material is crucial for effective assessment. Texts must be age-appropriate, linguistically suitable, and varied across genres. A healthy balance between fiction, non-fiction, poetry, informational texts, biographies, and cultural stories ensures that learners develop broad exposure and remain motivated to read.","• A range of tools is used to evaluate different aspects of reading. Comprehension passages assess understanding of content; cloze tests check contextual vocabulary and syntax awareness; retelling and summarisation reveal sequencing and comprehension; think-aloud protocols provide insight into a learner’s cognitive strategies; graphic organisers map understanding visually; and both objective and open- ended questions measure recall, interpretation, and critical engagement.","• Effective assessment is supported by purposeful teaching strategies. Pre- reading activities such as KWL charts or brainstorming activate prior knowledge and set a purpose for reading. During-reading strategies like annotation, highlighting key points, or reciprocal teaching keep learners engaged and monitor their thought process. Post-reading tasks such as group discussions, reflective journaling, or summarising deepen comprehension and encourage critical reflection.","• Assessment is not the last step after teaching, but a continuous cycle. It allows teachers to observe learners at different stages, provide feedback, and modify instruction accordingly. Ongoing assessment ensures that learning gaps are identified early and interventions are made timely.","• Systematic documentation provides evidence of growth and areas needing support. Teachers may use running records to track reading fluency, checklists and anecdotal notes to capture observations, reading logs to record independent reading habits, and portfolios to showcase progress over time. Such documentation also supports communication with parents and helps students reflect on their learning. Assessment of Oral Language: Tools and Strategies","• Rubrics create consistency and clarity in evaluation. They provide defined criteria for measuring silent reading comprehension, oral fluency, vocabulary usage, writing composition, and sentence formation. Well- designed rubrics not only guide teachers in fair assessment but also help students understand expectations and set goals.","• Storytelling activities allow learners to demonstrate sequencing, comprehension, expression, and creativity, while also helping teachers to identify gaps in understanding. Miscue analysis, which examines the errors or substitutions children make while reading aloud, reveals the strategies they use and points to specific instructional needs.","• In alignment with NEP 2020, the Holistic Progress Card provides a multi- dimensional approach to reading assessment. It goes beyond grades and marks by incorporating teacher, peer, parent, and self-evaluations. The HPC captures cognitive, emotional, and social aspects of reading development, encouraging students to take ownership of their learning. Its descriptive and goal-oriented structure promotes reflection, collaboration, and balanced growth.","• Reading assessment should be viewed as a process that supports not only academic achievement but also the development of curiosity, confidence, and a lifelong love for reading. By combining modern tools, diverse texts, continuous documentation, and holistic approaches, teachers can ensure that students grow into thoughtful and independent readers."]},{"t":"9.8 END EXERCISES","p":["1. Do you think cloze tests are a reliable tool for assessing comprehension? Why or why not?","2. A Grade IV teacher notices that Rohan can answer comprehension questions orally but often writes incomplete answers in his worksheets. Over the past month, his reading logs show a preference for mystery stories, but running records reveal frequent pauses and word substitutions during oral reading.","a) What does this suggest about Rohan’s reading abilities?","b) Which assessment tools would you recommend to further investigate his needs?","c) How might the teacher adapt instruction for him? Assessment of Oral Language: Tools and Strategies","3. Meena, a Class V student, is an enthusiastic reader of animal stories but shows little interest in poetry or informational texts. When given a poem in class, she struggles to explain its meaning and avoids answering inferential questions. I. How could the teacher use genre-based strategies to expand Meena’s reading interests? II. Suggest two pre-reading and two post-reading activities that could support her comprehension of poetry.","4. During a storytelling activity, students were asked to retell “The Friendly Mongoose.” One student, Arjun, retold the story in detail but mixed up the sequence of events. He also used simple vocabulary and showed little variation in tone. a. According to the storytelling rubric in the chapter, how would you rate Arjun’s performance in sequencing, expression, and vocabulary? b. Suggest one activity that could improve each of these areas. Once upon a time, a farmer and his wife had a baby boy. To give him company, they kept a baby mongoose as a pet. The farmer loved the animal dearly, but the wife was always doubtful and feared it might harm the child one day. One afternoon, the farmer went to his fields and his wife went out to fetch groceries, leaving the baby asleep in the cradle. A big snake crept into the house toward the baby. The mongoose saw it and bravely fought with the snake. After a fierce struggle, it killed the snake. When the wife returned, she saw the mongoose at the door with blood on its mouth and paws. Thinking it had killed her child, she got furious and struck the mongoose dead. Rushing inside, she found the baby safe and the dead snake lying nearby. Realizing her mistake, she was filled with grief and regret for killing the faithful mongoose.","5. A middle school English teacher is implementing the HPC for reading assessment. One student’s HPC notes include: Self-reflection: “I can understand the story, but I forget details.” Peer feedback: “Explains the story well but needs to ask more questions.” Parent feedback: “Reads at home but only when prompted.” Assessment of Oral Language: Tools and Strategies Teacher note: “Good literal comprehension; needs to work on inference and independent reading habits.” i. Based on this profile, identify the student’s key strengths and areas for growth. ii. Suggest two specific, measurable reading goals for the ambition card.","6. In an oral reading session, Priya read the line: “The children loved the flowers very much” as “The kids liked the flowers a lot.” The meaning was retained, but none of the words matched exactly. a. What type of miscues are these? b. Should the teacher treat these as errors needing correction, or as acceptable variations? Why? c. Suggest how miscue analysis could help design future reading activities for Priya."]}];
const doc=document.getElementById('doc'),$=id=>document.getElementById(id);
const S=[];
C.forEach((c,si)=>{
  const sec=document.createElement('section');
  const h=document.createElement('h2');h.append(c.t);
  const b=document.createElement('button');b.textContent='Listen';b.onclick=()=>start(firstOf(si));h.append(b);
  sec.append(h);
  c.p.forEach(par=>{
    const p=document.createElement('p');
    (par.match(/[^.?!]+[.?!]+(\s|$)|[^.?!]+$/g)||[par]).forEach(t=>{
      const s=document.createElement('span');s.className='s';s.textContent=t.trim()+' ';
      const i=S.length;s.onclick=()=>start(i);
      S.push({el:s,sec:si,text:t.trim()});p.append(s);
    });
    sec.append(p);
  });
  doc.append(sec);
});
const firstOf=si=>S.findIndex(x=>x.sec===si);
const ss=window.speechSynthesis;
if(!ss){$('warn').hidden=false;$('warn').textContent='This browser does not support speech playback. Please open the file in Chrome, Edge, Safari or Firefox.';}
let idx=0,playing=false,paused=false,token=0,voices=[];
const INDIAN=/(india|rishi|veena|heera|hemant|kalpana|ravi|neerja|prabhat|aditi|raveena|lekha)/i;
function loadVoices(){
  if(!ss)return;
  const L=$('lang').value;
  const rank=v=>{
    const lg=v.lang.replace('_','-');
    if(L==='en-IN')return lg.toLowerCase()==='en-in'?0:(INDIAN.test(v.name)&&/^en/i.test(lg))?1:/^en-(GB|AU)/i.test(lg)?3:/^en/i.test(lg)?4:9;
    return lg.toLowerCase()===L.toLowerCase()?0:/^en/i.test(lg)?2:9;
  };
  voices=ss.getVoices().filter(v=>rank(v)<9).sort((a,b)=>rank(a)-rank(b));
  const sel=$('voice');sel.innerHTML='';
  voices.forEach((v,i)=>{const o=document.createElement('option');o.value=i;o.textContent=v.name+' ('+v.lang+')';sel.append(o);});
  const w=$('warn');
  if(!voices.length){w.hidden=false;w.textContent='No English voices were found on this device. Please check your system speech settings.';}
  else if(rank(voices[0])>1){w.hidden=false;w.textContent='No '+$('lang').selectedOptions[0].text+' voice was found on this device, so the closest English voice is selected. For Indian English, install an en-IN voice in your phone or computer speech settings.';}
  else w.hidden=true;
}
loadVoices();if(ss)ss.onvoiceschanged=loadVoices;
function mark(i){
  S.forEach(x=>x.el.classList.remove('on'));
  const s=S[i];if(!s)return;s.el.classList.add('on');
  s.el.scrollIntoView({block:'center',behavior:'smooth'});
  $('prog').firstElementChild.style.width=((i+1)/S.length*100)+'%';
  $('now').textContent='Now reading: '+C[s.sec].t;
}
function speak(){
  if(idx>=S.length){finish();return;}
  const my=++token,u=new SpeechSynthesisUtterance(S[idx].text);
  const v=voices[$('voice').value];u.lang=$('lang').value;if(v){u.voice=v;u.lang=v.lang;}
  u.rate=parseFloat($('rate').value);mark(idx);
  u.onend=()=>{if(my===token&&playing){idx++;speak();}};
  u.onerror=()=>{if(my===token&&playing&&!paused){idx++;speak();}};
  ss.speak(u);
}
function start(i){ss.cancel();token++;idx=Math.max(0,i);playing=true;paused=false;$('play').textContent='Pause';setTimeout(speak,60);}
function finish(){playing=false;paused=false;idx=0;$('play').textContent='Play';$('now').textContent='Finished. Press Play to listen again.';}
$('play').onclick=()=>{
  if(!playing)return start(idx);
  if(paused){ss.resume();paused=false;$('play').textContent='Pause';}
  else{ss.pause();paused=true;$('play').textContent='Resume';}
};
$('stop').onclick=()=>{ss.cancel();token++;playing=false;paused=false;idx=0;$('play').textContent='Play';S.forEach(x=>x.el.classList.remove('on'));$('prog').firstElementChild.style.width='0';$('now').textContent='Stopped.';};
$('next').onclick=()=>{const cur=S[idx]?S[idx].sec:0;start(firstOf(Math.min(C.length-1,cur+1)));};
$('prev').onclick=()=>{const cur=S[idx]?S[idx].sec:0;start(firstOf(Math.max(0,cur-1)));};
$('lang').onchange=()=>{loadVoices();if(playing&&!paused)start(idx);};
['rate','voice'].forEach(id=>$(id).onchange=()=>{if(playing&&!paused)start(idx);});
window.addEventListener('beforeunload',()=>ss&&ss.cancel());
</script>
</body>
</html>
