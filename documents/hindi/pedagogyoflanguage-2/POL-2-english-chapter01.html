<style>
:root{--bg:#f3f4fa;--ink:#1d2340;--mute:#5b6288;--card:#fff;--line:#d5d8ea;--ac:#2b3990;--hi:#ffe9a8}
@media (prefers-color-scheme:dark){:root{--bg:#141833;--ink:#e9ebf8;--mute:#a3a9cf;--card:#1d2245;--line:#343a70;--ac:#8f9dff;--hi:#4a3f14}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.7 Georgia,"Times New Roman",serif}
header{padding:28px 20px 10px;max-width:760px;margin:auto}
header small{color:var(--mute);font:14px system-ui,sans-serif}
h1{margin:4px 0 0;font-size:2rem;color:var(--ac)}
.bar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
.bar div{max-width:760px;margin:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font:14px system-ui,sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--ac);background:var(--card);color:var(--ac);cursor:pointer;max-width:100%}

button:focus-visible,select:focus-visible{outline:3px solid var(--hi);outline-offset:2px}

#prog i{display:block;height:100%;width:0;background:var(--ac)}
#now{flex:1 1 100%;color:var(--mute)}
main{max-width:760px;margin:auto;padding:10px 20px 60px}

<script>
const C=[{"t": "1.1 Introduction", "p": ["Being a country of various ethnicities, traditions, and religions, Bharat is home to over a billion people who communicate in innumerable dialects and official languages. In every few hundred kilometres, the language changes. Multilingualism forms the warp and weft of the rich tapestry of communication, and is a symbol of unity and diversity. The Indian Constitution recognises 22 languages under the Eighth Schedule, while countless others thrive within regional and tribal communities. In a country as diverse as ours, multilingualism is not just a choice but a way of life.", "Language stands at the core of all communication and forms the foundation of all learning. It is the vehicle for expressing our innermost feelings, and it shapes the way children think, express, and connect with the world. Young children acquire different languages at home, at school, and in their communities. Depending on exposure, a child may acquire only one language, or two or more.", "Language learning in schools is not just about learning one language. It is about building on the previous knowledge of the child and letting them learn new languages in a joyful and stress-free environment, so that every child feels confident, included, and supported, no matter which language they speak. Figure 1.1 shows a map of the languages spoken in Indian states.", "The National Education Policy, NEP 2020, along with the National Curriculum Framework for the Foundational Stage, NCF-FS 2022, and the National Curriculum Framework for School Education, NCF-SE 2023, highlight the importance of the home language of children, particularly during early education. The transition from home to school should be easy, and the home language can act as a bridge. Children should begin their education in the language they are most comfortable with, usually the home language or mother tongue. This chapter discusses the key provisions related to language education in NEP 2020 and the NCFs."]}, {"t": "1.2 Learning Outcomes", "p": ["After completing the chapter, the learner appreciates the fundamental features of language education in NEP 2020 and the NCFs at the primary stage, explains bi and multilingualism and how it supports learning and thinking, and recognises it as a resource in the classroom. The learner also identifies challenges in implementing it and suggests practical solutions, and designs simple classroom activities that promote bi and multilingualism."]}, {"t": "1.3 Language Education Policies in India", "p": ["Bharat is the most linguistically diverse country in the world, and children come to our classrooms with rich experiences and varied language backgrounds. Several national commissions, such as the Kothari Commission, 1964 to 66, the National Policy on Education, 1986, updated in 1992, and most recently NEP 2020, have laid down recommendations on language use in schools. All emphasise that children learn best when taught in the language they connect with emotionally, that is, the language they speak at home. NEP 2020, NCF-FS 2022, and NCF-SE 2023 go a step ahead with concrete ways to integrate home languages, especially in the Foundational and Preparatory stages."]}, {"t": "1.3.1 Key Recommendations from NEP 2020", "p": ["Home language or mother tongue as medium of instruction. Children should be taught, as far as possible, at least until Grade 5 and preferably up to Grade 8 and beyond, in their home language. Research shows that children learn better and build stronger relationships when taught in their home language.", "Flexible three-language formula. The policy reiterates the three-language formula, but gives States flexibility in choosing languages according to regional and cultural needs. The suggested pattern is: first, the mother tongue or regional language, which ensures cultural grounding and local relevance; second, Hindi or any other modern Indian language, which encourages national integration; and third, English or another foreign language, which prepares students for global opportunities. This promotes inclusion, national unity, and mutual respect for linguistic diversity.", "Early exposure to multiple languages. Acquiring multiple languages is not only for communication, but also aids cognitive development, as multilingualism enhances brain function and develops higher-order thinking skills.", "English as a subject. NEP 2020 propagates teaching English as a subject within a multilingual framework at the primary level, so that students develop strong foundational skills in both their mother tongue and English, and are not overwhelmed by learning content and language simultaneously. As they become proficient, English can play a larger role as a medium of instruction, particularly at the secondary level.", "Respect for cultural and linguistic rootedness. NEP 2020 considers rootedness in one's culture and language a matter of immense pride, and calls for a learning environment that celebrates the diversity in the classroom.", "Consider a Grade 1 classroom in Odisha. Most children speak Odia, but a few tribal students speak Kui and are reticent in class. The teacher begins each day with an activity where students greet each other in their home languages, and introduces basic English through songs and rhymes. In environmental studies, she uses storybooks and bilingual flashcards in Odia and Kui. In mathematics, she introduces counting numbers in both languages and finally in English. The children became more confident and curious about new languages while staying grounded in their own."]}, {"t": "1.3.2 Key Provisions from NCF-FS 2022 and NCF-SE 2023", "p": ["While the policy outlines the recommendations, it is the NCFs that tell us how to translate them into practice.", "Joyful and meaningful learning. Early education should be accompanied by play and activity, giving way to natural and joyful language acquisition.", "Use of familiar language. A familiar language should be the medium of communication and instruction, so children feel safe, valued, and understood. In the Foundational Stage, the primary medium of instruction should ideally be the home language, mother tongue, or familiar language.", "Use of contextual content. Locally and culturally relevant content, such as folk tales, songs, and rhymes, should be used, to bridge the gap between classroom learning and the child's lived experience.", "Multilingual environment. Multilingualism is a resource, and all languages should thrive together. Children should share knowledge in the language they are most comfortable with, and be immersed in multiple oral languages, referred to as L2 and L3, from an early age. Teachers and parents should be present in schools so that at least two, preferably three, languages are present with children regularly.", "Teacher support and training. Teachers need proper training in pedagogy and inclusive strategies. They are expected to help students develop reading and writing through the language R1, preferably the home language L1 whenever possible. By R1 we mean the language in which a child first learns reading and writing; R2 is the second such language, and R3 the third. Once the concept of reading and writing is developed in R1, additional scripts can be gradually introduced. The aim is for students to become independent readers and writers in R1 by age 8, Grade 3."]}, {"t": "Check Your Progress 1.1", "p": ["One, fill in the blanks. The policy reiterates and emphasises the blank language formula, and NEP 2020 propagates teaching English as a blank within a multilingual framework. Answers: three, and subject. Two, which will bridge the gap between school and home? Teaching in the home language, using rhymes, songs, and folk tales, and using locally available knowledge; the answer is D, all of the above. Three, according to NEP 2020, the medium of instruction until at least Grade 5 should preferably be the home language, mother tongue, or local language; the answer is C.", "Four, in your opinion, why is it important to teach children in their home language? Five, what is the three-language formula, and how can it be applied? Six, list two ways NCF-FS 2022 supports language learning in the early years."]}, {"t": "1.4 Understanding Bi/Multilingualism", "p": ["Bilingualism means the ability to speak, read, and write in at least two languages, and multilingualism is being dexterous in more than two. Many children grow up in a language-rich environment. For instance, a child may speak Bhili with grandparents at home, use Hindi in the market or with friends, and hear English in school or on television. This is a natural and dynamic process shaped by social, cultural, and environmental needs. Children do not learn languages one at a time in isolation; they pick them up unconsciously by listening, speaking, playing, and interacting."]}, {"t": "1.4.1 Importance of Multilingualism", "p": ["There is ample research evidence that multilingualism supports the overall development of children. It should be used as a resource rather than a barrier.", "It boosts cognitive development: knowing more than one language boosts memory, problem-solving, and flexible thinking, and switching between languages helps children multitask and adapt quickly.", "It builds cultural connection and mutual respect: multilingual children appreciate cultural differences and respect people from different backgrounds. When school encourages home languages, children feel comfortable, valued, and connected to their identity and community.", "It makes learning easier: children learn better when they link new concepts with words and ideas they already know in their home language.", "It supports social and emotional growth: expression in more than one language improves communication and builds confidence, and encourages empathy and respect for other languages and cultures.", "Consider Meena from Jharkhand. She speaks Kurukh, a tribal language, at home, Hindi with neighbours, and is learning English at school. Instead of forcing her to speak English or Hindi, her teacher asks her to share a story or song her mother told her in Kurukh, and retells it in Hindi with basic English words. Meena feels her home language is valued, becomes more open to learning Hindi and English, and takes pride in her home language."]}, {"t": "Check Your Progress 1.2", "p": ["One, fill in the blanks: blank is the ability to speak more than two languages, and multilingualism boosts blank development. The answers are multilingualism, and cognitive. Two, a person who speaks more than two languages is called a polyglot; the answer is A. Three, list two cognitive benefits of multilingualism. Four, how can using a child's home language support classroom learning? Five, why is multilingualism considered a strength in Indian classrooms?"]}, {"t": "1.5 Multilingualism as a Classroom Resource", "p": ["Children enter school with prior linguistic experiences. Their mother tongue shapes their identity, helps them acquire culture, and activates their thought process. When teachers recognise this diversity, a possible challenge becomes a powerful resource. Multilingualism is not about knowing many languages, but about putting them to use in a meaningful and creative manner. A successful multilingual teacher makes every child seen, heard, and valued."]}, {"t": "1.5.1 Key Benefits of Using Multilingualism as a Resource", "p": ["Children learn and understand better when new concepts are linked to what they already know. They feel safe and respected in their home language, and using it shows respect for their background. They feel included and are more likely to participate actively. They build confidence, while hesitation and fear are minimised. And it helps them become better at learning new languages, including English."]}, {"t": "1.5.2 Strategies to Use Multilingualism in the Classroom", "p": ["Increase talk time. Let children share an idea, a story, or answers in their home language, then gently introduce new terms in the school language. The idea is to remove inhibitions and create a stress-free environment.", "Use local stories and songs. Begin a class with a local folk tale or rhyme in the children's home language, then connect the theme of the lesson in Hindi or English.", "Translanguaging. This encourages flexible use of languages rather than keeping them in watertight compartments. For instance, a child may read a story in Hindi, discuss it in their home language, Bhojpuri, and then write an assignment in English. It connects new knowledge with previous knowledge, promotes cognitive development, and makes learning more inclusive and joyful.", "Bilingual instruction and code-switching. Bilingual instruction uses two languages, typically the home language and the language of the school. For instance, the teacher introduces a new concept in EVS in Hindi or English and discusses it in the child's mother tongue. Code-switching is the intentional alternation between two or more languages, generally within the same sentence or conversation, to clarify meanings, connect new knowledge to previous knowledge, and give classroom instructions.", "Multilingual teaching-learning material. Create charts, signs, and word walls in multiple languages; the word water can be labelled in Hindi, English, Santhali, and Kurukh. Use multilingual books or wall stories with two or three languages side by side. NCERT, in collaboration with the Central Institute of Indian Languages, CIIL, has developed 52 Primers in Indian Languages, released on 9 March 2024, and available on the NCERT website.", "Total Physical Response, TPR. Physical movement is aligned with verbal input. When the teacher says sit or jump in both the home language and the school language, children respond by performing the action. It is helpful for students still building confidence in the school language, as they can use their bodies as a natural response.", "Consider a primary school in Maharashtra. The children came from tribal communities and speak Konkani at home, while class activities were mostly in Marathi, so the Konkani-speaking students became silent. The teacher created language corners with simple words, greetings, short stories, and rhymes in both Marathi and Konkani. She invited parents to contribute local songs and folktales, recorded and played during assembly and lunch time. The Konkani-speaking children became proud of their identity and participated actively, and even Marathi-speaking children began learning a few Konkani words."]}, {"t": "Check Your Progress 1.3", "p": ["One, fill in the blanks: blank is an effective strategy which involves physical movement aligned with verbal input; and translanguaging promotes cognitive development and bridges gaps between blank. Answers: Total Physical Response, and languages. Two, which is not a strategy to implement multilingualism? Decreasing talk time in the classroom; the answer is A. Three, which is not a benefit of multilingualism in early childhood education? Reduces learning motivation; the answer is C. Four, how does using home languages help build confidence? Five, what is peer support, and how does it help in a multilingual classroom? Six, why should we display multilingual labels in the classroom?"]}, {"t": "1.6 Challenges in Promoting Multilingualism and Solutions", "p": ["Using multilingualism in the classroom is a powerful idea, but it is a daunting task to implement. The challenges are mostly extrinsic, such as those posed by the school system, limited resources, and teachers' limited experience and confidence with multiple languages. With planning, support, and collaboration, they can become opportunities."]}, {"t": "1.6.1 Common Challenges Faced by Teachers", "p": ["Lack of teaching materials in local languages. Owing to the vast number of languages and dialects, it is difficult to prepare material in all of them. English is often viewed as a prestige language, while local languages may be undervalued.", "Emphasis on using only the official medium of instruction. Many schools are rigid about it, and teachers may feel compelled to teach only in Hindi, English, or the state's official language, due to school policies and parental expectations, where English proficiency is equated with academic success.", "Teachers may not know all the languages spoken by students. A teacher may be unaware of the language of the school or state in which they are posted, particularly in a government setup, and it is unrealistic to expect them to know every language in a class. This creates communication gaps.", "Insufficient teacher training and support. Teachers may lack the skills, strategies, and support to manage multilingual classrooms, resulting in challenges in balancing English with local languages."]}, {"t": "1.6.2 Practical Solutions for Teachers", "p": ["For lack of materials: collect folk tales, rhymes, and songs from the community; invite parents or elders to share stories in local languages; and create simple picture books or posters with children.", "For the emphasis on the official medium: use home languages as a bridge to help children understand concepts before shifting to the official language, and use translanguaging.", "When teachers don't know all the languages: use gestures, pictures, and visuals; pair children with a classmate who speaks the same language for peer support; and learn a few key words in children's languages to build trust.", "For insufficient training: participate in workshops, online courses, or communities of practice; collaborate with other teachers to co-plan multilingual activities; and reflect regularly on what works.", "Consider a government school in Odisha where four students spoke Kui, while the rest of the class spoke Odia, and the four became reticent. The teacher did not speak Kui, but paired them with Odia-speaking classmates who could help translate, used drawings, songs, and local objects, and invited a grandmother from the community to narrate a folktale in Kui, which she later repeated in Odia. The Kui-speaking children became comfortable, welcomed, and curious to participate."]}, {"t": "Check Your Progress 1.4", "p": ["One, which is not a challenge faced by teachers? Too many languages in the classroom; the answer is D. Two, a classroom strategy that supports multilingualism is encouraging peer translation and storytelling in multiple languages; the answer is B. Three, list two ways to create or collect learning materials in local languages. Four, why is collaboration among teachers and students important for promoting multilingualism? Five, state two common challenges, not mentioned above, that you face in multilingual classrooms. Six, suggest one practical solution to these challenges."]}, {"t": "1.7 Activities to Promote Multilingualism", "p": ["Multilingualism is about celebrating and respecting the language of every child, and helping them feel valued, heard, and understood. These activities augment vocabulary and communication skills and foster joyful learning.", "Multilingual story circle. Children invite stories in the language they speak at home, for example in Gondi, Bundeli, or Santali, with picture cues, drawings, puppets, and local props. Afterwards, the teacher or other children retell it in Hindi or English, followed by a discussion of the message. The teacher can write keywords on the blackboard with equivalents in Hindi or English, and ask children to act it out in their own language in groups. Figure 1.2 shows an example of picture cues from Mridang I.", "Language corners. Create dedicated corners with books in different languages, such as picture books, comics, or translated stories, and charts of numbers, colours, or animals in local languages, and a blackboard space for a word of the week. For example, a poster showing water: Pani in Hindi, Jalam in Sanskrit, Neeru in Kannada, and Aab in Urdu, with drawings.", "Rhymes and songs in different languages. Children sing rhymes or songs they know in their home language, with gestures, actions, and visuals. The teacher can translate well-known English rhymes, like Head, Shoulders, Knees and Toes, into Hindi or the children's home languages.", "Role play and dramatisation. The NEP and NCFs emphasise experiential learning. Children enact situations like shopping at the market, a visit to the doctor, or travelling by bus or train, in the language they are most comfortable with. For example, one child, a shopkeeper, speaks in their home language and the customer replies in Hindi; then they switch roles and repeat in English.", "Word walls and picture dictionaries. Choose five to ten words weekly, such as fruit names, body parts, or local words, and display them in the different languages spoken in the class, with handmade pictures. For example, apple is Seb in Hindi, Safarjan in Gujarati, and Apel in Bengali.", "Bridge the words. Write common English words like tree, water, book, sun, and friend on the board, show pictures, and ask students to name the equivalent in their home language, building a word bridge chart. Extend it to simple sentences. For example, Sun is Surya in Gujarati, Surya in Marathi, and Sooraj in Hindi. Tree is Vruksh in Gujarati, Zhad in Marathi, and Ped in Hindi. The sentence, the sun is bright, can be said in Gujarati, Marathi, and Hindi.", "Spot the difference. Show a picture, and ask students to say what is happening in their own languages. Then introduce a similar second picture with minimal differences, and ask them to spot the differences in different languages. For example, in English: There are pillows here, but not there. Figure 1.6 is from Mridang II.", "Table 1.2 summarises these. Storytelling builds expression, listening, and cultural sharing. Language corners build vocabulary and reading. Songs and rhymes build pronunciation, rhythm, and comprehension. Role play builds communication and social skills. Word walls build visual memory, spelling, and multisensory learning. Bridge the words builds vocabulary, translation, and sentence formation. Spot the difference builds speaking, observation, and translation."]}, {"t": "Check Your Progress 1.5", "p": ["One, fill in the blanks: a blank in the class helps children acquire new words and retain them in active vocabulary; the NEP and NCFs emphasise blank learning. Answers: word wall, and experiential. Two, songs and rhymes help to build pronunciation, rhythm, and comprehension; the answer is D, all of the above. Three, describe one multilingual classroom activity you would try and why. Four, how can a word wall support multilingual learning? Five, what is the importance of role play in supporting language use? Six, list two activities that you use in your classrooms."]}, {"t": "1.8 Let Us Sum Up", "p": ["NEP 2020 and the NCFs recommend the home language or mother tongue as the medium of instruction up to at least Grade 5, and preferably until Grade 8 and beyond, with a smooth transition from the home language to the school language. They emphasise bi and multilingualism, very commonly found in homes, and these abilities should be seen as opportunities and not barriers.", "When utilised effectively, multilingualism promotes higher-order thinking skills and strong cultural identities. It is not a challenge to overcome but a treasure to embrace. When teachers make use of the multiple languages children speak, classrooms become inclusive, engaging, and effective for all."]}, {"t": "1.9 End Exercises", "p": ["One, fill in the blanks. NEP 2020 recommends that the medium of instruction until at least Grade blank should be the child's home language. Multilingualism helps strengthen children's blank and blank growth. One major classroom strategy is the use of blank and blank in different languages. Teachers can use blank cards to bridge vocabulary across languages in early grades. A significant challenge is the lack of blank in multiple languages for teaching-learning materials.", "Two, match the following. Home language, mother tongue and local dialects. Picture-word cards, a teaching tool for vocabulary building in many languages. Translanguaging, using multiple languages flexibly within the classroom. Multilingual songs, encouraging empathy, identity formation, and belonging. NEP 2020 language policy, promoting the use of the home language as a medium of instruction.", "Three, what is a common challenge in implementing multilingual education? The answer is lack of accessible teaching-learning materials in all home languages. Four, what are the key recommendations of NEP 2020 on language at the foundational stage? Five, explain how multilingualism supports children's cognitive and emotional development. Six, list three classroom strategies with examples that promote bi and multilingualism. Seven, what challenges do teachers face in promoting multilingualism, and how can they be resolved? Eight, design a multilingual classroom activity for a Grade 2 class. Nine, reflect on your own classroom and state how inclusive it is of children's languages and cultures."]}];
const doc=document.getElementById('doc'),$=id=>document.getElementById(id);
const S=[];
C.forEach((c,si)=>{
  const sec=document.createElement('section');
  const h=document.createElement('h2');h.append(c.t);
  const b=document.createElement('button');b.textContent='Listen';b.onclick=()=>start(firstOf(si));h.append(b);
  sec.append(h);
  c.p.forEach(par=>{
    const p=document.createElement('p');
    (par.match(/[^.?!]+[.?!]+(\s|$)|[^.?!]+$/g)||[par]).forEach(t=>{
      const s=document.createElement('span');s.className='s';s.textContent=t.trim()+' ';
      const i=S.length;s.onclick=()=>start(i);
      S.push({el:s,sec:si,text:t.trim()});p.append(s);
    });
    sec.append(p);
  });
  doc.append(sec);
});
const firstOf=si=>S.findIndex(x=>x.sec===si);
const ss=window.speechSynthesis;
if(!ss){$('warn').hidden=false;$('warn').textContent='This browser does not support speech playback. Please open the file in Chrome, Edge, Safari or Firefox.';}
let idx=0,playing=false,paused=false,token=0,voices=[];
const INDIAN=/(india|rishi|veena|heera|hemant|kalpana|ravi|neerja|prabhat|aditi|raveena|lekha)/i;
function loadVoices(){
  if(!ss)return;
  const L=$('lang').value,base=L.slice(0,2);
  const rank=v=>{
    const lg=v.lang.replace('_','-');
    if(L==='en-IN')return lg.toLowerCase()==='en-in'?0:(INDIAN.test(v.name)&&/^en/i.test(lg))?1:/^en-(GB|AU)/i.test(lg)?3:/^en/i.test(lg)?4:9;
    return lg.toLowerCase()===L.toLowerCase()?0:/^en/i.test(lg)?2:9;
  };
  voices=ss.getVoices().filter(v=>rank(v)<9).sort((a,b)=>rank(a)-rank(b));
  const sel=$('voice');sel.innerHTML='';
  voices.forEach((v,i)=>{const o=document.createElement('option');o.value=i;o.textContent=v.name+' ('+v.lang+')';sel.append(o);});
  const w=$('warn');
  if(!voices.length){w.hidden=false;w.textContent='No English voices were found on this device. Please check your system speech settings.';}
  else if(rank(voices[0])>1){w.hidden=false;w.textContent='No '+$('lang').selectedOptions[0].text+' voice was found on this device, so the closest English voice is selected. For Indian English, install an en-IN voice in your phone or computer speech settings (for example, English India in Google Text-to-speech on Android, or Rishi and Veena on iPhone and Mac).';}
  else w.hidden=true;
}
loadVoices();if(ss)ss.onvoiceschanged=loadVoices;
function mark(i){
  S.forEach(x=>x.el.classList.remove('on'));
  const s=S[i];if(!s)return;s.el.classList.add('on');
  s.el.scrollIntoView({block:'center',behavior:'smooth'});
  $('prog').firstElementChild.style.width=((i+1)/S.length*100)+'%';
  $('now').textContent='Now reading: '+C[s.sec].t;
}
function speak(){
  if(idx>=S.length){finish();return;}
  const my=++token,u=new SpeechSynthesisUtterance(S[idx].text);
  const v=voices[$('voice').value];u.lang=$('lang').value;if(v){u.voice=v;u.lang=v.lang;}
  u.rate=parseFloat($('rate').value);
  mark(idx);
  u.onend=()=>{if(my===token&&playing){idx++;speak();}};
  u.onerror=()=>{if(my===token&&playing&&!paused){idx++;speak();}};
  ss.speak(u);
}
function start(i){ss.cancel();token++;idx=i;playing=true;paused=false;$('play').textContent='Pause';setTimeout(speak,60);}
function finish(){playing=false;paused=false;idx=0;$('play').textContent='Play';$('now').textContent='Finished. Press Play to listen again.';}
$('play').onclick=()=>{
  if(!playing)return start(idx);
  if(paused){ss.resume();paused=false;$('play').textContent='Pause';}
  else{ss.pause();paused=true;$('play').textContent='Resume';}
};
$('stop').onclick=()=>{ss.cancel();token++;playing=false;paused=false;idx=0;$('play').textContent='Play';
  S.forEach(x=>x.el.classList.remove('on'));$('prog').firstElementChild.style.width='0';$('now').textContent='Stopped.';};
$('next').onclick=()=>{const s=Math.min(C.length-1,(S[idx]?S[idx].sec:0)+1);start(firstOf(s));};
$('prev').onclick=()=>{const cur=S[idx]?S[idx].sec:0;start(firstOf(idx>firstOf(cur)?cur:Math.max(0,cur-1)));};
$('lang').onchange=()=>{loadVoices();if(playing&&!paused)start(idx);};
['rate','voice'].forEach(id=>$(id).onchange=()=>{if(playing&&!paused)start(idx);});
window.addEventListener('beforeunload',()=>ss&&ss.cancel());
