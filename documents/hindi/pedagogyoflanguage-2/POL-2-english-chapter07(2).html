<script>
const C=[{"t": "7.1 INTRODUCTION", "p": ["Whenever we do any work or take up any task, a certain amount of planning goes into how to complete it. It can be a well-articulated, detailed plan laid out on paper or a mental note as to how to progress about the task. It cannot be said that any task is completed without any planning. It may be so that the task is completed without proper planning, but not without none at all. In case of lack of proper planning we find that there has been unnecessary wastage of time, resources and efforts during completion of that task. In that case we learn a lesson of properly planning for the next time to avoid the above stated loss. This chapter aims at realising the importance of planning and how a teacher can effectively use planning of a unit and a lesson to implement his/her pedagogy in the classroom. Towards the end, the chapter discusses in detail the steps of creating a good unit plan and an effective lesson plan."]}, {"t": "7.2 LEARNING OUTCOMES", "p": ["After the completion of the lesson, the learner:", "• Recognises the need for planning at different stages;", "• Differentiates between unit planning and lesson planning;", "• Explains the steps involved in creating a unit plan and a lesson plan;", "• Creates a good lesson plan and unit plan."]}, {"t": "7.3 NEED FOR PLANNING", "p": ["While teaching with the help of proper planning the educational process moves forward with clarity and precision in a streamlined manner without the wastage of time and resources and duplication of efforts, towards achievement of decided learning outcomes and curricular goals. This saves the precious time of teachers as well as the young learners whose lives are being influenced by the educational process. That is why, in the field of education, planning is done at various levels. Curriculum is planned at the level of government, yearly plans are made in school for covering that curriculum and achieving curricular goals, Unit plans are made by departments in the schools or by collaboration of teachers of the same and sometimes of different disciplines. Lastly lesson plans, the smallest and most precise unit of planning is done by individual teacher for the smallest units of specific topics and time period. CHECK YOUR PROGRESS 7.1 State True or False:", "1. Planning is not very effective in saving time.", "2. Lesson planning is done at the end by an individual teacher.", "Answers: 1. False, 2. True"]}, {"t": "7.4 UNIT PLAN", "p": ["A Unit can be considered as bringing together related content and educational activities which cater to a specific theme or lead to attaining specific learning outcomes. Planning of a unit becomes important for the same reason. If not well planned, the desired outcomes may not be achieved in the desired manner. Planning helps in laying out the process of conducting a unit in the classroom smoothly and coherently, making children learn about the concept easily and clearly. Planning also leads to better chances of attainment of the desired goals or outcomes. Often units are pre-designed or pre-decided in the textbooks. Related lessons, exercises and activities are clubbed under a specific theme as to catering to specific learning outcomes. For example, the NCERT textbooks for English titled Mridang, for classes 1 & 2, have the lessons clubbed under the following themes: Table 7.1: Themes of NCERT English Textbooks CLASS 1 CLASS 2 My Family and Me Fun With Friends Life Around Us Welcome to My World Food Going Places Seasons Life Around Us Harmony Beginning with the theme of ‘My Family and Me’ provides a sense of familiarity to the young child. Many children are first generational learners of L2 or English as L2 in their families. Introducing the new language through familiar contexts creates a smoother and more comfortable entry point, thereby fostering interest and engagement in learning the target language. Such an approach lays a strong foundation for sustained language learning in later stages."]}, {"t": "7.4.1 Characteristics of a Unit Plan", "p": ["A unit plan recognises that learning is not in fragments but a connected whole. Hence a unit plan comprises of related topics, activities and exercises which can even be interdisciplinary in nature. Together they contribute to holistic learning of the learner. A good unit plan should have the following characteristics:", "• The needs, capabilities and previous knowledge must be paid attention", "before formulating a unit plan.", "• The previous experiences and contexts of the learners should be kept in", "mind.", "• Linkage should be made to previous knowledge by incorporating the", "familiar world as to create interest and ease for the learners.", "• Also provide scope for newer experiences to enrich their knowledge like", "field trips, experiments etc.", "• There should be scope of active participation of the learners in the plan.", "This can be done by incorporating suggestions of the learners even at the planning stage itself.", "• The unit plan should not shy away from borrowing from allied disciplines", "as well.", "• The unit plan should not be very dense for the available time limit as to", "become burdensome for the learners.", "• The objectives should be set in behavioural terms for their effective", "assessment and further reflection."]}, {"t": "7.4.2 Purpose of Making a Unit Plan", "p": ["• A unit plan is designed to give direction to the teaching-learning process.", "• It proceeds from simple to complex, helping in gradual development in", "learning of the students.", "• Availability of a unit plan makes it easier to design everyday lesson", "plans.", "• A unit plan gives a complete picture of dealing with a unit at a single", "glance, thus saving time of reading again and again.", "• The plan keeps the educational process streamlined.", "• It makes it easier for the teacher as well as the authorities to track the", "progress of learning process.", "• Focus on clear learning objectives, based on learning outcomes, in a unit", "plan is helpful in attainment of overall curricular goals."]}, {"t": "7.4.3 Components of a Unit Plan", "p": ["The unit plan serves as a foundation for teaching any lesson or subject effectively, meaningfully, and in an interconnected manner. A good unit plan makes the instruction outcome-oriented and student-centered. The formulation of this plan involves several stages, in which we should not only have a deep understanding of the curriculum, but also take into account the needs of the students, the subject matter, and methods of assessment. For the purpose of this chapter let us take the example of Unit 3 “Going Places” in Mridang of Class 2. With the help of this unit, let us learn to create a Unit Plan. Let us discuss each component of the unit plan in detail:", "1. Title of the Unit: As discussed earlier, most books have pre-decided units.", "They are also titled as per the theme they are catering to. Even if we are forming a new unit on our own as a teacher, we can provide a suitable title to the unit which should preferably spell out the theme clearly. It gives a prior idea and prepares both the teacher and the students for what to expect from the unit. For example, the unit title, “Going Places” already gives a hint that the unit will focus on different kinds of places like residence or tourist places or places of work etc. and the related issues like transportation, need for classification of places, tourism etc.", "2. Unit Overview: It can be considered like a small introduction of the unit.", "Here we provide the information about what the particular unit is focusing upon. The unit in consideration introduces the modes of transportation and depicts travelling to familiar places.", "3. Learning Objectives: This is an important component of any unit plan. This", "part holds the key leading to successful learning. The objectives should be stated in behavioural terms so that the teacher can assess what the children have learnt. The learning should be visible in their behaviour or application. We can take cues from the Learning Outcomes in Nipun Bharat document for framing Learning Objectives for the classroom. The objectives can be framed using the SMART principle. SMART S - Specific M - Measurable A - Achievable R - Relevant T - Time-bound In the unit ‘Going Places’ some of the learning objectives can be:", "- Learners are able to identify different modes of transport.", "- Learners are able to pronounce the words containing the vowel ‘u’", "correctly.", "- Learners can narrate their journey in their mother tongue using a few", "familiar words in English; and so on. The above objectives are stated in behavioural terms. None of them are abstract which cannot be observed. Each of these objectives can be observed in application by the children.", "4. Previous knowledge: Checking of previous knowledge is also an important", "component of any plan. Though its importance is more in a particular lesson plan, it can very well become a part of a unit plan as well. Every child comes to a classroom with a certain amount of previous knowledge related to every concept or topic. Nothing is entirely new for a child. We can use that knowledge for accumulation of new knowledge, making it easier and smoother for a child and making learning fun. Feeling comfortable with any new knowledge is crucial for maintaining the interest of anyone, more so in case of a young child. The unit before “Going Places” was titled “World Around Me” which was about the familiar surroundings of a child. Everyone travels in one way or another in their surroundings which is more comfortable than going to a new place. The previous knowledge of travelling in a familiar world can be used to build upon travelling beyond the familiar surroundings. Modes of transportation used or seen by children in their surroundings can be the beginning point of learning about uses of modes of transportation. Then we can introduce more sophisticated modes of transport like aeroplanes and rockets to them. Previous knowledge may not find place in certain unit plan template but it is a crucial component for choosing topics and organising them into a unit plan.", "5. Selection and Organisation of knowledge component: Most of the time", "ample content for the unit is already given in the textbook. We need not look for new content separately. However, the organisation part may need some work on our part. The content is organised in the textbook also. However, owing to certain factors like the need of the students, previous topic learnt, availability of time etc. we may need to reorganise the content as to decide which topic needs to be done before another. Not only the sequence, the organisation also includes allotment of time to each topic. The teacher’s handbook or sometimes the textbook itself provides certain guidelines as to how much time is to be allotted to each topic in a unit. Once again, we can reorganise that as per our discretion owing to the similar factors of reorganisation as cited above. The first lesson in the unit under consideration is a poem about modes of transport. The second one is about a child’s route to school. As the previous unit of ‘World Around Me’ ended with a story related to school, we may want to continue with the theme of school and opt to teach the lesson ‘Between Home And School’ first. Then we can proceed to the poem ‘Come Back Soon’ which is about modes of transport. Similarly, as much discussion about school could have been done in the previous unit, we may not need to spend much time on the chapter ‘Between Home and School’, and utilise that time for some activity related to travelling or vocabulary enrichment or any other task.", "6. Teaching – Learning Activities/Methods: Here we can list the probable", "teaching-learning activities for conducting the unit in an interesting manner like story-telling method, audio-visual manner, role play, picture reading, question-answer method, worksheets, field trip etc. The specific and suitable activity or method can be opted at the lesson planning stage. For example, a field trip can be a unique way of teaching about transportation through experience.", "7. Resource Material: Apart from the exercises various resource material like", "flash cards, videos, PPTs etc. can be used to aid the learning and make it more fun.", "8. Assessment: This is the stage of assessing the behavioural learning outcomes", "set at the earlier stage of formulating the unit plan. Various assessment techniques can be used like oral assessment, worksheets, activity etc. For assessing the identification of modes of transport, flash cards depicting various modes can be displayed and learners can be asked to name the transport. A worksheet for matching the columns or True/False statements can be administered for the same.", "9. Feedback/Reflection: The reflection component is the one which is filled", "after finishing the unit or during it. It can be based on self-reflection or the feedback received from learners or/and peers. It acts as a guiding light for future unit plans which can be both the immediate or long term. This feedback can inform what needs to be incorporated in further units. It can also give insight as to what changes need to be made while conducting the same unit in another section or in the next session. The reflection or feedback plays a crucial role in our growth as a teacher."]}, {"t": "7.4.4 Unit Plan – Template", "p": ["Each plan is presented in a template for better presentation and clarity of display. The tabulated presentation makes the plan easier to grasp at single glance thus saving lot of time to go through it again and again during the teaching - learning process. There can be various templates for a unit plan with minor differences. But the overall classification would be more or less similar to as discussed above. One such template is provided below: UNIT PLAN Subject Class Sub Units 1. 2. 3. Duration Overview Topics", "Teaching Student Resource Material Assessment"]}, {"t": "7.4.5 Unit Plan – Sample", "p": ["In the previous section we discussed creating a unit plan with reference to the unit titled “Going Places” of Mridang, English textbook for class 2 by NCERT. Let us put that in the form of an organised unit plan in the given template. UNIT PLAN Subject English Class II Unit Going places Sub Units 1. Chapter 5 – Come Back soon", "2. Chapter 6 – Between Home And School", "3. Chapter 7 – This is My Town", "Duration 10 Hrs. Overview The unit aims at familiarising the children to their local surroundings and then extend it to travelling to far off places. The unit incorporates environmental sciences and social sciences as well as has the scope of learning about various modes of transport, local geography along with development of language skills and vocabulary building. Objectives Topics Teaching Student Duration Resource Material Learners describe their journey from home to school", "Between Home And School Reading of the lesson and discussion Prompting the learners by describing an incident while coming to will join the conversation by describing their experiences of coming to Sharing experience of any trip they may have taken", "1.5 hr", "Finger puppets Comprehension check of the lesson", "Oral description of route to school or experience of coming to school in mother tongue, with a few familiar words of L2 identify the various modes of transport", "Poem– Come Back Soon Reading aloud the poem", "Identification of various modes of transport in the poem Matching of pictures of modes of transport with their names Making list of modes of transport they see around during a day Making a chart of different modes of transport (group work) 1 hr Flash cards", "Worksheets", "Charts Quiz on modes of transport identify and tell about familiar places they see around them Between Home And School", "This Is My Town", "draw various landmarks they see daily enroute 30 mins Drafting the route between home and", "Identification of Flash cards/ pictures of landmarks that occur on any particular route that the learners may have travelled Learners fill their home and school address in different templates", "This Is My Town Reading of the poem and explanation", "Teacher discusses various units of an address like colony, town, city, state and country using Venn diagram and maps", "fill address in provided templates 1 hr Maps", "Address Templates", "All the above objectives Field Trip Conducting a school trip in the local area Learners travel and identify the modes of transport used and seen", "Create their own I-card for the trip", "Sharing of experience of the trip in class, at home", "Writing English words or names of familiar things they may have encountered on the trip", "5 hrs. are assessment based The unit was completed in time. Learners were very curious during the field visit. Most of the learners enthusiastically completed the outside school activities. However, many students were hesitant in writing. In next unit, we will plan to focus more on joyful activities promoting writing. CHECK YOUR PROGRESS 7.2", "1. Write any two characteristics of a good unit plan.", "2. Write any two purposes of making a unit plan.", "3. Which of the following is not a component of a unit plan:", "a) Learning objective b) Duration c) Curricular goals d) Assessment techniques Answer: 3. c)"]}, {"t": "7.5 LESSON PLAN", "p": ["A lesson plan can be considered to be an offshoot of the unit plan. While a unit plan can be stretched over a duration of weeks, a lesson plan is restricted to a single period during the day. The period can be of any duration depending on the time table of the school and the standard of the learners. For young children in foundational or primary stages a single period ranges from 30-40 minutes."]}, {"t": "7.5.1 Pre-Requisites for an Effective Lesson Plan", "p": ["Any effective lesson plan should answer three questions – What to teach, Why to teach and How to teach. Before designing a Lesson Plan we should have a clear understanding of the learners – their context, previous understanding which will help in informing the effective teaching - learning strategies and the kind of resources to be used. This will help in answering the three questions of What, Why and How to teach for the learners of a specific context. Table 7.2: Pre-Requisites for Lesson Plan WHAT WHY HOW Content, syllabus, gaps between previous knowledge, exam requirements etc. Achievement of specific learning objectives and learning outcomes. Teaching learning activities, teaching methods, teaching learning aids, resources, activities and exercises to be done by the learners."]}, {"t": "7.5.2 Components of a Lesson Plan", "p": ["The unit plan guides the formation of a lesson plan. Its components are also similar to those of a unit plan with the necessity of restricting them to a single period. Let’s learn about the components of a lesson plan based on the unit plan created above. The lesson plan constitutes of the following details:", "1. Introduction: It contains specific details like the class, name of the book,", "name of the chapter, date when the plan will be carried out and the duration for which it is being prepared.", "2. Topic: Name of the topic can range from the chapter’s name to any other", "specific topic like preposition, adverb, adjective etc. for grammar, letter writing, story creation etc. for writing skills, picture reading and so on.", "3. Learning Objectives: At this stage specific objectives are designed which", "are expected to be achieved by the end of the lesson. These objectives can be derived from the larger objectives framed in the unit plan. For example, in the unit plan above we had framed an objective that the learners identify the modes of transport. For the specific lesson of the day the objective can be framed as - the learners can identify the modes of land transport. Here as well, like unit plan, the learning objectives should be preferably in behavioural terms so that we assess at the end of the lesson whether these objectives have been achieved or not.", "4. Teaching Aids: Herein comes a list of resources that we shall use during our", "classroom teaching. These can range from only textbooks to pictures, flash cards, charts, PPTs to video programmes or any other resources appropriate for the learners.", "5. Previous knowledge: Recapitulating previous knowledge is crucial for", "forging links with the new knowledge to be introduced during the day. It is also an opportunity for revising what had been learnt the day before or in previous classes. This aids in concretising the knowledge gained previously and learning new things without feeling overburdened. For testing previous knowledge related to modes of transport we can ask children questions like:", "- What kind of transport do they use to come to school?", "- Which transport do they use to go to market?", "- If they had gone somewhere recently, which transport had they used?", "We can ask learners to draw the vehicle their family or their neighbour own.", "6. Procedure: This stage forms the core of the lesson plan. At this stage we", "will list out the activities chronologically that will be conducted during the period. For attaining the objective of successfully identifying the mode of land transport we can design the classroom practices for the specific period in the following manner:", "- Ask the learners to circle the means of transport that they have seen", "on the road.", "- Read the poem silently and then read aloud.", "- Match the names of the modes of transport in the poem with the", "pictures circled in the book; and so on.", "7. Recapitulation: Overview of the content covered in that particular period.", "8. Assessment: Here we assess whether the learning objectives designed at the", "beginning of the lesson plan have been achieved or not. It can be done in many ways. Assessment can be done in the form of certain questions that can be answered in chorus. Or we can call a few students on blackboard to draw or answer certain questions like matching the correct pairs or true/false etc. We can even administer a small worksheet if time permits.", "9. Assignment: Homework assignment may be given but it is to be ensured", "that they are enjoyable, not burdensome, and do not simply repeat exercises already completed in the classroom. For example, we can ask learners to list down the number of two wheelers/four wheelers they found standing on their way home, or making a list of types of transports owned by any three neighbours etc. Such kind of exercises will enhance their observational skills and social skills.", "10. Reflection: It is not necessary that every lesson goes on in the class as", "planned. Sometimes it may happen that the learners are not interested in the lesson or there may be gaps between their previous knowledge and the new knowledge introduced. Learners may find a specific activity repetitive as it may have been conducted in any previous period for some other topic as well. All these cases are beyond our control but they can inform our practice for the future. For example, in case of a gap between previous knowledge and concept at hand, we can prepare a lesson plan for the next day which is closer to the previous understanding of the learners and acts as a bridge between it and the topic to be dealt ahead. In case of any repetitive activity, we can change the activity in the class itself or plan any other interesting activity for the next class with a certain hint to the learners so as to arouse their interest for the next day."]}, {"t": "7.5.3 Lesson Plan – Template", "p": ["The tabulated presentation of a lesson plan makes it easier to administer it in the class without wasting much time in reading the description. Similar to unit plan, there can be various templates for lesson plans as well with minor differences. One such template is provided here: LESSON PLAN Subject Class & Section Book Chapter Topic 1. 2. 3. Teaching Aids Previous Knowledge", "Procedure 1. 2. 3. 4. 5. Recapitulation", "Assignment"]}, {"t": "7.5.4 Lesson Plan – Sample", "p": ["Deriving from the Unit Plan created in the previous section let us formulate a lesson plan in the template provided above: LESSON PLAN Subject English Class & Section II Date 14 October 2026 Duration 40 mins Book Mridang Chapter Chapter 5 - Come Back Soon Topic Modes of transport", "1. Learners will identify modes of land transport", "2. Learners will match the picture of modes of transport", "with their names", "3. Learners will read aloud the poem.", "4. Learners will create sentences using the names of", "transportation.", "5. Towards the end of the class, different learners will be", "asked to enact driving/riding/flying the vehicle of their choice. They can include making sounds of the chosen vehicle, gathering passengers etc. Teaching Aids Textbook Pictures of different modes of transport Previous Knowledge Teacher will ask the following questions to check the previous knowledge of the learners as well as forge linkage with the topic at hand:", "1. What kind of vehicle do you use to come to school?", "2. Have you gone somewhere outside the city? If yes,", "which transport did you use during that journey?", "3. What kind of vehicle have you seen around you but", "never travelled in it? Procedure 1. Teacher will ask the learners to circle the land transport in the textbook that they have seen on the road.", "2. Reading aloud of the poem, once by the teacher then", "twice by children, together.", "3. Learners will identify and underline the names of various", "means of transport in the poem.", "4. Then they will be asked to attempt matching those names", "with the picture given on the page.", "5. Learners will be asked to identify the vehicles they have", "travelled in.", "6. Activity 2: They will be asked to frame one sentence", "using the names of the vehicles that they have travelled in.", "7. Learners will be introduced to prepositions in these", "sentences which will be taken up in detail in other lesson. Recapitulation Learners will be asked to name the means of transport that occurred in the poem. Assessment The framing of sentences can also be used for assessment. Teacher will show the pictures of different means of transport and ask the learners to identify them. Assignment On your way back to home count the number of four-wheeler vehicles that are standing still/not moving. Ask three of your neighbours the names of the vehicles owned by them. Reflection Learners were not much interested in the activity of identifying the vehicles shown in the pictures displayed on the board as they had already done the identification of vehicles in the chapter both in picture and as names. It became repetitive for them towards the end. While doing means of air and water transport, instead of identifying they can be asked to draw them. CHECK YOUR PROGRESS 7.3 Complete the given sentences:", "1. Previous knowledge plays a crucial role in forging links with ……………….", "2. In a lesson plan, specific objectives are designed which are expected to be", "…………………", "3. While giving a home assignment it needs to be kept in mind that it is not", "…………………… Answer:", "1. new knowledge to be introduced.", "2. achieved by the end of that particular lesson", "3. burdensome, boring and repetitive."]}, {"t": "7.6 DIFFERENCE BETWEEN A UNIT PLAN AND A LESSON PLAN", "p": ["The principles behind both unit and lesson planning are similar. Both are focused on achievement of learning outcomes through set objectives, move forward forging a link with learners’ previous knowledge, to streamline the process of education, avoiding wastage of time and efforts and so on. However, there are a few points that help us in differentiating between a Unit plan and a Lesson plan. Let us look at those differences: Table 7.3: Differences between Unit and Lesson Plan Basis of Difference Unit Plan Lesson Plan Scope Broader in scope Narrow in scope Content A unit probably containing many chapters A chapter or even a particular topic within a chapter Duration Can range over weeks or maybe months Has to be completed within one period Objectives Larger objectives to be achieved over a period of time Specific objectives to be achieved within that period itself Relation with each other Aggregation of lessons Part of a unit CHECK YOUR PROGRESS 7.4 State True or False:", "1. A lesson plan is of longer duration than a unit plan.", "2. A unit consists of a specific topic.", "3. A unit plan has a broader range than a lesson plan.", "Answer: 1. False, 2. False, 3. True"]}, {"t": "7.7 LET US SUM UP", "p": ["In this chapter, we learned that planning provides a systematic structure to the educational process. It makes achievement of learning outcomes and larger curricular goals more realistic. The focus on unit planning and lesson planning in this chapter arises from the fact that teachers have the greatest autonomy in designing these two components. A detailed discussion of the planning process at both levels will make the task more systematic, effective, and manageable. An effective unit plan and lesson plan, in turn, make the teaching–learning process easier, more cohesive, engaging, and successful."]}, {"t": "7.8 END EXERCISES", "p": ["1. Formulate a Unit Plan for a unit of English for class 1.", "2. Design an English lesson plan for any topic for class 3.", "3. What is the difference between a unit plan and a lesson plan?"]}, {"t": "7.9 REFERENCES", "p": ["National Council of Educational Research and Training. (2022). National curriculum framework for foundational stage (NCF-FS). NCERT. https://ncert.nic.in/pdf/NCF_for_Foundational_Stage_20_ October_2022.pdf National Council of Educational Research and Training. (2023). National curriculum framework for school education 2023 [PDF]. NCERT. https://ncert.nic.in/pdf/NCFSE-2023-August_2023.pdf. National Council of Educational Research and Training. (2023). Mridang- 2. NCERT."]}];
const doc=document.getElementById('doc'),$=id=>document.getElementById(id);
const S=[];
C.forEach((c,si)=>{
  const sec=document.createElement('section');
  const h=document.createElement('h2');h.append(c.t);
  const b=document.createElement('button');b.textContent='Listen';b.onclick=()=>start(firstOf(si));h.append(b);
  sec.append(h);
  c.p.forEach(par=>{
    const p=document.createElement('p');
    (par.match(/[^.?!]+[.?!]+(\s|$)|[^.?!]+$/g)||[par]).forEach(t=>{
      const s=document.createElement('span');s.className='s';s.textContent=t.trim()+' ';
      const i=S.length;s.onclick=()=>start(i);
      S.push({el:s,sec:si,text:t.trim()});p.append(s);
    });
    sec.append(p);
  });
  doc.append(sec);
});
const firstOf=si=>S.findIndex(x=>x.sec===si);
const ss=window.speechSynthesis;
if(!ss){$('warn').hidden=false;$('warn').textContent='This browser does not support speech playback. Please open the file in Chrome, Edge, Safari or Firefox.';}
let idx=0,playing=false,paused=false,token=0,voices=[];
const INDIAN=/(india|rishi|veena|heera|hemant|kalpana|ravi|neerja|prabhat|aditi|raveena|lekha)/i;
function loadVoices(){
  if(!ss)return;
  const L=$('lang').value;
  const rank=v=>{
    const lg=v.lang.replace('_','-');
    if(L==='en-IN')return lg.toLowerCase()==='en-in'?0:(INDIAN.test(v.name)&&/^en/i.test(lg))?1:/^en-(GB|AU)/i.test(lg)?3:/^en/i.test(lg)?4:9;
    return lg.toLowerCase()===L.toLowerCase()?0:/^en/i.test(lg)?2:9;
  };
  voices=ss.getVoices().filter(v=>rank(v)<9).sort((a,b)=>rank(a)-rank(b));
  const sel=$('voice');sel.innerHTML='';
  voices.forEach((v,i)=>{const o=document.createElement('option');o.value=i;o.textContent=v.name+' ('+v.lang+')';sel.append(o);});
  const w=$('warn');
  if(!voices.length){w.hidden=false;w.textContent='No English voices were found on this device. Please check your system speech settings.';}
  else if(rank(voices[0])>1){w.hidden=false;w.textContent='No '+$('lang').selectedOptions[0].text+' voice was found on this device, so the closest English voice is selected. For Indian English, install an en-IN voice in your phone or computer speech settings.';}
  else w.hidden=true;
}
loadVoices();if(ss)ss.onvoiceschanged=loadVoices;
function mark(i){
  S.forEach(x=>x.el.classList.remove('on'));
  const s=S[i];if(!s)return;s.el.classList.add('on');
  s.el.scrollIntoView({block:'center',behavior:'smooth'});
  $('prog').firstElementChild.style.width=((i+1)/S.length*100)+'%';
  $('now').textContent='Now reading: '+C[s.sec].t;
}
function speak(){
  if(idx>=S.length){finish();return;}
  const my=++token,u=new SpeechSynthesisUtterance(S[idx].text);
  const v=voices[$('voice').value];u.lang=$('lang').value;if(v){u.voice=v;u.lang=v.lang;}
  u.rate=parseFloat($('rate').value);mark(idx);
  u.onend=()=>{if(my===token&&playing){idx++;speak();}};
  u.onerror=()=>{if(my===token&&playing&&!paused){idx++;speak();}};
  ss.speak(u);
}
function start(i){ss.cancel();token++;idx=i;playing=true;paused=false;$('play').textContent='Pause';setTimeout(speak,60);}
function finish(){playing=false;paused=false;idx=0;$('play').textContent='Play';$('now').textContent='Finished. Press Play to listen again.';}
$('play').onclick=()=>{
  if(!playing)return start(idx);
  if(paused){ss.resume();paused=false;$('play').textContent='Pause';}
  else{ss.pause();paused=true;$('play').textContent='Resume';}
};
$('stop').onclick=()=>{ss.cancel();token++;playing=false;paused=false;idx=0;$('play').textContent='Play';S.forEach(x=>x.el.classList.remove('on'));$('prog').firstElementChild.style.width='0';$('now').textContent='Stopped.';};
$('next').onclick=()=>{const s=Math.min(C.length-1,(S[idx]?S[idx].sec:0)+1);start(firstOf(s));};
$('prev').onclick=()=>{const cur=S[idx]?S[idx].sec:0;start(firstOf(idx>firstOf(cur)?cur:Math.max(0,cur-1)));};
$('lang').onchange=()=>{loadVoices();if(playing&&!paused)start(idx);};
['rate','voice'].forEach(id=>$(id).onchange=()=>{if(playing&&!paused)start(idx);});
window.addEventListener('beforeunload',()=>ss&&ss.cancel());
</script>
