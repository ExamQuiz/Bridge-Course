const C=[{"t": "2.0 INTRODUCTION", "p": ["Language is an essential aspect of human life. Human beings use it for various purposes, including communication. Language is a powerful medium through which we not only understand our world but also understand other people and their thoughts and perceptions. It must not be limited to a classroom subject to be taught. Language gives us the opportunity to express our thoughts to others. Language gives us confidence that helps us to create new experiences and learn from these experiences. The language that a child hears and absorbs before they learn to speak from their environment, home, family and neighbourhood is called their mother tongue/native language. Learning a language other than one’s native tongue is referred to as a second language (L2). In contrast to first language acquisition, which usually takes place spontaneously and naturally in early childhood, second language acquisition involves more deliberate and conscious efforts, frequently impacted by formal education, social interactions and individual motivation. We have learned in the previous lesson that in the context of languages, the National Education Policy 2020 recommends multilingualism and use of the mother tongue as the medium of instruction. Mother tongue is more helpful in developing our conceptual understanding, because we hear, speak, read and write language(s) a lot in mother tongue. In the previous lesson, we learnt about various language related provisions and recommendations (L1 & L2) with specific reference to the National Curriculum Framework – Foundational Level (2022) and School Education (2023). Language-related concerns are among the most essential in education, as acquiring a language has implications that go beyond language itself. In this lesson, we will understand in-depth about second language and the process of teaching and learning of second language so that we can ensure the organisation of our language classroom processes. We will also explore the language curriculum objectives, key competencies, and expected learning outcomes for the foundational stage (Grades 1 and 2) and for the preparatory stage (Grades 3 to 5)."]}, {"t": "2.1 LEARNING OUTCOMES", "p": ["After completion of this chapter, the learner:", "• Differentiates between mother tongue and second language;", "• Explains the aspects related to language learning in their second", "language;", "• Describes the advantages of learning a second language;", "• Recognises the challenges and concerns of learning a second language;", "• Plans and conducts activities to enhance and facilitate second language", "learning."]}, {"t": "2.2 NOTION OF FIRST LANGUAGE AND SECOND LANGUAGE", "p": ["Language is not only constrained to the mode of communication but also a useful means to think, feel, and react to things (Kumar, 2004). There is a strong connection between language and environment, and we acquire the language(s) available in the environment with ease. This environment can be our own home, family or even the neighbourhood. This means that we have a stronger connection with the language that is available in abundance in the environment. In other words, the language with which we are more familiar and use more frequently is considered the first language (L1). Children pick up their mother tongue (first language) from their immediate environment i.e., home environment, despite the socio-cultural differences. They attain knowledge of the language (grammatical competence) through this process without being taught grammar separately. The child learns the language from the experiences it has. Children hear from adults’ conversations and learn. They replicate words that they hear. But replication is not the only means by which a child learns. Children are exposed to words and sentences, associate them with objects or ideas, and subsequently use them in speech. They do invent their own words, and through the continuous conversations around them, they learn the correct way of speaking. Language doesn’t necessarily have to be taught and acquired in isolated segments at different times. It is possible to blend languages and children should have the chance to grasp new concepts and languages by leveraging their first language as a support frameworkframework: “Children should be exposed to and immersed in multiple oral languages (also referred to as L2 and L3 below) from an early age” (NCF-FS, 2022, p. 77). During the early years of learning, language significantly influences how children perceive and interpret the world in which they exist. It plays a vital yet often subtle role in helping them recognise their own abilities, interests, values, and attitudes. A child’s language serves as a powerful tool for navigating both social and academic environments and is a key part of their identity. Every language carries its own system and body of knowledge. Interestingly, all languages are acquired through similar processes. Fluency in a first language— such as the mother tongue/home language/first language —can inspire and encourage learning other languages. This approach aligns with the principles of multilingual education, emphasising the use of a child’s first language as a bridge to learning additional languages. Research indicates that children learn best when taught in their mother tongue, as it enhances comprehension and fosters a deeper connection to the material. Furthermore, integrating multiple languages in early education can stimulate cognitive development and support the acquisition of new languages (McCaffrey & Jhingran, 2024). In order to truly understand a language, a person must learn about its structure, their identity in relation to it, and how it connects with other languages. A language remains alive as long as it is spoken and understood by its community. Its significance lies in the value it holds for its speakers—politically, socially, economically, technologically, and culturally (Manoth, 2024). CHECK YOUR PROGRESS 2.1", "1. Young learners pick up their mother tongue from", "a) their home. b) their neighbourhood. c) their home and neighbourhood. d) school.", "2. NCF - FS suggests that young children in early age must", "a) exposed to and immersed in multiple oral languages. b) focus on one language. c) exposed to hazardous workplaces. d) none of the above.", "1. c), 2. a)"]}, {"t": "2.3 LANGUAGE LEARNING IN THE CONTEXT OF SECOND", "p": ["LANGUAGE The curriculum framework suggested by the National Education Policy (NEP) 2020 (5+3+3+4) highlights the significance of the early phases of education. There is a strong agreement that children need to establish a solid foundation during their formative years to thrive in subsequent stages. These years are crucial for the enhancement of literacy abilities and overall cognitive growth. Fig. 2.1: New Pedagogical and Curriculur Structure (NEP, 2020, p. 6) Early language learning highlights how children create meaning, which helps boost their creativity and supports the development of their appreciation for beauty and their values. The cognitive and affective domains serve as the foundation for the language development process. In contexts that are ageappropriate, engaging, and pertinent, children are inherently motivated to read, write, listen, and interact. As learners advance through the grades, they increasingly grasp the complexity of texts and the contextual application of grammar. Children develop an understanding of language nuances through increased participation in Listening, Speaking, Reading, and Writing (LSRW) activities. Language acquisition is the process by which individuals develop the ability to understand, interpret, and use words and sentences for effective communication. it acquisition generally refers to how infants learn their native language, which is the language a person acquires from birth. They are capable of learning any language, be it Hindi, English, Tamil, Kannada or any other human language they encounter. The grammatical sentences that children acquire serve as positive evidence. Chomsky (1986) stated that children naturally possess the ability to learn language from their surrounding environment. One example of this is a three-year-old child using their mother tongue to construct a complex sentence with proper grammatical accuracy e.g. Papa office, Mum (water) hot. Children acquire language skills even without consistent grammatical correction from adults. The process through which language is obtained is an ongoing, subconscious and unforced process which happens naturally. Learners acquire it without being aware of its continuous involvement. Providing multilingual language education allows children to explore diverse perspectives and to be involved with the organised body of knowledge that different languages provide. Such exposure nurtures constitutional ideals such as harmony and mutual respect along with helping children navigate social environments with ease and think in more diverse and creative ways. Learning is most effective when new material is connected to the learners’ previous knowledge and current abilities. Therefore, it is crucial to use learners’ prior knowledge and experiences in gaining proficiency in a second language. It is evident that humans possess both the ability and the system necessary to develop language skills, especially when supported by motivation and childcentred learning experiences. Children acquire language based on their need to communicate and express themselves. They grasp conventional language use at their own pace through meaningful and engaging input. For instance, illustrated texts are often easier for children to comprehend than those without visuals. Phonemic awareness holds great importance in language development provided it arises from context naturally. Including appropriate books, posters, story books help a facilitator to provide better opportunities for learners to acquire the second language. Words and sounds that are frequently repeated in stories can be used to teach the relationship between letters and sounds. A letter presented within a word and a word within a story is more meaningful and easier to understand than teaching a letter in isolation. Incorporating local stories, such as Indian epics, legends, Panchatantra tales, and regional folktales, into second language (that can be English in Hindi speaking regions) classrooms can boost students’ engagement and sense of familiarity. Additionally, using multilingual materials that include students’ mother tongues can improve their understanding and build confidence. Thoughtful use of translanguaging—shifting between the learners’ native language and second language —can support comprehension in the early stages. Yet, it remains important to gradually guide students toward using the second language. Language learning, be it for L1 or L2, is most effective when rooted in meaningful communication, enabling learners to incorporate the language in real-life interactions. Developing communicative competence involves both Basic Interpersonal Communicative Skills (BICS) and Cognitive Academic Language Proficiency (CALP). BICS equips learners to manage everyday conversations, such as greetings and casual exchanges, while CALP enables them to tackle more demanding academic and intellectual tasks, like analysing texts and constructing logical arguments. These two factors are deeply interconnected and form the foundation of communicative competence. For primary-level learners acquiring English as a second language, teachers should focus on building BICS and gradually guiding students toward achieving CALP. CHECK YOUR PROGRESS 2.2", "1. Basic Interpersonal Communicative Skills (BICS) help learners", "a) in writing paragraph. b) in everyday conversations. c) in mathematics. d) in reading.", "2. Cognitive Academic Language Proficiency (CALP) is related to", "a) Rote memorisation. b) Attendance c) academic and intellectual tasks. d) None of the above.", "3. For better acquisition of second language a teacher/facilitator must include", "a) appropriate books b) Relevant posters c) Age appropriate story books", "4. Knowledge of more than one language allows children to explore", "a) diverse perspectives. b) Classroom. c) Peer groups. d) school. 1.b), 2.c), 3.d), 4. a)"]}, {"t": "2.4 ADVANTAGES OF LEARNING SECOND LANGUAGE", "p": ["In a multilingual country like India, where the language changes after every mile, it is quite natural for young children to grow up in an environment where they speak and know multiple language. While it is easy to learn the native/first language because we hear it spoken at home, outside the home, in school, in the neighbourhood, learning a second language is not that easy. Learning a second language is beneficial in many ways, this has been shown in many researches. Learning a second language can stimulate new areas of the brain and enhance its natural capacity for concentration, thanks to the adaptability of the brain’s language centres (Bak et al., 2014). Scholars believe that learning a new language can enhance a person’s thinking and memory skills, and that bilingual students tend to have better focus compared to those who speak only one language. A study by Hilchey and Klein (2011) suggests that bilingual individuals develop stronger mental control abilities, which could safeguard them from cognitive decline in later life, thanks to their continuous use of multiple languages. Learning a second language has several benefits. It helps to develop the prefrontal cortex which is important for thinking and can simplify the process of learning an additional language. It also improves attention, memory, and creativity, which get better with the practice of the language. Children who learn a second language often perform better in school than those who don’t (Zhang, 2021). Acquiring a second language early in life helps children think more flexibly and communicate better. It also allows them to see problems from different perspectives. Research shows that people who speak more than one language often have better memory, planning, and multitasking skills. Early exposure to multiple languages trains the brain to focus on relevant information and ignore distractions, a cognitive skill that contributes to better concentration, stronger memory, effective planning, and improved multitasking later in life. Introducing bilingual or multilingual education in early childhood, with the native/first language as the primary medium, lays a strong foundation for effective communication. When children begin learning in their first language and are gradually exposed to additional languages, they become more confident and skilled at moving between them. This skill, known as code-switching, enables them to switch languages based on the situation, audience, or context. It demonstrates cognitive flexibility and a strong understanding of language use. Beginning this approach early not only supports the development of both the home and second languages but also enhances thinking abilities, selfconfidence, and the capacity to express ideas clearly in multiple languages. The NCF-FS highlighted the relevance of second language (L2) learning: “Exposure to multiple languages in oral form can also provide significant cognitive stimulation to the child that is beneficial, including the development of creativity and critical-thinking abilities, in addition to socio-emotional skills, as sounds and gestures by Teachers, parents, peers, and others are transformed in a child’s mind into words, phrases, and sentences” (2022, p. 77). CHECK YOUR PROGRESS 2.3", "1. Learning second language", "a) can make learning another language easier. b) Improve health. c) Makes you popular among others. d) Help to top in school.", "2. Second language also improves attention, memory, and creativity, which get", "better the more a child practices the language. a) False b) True", "3. Learning a new language can enhance a person’s", "a) thinking b) memory skills c) focus", "4. ______________ helps in better concentration, stronger memory, effective", "planning, and improved multitasking. a) Multilingual approach b) One language approach c) Memorisation d) A teacher", "1. a), 2. b), 3. d), 4. a)"]}, {"t": "2.5 MAJOR CONCERNS AND CHALLENGES IN L-II LEARNING", "p": ["IN THE INDIAN CLASSROOM CONTEXT. The National Curriculum Framework for School Education mentioned the challenges associated to language learning in schools that require immediate attention. Low Literacy Levels: India is facing a learning crisis, as a noteworthy number of students in elementary school have not yet developed essential literacy skills, such as the capability to read and understand simple texts. Therefore, facilitators in early grades must give importance to foundational skills in literacy and numeracy (FLN) so that the challenge must be overcome. Less Time for Language Learning: In many schools, the weekly timetable does not provide enough time for focused language instruction. This limited exposure is a major barrier to addressing the foundational literacy gaps seen in early grades. To support students in building strong reading, writing, and comprehension skills, it’s important for teachers to advocate for and make the most of every opportunity for meaningful language engagement throughout the day—across subjects and during classroom routines. Expanding language-rich experiences beyond designated language periods can help bridge this gap and promote overall language development. Low Quality Resource/Learning Material: There is a noticeable gap in the quality of language resource/learning materials used across classrooms, with many resources failing to meet learners’ needs. As educators, it’s important to select materials that combine appropriate vocabulary, relevant topics, engaging pictures, and user-friendly layouts to better support student understanding and motivation. Shortage of Teachers: There is a dire need to appoint well-qualified language teachers to meet the requirements of schools and learners. It also impacts the teacher-student ratio, making it difficult to provide focused and effective learning in the classroom. Content-Completion-Focused rather than Competency-Focused Teaching: Language lessons sometimes become routine tasks and teachers rush to finish the textbook without ensuring that students have mastered the key skills. Instead, language instruction should prioritise the development of competencies, guiding students toward meaningful language use and understanding. Memory-Based Assessment: The intention behind language learning includes mastering communication, functional fluency, and appreciating literary works. Still, assessments mostly test how much of the textbook content students remember, rather than how well they can actually use the language. Lack of Suitable Environment: Children often learn by listening and speaking with those around them, but in many cases, their surroundings do not provide enough exposure to spoken English. Without strong role models or regular practice, language development in English can be delayed. Peer Pressure: Due to intense competition, students often feel pressured to learn English not out of interest, but as a requirement for success. This pressure can take the joy out of learning, especially when the focus is only on memorising definitions and terms rather than understanding the language meaningfully. CHECK YOUR PROGRESS 2.4 What are the challenges related to language learning in schools highlighted by NCF-FS? a) Low literacy levels b) Less time for language learning c) Low quality resource/learning material Answer: d)"]}, {"t": "2.6 CURRICULAR GOALS", "p": ["Curricular goals hold a dominant role in shaping the educational process by informing the design of learning materials, teaching methods, and assessment tools. They outline the key learning achievements students should reach at diverse phases of their education. Grounded on the values of holistic and inclusive learning, these goals support the development of both academic knowledge and essential life skills such as critical thinking, creativity, communication, and emotional well-being. In language learning, curricular goals focus on enhancing communication and comprehension skills while fostering respect for linguistic and cultural variety. When teaching aligns with these clearly defined goals, it helps create meaningful, age-appropriate, and interactive educational opportunities for every student. Curricular Goals (CG) form the foundation of all teaching and learning resources. The NCERT English textbooks Mridang for Classes 1 and 2, the Santoor textbook for Class 3 have been developed with careful attention aligned with these goals. The National Curriculum Framework for the Foundational Stage (NCF-FS) clearly defines CG that support language teachers in understanding, facilitating, and assessing children’s language development. These goals are designed to address the diverse linguistic needs of learners in the classroom, ensuring inclusive and effective language learning. At the core of every language lies communication and comprehension, a focus that is reinforced in CG1: Sustains effective communication skills for day-to-day interactions,enhancing their oral ability to express ideas. CG provides ample opportunities for learners to engage with the text and share their input. Sections like ‘Let us speak’ and ‘Think and say’ subsection of ‘Let us think’ present opportunities for students to be creative with replies and share with classmates allowing learners to engage with language in a meaningful way. Fig. 2.2: Engagement with Texts (Mridang I, NCERT, 2024, p. 4; 46) 4 Mridang A. Repeat after the teacher Teacher: I clap with my hands. Children: I ... I tap with my feet. I look with my eyes. I walk with my legs. Let us speak Chapter 1.indd 4Chapter 1.indd 4 18-05-2023 14:39:5318-05-2023 14:39:53 46 Mridang Let us do A. You all know the alphabet song. Let us sing it while reading the letters. B. Sing it, loudly for the capital letters and softly for the small letters. A N B O C P D Q E R F S G T H U I V J W K X L Y M Z A n B o C p D Q e R f S g T H u I v J w K X l Y m Z Let us make puppets. Follow the instructions given by your teacher. a. Let us make 6 thick paper strips. These strips may be of any colour. c. Stick each picture on one end of the strip. The picture may help you. b. With the help of your teacher, draw faces of each family member on paper. d. You may now use these as puppets and play with your friends. Note to the teacher", "• Help the children read the above alphabet. They read the capital", "letters in a loud voice and the small letters in a soft voice. Let us think Chapter 1.indd 46Chapter 1.indd 46 18-05-2023 14:41:0818-05-2023 14:41:08 The curricular goals (CG) outlined in the NCF-FS are thoughtfully integrated into the textbook. For instance, CG 9.1, which emphasises listening to and appreciating simple songs, rhymes, and poems, is well represented through the action songs and engaging short poems featured in Mridang, the English textbook for the foundational stage. To support CG 9.2, learners are encouraged to explore rhyming words. The textbook consistently incorporates vocabulary related to everyday objects and experiences, aligning with CG 9.7, which focuses on acquiring sufficient vocabulary for daily interactions and using known words to infer the meaning of new ones. Furthermore, the textbook includes activities that promote meaningful conversation, addressing CG 9.3, which highlights the importance of fluent and purposeful dialogue—an essential skill in second language acquisition. There can be more resources other than textbooks that a facilitator may include for the same purpose. Activities such as ‘Join the dots in alphabetical order’ is an example of an instruction that the learner needs to understand to complete a given task, as indicated in CG 9.4. Another strength of the textbook is that it paid attention to cross-curricular integration by keeping mathematical concepts such as shapes that a learner deals with in their daily life scenarios. Fig. 2.3: Cross-curricular Integration (Santoor, NCERT, 2025, p. 25) Phonological awareness is the capability to recognise and distinguish between similar-sounding words. Since learners who develop this skill tend to become more successful readers, the textbook has included carefully designed activities", "to foster this awareness. It is essential to encourage and motivate learners to interrelate with words in a playful manner during the Foundational and Preparatory Stages, ensuring that learning remains both fun and effective. The purpose of the activities included in the textbooks is to promote conversation, allow learners to explore, read and sing with peers and build confidence in speaking, reading and writing English, and helping them gradually to become more independent in using the language. A facilitator must look for resources other than textbooks, such as story books, posters, magazines, etc., to provide more and more learning opportunities in classroom spaces. These resources will allow learners to immerse themselves into the world of language, filled with new possibilities to explore and learn. The more they see and use the language, the better it will become. The facilitator needs to understand that language cannot be rote memorised. More exposure to hear, speak, read and write in the target language makes the process of acquisition easier for learners and allows the facilitator to observe the progress of learners. A facilitator must create an encouraging environment for language learning by creating and using print rich environment that provides many opportunities for learners to use the language and learn the language. There are a few resources that have been developed by NCERT, such as annotated bibliography, Phirkee Bachchon Ki magazine, Barkha series, story books, big books etc, that can guide a facilitator to plan their instructions as per learning outcomes and subsequently achieve the curricular goals. Fig. 2.4: Barkha series, NCERT (2022) Fig. 2.5: Children’s Book, NCERT (n.d.) Gilli–Danda Gilli–Danda_Level 1 - 18155.indd 1 23-May-25 3:07:59 PM 1819 ISBN 81-7450-483-4 NCERT What on earth is What on earth is D.P. Sen Gupta D.P. Sen Gupta ENERGY? ENERGY? Cover 1819.indd 1-3 14-Sep-20 11:35:30 AM Fig. 2.6: CG and Competencies of Language and Literacy Development (NCF-FS, 2022, p. 62) CHECK YOUR PROGRESS 2.5 The curricular goals support the development of a) Mother tongue. b) Second language. c) Both academic knowledge and essential life skills. Answers: c)"]}, {"t": "2.7 COMPETENCIES AND LEARNING OUTCOMES IN THE", "p": ["CONTEXT OF LANGUAGE-II. Competencies are the fundamental knowledge and abilities that learners must acquire at every level of their education. They assist facilitators in determining if learners are fulfilling the desired curriculum objectives by acting as quantifiable markers of progress. These objectives are closely related to the skills which aid in the development of suitable evaluations, relevant learning experiences, and efficient teaching methods. By emphasising competencies, facilitators can guarantee that every learner receives support throughout their educational path, fostering both academic achievement and overall development. Competencies also refer to the learning outcomes that learners are expected to achieve by the end of a particular stage. Each curricular goal is linked to specific competencies, which help to ensure that all learners are provided with suitable learning experiences to meet those goals. When a learner demonstrates a competency, it indicates that they are making meaningful progress within the curriculum. Fig. 2.7: Components of Holistic Development (UNMUKH, NCERT, 2023, p. 9) Curricular goals and competencies are closely related but they perform distinct purposes in the educational process. The curricular goals are broad and long-term goals that explain what a learner may achieve after completing a particular level in their learning. They guide in the direction to plan curriculum, instructional practices, and learning outcomes. Competencies on the other hand are precise, Introduction to Balvatika 9 transaction of the curriculum. Opportunities have to be provided to children to construct their learning by exploration, investigation, problem-solving and critical thinking, thus, achieving the learning outcomes given in NCF-FS 2022. Teachers need to align the activities, experiences, content and pedagogy in order to achieve the learning outcomes. competencies The competencies are learning achievements that are expected to be attained by children by the end of a stage. Competencies for each of the curricular goals are expected to be achieved to ensure that all children receive appropriate learning opportunities for reaching their curricular goal. When competency is achieved, it means that a child is making progress in curriculum. (refer Annexure I to understand domains, curricular goals and competencies for Balvatika) learning outcomes The learning outcomes are the expected outcomes to be achieved by the end of activities. These are observable and measureable. Learning outcomes have been defined in NCF-FS 2022 for Balvatika. Learning outcomes help in planning and organising the content, deciding the pedagogy, and conducting assessment for achieving curricular goals. The outcomes of Balvatika can be achieved through an accessible, clear and well aligned pedagogy. Aims of Education Competencies Curricular Goals Learning Outcomes Learning Outcomes Holistic Development Curricular Goals Competencies Holistic development of the child is attained through curricular goals, competencies and learning outcomes and all are interrelated. Chapter 1.indd 9Chapter 1.indd 9 24 Apr 2023 16:38:0224 Apr 2023 16:38:02 quantifiable accomplishments that highlight how a learner is performing to meet these wide-ranging goals. Curricular goals define what students should achieve overall—such as improved thinking, language, and creativity. Competencies specify the practical skills and knowledge that reflect those goals in action. Combined, they create a clear roadmap for effective and responsive teaching. Table 2.1: Key Differences Between Curricular Goals and Competencies Aspect Curricular Goals Competencies Scope Broad, long-term Specific, short-term Function Guides curriculum and teaching approach Measures learning progress Focus Holistic development Skill-based outcomes Assessment Use Sets direction for what to teach Helps evaluate what has been learned Learning outcomes are specific, quantifiable statements that help a facilitator to check its learners’ understanding related to a specific task after completion of the period of instruction. They present clarity and direction to the facilitator in terms of their teaching and assessment, ensuring that learning is purposeful and goal-oriented. Unlike broad educational aims, learning outcomes are precise and measurable in nature, helping facilitators in lesson planning, executing and checking the progress that a learner has accomplished at the end. They also help in setting the expectations from the learner and facilitate a well organised and learner-centred environment where learners may actively involve with content and demonstrate their understanding in meaningful ways. In the context of second language acquisition, planning a lesson and its effective transaction language competencies and learning outcomes need to be taken into cognisance. While planning a lesson effectively a facilitator must look for the competencies and the learning outcomes associated with it to make the lesson planning easier and aligned. Competencies help in identifying and defining the crucial language skills that are speaking, listening, reading, and writing— that a learner must learn and refine to have mastery over the meaningful communication in the target language. On the other hand, learning outcomes outline clear, measurable objectives that describe learners’ achievement at various stages of their language acquisition and help a facilitator to understand learner’s level of learning. This provids clarity to the facilitator that how much the learner knows and understands and to incorporate those instructions and concepts in the lesson plan which the learner is found to be struggling with. Together, they enable educators to create targeted lessons and activities that support gradual and sustained language development. By clearly defining expected progress, competencies and learning outcomes enable learners to build practical language skills, increase their confidence, and move steadily toward fluency and academic success. CHECK YOUR PROGRESS 2.6", "1. Curricular goals are _____________ in nature.", "a) Short and boring b) Elaborative c) Board and long -term d) Specific and short", "2. Learning outcomes explains that", "a) learning is purposeful and goal-oriented. b) learning is aim less. c) learning is non-quantifiable. d) learning is slow.", "3. Choose the right order", "a) Curricular goals - competencies - learning outcomes b) learning outcomes - competencies - curricular goals c) competencies - curricular goals - learning outcomes d) Competencies - learning outcomes - curricular goals", "1. c), 2. a), 3.a)"]}, {"t": "2.8 LET’S SUM UP", "p": ["Language learning is a process that requires lots of cognitive skills and abilities. The mother tongue/home language a child may learn first from its surrounding but classroom space and teachers are going to provide the next facilitation to ensure the language learning takes place efficiently. The advantage of knowing the language (L1) will help teachers to initiate the process of reading and writing with L2 as well. Language learning process for a second language is not distinct from L1. Learners need a lot of exposure and opportunities to use that language to understand and learn it. It is the facilitator’s role to provide them all the necessary requisites to make their second language learning smooth and relevant. Curricular goals focus on strengthening communication, comprehension, and vocabulary through interactive activities rooted in real-life situations. This approach promotes fluency, creativity, and confidence in both the first and second languages, equipping learners for future academic and professional success while making language learning enjoyable and meaningful. Fostering second language skills in learners—especially in India’s multilingual context—requires a comprehensive strategy that combines practical communication, cultural sensitivity, and creative involvement. By incorporating real-life situations, multilingual techniques, and interactive activities, educators can offer students a rich and enjoyable learning experience. Emphasising both everyday conversation and academic language, along with step-by-step literacy growth, equips learners to confidently pursue educational and career opportunities while valuing the depth and diversity of the English language."]}, {"t": "2.9 END EXERCISES", "p": ["1. What are the differences between Basic Interpersonal Communicative Skills", "(BICS) and Cognitive Academic Language Proficiency (CALP)?", "2. Why are learning outcomes important in learning?", "3. What are the benefits of learning second language?", "4. What are the major challenges a teacher may face in classroom for teaching", "a second language?"]}, {"t": "2.10 REFERENCES", "p": ["Bak, T. H., Nissan, J. J., Allerhand, M. M., & Deary, I. J. (2014). Does bilingualism influence cognitive aging? Annals of Neurology, 75(6), 959–963. https://doi.org/10.1002/ana.24158. Chomsky, N. (1986). Knowledge of language: Its nature, origin, and use. Praeger. Hilchey, M. D., & Klein, R. M. (2011). Are there bili const doc=document.getElementById('doc'),$=id=>document.getElementById(id);
const S=[];
C.forEach((c,si)=>{
  const sec=document.createElement('section');
  const h=document.createElement('h2');h.append(c.t);
  const b=document.createElement('button');b.textContent='Listen';b.onclick=()=>start(firstOf(si));h.append(b);
  sec.append(h);
  c.p.forEach(par=>{
    const p=document.createElement('p');
    (par.match(/[^.?!]+[.?!]+(\s|$)|[^.?!]+$/g)||[par]).forEach(t=>{
      const s=document.createElement('span');s.className='s';s.textContent=t.trim()+' ';
      const i=S.length;s.onclick=()=>start(i);
      S.push({el:s,sec:si,text:t.trim()});p.append(s);
    });
    sec.append(p);
  });
  doc.append(sec);
});
const firstOf=si=>S.findIndex(x=>x.sec===si);
const ss=window.speechSynthesis;
if(!ss){$('warn').hidden=false;$('warn').textContent='This browser does not support speech playback. Please open the file in Chrome, Edge, Safari or Firefox.';}
let idx=0,playing=false,paused=false,token=0,voices=[];
const INDIAN=/(india|rishi|veena|heera|hemant|kalpana|ravi|neerja|prabhat|aditi|raveena|lekha)/i;
function loadVoices(){
  if(!ss)return;
  const L=$('lang').value;
  const rank=v=>{
    const lg=v.lang.replace('_','-');
    if(L==='en-IN')return lg.toLowerCase()==='en-in'?0:(INDIAN.test(v.name)&&/^en/i.test(lg))?1:/^en-(GB|AU)/i.test(lg)?3:/^en/i.test(lg)?4:9;
    return lg.toLowerCase()===L.toLowerCase()?0:/^en/i.test(lg)?2:9;
  };
  voices=ss.getVoices().filter(v=>rank(v)<9).sort((a,b)=>rank(a)-rank(b));
  const sel=$('voice');sel.innerHTML='';
  voices.forEach((v,i)=>{const o=document.createElement('option');o.value=i;o.textContent=v.name+' ('+v.lang+')';sel.append(o);});
  const w=$('warn');
  if(!voices.length){w.hidden=false;w.textContent='No English voices were found on this device. Please check your system speech settings.';}
  else if(rank(voices[0])>1){w.hidden=false;w.textContent='No '+$('lang').selectedOptions[0].text+' voice was found on this device, so the closest English voice is selected. For Indian English, install an en-IN voice in your phone or computer speech settings.';}
  else w.hidden=true;
}
loadVoices();if(ss)ss.onvoiceschanged=loadVoices;
function mark(i){
  S.forEach(x=>x.el.classList.remove('on'));
  const s=S[i];if(!s)return;s.el.classList.add('on');
  s.el.scrollIntoView({block:'center',behavior:'smooth'});
  $('prog').firstElementChild.style.width=((i+1)/S.length*100)+'%';
  $('now').textContent='Now reading: '+C[s.sec].t;
}
function speak(){
  if(idx>=S.length){finish();return;}
  const my=++token,u=new SpeechSynthesisUtterance(S[idx].text);
  const v=voices[$('voice').value];u.lang=$('lang').value;if(v){u.voice=v;u.lang=v.lang;}
  u.rate=parseFloat($('rate').value);mark(idx);
  u.onend=()=>{if(my===token&&playing){idx++;speak();}};
  u.onerror=()=>{if(my===token&&playing&&!paused){idx++;speak();}};
  ss.speak(u);
}
function start(i){ss.cancel();token++;idx=i;playing=true;paused=false;$('play').textContent='Pause';setTimeout(speak,60);}
function finish(){playing=false;paused=false;idx=0;$('play').textContent='Play';$('now').textContent='Finished. Press Play to listen again.';}
$('play').onclick=()=>{
  if(!playing)return start(idx);
  if(paused){ss.resume();paused=false;$('play').textContent='Pause';}
  else{ss.pause();paused=true;$('play').textContent='Resume';}
};
$('stop').onclick=()=>{ss.cancel();token++;playing=false;paused=false;idx=0;$('play').textContent='Play';S.forEach(x=>x.el.classList.remove('on'));$('prog').firstElementChild.style.width='0';$('now').textContent='Stopped.';};
$('next').onclick=()=>{const s=Math.min(C.length-1,(S[idx]?S[idx].sec:0)+1);start(firstOf(s));};
$('prev').onclick=()=>{const cur=S[idx]?S[idx].sec:0;start(firstOf(idx>firstOf(cur)?cur:Math.max(0,cur-1)));};
$('lang').onchange=()=>{loadVoices();if(playing&&!paused)start(idx);};
['rate','voice'].forEach(id=>$(id).onchange=()=>{if(playing&&!paused)start(idx);});
window.addEventListener('beforeunload',()=>ss&&ss.cancel());
</script>
