<script>
const C=[{"t":"11.1 INTRODUCTION","p":["Assessment is an essential part of the teaching–learning process. It not only helps teachers understand how children are learning but also guides them in improving their teaching practices. In language learning, assessment goes beyond testing knowledge of letters, words, or grammar. It looks at how children listen, speak, read, and write in real situations. This chapter focuses on some other important dimensions of assessment in language teaching. These include understanding emergent literacy, exploring 360° assessment, and using formative assessment strategies in the classroom. The aim is to make assessment more child-centred, continuous, and supportive of learning. Through these approaches, teachers can see the progress of learners from different angles—by observing, guiding, and giving feedback regularly. The chapter also highlights how assessment should help children become confident, independent learners rather than creating fear or pressure."]},{"t":"11.2 LEARNING OUTCOMES","p":["After completion of this chapter, the learner:","• Explains the principles of emergent literacy and their implications for reading instruction and assessment;","• Implements 360° assessment of reading by incorporating feedback from multiple sources—self, peers, and teachers—to support reflective and collaborative learning;","• Applies assessment strategies such as miscue analysis, task- based assessments, and observational tools to evaluate children’s comprehension and fluency;","• Develops and uses tools like rubrics and anecdotal records to assess reading in L2 and promote self-monitoring and metacognitive awareness."]},{"t":"11.3 EMERGENT LITERACY/ EARLY STAGES OF LITERACY","p":["DEVELOPMENT Emergent literacy refers to the abilities, knowledge, and dispositions that children develop via reading and writing before they develop into traditional or proficient readers and writers. Children could begin learning to read and write from an early age if they are given adequate opportunities before they can decode and write conventionally. Emergent reading skills incorporate print and logographic reading. Through the print materials, children can fetch meaning that can be used for different purposes. Emergent reading skills require exposure of children to print materials at home and outside, such as recognising the labels, observing others write or draw, or listening to children’s books being read aloud. The majority of children arrive at school with little knowledge of print; therefore, teachers must introduce them to it by fostering an environment rich in print and by involving them with books. Before learning to read and write letters, children must comprehend the value of literacy."]},{"t":"11.3.1 Strategies for Emergent Literacy","p":["1. Encourage children to engage with books by having them read aloud from illustrated storybooks.","2. Encouraging children to express themselves by writing, drawing, or scribbling on the ground or in notebooks may follow a storytelling session.","3. Using a variety of print resources, such as large books, picture books, story posters, poem posters, and children’s magazines, to create a print-rich environment in the classroom.","4. Establishing “writing” and “reading” corners in the classroom."]},{"t":"11.3.2 Emergent Literacy Assessment","p":["Before a young child formally learns to read and write, an emergent literacy assessment assesses their developing reading and writing knowledge and skills. Instead of only assessing reading proficiency, it concentrates on fundamental abilities such as phonological awareness, print awareness, and oral language. By identifying areas of strength and need, this assessment assists parents and teachers in creating appropriate literacy experiences."]},{"t":"11.3.3 Aspects of Emergent Literacy Assessment","p":["a) Emphasis on fundamental skills: Phonological awareness, print awareness, letter knowledge, and oral language development are the abilities that are assessed in emergent literacy.","b) Observation and interaction: To comprehend children’s developing literacy behaviours, the teacher observes how they interact with books, print materials, and during play.","c) A variety of evaluation instruments: Checklists, informal observations, and standardised tests like the Emerging Literacy and Language Assessment (ELLA) are some of the tools and techniques used to assess emergent literacy.","d) Dynamic and continuous: Assessing a child’s literacy is a continuous process that monitors their development of these fundamental abilities rather than a one-time occurrence.","e) Informed instruction: Teachers can create a nurturing and engaging literacy-rich environment by customising their instruction to each child’s unique needs using the data from emergent literacy assessments.","CHECK YOUR PROGRESS 11.2","1. Elu cidate the concept of Emergent Literacy.","2. How can Emergent Literacy be implemented in the classroom?","3. In general, which of the following is NOT regarded as an emergent literacy skill?","a) Realising that print has significance.","b) Identifying the alphabet’s letters.","c) Reading from a grade-level text with ease.","d) Gaining an understanding of spoken language sounds.","4. What is meant by the phrase “emergent literacy”?","a) The conventional method of learning to read and write.","b) The acquisition of fundamental reading and writing abilities and knowledge prior to formal education.","c) The capacity to understand difficult texts and read fluently.","d) The capacity to compose intricate reports and essays.","5. Out of the following, which one best describes emergent literacy?","a) A child is capable of reading a challenging book on their own.","b) A child recognises some letters and knows that print has meaning.","c) A child can write every letter of the alphabet flawlessly.","d) Every word in a text can be decoded by a child.","Answers:","3. c), 4. b), 5. b)"]},{"t":"11.4 360° ASSESSMENT","p":["As per NEP 2020, para 4.34 and 4.35, the aim of the assessment will indeed be for learning, it will help the teacher and student, and the entire schooling system, continuously revise the teaching learning process to optimise learning and development for all students. The 360-degree multidimensional report reflects in great detail the progress as well as uniqueness of each learner in the cognitive, affective, and psychomotor domains. It will include self-assessment and peer assessment, and progress of the child in project-based and inquiry- based learning, quizzes, role plays, group work, portfolios, etc., along with teacher assessment (NEP 2020, p. 17)."]},{"t":"11.4.1 Principles of 360° Assessment","p":["1. Comprehensive Feedback: A balanced evaluation requires information from various sources, and when a teacher contributes their own viewpoints, the assessment as a whole is enhanced.","2. Confidentiality and Trust: Establishing a culture of trust is necessary. Teachers are more forthcoming and honest when confidentiality is maintained.","3. Actionable Insights: Meaningful growth and development require feedback; this feedback not only provides areas of improvement but also offers practical recommendations for the same.","4. Alignment with Goals: To ensure a common vision of success, the assessment process should match individual development with the curricular goals."]},{"t":"11.4.2 Implementing Strategies for 360-Degree Assessments","p":["• Identifying Competencies: Successful implementation of 360-degree assessment firstly requires identification of the competencies and then aligning these competencies with the institutional objectives that need to be evaluated. These competencies include communication skills, leadership qualities, teamwork, adaptability, and emotional intelligence.","• Selecting Assessor: Selecting the right assessor is critical. The information that is gathered through self-assessment, peer assessment, teacher assessment, and parent assessment provides a well-rounded view of the performance, and for this, the assessor must be familiar with the individual work of the children.","• Ensuring Confidentiality: Honest feedback and trust are fostered by confidentiality. One way to lessen fears of being judged is to anonymise responses and emphasise the process’s positive goal.","• Leveraging Technology: For streamlining 360-degree assessment, the role of technology is very important. From the collection to the interpretation of the data."]},{"t":"11.4.3 Benefits of 360-Degree Assessments Enhanced","p":["• Self-Awareness: The children become self-awared as they gain insight into how their behaviour and performance are perceived by other people, and this also helps them to find out the areas where improvement is required.","• Improved Communication: It encourages constructive feedback and cultivates an open culture.","• Leadership Development: 360-degree evaluations highlight a candidate’s areas of strength and growth, giving prospective leaders a road map.","• Team Cohesion: When feedback is shared constructively, it builds trust among team members. Understanding different perspectives enhances empathy and collaboration."]},{"t":"11.4.3.1 Self-Assessment","p":["Assign self-assessment tasks to children after they can participate actively in peer-assessment activities and use the assessment standards appropriately. Self-assessment is a crucial part of the Assessment for Learning process and a very effective teaching tool. Learners will be better equipped to use these new abilities to conduct “objective” evaluation of their work once they can participate in peer-assessment activities. We are all aware that it is simple to criticise the work of others, but evaluating one’s own work is a much more difficult task. Children can identify areas in which they need to improve once they can assess their work and prior knowledge. They will be able to learn, progress, and manage their learning with this support."]},{"t":"11.4.3.2 Peer Assessment","p":["To enhance the learners’ learning, the learners must be fully engaged in the learning process. To maximise progress, learners must be aware of what they need to learn, why they are required to learn it, and how it will be evaluated. This is especially true when children are allowed to apply the evaluation criteria to peer-produced work as part of planned class activities. Peer evaluation using the pre-set assessment criteria is the next stage in determining learner comprehension and confirming learning. Advantages of Peer Assessment:","• Children elaborating on their concepts and comprehension of the learning goal.","• Verifying people’s comprehension of the evaluation criteria and how they should be applied to children’s work. Teachers need to provide the children:","• Practice to reflect on their work","• Essential assistance to acknowledge shortcomings in their work.","• To analyse strengths and weaknesses in their work.","CHECK YOUR PROGRESS 11.3","1. Why peer assessment is important.","2. Define the concept of teacher assessment.","3. Elucidate the concept of self-assessment.","4. What is the primary purpose of self-assessment? (A) To receive a grade from an instructor (B) To identify areas for improvement and track progress (C) To compare your performance with others (D) To avoid feedback from others","Answers:","4. (B)"]},{"t":"11.5 FORMATIVE ASSESSMENT STRATEGIES","p":["“The aim of assessment in the culture of our schooling system will shift from one that is summative and primarily tests rote memorization skills to one that is more regular and formative, is more competency-based, promotes learning and development for our students, and tests higher-order skills, such as analysis, critical thinking, and conceptual clarity. The primary purpose of assessment will indeed be for learning; it will help the teacher and student, and the entire schooling system, continuously revise teaching-learning processes to optimise learning and development for all students. This will be the underlying principle for assessment at all levels of education” (NEP 2020, p. 17). The term “formative” assessment refers to the ongoing use of data gathered from child assessments to plan new learning activities and experiences that will help the children grow, as well as to change and adapt current content and content delivery methods."]},{"t":"11.5.1 Miscue Analysis","p":["Miscue analysis serves as an instrument for looking closely at the types of reading strategies a reader uses. When reading from a text, the kinds of miscues (incorrect guesses) a reader makes will reveal to the listener how familiar or unfamiliar the reader finds the content matter and how easy or difficult they find the text to read. Reading tests do not give such information because reading is so much more than just looking closely at each letter and word. Goodman (1969), who first coined the term ‘miscue analysis’, based his approach on three ‘cueing’ systems which he believed underlay the reading process.","• Grapho/phonic – Letters’ connection to the sound system","• Syntactic – The system of syntax and grammar","• Semantic – the meaning and interpretation of words Goodman was anxious to get away from the notion that every departure from the words of the text is necessarily bad. The pattern of miscues can suggest a reader’s strengths as well as their weaknesses. If we put together the miscues with what the learner can tell us about how they were made, then we can begin to understand what is going on when a text is read. Examples of Miscue Analysis","i) The children here read for meaning. The reader substituted a noun and a verb for a verb clause. The substituted words look very similar and do not dramatically alter the sense of the passage. The self-corrections were made immediately as the reader realised that what s/he had said did not make sense in the context. The reader is reading using all the cues like grapho/phonic (look of the words), semantic (meaning of the words), and syntactic (grammar – the sound of the words).","ii) This substitution changes the sentence’s meaning in the passage. This made the substitution unacceptable. The reader chooses words that look like the original. The reader seems to be trying to get through the passage without considering its meaning. Selecting a Reading Passage To generate errors and to assess learners’ reading skills concerning the demands of their courses, it is essential to select an unknown passage. It is useful to select a passage from their course and to map the text to the curriculum to carry out the miscue analysis. If the learner is an absolute beginner reader (at Balvatika or just Entry 1), using miscue analysis will be inappropriate. It motivates the learner if they are allowed to select the text of their own choice. A general guide is about 100 or so words at Entry 1 and 200 words at Entry 3. A longer piece of text can be used at Level 1 and Level 2. Requirements for Conducting a Miscue Analysis As a teacher, you must ensure :","i) Ample time to carry out the procedure.","ii) Copies of the text for the students and a scoring and comment sheet for their own use.","iii) Books from which they have taken the text, as the learners are likely to make choices of the text based on the book’s ‘look and feel’.","iv) A good-quality tape recorder with a microphone. For miscue analysis, the teacher needs the following:","• A quiet room","• No interruptions","• No telephones","• A comfortable desk and chairs, with appropriate lighting","• A good quality tape recorder and microphone with a clean tape For the learner–","• Good quality photocopies of the text For the assessor–","• Copies of the text enlarged onto A3 paper or double-spaced on A4 paper","• Pens to score and make comments. Scoring System Errors can be recorded in different ways, but the following are the most useful:","Fig. 11.1: Scoring System (LearnSheffield, n.d., p. 6) Analysing Miscues: The following coding system is adapted from Goodman’s 1969 article titled “Analysis of Oral Reading Miscues: Applied Psycholinguistics.” It has been modified to aid accurate assessment of reading difficulties. Each error made is coded for all three cueing systems.","1. The grapho/phonic system","2. The semantic system","3. The syntactic system","1. The grapho/phonic system: The miscued words are almost identical in length and shape to the original words. The choice of words would not alter the meaning of the text to a serious extent. The author’s intent will stay mostly intact.","2. The semantic system: Semantic strength is high when the original meaning of the sentence is relatively unchanged. Most miscues will modify the meaning to some extent, but they are acceptable when they are close to the author’s meaning.","3. The syntactic system: This sort of miscue is that it probably does not affect the overall meaning of the text, and unless the reader made many errors of this sort, it could be pointed out, but not dwelt upon."]},{"t":"11.5.2 A Task-Based Approach","p":["A task-based lesson is centred around the completion of a central task, and the language that is studied is decided by what happens as the students finish it. The teacher does not predetermine the language that will be studied. Stages to the Task-Based Approach","1. Pre-task: The teacher presents the content and provides the students with precise instructions on what they must accomplish during the task phase.","2. Task: The pupil must complete the task, whether working independently or in groups, by using the resources available; the task of a teacher is confined to monitoring the students.","3. Planning: At this point, the students are required to submit a report, which may be written or presented orally. The report summarises the key points of the task.","4. Report: After that, students either read the written report or give an oral report to the class. In addition to selecting the order in which students will present their reports, the instructor may also provide brief comments on the material. At this point, the instructor might also play a video of other students completing the same task so that the students can compare.","5. Examination: For the students’ analysis, the instructor then highlights pertinent passages from the recording’s text. They might ask pupils to identify intriguing details in this text. For analysis, the instructor can also draw attention to the language the students used in the report phase.","6. Practice: Finally, the teacher decides which language areas to practice based on the needs of the students and the results from the task and report phases. The students then record useful vocabulary and complete practice exercises to increase their self-esteem. Instead of using traditional grammar or vocabulary tests, the teacher can use task-based assessment that focuses on assessing language learners’ abilities through the completion of authentic, communicative tasks. This method fosters fluency and communicative competence by emphasising the useful application of language skills in context. Task-based language teaching, in which tasks serve as the primary unit of instruction and learning, is closely related to this type of assessment. Important Facets of Task-Based Assessment:","i) Emphasis on communicative tasks: These are meant to mimic real-world scenarios, where students must use language to accomplish a predetermined objective.","ii) Emphasis on meaning and fluency: Rather than merely evaluating students’ grammatical or vocabulary accuracy, the evaluation looks at how well they can use language to express meaning and accomplish communicative objectives.","iii) Authentic assessment: By simulating language use in authentic contexts, task-based assessment seeks to be more authentic.","iv) Formative & Summative: It can be applied to both formative and summative objectives. The teacher can use task-based assessment in the class by asking students to create a presentation on any topic, present a problem to them, and assess them by analysing and proposing a solution to the problem by using appropriate language."]},{"t":"11.5.4 Rubrics","p":["The teacher can determine what the student has learned by observing their behaviour and attitudes. Youngsters use doing, showing, and telling to demonstrate their understanding. Teachers can better understand the children’s accomplishments and the factors influencing them by observing the students in a variety of activities. To find out how a child will behave in a particular scenario, teachers can set up scenarios in their classroom. For instance, a specific scenario must be set up so that the child can demonstrate their capacity to share food with their peers if the teacher wishes to assess the student’s capacity for sharing. The following procedures are involved in observation for assessment:","1. Planning: The teacher has to first decide the curriculum objectives, the competencies, and the learning outcomes they want to develop in the students, then they have to prepare the tools that will be needed to record observations.","2. Gather evidence: Determine when children can demonstrate the chosen competencies or learning outcomes. For instance, the teacher can plan an outdoor activity for the students if they want to observe motor development, or they can plan in-group activities or dramatic play if the topic is social development. The teacher should note down carefully every observation they make.","3. Reflect and assess: Examine the documentation and the supporting evidence to follow each child’s development over time. Every tangible piece of evidence would help the teacher plan and adjust her instruction for the children in the future. Observation activities as mentioned in NEP 2020 for the pedagogical process: a. Storytelling: i. Is the child getting involved in the story? ii. Is the child describing the pictures? iii. Is the child asking questions about different characters of the story? iv. Is the child connecting personal experiences with the events of the story? v. Is the child recalling familiar words from the story? vi. Is the child expressing likes or dislikes about the story? b. Guided conversation: i. Is the child listening to others during Circle Time? ii. Is the child waiting for their turn to speak? iii. Is the child expressing their pleasure or displeasure listening to others? iv. Is the child able to predict what is going to happen next? c. Play - Free, Guided, or Structured: i. Is the child solving simple problems? ii. Is the child able to use large and small muscles to engage with play material? iii. Is the child able to express different emotions? iv. Is the child able to respond appropriately to the emotions of others?”"]},{"t":"11.6.4 Rubrics","p":["Assignments, class participation, and final grades can all be graded using a rubric. This assessment tool shows the benchmarks for each component of any type of student work, including spoken, written, and visual. Multiple assessment criteria are grouped and categorised under grade headings or achievement levels in holistic rubrics. On the other hand, analytical rubrics differentiate between different evaluation criteria and go over each one in detail. A Rubric’s Creation Process:","• To ensure that the student’s work is of a high calibre, first determine which requirements must be fulfilled. At this stage, you may even consider selecting outstanding student work samples to present to students as part of the task assignment process.","• The teacher has to decide how many achievement levels to include in the rubric and how these align with the institution and grading scheme. Provide a thorough explanation of the performance for each criterion or aspect of quality at each achievement level.","• Additional comments: Allow for additional grades. Creating Interactive Rubrics with Pupils: Students’ learning experiences are improved when teachers participate in the creation of the rubric. Individually or in groups, the students can choose the assignment’s grading standards. In these exercises, the teacher assists the students in achieving the ultimate objective of a rubric that can be applied to their assignment, acting as a facilitator or mentor. Students feel more in control and included in the decision-making process as a result of this activity, which also enhances the learning process. How to Use Rubrics Effectively:","• By creating distinct rubrics for every task.","• When assigning the performance task to the students, be open and honest by providing them with a copy of the rubric.","• Ask students to evaluate themselves or provide peer feedback to incorporate rubrics into assignments.","• Use rubrics to manage time by emphasising the performance level attained for each criterion.","• Be prepared to revise your rubrics."]},{"t":"11.5.5 Anecdotal Records","p":["A document detailing a particular incident or episode that is particularly noteworthy or troubling is referred to as an anecdotal record. As soon as an event catches the teacher’s attention, they can write a narrative account of it. Observations of children’s words and actions during a specific activity constitute an anecdotal record.","Fig. 11.2: Sample Anecdotal Observation Record (NCF_FS, 2022, p. 179)","CHECK YOUR PROGRESS 11.4","1. Define the observation-based assessment.","2. Explain the stages of the task-based approach lesson.","3. A document detailing a particular incident that is particularly noteworthy is known as an ……………….. ( anecdotal record/ observation schedule/ interview).","4. …………………help in improving the learning process and a stronger sense of control and inclusion in the decision-making process. ( Rubrics/ anecdotal record/ task activity)","Answers:","3. Anecdotal record","4. Rubrics"]},{"t":"11.7 LET US SUM UP","p":["• The 360-degree multidimensional report reflects in great detail the progress as well as uniqueness of each learner in the cognitive, affective, and psychomotor domains.","• It includes self-assessment and peer assessment, and progress of the child in project-based and inquiry-based learning, quizzes, role plays, group work, portfolios, etc., along with teacher assessment.","• A reader uses various reading strategies. Miscue analysis is one of the tools for looking closely at the types of reading strategies a reader uses.","• A task-based lesson is centred around the completion of a task; the stages of the lesson include pre-task, task, planning, report, examination, and practice.","• Observation helps the teacher to comprehend the children’s achievement and the factors that affect their achievement. The steps involved in systematic observation are planning, gathering evidence, and reflecting."]},{"t":"11.8 END EXERCISES","p":["1. Explain the process of using rubrics effectively.","2. As a teacher, what will you need to carry out a miscue analysis?","3. Differentiate between peer assessment and self-assessment.","4. Write short notes on : a. Anecdotal records b. Observation","5. Elucidate the concept of task-based assessment and the Important facets of Task-Based Assessment."]},{"t":"11.9 REFERENCES","p":["Government of India, Ministry of Education. (2020). National Education Policy 2020. https://www.education.gov.in/sites/upload_files/mhrd/ files/NEP_Final_English_0.pdf. Goodman, K. S. (1969). Analysis of oral reading miscues: Applied psycholinguistics. Reading Research Quarterly, 5(1), 9–30. https://doi. org/10.2307/747158 LearnSheffield. (n.d.). Miscue analysis. Retrieved on October 15, 2025. https://learnsheffield.co.uk/Downloads/InclusionDocuments/22-23/ miscue%20analysis.pdf NCERT (2022). National curriculum framework for foundational stage (NCF- FS). National Council of Educational Research and Training.https:// ncert.nic.in/pdf/NCF_for_Foundational_Stage_20_October_2022.pdf"]}];
const doc=document.getElementById('doc'),$=id=>document.getElementById(id);
const S=[];
C.forEach((c,si)=>{
  const sec=document.createElement('section');
  const h=document.createElement('h2');h.append(c.t);
  const b=document.createElement('button');b.textContent='Listen';b.onclick=()=>start(firstOf(si));h.append(b);
  sec.append(h);
  c.p.forEach(par=>{
    const p=document.createElement('p');
    (par.match(/[^.?!]+[.?!]+(\s|$)|[^.?!]+$/g)||[par]).forEach(t=>{
      const s=document.createElement('span');s.className='s';s.textContent=t.trim()+' ';
      const i=S.length;s.onclick=()=>start(i);
      S.push({el:s,sec:si,text:t.trim()});p.append(s);
    });
    sec.append(p);
  });
  doc.append(sec);
});
const firstOf=si=>S.findIndex(x=>x.sec===si);
const ss=window.speechSynthesis;
if(!ss){$('warn').hidden=false;$('warn').textContent='This browser does not support speech playback. Please open the file in Chrome, Edge, Safari or Firefox.';}
let idx=0,playing=false,paused=false,token=0,voices=[];
const INDIAN=/(india|rishi|veena|heera|hemant|kalpana|ravi|neerja|prabhat|aditi|raveena|lekha)/i;
function loadVoices(){
  if(!ss)return;
  const L=$('lang').value;
  const rank=v=>{
    const lg=v.lang.replace('_','-');
    if(L==='en-IN')return lg.toLowerCase()==='en-in'?0:(INDIAN.test(v.name)&&/^en/i.test(lg))?1:/^en-(GB|AU)/i.test(lg)?3:/^en/i.test(lg)?4:9;
    return lg.toLowerCase()===L.toLowerCase()?0:/^en/i.test(lg)?2:9;
  };
  voices=ss.getVoices().filter(v=>rank(v)<9).sort((a,b)=>rank(a)-rank(b));
  const sel=$('voice');sel.innerHTML='';
  voices.forEach((v,i)=>{const o=document.createElement('option');o.value=i;o.textContent=v.name+' ('+v.lang+')';sel.append(o);});
  const w=$('warn');
  if(!voices.length){w.hidden=false;w.textContent='No English voices were found on this device. Please check your system speech settings.';}
  else if(rank(voices[0])>1){w.hidden=false;w.textContent='No '+$('lang').selectedOptions[0].text+' voice was found on this device, so the closest English voice is selected. For Indian English, install an en-IN voice in your phone or computer speech settings.';}
  else w.hidden=true;
}
loadVoices();if(ss)ss.onvoiceschanged=loadVoices;
function mark(i){
  S.forEach(x=>x.el.classList.remove('on'));
  const s=S[i];if(!s)return;s.el.classList.add('on');
  s.el.scrollIntoView({block:'center',behavior:'smooth'});
  $('prog').firstElementChild.style.width=((i+1)/S.length*100)+'%';
  $('now').textContent='Now reading: '+C[s.sec].t;
}
function speak(){
  if(idx>=S.length){finish();return;}
  const my=++token,u=new SpeechSynthesisUtterance(S[idx].text);
  const v=voices[$('voice').value];u.lang=$('lang').value;if(v){u.voice=v;u.lang=v.lang;}
  u.rate=parseFloat($('rate').value);mark(idx);
  u.onend=()=>{if(my===token&&playing){idx++;speak();}};
  u.onerror=()=>{if(my===token&&playing&&!paused){idx++;speak();}};
  ss.speak(u);
}
function start(i){ss.cancel();token++;idx=Math.max(0,i);playing=true;paused=false;$('play').textContent='Pause';setTimeout(speak,60);}
function finish(){playing=false;paused=false;idx=0;$('play').textContent='Play';$('now').textContent='Finished. Press Play to listen again.';}
$('play').onclick=()=>{
  if(!playing)return start(idx);
  if(paused){ss.resume();paused=false;$('play').textContent='Pause';}
  else{ss.pause();paused=true;$('play').textContent='Resume';}
};
$('stop').onclick=()=>{ss.cancel();token++;playing=false;paused=false;idx=0;$('play').textContent='Play';S.forEach(x=>x.el.classList.remove('on'));$('prog').firstElementChild.style.width='0';$('now').textContent='Stopped.';};
$('next').onclick=()=>{const cur=S[idx]?S[idx].sec:0;start(firstOf(Math.min(C.length-1,cur+1)));};
$('prev').onclick=()=>{const cur=S[idx]?S[idx].sec:0;start(firstOf(Math.max(0,cur-1)));};
$('lang').onchange=()=>{loadVoices();if(playing&&!paused)start(idx);};
['rate','voice'].forEach(id=>$(id).onchange=()=>{if(playing&&!paused)start(idx);});
window.addEventListener('beforeunload',()=>ss&&ss.cancel());
</script>
</body>
