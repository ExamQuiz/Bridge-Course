<!DOCTYPE html>
<html lang="hi-IN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>अध्याय 4: विकास - ऑडियो</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1d2433;--muted:#5d6678;--accent:#233f94;--hl:#fff3c4;--bd:#dfe3ee}
@media (prefers-color-scheme:dark){:root{--bg:#12151d;--card:#1b202c;--text:#e8ebf3;--muted:#9aa3b5;--accent:#8fa8ff;--hl:#3b3512;--bd:#2c3345}}
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,'Noto Serif Devanagari','Mangal','Nirmala UI','Times New Roman',serif;background:var(--bg);color:var(--text);line-height:1.7}
header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--bd);padding:12px 16px;z-index:5}
h1{font-size:1.15rem;margin:0 0 8px;color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-family:system-ui,'Noto Sans Devanagari','Nirmala UI',sans-serif;font-size:.9rem}
button{font:inherit;padding:8px 16px;border:0;border-radius:8px;cursor:pointer;background:var(--accent);color:#fff;font-weight:600}
button.stop{background:#b3261e}
button.alt{background:transparent;color:var(--accent);border:1px solid var(--accent)}
select,input{font:inherit;max-width:100%}
#status{width:100%;color:var(--muted);font-size:.85rem}
main{max-width:820px;margin:0 auto;padding:16px}
section{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;margin-bottom:12px}
section.active{outline:2px solid var(--accent)}
section h2{font-size:1.05rem;margin:0 0 6px;color:var(--accent);display:flex;justify-content:space-between;gap:8px;align-items:center}
section h2 button{padding:4px 10px;font-size:.75rem}
section p{margin:0}
mark{background:var(--hl);color:inherit}
</style>
</head>
<body>
<header>
  <h1>अध्याय 4: विकास (इकाई 2 - बाल विकास के परिप्रेक्ष्य)</h1>
  <div class="bar">
    <button id="play">▶ चलाएँ</button>
    <button id="pause" class="alt">⏸ रोकें</button>
    <button id="stop" class="stop">■ बंद करें</button>
    <label>आवाज़ <select id="voice"></select></label>
    <label>गति <input id="rate" type="range" min="0.6" max="1.4" step="0.1" value="0.95"></label>
    <div id="status">तैयार। यह आपके ब्राउज़र के अंतर्निहित टेक्स्ट-टू-स्पीच का उपयोग करता है (भारतीय हिंदी को प्राथमिकता)।</div>
  </div>
</header>
<main id="content"></main>

<script>
const sections = [
{t:"परिचय",x:"अध्याय 3 में हमने स्वयं की भारतीय अवधारणा, मन, बुद्धि और स्मृति के आपसी संबंध, तथा पंचकोश विकास के समग्र ढाँचे को समझा। अब अध्याय 4 में हम देखेंगे कि आधारभूत और प्रारंभिक चरणों के दौरान बच्चे शारीरिक, संज्ञानात्मक, सामाजिक-भावनात्मक, नैतिक और भाषाई क्षेत्रों में वास्तव में कैसे बढ़ते और विकसित होते हैं। हम यह भी जाँचेंगे कि इस विकास को आकार देने में परिवार, सहपाठी और विद्यालय क्या भूमिका निभाते हैं। यह अध्याय एक शिक्षक के रूप में आपको ऐसे सीखने के अनुभव तैयार करने में मदद करेगा जो बच्चों के समग्र और समावेशी विकास में सहायक हों।"},
{t:"अधिगम परिणाम",x:"इस अध्याय को पूरा करने के बाद, शिक्षार्थी तीन से ग्यारह वर्ष की आयु के बच्चों में विकास के विभिन्न क्षेत्रों की विशेषताओं और पड़ावों की पहचान करता है। शिक्षार्थी विकास के अनुकूल सीखने को बढ़ावा देने में विभिन्न हितधारकों की भूमिका की रूपरेखा बताता है। और शिक्षार्थी ऐसी सीखने की गतिविधियाँ तैयार करता है जो एक साथ कई क्षेत्रों में विकास को बढ़ावा देती हैं।"},
{t:"बाल विकास को समग्र दृष्टिकोण से समझना",x:"आइए एक सरल प्रश्न से शुरू करें। कौन-सी बात एक बच्चे को आत्मविश्वासी, ज्ञानवान और करुणामय व्यक्ति बनने में मदद करती है? इसका उत्तर इस समझ में है कि बाल विकास कोई एकआयामी प्रक्रिया नहीं है। यह गतिशील है और कई आपस में जुड़े क्षेत्रों में सामने आती है, जो मिलकर समग्र विकास की ओर ले जाते हैं। आगे के खंडों में, हम आधुनिक अंतर्दृष्टियों और पारंपरिक ज्ञान, दोनों के नज़रिये से तीन से ग्यारह वर्ष के बच्चों की इस यात्रा पर चिंतन करेंगे, उसका अवलोकन करेंगे और उसे खोजेंगे।"},
{t:"4.3.1 शारीरिक विकास",x:"शारीरिक विकास समग्र व्यक्तित्व को निखारने में महत्वपूर्ण भूमिका निभाता है। दो उदाहरणों पर विचार कीजिए। कक्षा 3 में पढ़ने वाला आठ वर्षीय अज़ान सक्रिय और प्रसन्नचित्त था, लेकिन वह धीरे-धीरे अलग-थलग रहने लगा, निर्देशों को दोहराने के लिए कहने लगा, और अनुचित प्रतिक्रियाएँ देने लगा, जिससे लगता था कि उसने जो कहा गया उसे समझा ही नहीं। परमप्रीत, छह वर्ष की एक बच्ची, जिसके मौखिक और संज्ञानात्मक कौशल मज़बूत थे, उसे चलने और खेल के मैदान के उपकरणों का उपयोग करने में कठिनाई होने लगी, और उसकी गतिविधियाँ असंतुलित हो गईं। क्या इन उदाहरणों से संकेत मिलता है कि बच्चे के साथ कुछ अनुचित हो रहा है? इसे समझने के लिए आइए शारीरिक विकास के सामान्य क्रम का अध्ययन करें। तीन से ग्यारह वर्ष के बीच शारीरिक विकास क्रमिक रूप से होता है और इसमें गति, समन्वय, शक्ति और स्वास्थ्य के पड़ाव शामिल हैं। मुख्य क्षेत्र हैं: स्थूल पेशीय कौशल, जैसे दौड़ना, कूदना, चढ़ना और संतुलन बनाना; सूक्ष्म पेशीय कौशल, जिनमें हाथों और उँगलियों की छोटी मांसपेशियों पर सटीकता और नियंत्रण चाहिए; हाथ-आँख समन्वय और स्थानिक जागरूकता; तथा संवेदी-गामक एकीकरण, जो स्पर्श, दृष्टि, ध्वनि और संतुलन से मिली जानकारी को गामक प्रतिक्रियाओं के साथ जोड़ता है। प्रारंभिक बाल्यावस्था में, यानी तीन से पाँच वर्ष की आयु में, बच्चों का संतुलन और समन्वय बेहतर होता है, इसलिए वे अधिक आत्मविश्वास से दौड़ सकते हैं, कूद सकते हैं, फुदक सकते हैं और चढ़ सकते हैं। सूक्ष्म पेशीय कौशल आगे बढ़ते हैं, जिससे वे आकृतियाँ बना पाते हैं, बर्तनों का उपयोग कर पाते हैं और छोटी वस्तुओं को सँभाल पाते हैं। मध्य बाल्यावस्था, यानी छह से ग्यारह वर्ष की आयु में, कद और वज़न में लगातार वृद्धि होती है, मांसपेशियों की शक्ति बढ़ती है, और स्थूल तथा सूक्ष्म पेशीय कौशल परिष्कृत होते हैं। बच्चों में बेहतर फुर्ती, सहनशक्ति और समन्वय दिखता है, जो खेलकूद, खेलों, धाराप्रवाह लिखने और जूतों के फीते बाँधने में सहायक होता है। वे दैनिक गतिविधियों में अधिक स्वतंत्र हो जाते हैं और अपने शरीर के प्रति अधिक जागरूक भी। इन पड़ावों पर नज़र रखने से विकासात्मक विलंब की जल्दी पहचान करने में मदद मिलती है, ताकि समय पर हस्तक्षेप किया जा सके। एनसीईआरटी का अधिगम परिणाम ढाँचा और बुनियादी साक्षरता एवं संख्याज्ञान मिशन शारीरिक विकास के लिए चार लक्ष्य निर्धारित करते हैं। पहला, स्थूल और सूक्ष्म पेशीय कौशल विकसित करना, बाहरी खेलों, मिट्टी के मॉडल बनाने, रंग भरने और मोती पिरोने के माध्यम से। दूसरा, शारीरिक जागरूकता और स्थानिक अभिविन्यास बढ़ाना, बाधा दौड़, म्यूज़िकल चेयर और नृत्य के माध्यम से। तीसरा, स्वास्थ्य और स्वच्छता की आदतों को बढ़ावा देना, हाथ धोने की दिनचर्या, स्वच्छता पर कहानियों और स्वास्थ्य चार्ट के माध्यम से। चौथा, सीखने के लिए सहनशक्ति और बल का निर्माण करना, पाठों के बीच लयबद्ध व्यायामों और छोटे शारीरिक कार्यों के माध्यम से। शिक्षकों को विकास के अनुकूल शिक्षण पद्धति अपनानी चाहिए और जान-बूझकर गति और खेल को रोज़मर्रा की पढ़ाई में शामिल करना चाहिए। समावेशी कक्षाओं में गतिविधियों को ढाला जा सकता है। उदाहरण के लिए, जो बच्चा कूद नहीं सकता, वह वस्तुओं को छाँट सकता है या अपनी पसंद बताने के लिए हाथ के इशारों का उपयोग कर सकता है। शारीरिक क्षेत्र में आकलन अवलोकन पर आधारित, सतत और बाल-अनुकूल होना चाहिए। उसमें गामक कौशल की दक्षता, सहभागिता और जुड़ाव, समय के साथ सुधार, और नए शारीरिक कार्यों को आज़माने की इच्छा पर ध्यान देना चाहिए। शिक्षक वृत्तांत अभिलेख, जाँच-सूची, प्रदर्शन कार्य और सहपाठी प्रतिक्रिया का उपयोग कर सकते हैं।"},
{t:"4.3.2 संज्ञानात्मक विकास",x:"संज्ञानात्मक विकास बच्चे की सोचने और तर्क करने की क्षमता का विकास है। इसमें प्रत्यक्षीकरण, स्मृति, भाषा, ध्यान, समस्या-समाधान और तार्किक चिंतन शामिल हैं। तीन से ग्यारह वर्ष के बीच बच्चे धीरे-धीरे सहज, संवेदन-आधारित सोच से अधिक तार्किक और संगठित विचार की ओर बढ़ते हैं, जो आगे की पढ़ाई की नींव रखता है। दस वर्ष की रेखा के बारे में सोचिए। उसे गणित और पठन-बोध में उम्र के अनुरूप अवधारणाओं में कठिनाई होती है, उसे निर्देश दोहराने पड़ते हैं, उसे कई चरणों वाले निर्देश कठिन लगते हैं, उसका ध्यान आसानी से भटक जाता है, और वह अपने साथियों पर बहुत निर्भर रहती है। उसका मामला उन बच्चों की शीघ्र पहचान और सहयोग के महत्व को दर्शाता है जिनमें धीमे संज्ञानात्मक विकास के संकेत दिखते हैं। पोषणकारी वातावरण, व्यक्तिगत रणनीतियों और सहयोग से ऐसे बच्चे अपनी गति से आगे बढ़ सकते हैं और विद्यालय जीवन में सकारात्मक रूप से भाग ले सकते हैं। तीन से ग्यारह वर्ष के बच्चे आमतौर पर पियाजे की पूर्व-संक्रियात्मक और मूर्त संक्रियात्मक अवस्थाओं में आते हैं। पूर्व-संक्रियात्मक अवस्था में, लगभग तीन से सात वर्ष तक, बच्चे प्रतीकात्मक चिंतन, आत्मकेंद्रितता, कल्पनाशील खेल और सजीववाद दिखाते हैं, उन्हें तर्क और कारण-परिणाम की सीमित समझ होती है, और संरक्षण समझने में कठिनाई होती है। उनके विचार अब भी तर्क से नहीं, बल्कि प्रत्यक्ष अनुभव से संचालित होते हैं। मूर्त संक्रियात्मक अवस्था में, लगभग सात से ग्यारह वर्ष तक, बच्चे अधिक तार्किक और ठोस ढंग से सोचना शुरू करते हैं। वे संरक्षण, वर्गीकरण और क्रमबद्धता को समझते हैं, दूसरों का दृष्टिकोण लेने में बेहतर होते हैं और कारण-परिणाम की बेहतर समझ दिखाते हैं, लेकिन अमूर्त अवधारणाओं को पूरी तरह समझने के लिए उन्हें अब भी प्रत्यक्ष, हाथ से करने वाले अनुभवों की ज़रूरत होती है। यह बदलाव रातों-रात नहीं होता। यह धीरे-धीरे सामने आता है, और अनुभव, सामाजिक अंतःक्रिया तथा निर्देशित अधिगम से प्रभावित होता है। राष्ट्रीय शिक्षा नीति 2020 शिक्षार्थी-केंद्रित, योग्यता-आधारित पाठ्यचर्या पर ज़ोर देती है। आधारभूत चरण में, यानी तीन से आठ वर्ष की आयु में, लक्ष्य हैं: खोज और खेल के माध्यम से चिंतन और तर्क का विकास, अवलोकन, ध्यान और स्मृति को बढ़ाना, प्रारंभिक गणितीय अवधारणाओं को पोषित करना, अवलोकन और जिज्ञासा के माध्यम से वैज्ञानिक चिंतन को बढ़ावा देना, और एकाग्रता, योजना बनाने और दृढ़ता जैसे कार्यकारी कौशलों का निर्माण करना। प्रारंभिक चरण में, यानी आठ से ग्यारह वर्ष की आयु में, लक्ष्य हैं: सभी विषयों में अवधारणात्मक समझ को सुदृढ़ करना, मूर्त से अमूर्त चिंतन की ओर संक्रमण में सहायता करना, तार्किक, विश्लेषणात्मक और अनुमानात्मक तर्क का विकास करना, अंतर-विषयक चिंतन को प्रोत्साहित करना, और समस्या-समाधान तथा निर्णय लेने की क्षमता को बढ़ाना। शिक्षकों को सीखने को ध्यान और एकाग्रता, स्मृति, तार्किक तर्क, समस्या-समाधान, तथा भाषा और बोध के इर्द-गिर्द संरचित करना चाहिए। प्रभावी रणनीतियों में अनुभवात्मक अधिगम, मूर्त सामग्री का उपयोग, खुले प्रश्न पूछना, सहयोगात्मक अधिगम, विषयों के बीच एकीकरण, और ऐसा सहारा देना शामिल है जिसे बच्चों में क्षमता आने के साथ धीरे-धीरे हटा लिया जाए। स्कूली शिक्षा के लिए राष्ट्रीय पाठ्यचर्या की रूपरेखा 2023 के अनुसार, आकलन को रटंत-आधारित मूल्यांकन से हटकर रचनात्मक, सतत, प्रक्रिया-उन्मुख दृष्टिकोणों की ओर बढ़ना चाहिए, जिनमें रचनात्मक प्रतिक्रिया दी जाए। उपयोगी साधनों में अवधारणा मानचित्र, मौखिक प्रश्नोत्तर, अवलोकन जाँच-सूचियाँ और पोर्टफोलियो शामिल हैं।"},
{t:"4.3.3 सामाजिक-भावनात्मक विकास",x:"सामाजिक-भावनात्मक क्षेत्र में बच्चे की भावनाओं को समझने और सँभालने, स्वस्थ संबंध बनाने, सहानुभूति दिखाने, ज़िम्मेदार निर्णय लेने और सामाजिक परिस्थितियों से निपटने की क्षमता आती है। इन चरणों में बच्चे अपनी स्वयं की अवधारणा बनाते हैं, सहयोग करना सीखते हैं, और घर-केंद्रित से साथियों से प्रभावित परिवेश की ओर बढ़ते हुए तरह-तरह की भावनाओं का अनुभव करते हैं। पाँच वर्ष की मीरा तब रो पड़ती है जब उसकी सहपाठी उसका खिलौना ले लेती है, और वह यह नहीं बता पाती कि वह क्यों परेशान है। उसकी शिक्षिका उसे सांत्वना देती हैं और कहने में उसकी मदद करती हैं, मैं दुखी हूँ, या, मैं भी इससे खेलना चाहती हूँ। मीरा दयालुता दिखाती है, लेकिन दूसरों की भावनाओं की उसकी समझ ज़्यादातर वयस्कों के मार्गदर्शन पर टिकी है। कक्षा 5 का नील तब मध्यस्थता करता है जब उसके दो टीम-साथी इस बात पर बहस करते हैं कि प्रस्तुति कौन देगा। वह बारी-बारी से मौका देने का निष्पक्ष सुझाव देता है, एक साथी को अलग-थलग महसूस करते देखकर उसे पहचान लेता है, अपने कार्यों की ज़िम्मेदारी लेता है, और प्रशंसा को महत्व देता है, जो उसके आत्म-सम्मान को आकार देती है। आधारभूत चरण में, यानी तीन से आठ वर्ष की आयु में, आत्म-जागरूकता उभरने लगती है, भावनाओं को सँभालना अब भी सीखने की प्रक्रिया है जिसमें वयस्कों का सहारा चाहिए, लगाव और विश्वास केंद्रीय होते हैं, साथियों के साथ अंतःक्रिया समानांतर खेल से सहयोगी खेल की ओर बढ़ती है, और सहानुभूति का विकास शुरू होता है। प्रारंभिक चरण में, यानी आठ से ग्यारह वर्ष की आयु में, बच्चे अधिक भावनात्मक नियंत्रण दिखाते हैं और ईर्ष्या, शर्मिंदगी या गर्व जैसी जटिल भावनाओं को व्यक्त कर सकते हैं। साथियों के संबंध मज़बूत होते हैं, नैतिक विकास आगे बढ़ता है, दूसरों का दृष्टिकोण समझने की क्षमता सुधरती है, और आत्म-सम्मान महत्वपूर्ण हो जाता है। शिक्षकों को दयालुता, धैर्य और निष्पक्षता का आदर्श प्रस्तुत करना चाहिए। सर्कल टाइम और कक्षा बैठकें बच्चों को अपनी भावनाएँ व्यक्त करने के लिए सुरक्षित स्थान देती हैं। कहानी सुनाना और भूमिका-निर्वाह सहानुभूति का निर्माण करते हैं। समूह गतिविधियाँ सहयोग को बढ़ावा देती हैं, और भावना कार्ड या मनोदशा चार्ट बच्चों को अपनी भावनाओं को नाम देने में मदद करते हैं। सकारात्मक प्रोत्साहन आत्म-सम्मान को बढ़ाता है। आकलन सहयोगात्मक होना चाहिए और बच्चों पर ठप्पा लगाने या उनका न्याय करने के बजाय व्यक्तिगत ज़रूरतों को समझने पर केंद्रित होना चाहिए। शिक्षक वृत्तांत अभिलेख, व्यवहार जाँच-सूचियाँ, सहपाठी प्रतिक्रिया, चिंतनशील डायरी या चित्र, और अपने स्वयं के चिंतन का उपयोग कर सकते हैं। शिक्षक को एक समावेशी, सम्मानजनक कक्षा भी बनानी चाहिए और धमकाने, चिढ़ाने या बहिष्कार जैसी बातों से तुरंत निपटना चाहिए, ताकि हर बच्चा सुरक्षित महसूस करे।"},
{t:"4.3.4 नैतिक विकास",x:"नैतिक विकास वह प्रक्रिया है जिसके द्वारा बच्चे सही और गलत में भेद करना सीखते हैं, मूल्य विकसित करते हैं, और निष्पक्षता, न्याय, ईमानदारी, सहानुभूति और ज़िम्मेदारी की भावना बनाते हैं। इन अवस्थाओं का अध्ययन जीन पियाजे और लॉरेंस कोहलबर्ग ने किया है। पूर्व-नैतिक अवस्था में, जन्म से पाँच वर्ष तक, व्यवहार तात्कालिक इच्छाओं, दंड के भय और वयस्कों की प्रतिक्रियाओं से संचालित होता है। परतंत्र या पूर्व-रूढ़िगत अवस्था में, पाँच से नौ वर्ष तक, बच्चे नियमों को निश्चित और अटल मानते हैं, जो सत्ता द्वारा थोपे गए हैं। नैतिकता दंड से बचने या पुरस्कार पाने पर आधारित होती है, और इरादों के बजाय परिणामों पर टिकी होती है। स्वायत्त या रूढ़िगत अवस्था में, नौ से बारह वर्ष तक, बच्चे समझते हैं कि नियम लचीले हो सकते हैं और आपसी लाभ के लिए बनाए जाते हैं। वे इरादों पर विचार करते हैं और दूसरों की स्वीकृति को महत्व देते हैं, और नैतिकता सामाजिक मानदंडों, निष्पक्षता और संबंधों को बनाए रखने पर आधारित होती है। शिक्षकों को जिन प्रमुख पहलुओं की जानकारी होनी चाहिए उनमें शामिल हैं: सही और गलत की समझ, नियमों के प्रति जागरूकता, परिणाम और इरादे, निष्पक्षता और न्याय, सहानुभूति और दूसरों का दृष्टिकोण समझना, नियमों और अधिकार के प्रति सम्मान, नैतिक तर्क, ईमानदारी, ज़िम्मेदारी और जवाबदेही, तथा आदर्श प्रस्तुत करने और प्रबलन की भूमिका। दस से ग्यारह वर्ष तक बच्चे अपने कार्यों की ज़िम्मेदारी स्वीकार करने लगते हैं और भूल सुधारने का महत्व समझते हैं। स्कूली शिक्षा के लिए राष्ट्रीय पाठ्यचर्या की रूपरेखा 2023 ऐसे लक्ष्य निर्धारित करती है जैसे सही और गलत की समझ, ईमानदारी को बढ़ावा देना, सहानुभूति को पोषित करना, निष्पक्षता और न्याय को प्रोत्साहित करना, नियमों का सम्मान, नैतिक निर्णय लेना, ज़िम्मेदारी, तथा समुदाय और सहयोग। इन्हें प्राप्त करने के लिए शिक्षक मूल्य-समृद्ध कक्षाएँ बनाते हैं जहाँ नैतिकता रोज़मर्रा के अनुभवों में रची-बसी होती है। प्रभावी तरीकों में लोककथाओं और दंतकथाओं के माध्यम से नैतिक प्रश्नों के साथ कहानी सुनाना, दुविधाओं का भूमिका-निर्वाह और नाट्य रूपांतरण, तथा कक्षा की ज़िम्मेदारियों को बारी-बारी से सौंपना शामिल है, जैसे पंक्ति नायक या पौधों की देखभाल करने वाला। सबसे महत्वपूर्ण बात यह कि शिक्षकों को स्वयं निष्पक्षता, दयालुता और सत्यनिष्ठा का आदर्श प्रस्तुत करना चाहिए। सतत और व्यापक मूल्यांकन के अंतर्गत, नैतिक विकास का आकलन पारंपरिक ग्रेडिंग के बजाय निरंतर अवलोकन, वृत्तांत अभिलेख, स्व-आकलन और सहपाठी प्रतिक्रिया के माध्यम से किया जाता है।"},
{t:"4.3.5 भाषा विकास",x:"भाषा विकास बच्चे की संवाद करने, सोचने, सीखने और सामाजिक रूप से जुड़ने की क्षमता के केंद्र में है। यह साक्षरता, शैक्षणिक उपलब्धि और संज्ञानात्मक विकास की नींव बनाता है। तीन से पाँच वर्ष की आयु में शब्द-भंडार तेज़ी से बढ़ता है, लगभग नौ सौ शब्दों से लेकर ढाई हज़ार से अधिक शब्दों तक। बच्चे चार से छह शब्दों के पूरे वाक्य बोलते हैं, कुछ अति-सामान्यीकरण के साथ बुनियादी व्याकरण लागू करते हैं, आरंभ, मध्य और अंत वाली सरल कहानियाँ सुनाना शुरू करते हैं, और अक्सर क्यों और कैसे वाले प्रश्न पूछते हैं। छह से आठ वर्ष की आयु में शब्द-भंडार पाँच हज़ार से अधिक शब्दों तक फैल जाता है। बच्चे अधिकांश व्याकरणिक संरचनाओं में निपुण हो जाते हैं, बढ़ती धाराप्रवाहिता के साथ पढ़ते हैं, पूरे वाक्य और छोटे अनुच्छेद लिखते हैं, कई चरणों वाले निर्देशों का पालन करते हैं, और कहानियों को क्रम से दोबारा सुनाते हैं। नौ से ग्यारह वर्ष की आयु में शब्द-भंडार दस हज़ार से अधिक शब्दों तक पहुँच जाता है, जिसमें शैक्षणिक शब्दावली भी शामिल है। बच्चे अधिक उन्नत वाक्य संरचनाओं का उपयोग करते हैं, आलंकारिक भाषा, मुख्य विचारों और अनुमान को समझते हैं, कई अनुच्छेदों वाली रचनाएँ लिखते हैं, तर्क देना और अपनी राय का औचित्य बताना शुरू करते हैं, अलग-अलग श्रोताओं के अनुसार अपनी बोली को ढालते हैं, और हास्य तथा व्यंग्य को समझते हैं। राष्ट्रीय शिक्षा नीति 2020 और स्कूली शिक्षा के लिए राष्ट्रीय पाठ्यचर्या की रूपरेखा 2023 एक समग्र दृष्टिकोण पर ज़ोर देती हैं, जिसके उद्देश्य सुनने, बोलने, पढ़ने, लिखने, तथा शब्दावली और व्याकरण में हैं। इन्हें कहानी सुनने, दिखाओ और बताओ, कक्षा चर्चाओं, भूमिका-निर्वाह, साझा पठन, ज़ोर से पढ़ने, ध्वनि-आधारित खेलों, डायरी लेखन, निर्देशित लेखन, शब्द खेलों, रिक्त स्थान भरने वाले अनुच्छेदों और भाषा पहेलियों के माध्यम से सहारा दिया जाता है।"},
{t:"4.4 विभिन्न हितधारकों की भूमिका",x:"समग्र विकास के लिए कई हितधारकों की सक्रिय भागीदारी आवश्यक है, जिनमें अभिभावक, शिक्षक, शैक्षिक प्रशासक, समुदाय के सदस्य और नीति-निर्माता शामिल हैं। इस खंड में हम परिवार, सहपाठियों और विद्यालय की भूमिका पर ध्यान केंद्रित करते हैं।"},
{t:"4.4.1 विकास में परिवार की भूमिका",x:"जहाँ विद्यालय संरचित अधिगम प्रदान करते हैं, वहीं घर का वातावरण बच्चों के मूल्यों, दृष्टिकोणों, सीखने के व्यवहार और कल्याण को आकार देने में केंद्रीय बना रहता है। सात वर्ष का आर्यन इसलिए फल-फूल रहा है क्योंकि उसके माता-पिता सीखने से भरपूर घर का वातावरण बनाते हैं, उसकी जिज्ञासा को बढ़ावा देते हैं और उसे समस्या-समाधान सिखाते हैं। आठ वर्ष का रवि संघर्ष कर रहा है क्योंकि उसकी माँ लंबे समय तक काम करती हैं और गृहकार्य में उसका मार्गदर्शन नहीं कर पातीं। राष्ट्रीय शिक्षा नीति 2020 और स्कूली शिक्षा के लिए राष्ट्रीय पाठ्यचर्या की रूपरेखा 2023 इस बात पर ज़ोर देती हैं कि परिवार पहला और सबसे महत्वपूर्ण सीखने का वातावरण प्रदान करते हैं। परिवार शारीरिक विकास में पोषण, दिनचर्या, विश्राम और खेल के माध्यम से सहयोग करते हैं; संज्ञानात्मक विकास में बातचीत, प्रश्नों और खोज के माध्यम से; भाषा विकास में समृद्ध मौखिक भाषा और ज़ोर से पढ़कर सुनाने के माध्यम से; सामाजिक-भावनात्मक विकास में सहानुभूति का आदर्श प्रस्तुत करके और भावनात्मक ज़रूरतों को सहारा देकर; और नैतिक विकास में सीमाएँ तय करके तथा ईमानदारी और सम्मान का आदर्श प्रस्तुत करके। हालाँकि, सभी परिवारों को संसाधनों, समय या सहयोग तक समान पहुँच नहीं होती। कुछ परिवारों में सीमित साक्षरता, आर्थिक कठिनाई या भिन्न सांस्कृतिक अपेक्षाएँ होती हैं। शिक्षकों को अभिभावकों के साथ सम्मानजनक संबंध बनाने चाहिए, यह सुनिश्चित करना चाहिए कि परिवारों को सुना जा रहा है, साथ मिलकर पढ़ने जैसी सरल घरेलू गतिविधियाँ सुझानी चाहिए, अभिभावक-शिक्षक बैठकों में केवल शैक्षणिक बातों से आगे जाना चाहिए, अभिभावकों को कक्षा के आयोजनों में आमंत्रित करना चाहिए, डिजिटल समूहों और गतिविधि पत्रकों के माध्यम से संसाधन साझा करने चाहिए, और घरेलू अवलोकनों तथा कार्य के नमूनों के माध्यम से अभिभावकों को आकलन में शामिल करना चाहिए।"},
{t:"4.4.2 विकास में सहपाठियों की भूमिका",x:"सहपाठी वे व्यक्ति होते हैं जो किसी समूह में समान आयु, स्थिति या क्षमता स्तर के होते हैं। जैसे-जैसे बच्चे घर से विद्यालय की ओर बढ़ते हैं, सहपाठी उनके सामाजिक, भावनात्मक, नैतिक, संज्ञानात्मक और भाषाई विकास के केंद्र में आ जाते हैं। राष्ट्रीय शिक्षा नीति 2020 सहपाठी शिक्षण, समूह परियोजनाओं और सहयोगात्मक अधिगम के माध्यम से सहपाठी सहयोग पर ज़ोर देती है। सहपाठी स्पष्टीकरण और समूह में समस्या-समाधान के माध्यम से संज्ञानात्मक समझ को बढ़ाते हैं। साथियों से बातचीत शब्दावली और भाषा संरचनाओं में सहायक होती है। सामाजिक और भावनात्मक रूप से, बच्चे सहयोग करना, बाँटना, विवाद सुलझाना सीखते हैं, और समूह में भूमिकाओं तथा सहपाठी प्रतिक्रिया के माध्यम से आत्म-जागरूकता पाते हैं। नैतिक रूप से, वे निष्पक्षता, न्याय, सहानुभूति और ज़िम्मेदारी विकसित करते हैं। शिक्षक जोड़ी और समूह कार्य, सहपाठी शिक्षण, सर्कल टाइम, भूमिका-निर्वाह और साथी प्रणाली का उपयोग कर सकते हैं, ताकि समावेशन में सहायता मिले, विशेषकर नए, संकोची या विशेष आवश्यकता वाले बच्चों के लिए। शिक्षक इन अंतःक्रियाओं का मार्गदर्शन करता है, उनका अवलोकन करता है और उन्हें सहारा देता है। सहपाठी संबंध बहिष्कार, टकराव या प्रतिस्पर्धा भी ला सकते हैं, इसलिए शिक्षकों को सम्मानजनक व्यवहार के लिए स्पष्ट मानदंड स्थापित करने चाहिए।"},
{t:"4.4.3 विकास में विद्यालय की भूमिका",x:"एक सरकारी विद्यालय का दस वर्षीय ज़ैन जिज्ञासु तो था, पर संकोची था। उसके शिक्षक ने विज्ञान में उसकी रुचि को पहचाना, सरल प्रयोगों और परियोजना-आधारित अधिगम के माध्यम से उसे प्रोत्साहित किया, और उसे समूह गतिविधियों तथा भूमिका-निर्वाह में शामिल किया, जिससे धीरे-धीरे उसका आत्मविश्वास बढ़ा। यह दिखाता है कि विद्यालय समग्र विकास को कैसे प्रभावित कर सकता है। राष्ट्रीय शिक्षा नीति 2020, आधारभूत चरण के लिए राष्ट्रीय पाठ्यचर्या की रूपरेखा 2022 और स्कूली शिक्षा के लिए राष्ट्रीय पाठ्यचर्या की रूपरेखा 2023 विद्यालयों को ऐसे पोषणकारी स्थान मानती हैं जहाँ बच्चे सभी क्षेत्रों में आगे बढ़ते हैं, जिनमें सुरक्षित, आकर्षक और लचीले वातावरण तथा आयु-उपयुक्त शिक्षण पद्धतियाँ होती हैं। विद्यालय इन माध्यमों से योगदान देते हैं: शारीरिक शिक्षा और संरचित खेल; संज्ञानात्मक विकास के लिए संरचित अधिगम वातावरण और कलाएँ; सहयोग और सहानुभूति के लिए सामाजिक परिवेश; भाषा के लिए कहानी सुनाना, वाद-विवाद और पठन कार्यक्रम; पाठ्यचर्या और सह-पाठ्यचर्या दोनों माध्यमों से मूल्य; दिव्यांग बच्चों, वंचित समुदायों और पहली पीढ़ी के शिक्षार्थियों के लिए समावेशी शिक्षा; परिवारों के साथ सेतु; और प्राथमिक चिकित्सा, डिजिटल साक्षरता, पर्यावरण शिक्षा और आपदा प्रतिक्रिया जैसे जीवन कौशल। विद्यालयों के सामने चुनौतियाँ भी हैं, जिनमें सीमित संसाधन, विविध सीखने की आवश्यकताएँ, अभिभावकों की कम भागीदारी, भावनात्मक और व्यवहारगत समस्याएँ, पाठ्यचर्या और आकलन का दबाव, सामाजिक-आर्थिक असमानताएँ, भाषाई और सांस्कृतिक विविधता, तथा शिक्षकों की तैयारी में कमियाँ शामिल हैं। रणनीतियों में शिक्षक प्रशिक्षण में निवेश करना, शिक्षक-छात्र अनुपात घटाना, घर-विद्यालय साझेदारी को मज़बूत करना, परामर्शदाता और सामाजिक-भावनात्मक अधिगम कार्यक्रम उपलब्ध कराना, ऐसी लचीली पाठ्यचर्या अपनाना जो खेल और रचनात्मकता को महत्व दे, पोषण और सामग्री सहायता देना, बहुभाषी और संस्कृति-संवेदनशील शिक्षण को अपनाना, तथा गैर-सरकारी संगठनों, समुदायों और सरकारी योजनाओं के साथ सहयोग करना शामिल हैं।"},
{t:"4.5 आइए सारांश देखें",x:"इस अध्याय में हमने तीन से ग्यारह वर्ष तक के बच्चों के विकास को समझा। विकास के क्षेत्र हैं: शारीरिक विकास, संज्ञानात्मक विकास, सामाजिक-भावनात्मक विकास, नैतिक विकास और भाषा विकास। प्रत्येक हितधारक की अपनी भूमिका है। शिक्षक ऐसे सीखने के अनुभव तैयार करते हैं जो सभी क्षेत्रों में विकास में सहायक हों। परिवार भावनात्मक सहारा देते हैं और प्रारंभिक अधिगम की ज़मीन तैयार करते हैं। सहपाठी सामाजिक कौशल, सहानुभूति और सहयोग विकसित करने में मदद करते हैं। विद्यालय संरचित अधिगम वातावरण प्रदान करते हैं जो समग्र विकास को पोषित करता है।"},
{t:"4.6 अंतिम अभ्यास",x:"प्रश्न एक। एक शिक्षक तीन से ग्यारह वर्ष की आयु के बच्चों के लिए ऐसी कक्षा गतिविधि कैसे तैयार कर सकता है जो एक साथ संज्ञानात्मक, सामाजिक-भावनात्मक और भाषा विकास में सहायक हो? एक उदाहरण के साथ समझाइए। प्रश्न दो। परिवार, सहपाठियों और विद्यालय के बीच सहयोग की कमी बच्चे के समग्र विकास में किन तरीकों से बाधा डाल सकती है? अपने उत्तर को तर्क के साथ पुष्ट कीजिए। यह अध्याय यहीं समाप्त होता है।"}
];

const synth = window.speechSynthesis;
const $ = id => document.getElementById(id);
const content = $('content'), status = $('status'), voiceSel = $('voice');
let chunks = [], token = 0, voices = [], paused = false, cur = -1;

// Build page + chunks
sections.forEach((s, i) => {
  const el = document.createElement('section');
  el.id = 's' + i;
  el.innerHTML = '<h2><span></span><button class="alt">यहाँ से सुनें</button></h2><p></p>';
  el.querySelector('span').textContent = s.t;
  el.querySelector('p').textContent = s.x;
  el.querySelector('button').onclick = () => start(chunks.findIndex(c => c.sec === i));
  content.appendChild(el);
  chunks.push({sec: i, text: s.t + '।'});
  const sents = s.x.match(/[^.!?।]+[.!?।]+["']?\s*/g) || [s.x];
  let buf = '';
  sents.forEach(st => {
    if ((buf + st).length > 220 && buf) { chunks.push({sec: i, text: buf.trim()}); buf = ''; }
    buf += st;
  });
  if (buf.trim()) chunks.push({sec: i, text: buf.trim()});
});

function loadVoices() {
  voices = synth.getVoices();
  if (!voices.length) return;
  const rank = v => {
    const l = v.lang.replace('_', '-').toLowerCase();
    if (l === 'hi-in') return 0;
    if (/india|hemant|kalpana|swara|madhur|lekha|hindi|हिन्दी|हिंदी/i.test(v.name)) return 1;
    if (l.startsWith('hi')) return 2;
    if (l === 'en-in') return 3;
    return 4;
  };
  let list = voices.filter(v => v.lang.toLowerCase().startsWith('hi'));
  if (!list.length) list = voices.slice();
  list.sort((a, b) => rank(a) - rank(b));
  voiceSel.innerHTML = '';
  list.forEach(v => {
    const o = document.createElement('option');
    o.value = v.name; o.textContent = v.name + ' (' + v.lang + ')';
    voiceSel.appendChild(o);
  });
  if (list.length && rank(list[0]) > 2)
    status.textContent = 'इस उपकरण पर हिंदी (भारत) की आवाज़ नहीं मिली; निकटतम उपलब्ध आवाज़ का उपयोग किया जा रहा है। सर्वोत्तम परिणाम के लिए अपने ऑपरेटिंग सिस्टम की सेटिंग में हिंदी (भारत) की आवाज़ इंस्टॉल करें।';
}
loadVoices();
synth.onvoiceschanged = loadVoices;

function speak(i, t) {
  if (t !== token) return;
  if (i >= chunks.length) { finish('समाप्त।'); return; }
  cur = i;
  const c = chunks[i];
  document.querySelectorAll('section.active').forEach(e => e.classList.remove('active'));
  const sec = $('s' + c.sec);
  sec.classList.add('active');
  if (!sec.dataset.seen || sec.dataset.seen !== '1') { sec.scrollIntoView({behavior: 'smooth', block: 'center'}); }
  document.querySelectorAll('section').forEach(e => { if (e !== sec) delete e.dataset.seen; });
  sec.dataset.seen = '1';
  const u = new SpeechSynthesisUtterance(c.text);
  u.lang = 'hi-IN';
  const v = voices.find(x => x.name === voiceSel.value);
  if (v) { u.voice = v; u.lang = v.lang; }
  u.rate = parseFloat($('rate').value);
  u.onend = () => speak(i + 1, t);
  u.onerror = e => {
    if (t !== token) return;
    if (e.error === 'interrupted' || e.error === 'canceled') return;
    speak(i + 1, t);
  };
  synth.speak(u);
  status.textContent = 'चल रहा है: ' + sections[c.sec].t;
}

function start(i) {
  if (!synth) { status.textContent = 'इस ब्राउज़र में टेक्स्ट-टू-स्पीच समर्थित नहीं है।'; return; }
  synth.cancel();
  paused = false;
  token++;
  const t = token;
  setTimeout(() => speak(Math.max(0, i), t), 80);
}

function finish(msg) {
  token++;
  synth.cancel();
  paused = false;
  document.querySelectorAll('section.active').forEach(e => e.classList.remove('active'));
  status.textContent = msg;
}

$('play').onclick = () => {
  if (synth.paused || paused) { synth.resume(); paused = false; status.textContent = 'चल रहा है: ' + sections[chunks[cur].sec].t; }
  else start(0);
};
$('pause').onclick = () => {
  if (synth.speaking && !synth.paused) { synth.pause(); paused = true; status.textContent = 'रुका हुआ।'; }
};
$('stop').onclick = () => finish('रोका गया।');
window.addEventListener('beforeunload', () => synth.cancel());
</script>
</body>
</html>
