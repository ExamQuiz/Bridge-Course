<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1d2433;--muted:#5d6678;--accent:#233f94;--hl:#fff3c4;--bd:#dfe3ee}

<script>
const sections = [
{t:"5.1 परिचय",x:"खेल बच्चों के लिए केवल मनोरंजन का साधन नहीं है। यह शिक्षण और अधिगम का एक महत्वपूर्ण तरीका भी है। खेल के माध्यम से बच्चे सीखते हैं, बढ़ते हैं और अपने आसपास की दुनिया से जुड़ते हैं। आँख-मिचौली जैसे स्वतःस्फूर्त मुक्त खेल से लेकर पीढ़ी-दर-पीढ़ी चले आ रहे खो-खो जैसे संरचित देशज खेलों तक, खेल बच्चे की विकास यात्रा की एक बुनियादी नींव है। यह शारीरिक वृद्धि को पोषित करता है, संज्ञानात्मक और भावनात्मक क्षमताओं को बढ़ाता है, और रचनात्मकता को बढ़ावा देता है। यह सहयोग, बातचीत से सहमति बनाने और संघर्ष समाधान जैसे सामाजिक कौशल भी विकसित करता है। विभिन्न संस्कृतियों में खेल विविध पारंपरिक मूल्यों से विरासत में मिला है, जो समुदाय, पहचान और आत्म-अभिव्यक्ति के बारे में बच्चों की समझ को आकार देता है। यह अध्याय बच्चों के जीवन में खेल की भूमिका की पड़ताल करता है, जिसमें सांस्कृतिक जड़ों वाले खेलों, वास्तविक जीवन के उदाहरणों और खेल-आधारित गतिविधियों की व्यावहारिक रूपरेखा पर विशेष ज़ोर दिया गया है।"},
{t:"5.2 अधिगम परिणाम",x:"इस अध्याय को पूरा करने के बाद, शिक्षार्थी विभिन्न खेल गतिविधियों को वास्तविक जीवन की घटनाओं से जोड़ते हुए समग्र विकास को बढ़ावा देने में उनकी भूमिका को प्रदर्शित करता है। शिक्षार्थी ऐसी खेल-आधारित अधिगम गतिविधियाँ तैयार करता और रचता है जो सीखने में स्वतंत्रता को सहारा देती हैं और सहपाठियों के बीच संघर्ष को सुलझाने में मदद करती हैं। और शिक्षार्थी खेल में संघर्ष और बातचीत से सहमति बनाने की गतिशीलता को समझता है।"},
{t:"5.3 खेल और बाल्यावस्था",x:"खेल एक स्वाभाविक, समावेशी और आनंददायक गतिविधि है, जिसमें पृष्ठभूमि, संस्कृति या क्षमता की परवाह किए बिना सभी बच्चे भाग ले सकते हैं। यह केवल खिलौनों या खेलों तक सीमित नहीं है। इसमें वह सब शामिल है जो बच्चे आनंद, खोज और अभिव्यक्ति के लिए करते हैं, चाहे वह दौड़ना हो, चित्र बनाना हो, कुछ गढ़ना हो या किसी और का रूप धरना हो। खेल शारीरिक, सामाजिक और भावनात्मक विकास को बढ़ावा देता है। यह समस्या-समाधान, आलोचनात्मक चिंतन और रचनात्मकता जैसे संज्ञानात्मक कौशलों को पोषित करता है। सामाजिक रूप से, यह अंतःक्रिया, बातचीत से सहमति बनाने, सहयोग और सहानुभूति को सुगम बनाता है। भावनात्मक रूप से, यह बच्चों को भावनाओं को समझने, खुद को व्यक्त करने और लचीलापन विकसित करने में मदद करता है। खेल सभी सीखने का सबसे स्वाभाविक और सहज आधार है। यह बच्चों को अपने परिवेश की खोज करने देता है, सामाजिक बंधनों को मज़बूत करता है, आनंद से लेकर निराशा तक की भावनाओं को व्यक्त करने का सुरक्षित तरीका देता है, और व्यावहारिक अनुभव तथा कल्पना के माध्यम से अमूर्त विचारों को मूर्त बना देता है। खेल के माध्यम से बच्चे जीवन कौशल भी प्राप्त करते हैं। साथियों से बात करने और भूमिकाएँ तय करने के दौरान संप्रेषण कौशल बढ़ता है। अप्रत्याशित चुनौतियों का सामना करने पर समस्या-समाधान विकसित होता है। साझा लक्ष्यों की ओर मिलकर काम करने से टीमवर्क बढ़ता है। खेल के नियमों और सामाजिक गतिशीलता का पालन करते हुए आत्म-नियमन पोषित होता है, और बच्चे बारी का इंतज़ार करना तथा निर्णय के भय के बिना अपनी भावनाएँ व्यक्त करना सीखते हैं। खेल शारीरिक, संज्ञानात्मक, भावनात्मक और सामाजिक क्षेत्रों में समग्र विकास को सहारा देता है। गेंद पकड़ने का एक सरल खेल गामक कौशल सुधारता है, जबकि शिक्षक या डॉक्टर की भूमिका निभाने से भाषा और सामाजिक समझ बढ़ती है। बोड्रोवा और लियोंग के 2007 के शोध से पता चलता है कि शारीरिक खेल समन्वय और मस्तिष्क विकास को बेहतर बनाता है, जबकि कल्पनाशील खेल भाषा तथा सामाजिक-भावनात्मक विकास में योगदान देता है। गिन्सबर्ग, 2007, खेल को बच्चों और युवाओं के संज्ञानात्मक, शारीरिक, सामाजिक और भावनात्मक कल्याण के लिए अनिवार्य बताते हैं। खेल के माध्यम से सीखने पर यूनिसेफ की 2018 की रिपोर्ट कहती है कि खेल-आधारित अधिगम जुड़ाव, रचनात्मकता और लचीलेपन को बढ़ावा देता है।"},
{t:"5.4 खेल के प्रकार",x:"खेल को कई प्रकारों के माध्यम से समझा जा सकता है: मुक्त खेल, संरचित खेल, घर के भीतर का खेल, बाहरी खेल, रचनात्मक खेल और भूमिका-निर्वाह खेल। मुक्त खेल असंरचित, फ़ुरसत के समय की गतिविधि है, जिसे पूरी तरह बच्चा स्वयं शुरू करता और संचालित करता है, और जो आंतरिक प्रेरणा तथा जिज्ञासा से चलती है। इसमें कोई तय नियम नहीं होते, कोई सही या गलत गतिविधि नहीं होती और कोई विशिष्ट लक्ष्य नहीं होते। उदाहरण हैं खिलौना बर्तनों से माता-पिता के खाना पकाने की नकल करना, या गद्दों से किला बनाना। मुक्त खेल रचनात्मकता, संज्ञानात्मक लचीलेपन, समस्या-समाधान, स्वतंत्रता, आत्मविश्वास और भावनात्मक अभिव्यक्ति को बढ़ाता है, और यह सामाजिक, भाषाई तथा शारीरिक कौशलों को भी सहारा देता है। संरचित खेल में पहले से तय नियम, उद्देश्य और अक्सर किसी वयस्क का मार्गदर्शन होता है। इसमें बोर्ड खेल, विशिष्ट निर्देशों वाली कक्षा की अधिगम गतिविधियाँ और निर्देशित खेलकूद शामिल हैं। बच्चे दिशानिर्देशों का सम्मान करना और उनसे हटने के परिणामों को समझना सीखते हैं। बारी लेने से धैर्य और दूसरे के दृष्टिकोण को समझने की क्षमता बनती है, और लक्ष्य तक पहुँचने के लिए चरणों का पालन करने से एकाग्रता बनती है। दोनों प्रकार आवश्यक हैं। मुक्त खेल आत्म-अभिव्यक्ति को पोषित करता है, जबकि संरचित खेल ध्यान और अनुशासन विकसित करता है। घर के भीतर का खेल घर में, कक्षा में या किसी निर्धारित खेल क्षेत्र में होता है। पहेलियाँ आलोचनात्मक चिंतन, स्थानिक तर्क और सूक्ष्म पेशीय कौशल को बढ़ावा देती हैं। कहानी सुनाना भाषा और बोध को बढ़ाता है। निर्माण खेल समस्या-समाधान और बुनियादी वैज्ञानिक समझ को प्रोत्साहित करता है। बोर्ड खेल रणनीति और बारी लेने को बढ़ावा देते हैं, और संगीत लय तथा सुनने की क्षमता विकसित करता है। घर के भीतर के खेल में एकल खेल भी शामिल है, जो स्वतंत्रता विकसित करता है, और समानांतर खेल भी, जिसमें बच्चे एक-दूसरे के साथ-साथ खेलते हैं और सहयोगी खेल के लिए तैयार होते हैं। बाहरी खेल पार्कों, खेल के मैदानों, बगीचों या प्राकृतिक परिदृश्यों में होता है। दौड़ना, रस्सी कूदना और छलाँग लगाना स्थूल पेशीय कौशल, हृदय-संबंधी स्वास्थ्य और शक्ति विकसित करते हैं। चढ़ना समन्वय और संतुलन बढ़ाता है। आँख-मिचौली और खो-खो टीमवर्क और नियमों की समझ को बढ़ावा देते हैं। बाहरी खेल प्रकृति की खोज को प्रोत्साहित करता है, सुरक्षित जोखिम लेने को बढ़ावा देता है जिससे आत्मविश्वास और लचीलापन बनता है, और संवाद तथा संघर्ष समाधान जैसे सामाजिक कौशल विकसित करता है। धूप में रहने से विटामिन डी बनने में भी मदद मिलती है, जो हड्डियों के स्वास्थ्य के लिए आवश्यक है। घर के भीतर और बाहर के खेल का संतुलित दृष्टिकोण महत्वपूर्ण है। घर के भीतर का खेल संज्ञानात्मक, रचनात्मक और सूक्ष्म पेशीय कौशलों को पोषित करता है, जबकि बाहरी खेल शारीरिक स्वास्थ्य, स्थूल पेशीय कौशल, सामाजिक दक्षता और प्रकृति की समझ को बढ़ावा देता है। वे एक-दूसरे के पूरक हैं। दोनों के बीच आना-जाना बच्चों में अनुकूलनशीलता और आत्म-नियमन विकसित करने में मदद करता है। रचनात्मक खेल में रंग भरना, चित्र बनाना, मिट्टी की मूर्तियाँ गढ़ना, गाना, वाद्य बजाना और कल्पनाशील कहानी सुनाना शामिल हैं। यह नवाचार, भावनात्मक साक्षरता, आत्मविश्वास, समस्या-समाधान और अपसारी चिंतन को बढ़ावा देता है। भूमिका-निर्वाह खेल बच्चों को शिक्षक, दुकानदार, अग्निशमन कर्मी या किसी जानवर जैसे पात्रों में उतरने देता है। यह सहानुभूति, संप्रेषण, सांस्कृतिक जागरूकता, सहयोग और बारी लेने की भावना विकसित करता है। दोनों कल्पना, अमूर्त चिंतन और परिस्थितियों को अनेक दृष्टिकोणों से देखने की क्षमता को उत्तेजित करते हैं, जिससे सहिष्णुता और खुलापन आता है। खेल के विभिन्न रूप एक-दूसरे पर आधारित होते हैं। कोई बच्चा जानवरों के चित्र बनाकर शुरू कर सकता है, फिर चिड़ियाघर के रखवाले की भूमिका निभा सकता है, और फिर खिलौना जानवरों को आकार, रंग या प्रकार के अनुसार छाँट सकता है। शिक्षकों के लिए, बच्चों की खेल संबंधी पसंद का अवलोकन करना विकासात्मक अवस्थाओं, रुचियों और सीखने की शैलियों की मूल्यवान जानकारी देता है, और उन्हें विविध प्रकार की गतिविधियाँ नियोजित करने में मदद करता है।"},
{t:"5.5 देशज खेल और सांस्कृतिक संदर्भ",x:"देशज खेल वे पारंपरिक खेल हैं जो समुदायों द्वारा पीढ़ियों से खेले जाते रहे हैं। वे मौखिक परंपराओं के माध्यम से आगे बढ़ते हैं और स्थानीय रीति-रिवाजों, मूल्यों तथा परिवेश को दर्शाते हैं। वे सरल होते हैं, उनमें न्यूनतम उपकरण चाहिए, और वे अक्सर समावेशी तथा अनुकूलनीय होते हैं। उदाहरणों में पकड़म-पकड़ाई, गिल्ली डंडा, कबड्डी, पिट्ठू या सात पत्थर, और खो-खो शामिल हैं। कबड्डी टीमवर्क, शक्ति और रणनीति को बढ़ावा देती है। लगोरी समन्वय और समूह नियोजन विकसित करती है। स्टापू, यानी लंगड़ी टाँग का खेल, संतुलन, गिनती और गामक कौशल सुधारता है। गिल्ली डंडा हाथ-आँख समन्वय और ध्यान को बढ़ाता है। कंचे गिनती, अनुमान लगाने और बारी लेने की सीख देते हैं। पारंपरिक खेल कई कौशल क्षेत्रों में योगदान देते हैं। सामाजिक रूप से, बच्चे बारी लेना, निष्पक्ष खेलना, जीत और हार को शालीनता से स्वीकारना और दूसरों का सम्मान करना सीखते हैं, विविधता की सराहना करते हैं और संघर्षों को शांतिपूर्वक सुलझाते हैं। भावनात्मक रूप से, वे उत्साह को सही दिशा देना, निराशा से निपटना, और खेल भावना के साथ जीतना या हारना सीखते हैं। शारीरिक रूप से, वे शक्ति, फुर्ती और सहनशक्ति विकसित करते हैं। शक्ति मांसपेशियों द्वारा बल लगाने की क्षमता है, फुर्ती संतुलन बनाए रखते हुए तेज़ी से दिशा बदलने की क्षमता है, और सहनशक्ति अत्यधिक थकान के बिना गतिविधि जारी रखने की क्षमता है। संज्ञानात्मक रूप से, खेल रणनीतिक चिंतन, अवलोकन, स्मृति और समस्या-समाधान विकसित करता है, जो आजीवन सीखने की नींव रखता है। खो-खो पीछा करने वालों और बचाव करने वालों के बीच छूने का खेल है, जिसमें फुर्ती, गति और रणनीति चाहिए। कबड्डी एक संपर्क वाला टीम खेल है जिसमें रेडर विरोधी पक्ष के हिस्से में प्रवेश करता है, रक्षकों को छूता है और साँस रोके हुए कबड्डी, कबड्डी बोलते हुए लौट आता है। इसमें फेफड़ों की क्षमता, शक्ति, फुर्ती और टीमवर्क चाहिए। लगोरी में सात चपटे पत्थरों का ढेर और एक गेंद इस्तेमाल होती है। एक टीम ढेर को गिराने की कोशिश करती है और दूसरी टीम उसे फिर से जमाते समय गेंद से उन्हें मारने की कोशिश करती है। यह सटीकता, तीव्र प्रतिक्रिया और रणनीति को बढ़ावा देता है। गिल्ली-डंडा में बड़ी लाठी, यानी डंडे से छोटी तकले जैसी लकड़ी, यानी गिल्ली, पर प्रहार किया जाता है और उसे हवा में उछाला जाता है। यह हाथ-आँख समन्वय, सही समय पर वार करने और दूरी का अनुमान लगाने की क्षमता को निखारता है। ये खेल सांस्कृतिक प्रतीक के रूप में भी काम करते हैं, परंपराओं को आगे बढ़ाते हैं और सामुदायिक बंधनों को मज़बूत करते हैं। वे अपनेपन की भावना पैदा करते हैं, समावेशिता को बढ़ावा देते हैं, और बच्चों को मज़ेदार तथा अंतःक्रियात्मक तरीके से अपनी जड़ों से जुड़ने देते हैं। दुनिया भर में हर संस्कृति के अपने पारंपरिक खेल हैं। जापान में केंडामा है, जो गेंद और कटोरी का खेल है। अफ़्रीका में मनकाला है, जो पत्थरों से गिनती का खेल है। मूल अमेरिकी जनजातियाँ सामुदायिक जुड़ाव के लिए पारंपरिक गेंद खेल खेलती हैं। मेक्सिको में लोतेरिया है, जो बिंगो जैसा चित्र-आधारित खेल है। ऐसे खेलों के साझा लक्ष्य सीखना, सहयोग, गतिविधि और मज़ा हैं, और वे बच्चों में वैश्विक जागरूकता तथा विविधता के प्रति सम्मान विकसित करने में मदद करते हैं।"},
{t:"5.6 खेल और समग्र विकास",x:"शारीरिक विकास: खेल दौड़ने, कूदने और संतुलन बनाने जैसे स्थूल पेशीय कौशलों, तथा पकड़ने, चित्र बनाने और हाथ-आँख समन्वय जैसे सूक्ष्म पेशीय कौशलों को सहारा देता है। खो-खो और चढ़ने की संरचनाएँ हड्डियों, मांसपेशियों और सहनशक्ति को मज़बूत करती हैं, जबकि ब्लॉक और मोती पिरोना हाथों के नियंत्रण को निखारते हैं। नियमित शारीरिक खेल स्वस्थ वृद्धि में सहायक होता है, तनाव घटाता है और व्यायाम की आजीवन आदतें बनाता है। सामाजिक और भावनात्मक अधिगम: बच्चे बाँटना, बारी लेना और सहयोग करना सीखते हैं। समूह खेल टीमवर्क, सहानुभूति और मित्रता को बढ़ावा देते हैं। वे निराशा को सँभालना, छोटे-मोटे झगड़े सुलझाना और नियमों पर बातचीत से सहमति बनाना सीखते हैं, और खेल भावनाएँ व्यक्त करने तथा आत्मविश्वास बनाने के लिए सुरक्षित स्थान देता है। संज्ञानात्मक कौशल और रचनात्मकता: खेल स्मृति, अवलोकन, समस्या-समाधान और निर्णय लेने की क्षमता विकसित करते हैं। पहेलियाँ तर्क को पैना करती हैं, भूमिका-निर्वाह भाषा और कहानी कहने की क्षमता बढ़ाता है, और कला, संगीत तथा कल्पनाशील परिदृश्य नवाचारी चिंतन का निर्माण करते हैं। वास्तविक जीवन के उदाहरण: बाज़ार का दृश्य खेलने वाले बच्चे संख्याओं, पैसे और संप्रेषण के बारे में सीखते हैं। घर-घर खेलना भूमिकाएँ, पारिवारिक ढाँचे और देखभाल का व्यवहार सिखाता है। मीनार बनाना संतुलन, योजना और स्थानिक समझ सिखाता है। कबड्डी खेलना फुर्ती, साहस और टीम रणनीति सिखाता है। खेल सीखने से अलग नहीं है। यह क्रिया में सीखना है।"},
{t:"5.7 खेल-आधारित गतिविधियों की रूपरेखा",x:"एक अच्छी तरह तैयार की गई खेल गतिविधि बाल-केंद्रित होती है, जो बच्चों को चुनाव करने और नेतृत्व करने देती है। वह आकर्षक और मज़ेदार, खुले सिरे वाली, विकास के अनुरूप, और क्षमता, पृष्ठभूमि या लिंग की परवाह किए बिना सभी बच्चों के लिए समावेशी होती है। उसका उद्देश्य जीतना या जल्दी खत्म करना नहीं है। उसका उद्देश्य एक आनंदपूर्ण और सम्मानजनक स्थान में करके सीखना है। खेल हर विषय का हिस्सा हो सकता है। भाषा में कहानी सुनाने के घेरे, शब्द खेल और कठपुतली प्रदर्शन का उपयोग करें। गणित में वस्तुओं को छाँटना, संख्याओं वाला पिट्ठू या लंगड़ी खेल, और पासे पर आधारित गिनती के खेलों का उपयोग करें। पर्यावरण अध्ययन में समुदाय के सहायकों की भूमिका-निर्वाह, प्रकृति भ्रमण और बागवानी का अभिनय करें। कलाओं में चित्रकारी, नृत्य और स्थानीय सामग्री से शिल्प का उपयोग करें। गीत, तुकबंदियाँ और गति वाले खेल पाठों के बीच के बदलाव में मदद कर सकते हैं। गतिविधियों को समावेशी और सांस्कृतिक रूप से संवेदनशील बनाने के लिए पत्थर, पत्ते, कपड़ा या पुनर्नवीनीकृत वस्तुओं जैसी स्थानीय सामग्री का उपयोग करें। बच्चों की अपनी संस्कृतियों की कहानियाँ, गीत और खेल शामिल करें, खेल के दौरान अलग-अलग भाषाओं और अभिव्यक्तियों की अनुमति दें, और सुनिश्चित करें कि हर बच्चा सुरक्षित और सम्मानित महसूस करे। खेलों को विविध आवश्यकताओं के अनुसार ढालें। शारीरिक अनुकूलन के लिए खेल के क्षेत्र में बदलाव करें, सहायक उपकरण उपलब्ध कराएँ, या बैठकर छूने का खेल खेलें। संज्ञानात्मक अनुकूलन के लिए निर्देशों को सरल बनाएँ, दृश्य सामग्री और चित्र कार्डों का उपयोग करें, और कार्यों को चरणों में बाँटें। संवेदी अनुकूलन के लिए शोर कम करें, रोशनी धीमी रखें और शांत स्थान उपलब्ध कराएँ। सामाजिक-भावनात्मक अनुकूलन के लिए बारी लेने में सहायता करें, सम्मानजनक संवाद के लिए स्पष्ट नियम दें और सहानुभूति को प्रोत्साहित करें। समावेशी खेल अपनेपन की भावना को मज़बूत करता है, सामाजिक कौशल सुधारता है, रचनात्मक समस्या-समाधान को प्रोत्साहित करता है, सभी के लिए शारीरिक गतिविधि सुनिश्चित करता है, और भावनात्मक कल्याण को बेहतर बनाता है। यहाँ तीन नमूना गतिविधियाँ हैं। संख्या कूद खेल: फ़र्श पर चॉक से संख्याएँ बनाएँ, कोई संख्या बोलें, और बच्चा उस पर कूदकर पहुँचे, जिससे संख्या पहचान और क्रम की समझ बनती है। कहानी नाटक घेरा: बच्चे एक चित्र कार्ड चुनते हैं, समूह में एक कहानी रचते हैं और उसका अभिनय करते हैं, जिससे भाषा और कल्पना विकसित होती है। स्थानीय बाज़ार भूमिका-निर्वाह: बच्चे असली या नकली सब्ज़ियों और खिलौना पैसों के साथ दुकानदार और खरीदार बनते हैं, और बुनियादी गणित, सामाजिक अंतःक्रिया तथा सांस्कृतिक संदर्भ सीखते हैं। पाठ योजना के प्रारूप में गतिविधि का नाम, उद्देश्य, सामग्री, चरण और विकसित होने वाले कौशल शामिल हो सकते हैं।"},
{t:"5.8 खेल में संघर्ष, सहयोग और बातचीत से सहमति",x:"खेल के दौरान अक्सर संघर्ष तब उठते हैं जब बच्चे नियमों, बारी या बाँटने को लेकर असहमत होते हैं। ये संघर्ष स्वाभाविक हैं और सीखने के महत्वपूर्ण क्षण होते हैं। इनके माध्यम से बच्चे निष्पक्षता, सीमाओं और अपने कार्यों के दूसरों पर पड़ने वाले प्रभाव को समझने लगते हैं। आम स्थितियों में एक ही खिलौना चाहना, भाग लेने के क्रम पर विवाद, और नियमों को कैसे लागू किया जाए इस पर असहमति शामिल हैं। शिक्षकों को बहुत जल्दी दखल देने के बजाय अवलोकन करना और सहारा देना चाहिए। इससे बच्चों को समस्या-समाधान कौशल विकसित करने, अपने विचार सम्मानपूर्वक रखने और सहानुभूति बनाने का अवसर मिलता है। शिक्षक बाद में चिंतन को सुगम बना सकते हैं, और बच्चों को अपनी भावनाएँ व्यक्त करने तथा विकल्पों पर विचार करने में मदद कर सकते हैं। क्रम यह है: संघर्ष उठता है, शिक्षक या सहपाठी द्वारा मध्यस्थता होती है, संवाद और साझाकरण होता है, और अंत में समाधान तथा सहयोग आता है। खेल सहयोग सिखाने के सबसे अच्छे तरीकों में से एक है। टीम खेलों या साझा कहानी सुनाने में बच्चे सुनना, बारी लेना, भूमिकाएँ बाँटना और साझा लक्ष्य की ओर मिलकर काम करना सीखते हैं। समूह में निर्माण के कार्य, वस्तु आगे बढ़ाने या पकड़ने वाले घेरे के खेल, रिले दौड़, और समूह गीत तथा नृत्य टीमवर्क को बढ़ावा देते हैं। शिक्षक सहयोगात्मक व्यवहार का आदर्श प्रस्तुत कर सकते हैं और उसकी प्रशंसा कर सकते हैं, उदाहरण के लिए यह कहकर कि मैंने देखा कि तुमने अपनी बारी का इंतज़ार कैसे किया। यह बहुत अच्छी बात थी। संघर्ष समाधान में मार्गदर्शन के लिए, बच्चों को प्रोत्साहित करें कि वे अपनी भावनाएँ शब्दों में बताएँ, जैसे, जब तुमने गेंद छीन ली तो मुझे अच्छा नहीं लगा। निष्पक्षता सुनिश्चित करने के लिए टाइमर या गिनती की विधि का उपयोग करें। ऐसे प्रश्न पूछें जैसे, हम इसे मिलकर कैसे सुलझा सकते हैं? या, तुम दोनों के लिए क्या उचित होगा? और खेल के बाद संक्षेप में चिंतन करें कि क्या अच्छा रहा और क्या सुधारा जा सकता है। इससे समस्या-समाधान, सहानुभूति और भावनात्मक नियमन विकसित होता है। शिक्षक पर्यवेक्षक, सुगमकर्ता और मार्गदर्शक की भूमिका निभाते हैं। वे एक सुरक्षित और समावेशी वातावरण बनाते हैं, सकारात्मक सहपाठी अंतःक्रियाओं को प्रोत्साहित करते हैं, बच्चों को भावनाओं और व्यवहार पर चिंतन करने में मदद करते हैं, और साझा नेतृत्व के अवसर पैदा करते हैं। ऐसा करके वे सम्मानशील और लचीले भावी नागरिकों को गढ़ते हैं।"},
{t:"5.9 चिंतन और अनुप्रयोग",x:"शिक्षक इन प्रश्नों के साथ चिंतन कर सकते हैं। क्या मैं हर दिन मुक्त और निर्देशित खेल के लिए पर्याप्त समय देता हूँ? क्या अलग-अलग आवश्यकताओं और पृष्ठभूमियों वाले बच्चों सहित सभी बच्चे सक्रिय रूप से भाग ले रहे हैं? खेल के माध्यम से बच्चे कौन-से सामाजिक, संज्ञानात्मक और शारीरिक कौशल विकसित कर रहे हैं? जब संघर्ष उठते हैं तो मैं कैसी प्रतिक्रिया देता हूँ? क्या मैं स्थानीय और सांस्कृतिक खेलों का सार्थक उपयोग कर रहा हूँ? कक्षा के दो उदाहरण खेल को क्रिया में दिखाते हैं। कक्षा 2 में, दो बच्चे ब्लॉक खेलते समय अक्सर झगड़ते थे। शिक्षक ने बारी का टाइमर लगाया और उन्हें कहना सिखाया, क्या अगली बारी मेरी हो सकती है? एक सप्ताह के भीतर वे आपस में बाँटने लगे और एक-दूसरे की बनाई रचनाओं की प्रशंसा करने लगे, और शिक्षक ने इसका उपयोग कक्षा के साथ निष्पक्षता पर चर्चा करने के लिए किया। एक ग्रामीण विद्यालय में, हर शुक्रवार की शुरुआत तीस मिनट के स्टापू और पिट्ठू से होती थी। बच्चे अधिक सक्रिय और सामाजिक रूप से जुड़े हुए हो गए, उन्होंने खेलों के नए रूप बनाए, और बाद में उन खेलों का उपयोग गिनती और पैटर्न पर आधारित गणित के पाठों में किया गया। खेल का राष्ट्रीय शिक्षा नीति 2020 और बुनियादी साक्षरता एवं संख्याज्ञान (FLN) लक्ष्यों से गहरा संबंध है। राष्ट्रीय शिक्षा नीति 2020 योग्यता-आधारित अधिगम की वकालत करती है जो आनंदपूर्ण, समावेशी और गतिविधि-आधारित हो। खेल वास्तविक जीवन के संदर्भों के माध्यम से बुनियादी साक्षरता और संख्याज्ञान को प्रोत्साहित करता है, आलोचनात्मक चिंतन, रचनात्मकता और सहयोग का निर्माण करता है, कहानी सुनाने और स्थानीय खेलों के माध्यम से बहुभाषी अभिव्यक्ति को सहारा देता है, और सामाजिक-भावनात्मक अधिगम तथा सांस्कृतिक जड़ों को बढ़ावा देता है। खेल के दौरान ब्लॉक गिनना सीखने को रटने से सार्थक अनुभव की ओर ले जाता है। तुकबंदियों और गीतों वाले पारंपरिक खेल बच्चों को भाषा और संस्कृति से परिचित कराते हैं, और नाटकीय खेल उन्हें कम दबाव वाले माहौल में भाषाओं के साथ प्रयोग करने देता है। इसलिए खेल कोई अतिरिक्त चीज़ नहीं, बल्कि राष्ट्रीय शिक्षा नीति 2020 की परिकल्पना को साकार करने के लिए एक बुनियादी आवश्यकता और अधिकार है।"},
{t:"5.10 आइए सारांश देखें",x:"खेल एक स्वाभाविक और अनिवार्य गतिविधि है जो सीखने, वृद्धि और आनंद को सहारा देती है, और शारीरिक, संज्ञानात्मक, भावनात्मक तथा सामाजिक विकास में केंद्रीय भूमिका निभाती है। खेल के विभिन्न प्रकार, जैसे मुक्त, संरचित, घर के भीतर, बाहरी, रचनात्मक और भूमिका-निर्वाह खेल, अनूठे सीखने के अवसर देते हैं, और इनका संतुलित मेल समग्र विकास को बढ़ाता है। देशज खेल बच्चों को उनकी सांस्कृतिक जड़ों से जोड़ते हैं और सहयोग, रणनीति तथा शारीरिक फुर्ती को बढ़ावा देते हैं। वे कम खर्चीले, समावेशी और आकर्षक होते हैं। खेल-आधारित गतिविधियाँ तैयार करने के लिए सोच-समझकर योजना बनाना आवश्यक है: प्रभावी खेल समावेशी, आयु-उपयुक्त, आकर्षक और वास्तविक जीवन के अधिगम परिणामों से जुड़ा होता है। संघर्ष, सहयोग और बातचीत से सहमति बनाना खेल के स्वाभाविक अंग हैं, और शिक्षक इनके माध्यम से बच्चों में सहानुभूति, निष्पक्षता और समस्या-समाधान विकसित करने में मदद करते हैं। खेल-आधारित अधिगम सीखने को आनंदपूर्ण, सार्थक और बच्चे के सामाजिक तथा सांस्कृतिक परिवेश में रचा-बसा बनाकर राष्ट्रीय शिक्षा नीति 2020 और बुनियादी साक्षरता एवं संख्याज्ञान (FLN) लक्ष्यों के अनुरूप चलता है।"},
{t:"5.11 अंतिम अभ्यास",x:"यहाँ अंतिम अभ्यास के कुछ प्रश्न दिए गए हैं। खेल के बारे में आपकी क्या समझ है, और आप इसे किसी अभिभावक को कैसे समझाएँगे? प्रारंभिक बाल्यावस्था शिक्षा में खेल को अनिवार्य क्यों माना जाता है? आप मुक्त खेल और संरचित खेल के बीच अंतर कैसे करेंगे? प्रत्येक का एक उदाहरण दीजिए। घर के भीतर और बाहर के खेल में संतुलन रखना क्यों महत्वपूर्ण है? देशज खेल क्या हैं? बचपन में आपने जो दो खेल खेले, उनके नाम बताइए। खेल शारीरिक विकास में कैसे सहायक होता है? रचनात्मक खेल समस्या-समाधान और कल्पना को कैसे प्रोत्साहित कर सकता है? एक अच्छी खेल-आधारित गतिविधि की मुख्य विशेषताएँ क्या हैं? खेल के दौरान संघर्ष क्यों होते हैं, और वे सीखने के लिए महत्वपूर्ण क्यों हैं? बच्चों के बीच संघर्ष सुलझाने के लिए शिक्षक द्वारा अपनाई जा सकने वाली दो रणनीतियाँ बताइए। समूह खेल सहयोग और सहानुभूति को कैसे बढ़ावा देता है? खेल-आधारित अधिगम में शिक्षक का चिंतन क्यों महत्वपूर्ण है? यह अध्याय यहीं समाप्त होता है।"}
];

const synth = window.speechSynthesis;
const $ = id => document.getElementById(id);
const content = $('content'), status = $('status'), voiceSel = $('voice');
let chunks = [], token = 0, voices = [], paused = false, cur = 0;

sections.forEach((s, i) => {
  const el = document.createElement('section');
  el.id = 's' + i;
  el.innerHTML = '<h2><span></span><button class="alt">यहाँ से सुनें</button></h2><p></p>';
  el.querySelector('span').textContent = s.t;
  el.querySelector('p').textContent = s.x;
  el.querySelector('button').onclick = () => start(chunks.findIndex(c => c.sec === i));
  content.appendChild(el);
  chunks.push({sec: i, text: s.t + '।'});
  const sents = s.x.match(/[^.!?।]+[.!?।]+["']?\s*/g) || [s.x];
  let buf = '';
  sents.forEach(st => {
    if ((buf + st).length > 220 && buf) { chunks.push({sec: i, text: buf.trim()}); buf = ''; }
    buf += st;
  });
  if (buf.trim()) chunks.push({sec: i, text: buf.trim()});
});

function loadVoices() {
  voices = synth.getVoices();
  if (!voices.length) return;
  const rank = v => {
    const l = v.lang.replace('_', '-').toLowerCase();
    if (l === 'hi-in') return 0;
    if (/india|hemant|kalpana|swara|madhur|lekha|hindi|हिन्दी|हिंदी/i.test(v.name)) return 1;
    if (l.startsWith('hi')) return 2;
    if (l === 'en-in') return 3;
    return 4;
  };
  let list = voices.filter(v => v.lang.toLowerCase().startsWith('hi'));
  if (!list.length) list = voices.slice();
  list.sort((a, b) => rank(a) - rank(b));
  voiceSel.innerHTML = '';
  list.forEach(v => {
    const o = document.createElement('option');
    o.value = v.name; o.textContent = v.name + ' (' + v.lang + ')';
    voiceSel.appendChild(o);
  });
  if (list.length && rank(list[0]) > 2)
    status.textContent = 'इस उपकरण पर हिंदी (भारत) की आवाज़ नहीं मिली; निकटतम उपलब्ध आवाज़ का उपयोग किया जा रहा है। सर्वोत्तम परिणाम के लिए अपने ऑपरेटिंग सिस्टम की सेटिंग में हिंदी (भारत) की आवाज़ इंस्टॉल करें।';
}
loadVoices();
synth.onvoiceschanged = loadVoices;

let lastSec = -1;
function speak(i, t) {
  if (t !== token) return;
  if (i >= chunks.length) { finish('समाप्त।'); return; }
  cur = i;
  const c = chunks[i];
  if (c.sec !== lastSec) {
    document.querySelectorAll('section.active').forEach(e => e.classList.remove('active'));
    const sec = $('s' + c.sec);
    sec.classList.add('active');
    sec.scrollIntoView({behavior: 'smooth', block: 'start'});
    lastSec = c.sec;
  }
  const u = new SpeechSynthesisUtterance(c.text);
  u.lang = 'hi-IN';
  const v = voices.find(x => x.name === voiceSel.value);
  if (v) { u.voice = v; u.lang = v.lang; }
  u.rate = parseFloat($('rate').value);
  u.onend = () => speak(i + 1, t);
  u.onerror = e => {
    if (t !== token) return;
    if (e.error === 'interrupted' || e.error === 'canceled') return;
    speak(i + 1, t);
  };
  synth.speak(u);
  status.textContent = 'चल रहा है: ' + sections[c.sec].t;
}

function start(i) {
  if (!synth) { status.textContent = 'इस ब्राउज़र में टेक्स्ट-टू-स्पीच समर्थित नहीं है।'; return; }
  synth.cancel();
  paused = false; lastSec = -1;
  token++;
  const t = token;
  setTimeout(() => speak(Math.max(0, i), t), 80);
}

function finish(msg) {
  token++;
  synth.cancel();
  paused = false; lastSec = -1;
  document.querySelectorAll('section.active').forEach(e => e.classList.remove('active'));
  status.textContent = msg;
}

$('play').onclick = () => {
  if (synth.paused || paused) { synth.resume(); paused = false; status.textContent = 'चल रहा है: ' + sections[chunks[cur].sec].t; }
  else start(0);
};
$('pause').onclick = () => {
  if (synth.speaking && !synth.paused) { synth.pause(); paused = true; status.textContent = 'रुका हुआ।'; }
};
$('stop').onclick = () => finish('रोका गया।');
window.addEventListener('beforeunload', () => synth.cancel());
</script>
