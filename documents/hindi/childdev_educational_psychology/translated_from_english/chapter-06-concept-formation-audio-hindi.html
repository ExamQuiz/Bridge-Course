<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>अवधारणा निर्माण – ऑडियो अध्याय</title>
<style>
:root{--bg:#f3f6f4;--ink:#16302b;--mute:#557068;--card:#fff;--line:#d3dfda;--accent:#1f6f5c;--hi:#e3f2ec}
@media (prefers-color-scheme:dark){:root{--bg:#0f1c19;--ink:#e6f0ec;--mute:#93aca4;--card:#162723;--line:#294038;--accent:#5fc5a7;--hi:#1b3a32}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.75 Georgia,"Times New Roman","Noto Serif Devanagari","Mangal","Nirmala UI",serif}
header{max-width:760px;margin:0 auto;padding:36px 20px 8px}
h1{font-size:2rem;margin:0 0 4px;line-height:1.2}
.sub{color:var(--mute);margin:0}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 20px}
.bar div{max-width:760px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-family:system-ui,"Noto Sans Devanagari","Nirmala UI",sans-serif;font-size:14px}
button{font:600 15px system-ui,"Noto Sans Devanagari","Nirmala UI",sans-serif;border:2px solid var(--accent);background:var(--accent);color:#fff;padding:9px 18px;border-radius:8px;cursor:pointer}
button.alt{background:transparent;color:var(--accent)}
button:focus-visible,select:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
select{font:14px system-ui,"Noto Sans Devanagari","Nirmala UI",sans-serif;padding:7px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
#status{color:var(--mute);margin-left:auto}
main{max-width:760px;margin:0 auto;padding:16px 20px 60px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 20px;margin:14px 0}
section.on{border-color:var(--accent);background:var(--hi)}
section h2{font-size:1.15rem;margin:0 0 6px;display:flex;justify-content:space-between;gap:10px;align-items:center}
section h2 button{padding:5px 12px;font-size:13px}
section p{margin:0}
.note{font:13px system-ui,"Noto Sans Devanagari","Nirmala UI",sans-serif;color:var(--mute);margin-top:20px}
</style>
</head>
<body>
<header>
<h1>अध्याय 6: अवधारणा निर्माण</h1>
<p class="sub">बाल विकास और शैक्षिक मनोविज्ञान · इकाई 3, सीखने की प्रक्रिया</p>
</header>
<div class="bar"><div>
<button id="play">▶ सभी चलाएँ</button>
<button id="pause" class="alt">⏸ रोकें</button>
<button id="stop" class="alt">■ बंद करें</button>
<label>गति <select id="rate"><option value="0.8">0.8×</option><option value="1" selected>1×</option><option value="1.2">1.2×</option><option value="1.5">1.5×</option></select></label>
<label>आवाज़ <select id="voice"></select></label>
<span id="status" aria-live="polite">तैयार</span>
</div></div>
<main id="list"></main>
<p class="note" style="max-width:760px;margin:0 auto;padding:0 20px 40px">ऑडियो आपके ब्राउज़र के अंतर्निहित टेक्स्ट-टू-स्पीच से बनता है, इसलिए यह ऑफ़लाइन भी काम करता है। सर्वोत्तम आवाज़ों के लिए Chrome, Edge या Safari का उपयोग करें।</p>

<script>
const S=[
["परिचय","बच्चे खेल के माध्यम से अवधारणाएँ सीखते और विकसित करते हैं। वे नया ज्ञान प्राप्त करते हैं, वस्तुओं को पहचानते हैं और आनंददायक ढंग से संबंधों को समझते हैं। अवधारणा निर्माण का अर्थ है अनुभवों को सामान्य श्रेणियों में व्यवस्थित करना और वस्तुओं का वर्गीकरण करना। सरल शब्दों में, अवधारणा किसी बात को समझने का मुख्य विचार है, जो हमें बताती है कि कोई वस्तु क्या है और कैसे काम करती है। उदाहरण के लिए, पेड़ एक पौधा है जो बड़ा होता है और जिसमें तना, शाखाएँ और पत्तियाँ होती हैं। परिवार एक ऐसा समूह है जिसमें माता-पिता, भाई-बहन और अन्य सदस्य साथ रहते हैं और एक-दूसरे का सहयोग करते हैं। बच्चे अपने शुरुआती वर्षों में ही चीज़ों का वर्गीकरण करना आरंभ कर देते हैं, और मध्य बाल्यावस्था तक वे अधिक गहरी अवधारणाएँ विकसित कर लेते हैं। वे जो पहले से समझते हैं, उसी के आधार पर सक्रिय रूप से विचारों का निर्माण करते हैं, और नए ज्ञान को पूर्व ज्ञान से निरंतर जोड़ते रहते हैं।"],
["अधिगम प्रतिफल","इस अध्याय के बाद शिक्षार्थी ये कर सकेगा: नई अवधारणाओं का परिचय देने के लिए बच्चों के मौजूदा ज्ञान का उपयोग करना; यह वर्णन करना कि बच्चे घर, विद्यालय और परिवेश में भूमिकाओं, दैनिक दिनचर्या और अंतःक्रियाओं के माध्यम से अवधारणाएँ कैसे सीखते हैं; पंचपदी की पाँच चरणों वाली विधि को लागू करना; और एक ग्राफिक ऑर्गेनाइज़र या अवधारणा मानचित्र तैयार करना, जो दिखाए कि बच्चे घर, विद्यालय और आसपास के परिवेश के विचारों को कैसे जोड़ते हैं।"],
["अवधारणा की प्रकृति","अवधारणा का अर्थ है वस्तुओं, घटनाओं या विचारों को समान विशेषताओं के आधार पर समूहबद्ध करना और जानकारी को श्रेणियों में व्यवस्थित करना। बच्चे स्वाद, गंध, दृष्टि, श्रवण और स्पर्श की इंद्रियों के माध्यम से सीखते हैं। अवधारणाएँ संवेदी अनुभवों से, लोगों और परिवेश के साथ अनुभवों एवं अंतःक्रियाओं से, तथा चीज़ों और घटनाओं की विशेषताओं को अलग करके बनती हैं। उदाहरण के लिए, एक बच्चा घर की बिल्ली को देखता है, जिसके चार पैर, रोएँदार त्वचा और म्याऊँ की आवाज़ है। बाद में बच्चा कुत्ते को देखता है और उसे बिल्ली कह देता है। माता या पिता प्यार से समझाते हैं कि कुत्ते भौंकते हैं और उनके आकार तथा व्यवहार अलग होते हैं। बच्चा अपनी समझ में सुधार करता है और बिल्ली की स्पष्ट अवधारणा विकसित कर लेता है। रॉस ने अवधारणा को किसी विचार का मानसिक निर्माण बताया। बोरिंग, लैंगफेल्ड और वेल्ड ने कहा कि अवधारणाएँ ऐसे विचार हैं जो वस्तुओं, घटनाओं और गुणों की ओर संकेत करते हैं।"],
["अवधारणा निर्माण की प्रक्रिया","जेरोम ब्रूनर के अनुसार, बच्चा पाँच चरणों से गुज़रता है। पहला, तुलना: बच्चा एक सफ़ेद घोड़ा और एक काला घोड़ा देखता है, उनकी तुलना करता है और रंग के अंतर के बावजूद समानता खोज लेता है। दूसरा, सामान्यीकरण: समान गुण एकत्र होते जाते हैं, इसलिए बच्चा किसी भी घोड़े को घोड़ा कहने लगता है। तीसरा, अवलोकन: बच्चा बोलना सीखने से पहले ही वस्तुओं को देखकर मानसिक चित्र बना लेता है। चौथा, परिभाषा निर्माण: बच्चा घोड़े की एक सामान्य अवधारणा बना लेता है, जिसे वर्णन या परिभाषा के द्वारा व्यक्त किया जा सकता है। पाँचवाँ, अमूर्तीकरण: बच्चा असमानताओं को समानताओं से अलग कर लेता है। यहाँ अंतर केवल रंग का है, जबकि समानताएँ अनेक हैं। जब पक्षी जैसी गहरी अवधारणा बन जाती है, तो बच्चा उसे नए उदाहरणों पर लागू कर सकता है और जीवन चक्र तथा आवास जैसे जटिल विचार गढ़ सकता है। अवधारणा निर्माण सभी विषयों में सीखने का प्रवेश द्वार है।"],
["अवधारणाओं के प्रकार","अवधारणाओं के कई प्रकार होते हैं। मूर्त अवधारणाओं को इंद्रियों से अनुभव किया जा सकता है, जैसे सेब और कुत्ता। अमूर्त अवधारणाओं को देखा या छुआ नहीं जा सकता, जैसे स्वतंत्रता और प्रेम। प्राकृतिक अवधारणाएँ वास्तविक जीवन के अनुभव से बनती हैं और उनकी सीमाएँ अस्पष्ट होती हैं, जैसे फ़र्नीचर। कृत्रिम अवधारणाएँ नियमों द्वारा परिभाषित होती हैं, जैसे त्रिभुज और वर्ग। प्रोटोटाइप किसी अवधारणा का सर्वोत्तम उदाहरण होते हैं, जैसे पक्षी के लिए गौरैया। स्कीमा आधारित अवधारणाएँ मानसिक ढाँचे होती हैं, जैसे सामाजिक अंतःक्रिया की पटकथाएँ। श्रेणियाँ अवधारणाओं को समूहों या पदानुक्रमों में बाँटती हैं। ब्रूनर ने तीन प्रकार भी बताए: संयोजक अवधारणाएँ, जिनमें वस्तुओं में एक या अधिक विशेषताएँ समान होती हैं, जैसे कुर्सी, मेज़ और पलंग सभी फ़र्नीचर हैं; वियोजक अवधारणाएँ, जिनमें चीज़ों में कुछ विशेषताएँ समान होती हैं, सभी नहीं, जैसे चाय और कॉफ़ी, दोनों गर्म पेय हैं लेकिन स्वाद में भिन्न हैं; और संबंधपरक अवधारणाएँ, जो तुलना से समझी जाती हैं, जैसे एक ऊँची इमारत किसी छोटी इमारत के पास और भी ऊँची दिखती है।"],
["ब्रूनर का सिद्धांत","जेरोम ब्रूनर ने निरूपण के तीन तरीके बताए। क्रियात्मक निरूपण, जन्म से एक वर्ष तक: क्रियाओं के माध्यम से सीखना, जैसे बच्चे का झुनझुना हिलाना। प्रतिमा निरूपण, एक से छह वर्ष तक: छवियों और मानसिक चित्रों के माध्यम से सीखना, जैसे तस्वीर से आम को पहचानना। प्रतीकात्मक निरूपण, सात वर्ष और उससे अधिक आयु में: भाषा और प्रतीकों के माध्यम से सीखना, जैसे पाँच जमा तीन बराबर आठ को समझना। ब्रूनर ने सर्पिल पाठ्यचर्या का भी प्रस्ताव रखा, जिसमें विषयों को बार-बार बढ़ती गहराई के साथ दोहराया जाता है, और खोज द्वारा अधिगम का भी, जिसमें बच्चे स्वयं सक्रिय रूप से ज्ञान खोजते हैं जबकि शिक्षक मार्गदर्शक की भूमिका निभाते हैं।"],
["पियाजे का सिद्धांत","जीन पियाजे ने संज्ञानात्मक विकास को चार अवस्थाओं में बाँटा। संवेदी-पेशीय अवस्था, जन्म से दो वर्ष तक: बच्चे इंद्रियों और क्रियाओं के माध्यम से सीखते हैं और वस्तु स्थायित्व विकसित करते हैं। पूर्व-संक्रियात्मक अवस्था, दो से सात वर्ष तक: बच्चे शब्दों और छवियों जैसे प्रतीकों का उपयोग करते हैं, लेकिन आत्मकेंद्रित होते हैं और किसी स्थिति के केवल एक पहलू पर ध्यान देते हैं। मूर्त संक्रियात्मक अवस्था, सात से ग्यारह वर्ष तक: बच्चे मूर्त उदाहरणों के माध्यम से तर्क को समझते हैं, संरक्षण की समझ प्राप्त करते हैं, और वस्तुओं का वर्गीकरण तथा क्रमबद्धीकरण कर सकते हैं। औपचारिक संक्रियात्मक अवस्था, बारह वर्ष और उससे अधिक आयु में: बच्चे अमूर्त और तार्किक ढंग से सोचते हैं, तथा समस्याओं को हल कर सकते हैं और कल्पनाशील चिंतन कर सकते हैं।"],
["वाइगोत्स्की का सिद्धांत","लेव वाइगोत्स्की का मानना था कि संज्ञानात्मक विकास सामाजिक और सांस्कृतिक संदर्भों से आकार लेता है। बच्चे माता-पिता, शिक्षकों और साथियों के साथ अंतःक्रिया के माध्यम से सीखते हैं, और भाषा तथा संस्कृति की निर्णायक भूमिका होती है। समीपस्थ विकास का क्षेत्र वह अंतर है जो इस बात के बीच होता है कि बच्चा स्वतंत्र रूप से क्या कर सकता है और सहायता मिलने पर क्या कर सकता है। संरचना सहायता वह सहयोगात्मक प्रक्रिया है जिसमें शिक्षक कठिन कार्यों में बच्चे का मार्गदर्शन करता है, और सहायता धीरे-धीरे कम की जाती है। भाषा चिंतन का एक साधन भी है, और आंतरिक वाणी बच्चों को योजना बनाने और समस्याएँ सुलझाने में मदद करती है।"],
["घर पर अवधारणा निर्माण","घर वह पहला स्थान है जहाँ बच्चे अवधारणाएँ बनाते हैं। खाना पकाना, बर्तन गिनना, या फलों और सब्ज़ियों पर चर्चा करना जैसी दैनिक दिनचर्याएँ मात्रा, गर्म और ठंडा तथा स्वाद सिखाती हैं। सुप्रभात कहने जैसे छोटे रीति-रिवाज़ भी महत्त्व रखते हैं। भूमिका-निर्वाह, जैसे बस की सवारी करने या माता-पिता की भूमिका निभाने का अभिनय, कल्पना के माध्यम से अवधारणाएँ विकसित करता है। बड़ों के साथ बातचीत सामाजिक नियम और मूल्य सिखाती है। कमरा साफ़ करने या पौधों को पानी देने जैसी ज़िम्मेदारियाँ बाँटना उत्तरदायित्व और अनुशासन सिखाता है।"],
["विद्यालय में अवधारणा निर्माण","विद्यालय पाठ्यचर्या, पाठों तथा शिक्षकों और साथियों के साथ अंतःक्रिया के माध्यम से संरचित अवसर प्रदान करते हैं। वे सीखने को वास्तविक जीवन की स्थितियों से जोड़ते हैं, आलोचनात्मक चिंतन को बढ़ावा देते हैं और चर्चा को प्रोत्साहित करते हैं। यदि दो बच्चे एक ही वस्तु के लिए पेन और पैन कहते हैं, तो शिक्षक का मार्गदर्शन सही अवधारणा बनाने में मदद करता है। समूह गतिविधियाँ और खेल सहयोग करना तथा जीत और हार को संभालना सिखाते हैं। प्रार्थना, पंक्ति में चलना और भोजनावकाश जैसी विद्यालय की दिनचर्याएँ अनुशासन, समय प्रबंधन और सामाजिक आदतें सिखाती हैं।"],
["परिवेश में अवधारणा निर्माण","परिवेश वास्तविक दुनिया के ऐसे संदर्भ प्रदान करता है जिन्हें कक्षा में सिखाना कठिन होता है। बागवानी, खरीदारी और चिड़ियाघर की सैर केवल चित्रों की तुलना में अधिक स्पष्ट अवधारणाएँ देती हैं। खेत के असली जानवरों को देखना बच्चों को उनका वर्गीकरण करने में मदद करता है। सामुदायिक कार्यक्रम और संग्रहालय संस्कृतियों और विचारों से परिचय का दायरा बढ़ाते हैं। उद्यान और प्रकृति केंद्र पारिस्थितिकी और संरक्षण की अवधारणाएँ विकसित करते हैं। ऐसे अनुभव समय के संयोजन, निर्णय लेने और समस्या समाधान जैसे जीवन कौशल भी विकसित करते हैं। बच्चे घर और विद्यालय में जो सीखते हैं, उसे बाज़ारों, उद्यानों, मंदिरों और बसों से जोड़ते हैं, जो उन्हें वास्तविक दुनिया की जटिलता, विविधता और नियम सिखाते हैं।"],
["अवधारणा विकास को सुगम बनाना","पूर्व ज्ञान उस के बीच एक सेतु है जो ज्ञात है और जो अभी सीखा जाना है। शिक्षक कई तरीकों से सहायता कर सकते हैं। मूर्त उदाहरणों और तुलनाओं का उपयोग करें, उससे शुरुआत करते हुए जो बच्चे पहले से जानते हैं, जैसे वृत्त के माध्यम से पहिये को समझाना। संबंध जोड़ने और अर्थ निर्माण को प्रोत्साहित करें, ऐसे प्रश्न पूछकर जैसे, इन फलों में क्या समानता है। बच्चों को संबंध पहचानने में मदद करें, उदाहरण के लिए तालिका में गाँव और शहर के जीवन की तुलना करके। अनुभव पर आधारित मुक्त प्रश्न पूछें, जैसे, क्या तुमने कभी बारिश में भीगने का आनंद लिया है। कहानी सुनाने और व्यक्तिगत अनुभवों का उपयोग करें। वास्तविक जीवन की स्थितियों का उपयोग करें, जैसे घटाव सिखाने के लिए टॉफ़ियाँ बाँटना। भ्रांतियों को सामने लाने के लिए विचार-मंथन सत्र आयोजित करें। समूह चर्चा और सहपाठी शिक्षण का उपयोग करें। दृश्य सामग्री और बहुमाध्यम का उपयोग करें। गलत धारणाओं को प्यार से सुधारें, उदाहरण के लिए ग्लोब और टॉर्च की मदद से दिखाएँ कि पृथ्वी घूमती है, जिससे दिन और रात होते हैं। अंत में, सहयोगात्मक वातावरण बनाएँ और स्वाभाविक जिज्ञासा को प्रोत्साहित करें।"],
["अवधारणा विकास के लिए गतिविधियाँ","उपयोगी गतिविधियों में ये शामिल हैं: ब्लॉक से निर्माण जैसी हाथों से की जाने वाली परियोजनाएँ, बाहरी खेल, खाना पकाना, सरल विज्ञान प्रयोग, प्रकृति भ्रमण, कला परियोजनाएँ, सामूहिक गतिविधियाँ और नृत्य, वाद-विवाद, पूछताछ आधारित अधिगम, समस्या आधारित अधिगम, खेल और पहेलियाँ, तथा भूमिका-निर्वाह। इनमें से प्रत्येक बच्चों को केवल सुनने के बजाय किसी अवधारणा का सक्रिय रूप से अन्वेषण करने देती है।"],
["ग्राफिक ऑर्गेनाइज़र और अवधारणा मानचित्र","तालिकाएँ, वेन आरेख, समय-रेखाएँ और अवधारणा मानचित्र जैसे ग्राफिक ऑर्गेनाइज़र बच्चों को अवधारणाओं और उनके बीच के संबंधों की कल्पना करने में मदद करते हैं। अवधारणाओं को नोड के रूप में दिखाया जाता है, जो रेखाओं या तीरों से जुड़े होते हैं। अवधारणा मानचित्र सबसे पहले जोसेफ नोवाक ने 1972 में बनाए थे। ये दृश्य संगठन प्रदान करते हैं, दिखाते हैं कि अवधारणाएँ कैसे जुड़ती हैं, रटने के बजाय सार्थक अधिगम को बढ़ावा देते हैं, बच्चों को सक्रिय रूप से शामिल करते हैं, मूल्यांकन के साधन के रूप में काम करते हैं, और अलग-अलग शिक्षार्थियों के अनुसार ढाले जा सकते हैं। अवधारणा मानचित्र बनाने के लिए: मुख्य विषय की पहचान करें; संबंधित अवधारणाओं पर विचार-मंथन करें; उन्हें समूहों में व्यवस्थित करें; विचारों को जोड़ने वाली रेखाएँ खींचें; संबंधों को समझाने वाले लेबल जोड़ें; और मानचित्र की समीक्षा करके उसे परिष्कृत करें।"],
["पंचपदी विधि","पंचपदी विधि पाँच चरणों वाला एक दृष्टिकोण है, जिसकी अनुशंसा राष्ट्रीय पाठ्यचर्या की रूपरेखा 2023 में आधारभूत चरण की शिक्षा के लिए की गई है। पहला चरण, अदिति या परिचय: जिज्ञासा जगाएँ और मौजूदा ज्ञान से जोड़ें, उदाहरण के लिए पूछें, क्या तुमने अपने घर या उद्यान में पौधे देखे हैं। दूसरा चरण, बोध या अवधारणात्मक समझ: हाथों से की जाने वाली गतिविधि के माध्यम से समझ विकसित करें, जैसे बीज बोना और उन्हें उगते देखना। तीसरा चरण, अभ्यास: विविध पुनरावृत्ति के माध्यम से सीखे हुए को पक्का करें, जैसे मिलान वाले खेल, चित्रकारी और गीत। चौथा चरण, प्रयोग या अनुप्रयोग: सीखे हुए को वास्तविक जीवन में लागू करें, जैसे विद्यालय के बगीचे की देखभाल करना। पाँचवाँ चरण, प्रसार या विस्तार: साथियों के साथ साझा करके ज्ञान को समृद्ध करें, कहानियों, गीतों और समूह पोस्टरों के माध्यम से। जल चक्र पर लागू करें तो इसकी शुरुआत इस प्रश्न से हो सकती है, यदि बारिश रुक जाए तो क्या होगा, फिर चित्र या कहानी से समझाएँ, प्रश्नोत्तरी से दोहराएँ, वर्षा जल संचयन के माध्यम से लागू करें, और बादल कैसे बनते हैं इस पर चर्चा करके विस्तार करें।"],
["सारांश","बच्चे अवधारणाएँ अनुभव और अवलोकन के माध्यम से सीखते हैं, घर में, विद्यालय में और परिवेश में। शिक्षक समझ विकसित करने के लिए खेलों, उदाहरणों और सहयोगात्मक कार्य का, तथा अवधारणा मानचित्र और पंचपदी विधि जैसे साधनों का उपयोग करते हैं। ब्रूनर कहते हैं कि बच्चे पहले करके, फिर चित्रों से, और फिर प्रतीकों से सीखते हैं। पियाजे संज्ञानात्मक विकास की चार अवस्थाओं का वर्णन करते हैं। वाइगोत्स्की कहते हैं कि बच्चे दूसरों की सहायता से सबसे अच्छा सीखते हैं, जिसे समीपस्थ विकास के क्षेत्र द्वारा समझाया जाता है। ये सभी विचार मिलकर सीखने को एक रोमांचक अनुभव बनाते हैं।"]
];
const synth=window.speechSynthesis,list=document.getElementById('list'),st=document.getElementById('status');
let idx=-1,token=0,voices=[],mode='all';
S.forEach((s,i)=>{const e=document.createElement('section');e.id='s'+i;
e.innerHTML=`<h2>${s[0]}<button class="alt" data-i="${i}">▶ चलाएँ</button></h2><p>${s[1]}</p>`;list.appendChild(e)});
list.addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(b){mode='one';start(+b.dataset.i)}});
function loadVoices(){const all=synth.getVoices();const hi=all.filter(v=>/^hi/i.test(v.lang));voices=hi.length?hi:all;const sel=document.getElementById('voice');
sel.innerHTML=voices.map((v,i)=>`<option value="${i}">${v.name} (${v.lang})</option>`).join('');
const pref=voices.findIndex(v=>/hi-IN/i.test(v.lang));if(pref>=0)sel.value=pref;
if(!hi.length&&all.length)st.textContent='इस उपकरण पर हिंदी (भारत) की आवाज़ नहीं मिली; निकटतम उपलब्ध आवाज़ का उपयोग किया जा रहा है। सर्वोत्तम परिणाम के लिए अपने ऑपरेटिंग सिस्टम की सेटिंग में हिंदी (भारत) की आवाज़ इंस्टॉल करें।'}
loadVoices();synth.onvoiceschanged=loadVoices;
function chunks(t){return (t.match(/[^.?!;:।]+[.?!;:।]?/g)||[t]).map(x=>x.trim()).filter(Boolean)}
function mark(i){document.querySelectorAll('section').forEach((s,j)=>s.classList.toggle('on',j===i))}
function start(i){synth.cancel();const my=++token;idx=i;mark(i);
const ps=chunks(S[i][0]+'। '+S[i][1]);let k=0;st.textContent='चल रहा है: '+S[i][0];
document.getElementById('s'+i).scrollIntoView({behavior:'smooth',block:'center'});
(function next(){if(my!==token)return;
if(k>=ps.length){if(mode==='all'&&i+1<S.length)start(i+1);else finish();return}
const u=new SpeechSynthesisUtterance(ps[k++]);u.rate=+document.getElementById('rate').value;u.lang='hi-IN';
const v=voices[document.getElementById('voice').value];if(v){u.voice=v;u.lang=v.lang}
u.onend=next;u.onerror=ev=>{if(ev.error!=='interrupted'&&ev.error!=='canceled')next()};synth.speak(u)})()}
function finish(){mark(-1);idx=-1;st.textContent='समाप्त'}
document.getElementById('play').onclick=()=>{if(synth.paused){synth.resume();st.textContent='चल रहा है: '+S[idx][0];return}mode='all';start(0)};
document.getElementById('pause').onclick=()=>{if(synth.speaking){synth.pause();st.textContent='रुका हुआ'}};
document.getElementById('stop').onclick=()=>{token++;synth.cancel();finish();st.textContent='रोका गया'};
if(!synth){st.textContent='इस ब्राउज़र में टेक्स्ट-टू-स्पीच समर्थित नहीं है'}
</script>

</html>
