<script>
const S=[
["परिचय","यह इकाई विशेष आवश्यकता वाले बच्चों के सीखने को सुगम बनाने तथा समावेशी कक्षा में शिक्षण के बारे में है, ताकि ये बच्चे दूसरों के साथ सभी पहलुओं में विकास कर सकें। हम दिव्यांगजन अधिकार अधिनियम (आरपीडब्ल्यूडी अधिनियम) में बताई गई इक्कीस प्रकार की दिव्यांगताओं के बारे में जानेंगे, यह भी कि शिक्षक समय के साथ इन बच्चों का आकलन कैसे करते हैं, और आकलन के दौरान आने वाली चुनौतियों से कैसे निपटा जाए। हम यह भी देखेंगे कि वैयक्तिक शिक्षा योजना और विभेदित अधिगम के माध्यम से शिक्षण और अधिगम को कैसे बेहतर बनाया जा सकता है, ताकि शिक्षक प्रत्येक बच्चे की आवश्यकताओं के अनुसार तैयारी कर सकें और विशेष आवश्यकता वाले बच्चों में आत्मविश्वास का निर्माण कर सकें।"],
["अधिगम परिणाम","इस अध्याय के बाद शिक्षार्थी ये कर सकेगा: समावेशी परिवेश पद की परिभाषा दे सकेगा; विभिन्न अधिगम शैलियों को समझ सकेगा; विभेदित अधिगम की पद्धतियाँ तैयार कर सकेगा; अधिगम अक्षमताओं में प्रारंभिक हस्तक्षेप के प्रकारों और रणनीतियों की पहचान कर सकेगा; अधिगम अक्षमता वाले बच्चों की शीघ्र पहचान के लिए जाँच कर सकेगा; तथा वैयक्तिक शिक्षा योजना की अवधारणा को समझकर शिक्षण-अधिगम प्रक्रिया में उसका उपयोग कर सकेगा।"],
["समावेशी कक्षाएँ: शिक्षार्थी","शिक्षा सदैव मानव जीवन के केंद्र में रही है, और भारत महान विविधता वाला देश है, जिसमें बच्चों की अधिगम क्षमताओं की विविधता भी शामिल है। शिक्षक के रूप में हमारा सामना ऐसे बच्चों से होता है जो निर्देशों और जानकारी को सामान्य तरीक़ों से नहीं समझ पाते; इन्हें विशेष आवश्यकता वाले बच्चे कहा जाता है। प्रायः किसी एक इंद्रिय की कमी की भरपाई अन्य इंद्रियों के अधिक प्रभावी ढंग से कार्य करने से हो जाती है। यदि इन बच्चों की समय पर पहचान हो जाए और उन्हें उचित हस्तक्षेप मिले, तो वे भी अन्य बच्चों की तरह सर्वांगीण विकास कर सकते हैं।"],
["दिव्यांगताएँ और उनकी क्षमताएँ","चलन दिव्यांगता वाले बच्चों की गति में सीमाएँ होती हैं, परंतु उनकी बुद्धि-लब्धि सामान्य होती है, और वे विद्यालय की कक्षा के भीतर की गतिविधियों में उत्कृष्ट प्रदर्शन कर सकते हैं। श्रवण बाधिता वाले बच्चों में वाणी और भाषा का विकास धीमा हो सकता है, किंतु वे प्रायः बाहरी शोर से कम विचलित होते हैं, जिससे उनका ध्यान अधिक सुदृढ़ होता है। दृष्टिबाधित बच्चों में प्रायः सुनने और स्पर्श की क्षमता अधिक विकसित होती है, और वे ब्रेल, डिजिटल साधनों तथा श्रव्य संकेतों की सहायता से सीख सकते हैं। शिक्षकों को विषयों को भली-भाँति समझाना चाहिए, स्पष्ट बोलना चाहिए और इन बच्चों को भाग लेने के पूर्ण अवसर देने चाहिए। वाक् एवं भाषा अक्षमता वाले बच्चों को उच्चारण, शब्द-भंडार या जटिल भाषा में कठिनाई हो सकती है, परंतु शिक्षकों को उनकी अन्य शक्तियों पर ध्यान देना चाहिए, जैसे दृश्य-स्थानिक कौशल, गणित या संगीत। बौद्धिक अक्षमता, स्वलीनता/ऑटिज़्म स्पेक्ट्रम विकार, मानसिक रोग और बहु-दिव्यांगता बच्चे की जानकारी को संसाधित करने की क्षमता को प्रभावित करती हैं, यद्यपि बुद्धि स्वयं आवश्यक रूप से प्रभावित नहीं होती; समय पर दिए गए सहयोग और अभ्यास से इन चुनौतियों को कम किया जा सकता है।"],
["समावेशी परिवेश की अवधारणा","समावेशी परिवेश ऐसे स्वागतपूर्ण वातावरण होते हैं जो सभी पृष्ठभूमियों के लोगों के लिए होते हैं, चाहे वे भाषाई हों, क्षेत्रीय हों, सामाजिक-आर्थिक हों या दिव्यांगता से संबंधित हों। इसके प्रमुख पहलुओं में सभी बच्चों को जैसे वे हैं वैसे स्वीकार करना, विविधता का सम्मान, भाग लेने और सीखने के समान अवसर, तथा विविध शिक्षण विधियों का उपयोग शामिल है, जैसे विभेदित अनुदेशन, अधिगम के लिए सार्वभौमिक अभिकल्प, बहु-संवेदी उपागम, सहपाठी शिक्षण और सहायक प्रौद्योगिकी।"],
["पृथक्करण, एकीकरण और समावेशन","ये तीनों अवधारणाएँ अपने बल-बिंदुओं में भिन्न हैं। पृथक्करण सेवाओं, दिव्यांगता के चिकित्सकीय मॉडल, वर्गीकरण और अलग पाठ्यक्रम पर केंद्रित है। एकीकरण आवश्यकताओं, व्यक्तिगत अनुकूलन और समान व्यवहार पर केंद्रित है, किंतु फिर भी चिकित्सकीय मॉडल पर ही आधारित रहता है। समावेशन अधिकारों, दिव्यांगता के सामाजिक मॉडल, संस्थागत अनुकूलन, सभी के लिए सहयोग, विविधता का उत्सव, तथा पेशेवरों और अभिभावकों के बीच साझेदारी पर केंद्रित है, जिसमें विद्यालय की प्रभावशीलता और सभी के लिए परिणामों पर बल दिया जाता है।"],
["विशेष आवश्यकता वाले बच्चे और दिव्यांग बच्चे","विशेष आवश्यकता वाले बच्चों को शारीरिक, संवेदी, विकासात्मक, व्यवहारात्मक या संज्ञानात्मक क्षेत्रों में बाधाओं का सामना करना पड़ता है, और उन्हें अन्य बच्चों की तुलना में अधिक प्रयास और सहायता की आवश्यकता होती है — उदाहरण के लिए, स्वलीनता/ऑटिज़्म, एडीएचडी, डाउन सिंड्रोम या सीखने की कठिनाइयों वाले बच्चे। इन्हें शारीरिक अक्षमता, बौद्धिक अक्षमता या संज्ञानात्मक अक्षमता के रूप में वर्गीकृत किया जाता है। दिव्यांग बच्चों में जन्म से या उसके बाद से कोई दीर्घकालिक स्थिति होती है जो उनकी दैनिक गतिविधियों को प्रभावित करती है। संबंधित शब्दों में शामिल हैं: क्षति, अर्थात अंग के स्तर पर कार्य की हानि; दिव्यांगता, अर्थात किसी गतिविधि को उस तरह करने में प्रतिबंध जिसे सामान्य माना जाता है; और विकलांगता-जनित बाधा, अर्थात क्षति या दिव्यांगता के कारण किसी भूमिका को निभाने में उत्पन्न होने वाला नुकसान, जो आयु, लिंग और सामाजिक-सांस्कृतिक कारकों पर निर्भर करता है।"],
["आरपीडब्ल्यूडी अधिनियम के अंतर्गत इक्कीस दिव्यांगताएँ","राष्ट्रीय शिक्षा नीति 2020 कहती है कि सामाजिक न्याय और समानता की गारंटी केवल शिक्षा के माध्यम से ही दी जा सकती है, और समावेशी तथा न्यायसंगत शिक्षा एक अनिवार्य लक्ष्य है। दिव्यांगजन अधिकार अधिनियम (आरपीडब्ल्यूडी अधिनियम) 2016 के अनुसार इक्कीस मान्यता प्राप्त दिव्यांगताएँ हैं, जिनमें शामिल हैं: दृष्टिहीनता, अल्पदृष्टि, श्रवण बाधिता, चलन दिव्यांगता, बौनापन, मस्तिष्क पक्षाघात, बौद्धिक अक्षमता, स्वलीनता/ऑटिज़्म स्पेक्ट्रम विकार, मानसिक रोग, दीर्घकालिक तंत्रिका संबंधी स्थितियाँ, मांसपेशीय दुर्विकास, बहु-स्केलेरोसिस, विशिष्ट अधिगम अक्षमता, थैलेसीमिया, वाक् एवं भाषा अक्षमता, सिकल सेल रोग, हीमोफीलिया, कुष्ठ रोग से मुक्त व्यक्ति, पार्किंसंस रोग, एसिड अटैक पीड़ित और बहु-दिव्यांगता।"],
["अधिगम अक्षमता का अर्थ","अधिगम अक्षमताएँ तंत्रिका-विकासात्मक विकार हैं जो किसी व्यक्ति की नई बातें सीखने की क्षमता को काफ़ी हद तक बाधित करते हैं, जिससे बोलने, पढ़ने, लिखने, ध्यान, समझ, स्मृति, गणित या आँख-हाथ के समन्वय में कठिनाई होती है। दिव्यांगजन अधिकार अधिनियम (आरपीडब्ल्यूडी अधिनियम) विशिष्ट अधिगम अक्षमताओं को ऐसी स्थितियों के समूह के रूप में परिभाषित करता है जिनमें बोली या लिखित भाषा को संसाधित करने में कमी होती है, जिनमें प्रत्यक्षण संबंधी अक्षमताएँ, डिस्लेक्सिया, डिस्ग्राफिया, डिस्कैल्कुलिया, डिस्प्रैक्सिया और विकासात्मक वाचाघात शामिल हैं। डीएसएम-5 ने पढ़ने, गणित और लिखित अभिव्यक्ति की कठिनाइयों को मिलाकर एक ही निदान बना दिया, जिसे विशिष्ट अधिगम विकार कहा जाता है।"],
["डिस्लेक्सिया","डिस्लेक्सिया भाषा-संसाधन संबंधी विकार है जो पढ़ने और समझने की क्षमता को प्रभावित करता है। डिस्लेक्सिया वाले बच्चे अक्षरों को ग़लत पढ़ सकते हैं या उलट सकते हैं, जैसे अंग्रेज़ी के शब्द ‘was’ को ‘saw’ पढ़ना, या अक्षर ‘b’ को ‘d’ पढ़ना, और उन्हें लंबे शब्दों में कठिनाई हो सकती है। ये त्रुटियाँ लिखित भाषा को संसाधित करने की कठिनाइयों से आती हैं, केवल ख़राब शिक्षण के कारण नहीं। सहायक उपायों में बहु-संवेदी शिक्षण, मौखिक उत्तर देना, पढ़ने और लिखने का अभ्यास, उच्चारण पर कार्य, श्रव्य-दृश्य सामग्री और सूचना एवं संचार प्रौद्योगिकी का उपयोग शामिल हैं।"],
["डिस्ग्राफिया","डिस्ग्राफिया एक ऐसा विकार है जो लिखने और विचारों को कागज़ पर व्यक्त करने की क्षमता को प्रभावित करता है। ख़राब हस्तलेख के अतिरिक्त, बच्चों को अक्षरों के बीच दूरी, गतिक योजना, स्थानिक जागरूकता, तथा एक साथ सोचने और लिखने में कठिनाई हो सकती है — उदाहरण के लिए, अक्षरों या संख्याओं को उलटना, असमान दूरी रखना, बड़े और छोटे अक्षरों को मिला देना, या वर्तनी में असंगति। सहायक उपायों में रेत में लिखना, हवा में लिखना, बिंदुओं को जोड़कर अक्षर बनाना, पेंसिल को सही ढंग से पकड़ना और नियमित लेखन अभ्यास शामिल हैं।"],
["डिस्कैल्कुलिया","डिस्कैल्कुलिया, जिसे कभी-कभी गणितीय डिस्लेक्सिया कहा जाता है, में गणितीय अवधारणाओं, संख्याओं और तर्क में कठिनाई होती है, जैसे 6 और 9 को आपस में भ्रमित करना, या जोड़ और घटाव में त्रुटियाँ करना। सहायक उपायों में प्रत्यक्ष अनुभव, दृश्य साधन, चरण-दर-चरण अनुदेशन, वास्तविक जीवन का अभ्यास जैसे ख़रीदारी करना, संख्या-ब्लॉक और फ़्लैशकार्ड, वस्तुओं की गिनती, पैसे का लेन-देन और क्षेत्र-भ्रमण शामिल हैं।"],
["डिस्प्रैक्सिया और विकासात्मक वाचाघात","डिस्प्रैक्सिया, अर्थात विकासात्मक समन्वय विकार, गतिक कौशलों और समन्वय को करना कठिन बना देता है; व्यावसायिक चिकित्सा इसमें सहायक हो सकती है, साथ ही सुई-धागे का कार्य, गेंद पकड़ना और फेंकना, मनके पिरोना, आकृतियाँ काटना और मोड़ना, मिट्टी से खेलना और ब्लॉक बनाना जैसी गतिविधियाँ भी। विकासात्मक वाचाघात मस्तिष्क के भाषा-क्षेत्रों को क्षति पहुँचने से होता है और यह अभिव्यक्ति, समझ, पढ़ने और लिखने को बाधित करता है। सहायक उपायों में सरल और स्पष्ट भाषा का उपयोग, दोहराना और दूसरे शब्दों में समझाना, धीरे बोलना, चित्रों और हाव-भाव का उपयोग तथा कहानी सुनाना शामिल हैं।"],
["अधिगम अक्षमता के कारण","अधिगम अक्षमताएँ जन्म-पूर्व कारणों से उत्पन्न हो सकती हैं, जैसे कम उम्र में विवाह, माँ का ख़राब पोषण, या गर्भावस्था के दौरान शराब, नशीले पदार्थों या बिना निगरानी के दवाओं का सेवन; जन्म के समय के कारणों से, जैसे अप्रशिक्षित व्यक्ति द्वारा प्रसव, जन्म के समय कम वज़न, ज़बरदस्ती प्रसव कराना, या जन्म के समय ऑक्सीजन की कमी; और जन्म-पश्चात कारणों से, जैसे गंभीर बीमारी, दुर्घटनाएँ, टीकाकरण का अभाव या कुपोषण।"],
["जाँच और शीघ्र पहचान","राष्ट्रीय शिक्षा नीति 2020 के अनुसार, बच्चे के मस्तिष्क का पचासी प्रतिशत से अधिक विकास छह वर्ष की आयु तक हो जाता है, इसलिए गुणवत्तापूर्ण प्रारंभिक बाल्यावस्था देखभाल और शिक्षा आवश्यक है। शीघ्र पहचान पाँच चरणों में होती है: शिक्षक द्वारा अनौपचारिक अवलोकन; विशेष शिक्षक द्वारा अभिभावकों से परामर्श करके केस इतिहास लेना; आवश्यकता होने पर औपचारिक जाँच; विशेषज्ञों या अस्पतालों को संदर्भित करना; और योजना बनाने के लिए अंतिम निदान रिपोर्ट विद्यालय को सौंपना। एनसीईआरटी का प्रशस्त ऐप इस प्रक्रिया में सहायक हो सकता है। विशिष्ट अधिगम अक्षमता की जाँच-सूची में ऐसे संकेत देखे जाते हैं जैसे ध्यान बनाए रखने में कठिनाई, समय-सीमा में कार्य पूरा करने में कठिनाई, पढ़ते समय शब्द छोड़ देना, वस्तुओं को व्यवस्थित करने में कठिनाई, गणितीय चिह्नों में परेशानी, मिलते-जुलते अक्षरों या संख्याओं को भ्रमित करना, और विराम-चिह्नों या बोध में कठिनाई — विशेषकर जब बच्चे की बुद्धि-लब्धि पचासी से ऊपर हो।"],
["प्रारंभिक हस्तक्षेप की रणनीतियाँ","प्रारंभिक हस्तक्षेप सेवाएँ विशेष शिक्षकों, चिकित्सकों और परामर्शदाताओं को एक साथ लाकर विकासात्मक विलंब वाले बच्चों की सहायता करती हैं। अभिभावक और शिक्षक प्रायः पहले हस्तक्षेपकर्ता होते हैं। व्यावसायिक चिकित्सा सूक्ष्म गतिक और स्वावलंबन कौशलों में मदद करती है; भौतिक चिकित्सा चलने, संतुलन बनाने और बैठने में मदद करती है; और वाक् चिकित्सा हकलाने या तुतलाने वाले बच्चों को भाषा में दक्ष होने में मदद करती है। आधारभूत चरण में ध्यान मातृभाषा, मौखिक अभिव्यक्ति, कहानी सुनाने, गीतों और खेल पर रहता है, जिसमें चित्र-पुस्तकों, मॉडलों और कठपुतलियों जैसी सामग्री का उपयोग होता है, और मूल्यांकन मुख्यतः अवलोकन के माध्यम से किया जाता है। प्रारंभिक तैयारी चरण में ध्यान पढ़ने, लिखने, वर्तनी और बोध की ओर जाता है, जिसमें कहानी की पुस्तकों, शब्द-खेलों और स्पर्श-आधारित सामग्री का उपयोग होता है, और मूल्यांकन पठन-परीक्षणों, श्रुतलेख और कहानी सुनाने के माध्यम से किया जाता है।"],
["वैयक्तिक शिक्षा योजना","भारत में वैयक्तिक शिक्षा योजना (आईईपी) की अवधारणा दिव्यांग बच्चों के आरंभिक विद्यालयों से जुड़ी है। दिव्यांगजन अधिकार अधिनियम (आरपीडब्ल्यूडी अधिनियम) 2016 की धारा 16 के अंतर्गत सरकारी प्रतिष्ठानों को प्रत्येक विशेष आवश्यकता वाले बच्चे की शिक्षा में भागीदारी, प्रगति और पूर्णता की निगरानी करनी होती है। वैयक्तिक शिक्षा योजना विद्यार्थी को उसके वर्तमान कौशलों से आगे के व्यक्तिगत लक्ष्य प्राप्त करने में मदद करती है, और प्रगति के आधार पर इसे वर्ष में कम से कम दो बार संशोधित किया जाता है। जब कोई विशेष आवश्यकता वाला बच्चा विद्यालय में आता है, तो शिक्षक को उसका स्वागत करना चाहिए, उसे साथियों और कर्मचारियों से मिलवाना चाहिए, अभिभावकों से मिलना चाहिए और केस इतिहास लेना चाहिए। वैयक्तिक शिक्षा योजना के तीन भाग होते हैं। भाग क में बुनियादी जानकारी, दिव्यांगता का प्रकार और मात्रा, तथा वार्षिक और अल्पकालिक लक्ष्य आते हैं, जो अभिभावकों और शिक्षकों के परामर्श से निर्धारित किए जाते हैं। भाग ख में सह-पाठयक्रम गतिविधियाँ, चिकित्सीय आवश्यकताएँ और जीवन कौशल आते हैं, जिन्हें प्रत्येक अल्पकालिक लक्ष्य के लिए विषय शिक्षकों और विशेषज्ञों के साथ मिलकर नियोजित किया जाता है। भाग ग में शैक्षणिक विषय आते हैं, जिन्हें विषय शिक्षकों के साथ मिलकर नियोजित, क्रियान्वित और प्रतिमाह मूल्यांकित किया जाता है।"],
["वैयक्तिक शिक्षा योजना तैयार करने की चुनौतियाँ","वैयक्तिक शिक्षा योजना तैयार करने वाले शिक्षकों को प्रायः अपर्याप्त प्रशिक्षण, संसाधनों की कमी, संवाद संबंधी समस्याओं, तथा दृश्य, श्रव्य और गतिबोधी पसंद सहित विविध अधिगम शैलियों में संतुलन बनाने की चुनौती का सामना करना पड़ता है, साथ ही पहले से भारी कार्यभार, पाठ्यक्रम अनुकूलन की माँगें और अभिभावकों का सीमित सहयोग भी होता है। सुझाए गए समाधानों में अधिगम के लिए सार्वभौमिक अभिकल्प और विभेदित अनुदेशन का उपयोग, व्यावसायिक विकास कार्यक्रम, प्रौद्योगिकी का समुचित उपयोग, बेहतर कक्षा प्रबंधन रणनीतियाँ, विद्यालय के संसाधनों का उचित उपयोग, अभिभावकों को प्रेरित करना, और सभी कर्मचारियों के बीच सहयोग को बढ़ावा देना शामिल हैं।"],
["विभेदित अधिगम","भारत की अपार विविधता के कारण शिक्षकों को अनुदेशन को इस प्रकार ढालना चाहिए कि विविधता सीखने में बाधा न बने। राष्ट्रीय शिक्षा नीति 2020 विभेदित अनुदेशन का समर्थन करती है, जिसमें सभी शिक्षार्थियों की सफलता में सहायता के लिए विविध साधनों, सामग्रियों और प्रक्रियाओं का उपयोग किया जाता है। यह प्रशासनिक स्तर पर हो सकता है, जिसमें सामाजिक-आर्थिक स्थिति जैसे कारकों पर विचार किया जाता है, या कक्षा स्तर पर, जिसमें प्रत्येक विद्यार्थी की तत्परता, रुचि और अधिगम प्रोफ़ाइल के अनुसार विषय-वस्तु, प्रक्रिया, उत्पाद और प्रभाव पर विचार किया जाता है। विभेदित अधिगम कक्षा में सहभागिता बढ़ाता है, शैक्षणिक परिणामों में सुधार करता है, सकारात्मक अधिगम वातावरण को बढ़ावा देता है, विविध अधिगम शैलियों को संबोधित करता है, उपलब्धि के अंतराल को पाटता है और शिक्षक की प्रभावशीलता बढ़ाता है। इसे सस्वर पाठ, भूमिका-निर्वाह, स्मार्टबोर्ड, छोटे समूह और सहपाठी अधिगम, शिक्षण-अधिगम सामग्री, खेल, बहु-संवेदी उपागम, सहपाठी शिक्षण, कला और शिल्प तथा व्यक्तिगत ध्यान के माध्यम से लागू किया जा सकता है।"],
["सारांश","इस अध्याय में बताया गया कि विविध शिक्षार्थियों के लिए कक्षाओं को अधिक समावेशी और प्रभावी कैसे बनाया जाए, सामान्य अधिगम अक्षमताओं के लिए सुधारात्मक उपाय क्या हैं, और वैयक्तिक शिक्षा योजना तथा विभेदित अधिगम शिक्षकों को प्रत्येक बच्चे की आवश्यकताओं के अनुसार तैयारी करने और मुख्यधारा की ओर बढ़ने में उनका आत्मविश्वास बढ़ाने में कैसे सहायता करते हैं।"]
];
const synth=window.speechSynthesis,list=document.getElementById('list'),st=document.getElementById('status');
let idx=-1,token=0,voices=[],mode='all';
S.forEach((s,i)=>{const e=document.createElement('section');e.id='s'+i;
e.innerHTML=`<h2>${s[0]}<button class="alt" data-i="${i}">▶ चलाएँ</button></h2><p>${s[1]}</p>`;list.appendChild(e)});
list.addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(b){mode='one';start(+b.dataset.i)}});
function loadVoices(){const all=synth.getVoices();const hi=all.filter(v=>/^hi/i.test(v.lang));voices=hi.length?hi:all;const sel=document.getElementById('voice');
sel.innerHTML=voices.map((v,i)=>`<option value="${i}">${v.name} (${v.lang})</option>`).join('');
const pref=voices.findIndex(v=>/hi-IN/i.test(v.lang));if(pref>=0)sel.value=pref;
if(!hi.length&&all.length){st.textContent='इस उपकरण पर हिंदी (भारत) की आवाज़ नहीं मिली; निकटतम उपलब्ध आवाज़ का उपयोग किया जा रहा है। सर्वोत्तम परिणाम के लिए अपने ऑपरेटिंग सिस्टम की सेटिंग में हिंदी (भारत) की आवाज़ इंस्टॉल करें।'}}
loadVoices();synth.onvoiceschanged=loadVoices;
function chunks(t){return (t.match(/[^.?!;:।]+[.?!;:।]?/g)||[t]).map(x=>x.trim()).filter(Boolean)}
function mark(i){document.querySelectorAll('section').forEach((s,j)=>s.classList.toggle('on',j===i))}
function start(i){synth.cancel();const my=++token;idx=i;mark(i);
const ps=chunks(S[i][0]+'। '+S[i][1]);let k=0;st.textContent='चल रहा है: '+S[i][0];
document.getElementById('s'+i).scrollIntoView({behavior:'smooth',block:'center'});
(function next(){if(my!==token)return;
if(k>=ps.length){if(mode==='all'&&i+1<S.length)start(i+1);else finish();return}
const u=new SpeechSynthesisUtterance(ps[k++]);u.rate=+document.getElementById('rate').value;
u.lang='hi-IN';const v=voices[document.getElementById('voice').value];if(v){u.voice=v;u.lang=v.lang}
u.onend=next;u.onerror=ev=>{if(ev.error!=='interrupted'&&ev.error!=='canceled')next()};synth.speak(u)})()}
function finish(){mark(-1);idx=-1;st.textContent='समाप्त'}
document.getElementById('play').onclick=()=>{if(synth.paused){synth.resume();st.textContent='चल रहा है: '+S[idx][0];return}mode='all';start(0)};
document.getElementById('pause').onclick=()=>{if(synth.speaking){synth.pause();st.textContent='रुका हुआ'}};
document.getElementById('stop').onclick=()=>{token++;synth.cancel();finish();st.textContent='रोका गया'};
if(!synth){st.textContent='इस ब्राउज़र में टेक्स्ट-टू-स्पीच समर्थित नहीं है'}
</script>
</body>
</html>
